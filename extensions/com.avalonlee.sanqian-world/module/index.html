<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>三千世界</title>
<style>
  /* 主题双声明 fallback；module 卡透明底（宿主已套玻璃卡，x-hub §6.1/§6.3）
   * 卡片纪律：不自带不透明底、不自带外边距，仅用文字/进度/徽标表达信息；
   * 布局走 CSS Grid 命名区域（grid-template-areas），三形态各排一版，互不干扰。 */
  :root {
    color-scheme: light;
    --sq-karma-right: #7a5c08;
    --sq-karma-evil: #b03a2e;
    --sq-karma-neutral: #4f6b7a;
    --ink: var(--xhub-text-1, #1f2230);
    --ink-2: var(--xhub-text-2, #5b6070);
    --ink-3: var(--xhub-text-3, #8a8f9e);
    --line: var(--xhub-border, rgba(0, 0, 0, 0.1));
    --primary: var(--xhub-accent, #a8842c);
    --track: rgba(20, 24, 40, 0.10);
    --fill-a: #e6cd7e;
    --fill-b: #b8933a;
  }
  :root[data-xhub-theme="dark"] {
    color-scheme: dark;
    --sq-karma-right: #e3c34a;
    --sq-karma-evil: #e57373;
    --sq-karma-neutral: #8fb3c4;
    --ink: var(--xhub-text-1, #e8e9f0);
    --ink-2: var(--xhub-text-2, #a2a7b8);
    --ink-3: var(--xhub-text-3, #7d8294);
    --line: var(--xhub-border, rgba(255, 255, 255, 0.12));
    --primary: var(--xhub-accent, #d9b45e);
    --track: rgba(255, 255, 255, 0.16);
    --fill-a: #d9b45e;
    --fill-b: #a8842c;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 12px;                 /* 宿主不加内边距，12px 与内置模块卡一致 */
    box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Songti SC", SimSun, sans-serif;
    background: transparent;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    cursor: default;          /* 卡片只读：宿主切形态那条桥 API 本机未注册，第二十一批删调用消 warn */
    overflow: hidden;
    container-type: size;          /* 格子自适应：最矮 ~86px 也不裁切 */
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "id    karma"
      "prog  prog"
      "meta  meta";
    grid-template-rows: auto auto 1fr;   /* 身份+进度靠顶，资源行贴底 */
    align-content: start;
    gap: clamp(3px, 2.2cqh, 9px) 8px;
  }

  /* ── 基础单元 ───────────────────────────────────────────── */
  .id {
    grid-area: id;
    display: flex; flex-direction: column;
    gap: clamp(1px, 1.2cqh, 6px);
    min-width: 0;
  }
  .world {
    font-size: clamp(10px, 7.5cqh, 12px);
    line-height: 1.35;
    color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .name {
    display: flex; align-items: baseline; gap: 8px;
    min-width: 0;
  }
  .name > b {
    font-size: clamp(15px, 15cqh, 24px);
    font-weight: 650; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .realm {
    flex: 0 0 auto;
    font-size: clamp(9px, 6.5cqh, 12px);
    font-weight: 600;
    color: var(--primary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .kb {
    grid-area: karma;
    align-self: start;
    padding: 1px clamp(5px, 2.2cqw, 9px);
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: clamp(8px, 5.8cqh, 11px);
    line-height: 1.5;
    white-space: nowrap;
    color: var(--sq-karma-neutral);
  }
  .kb.right { color: var(--sq-karma-right); border-color: var(--sq-karma-right); }
  .kb.evil { color: var(--sq-karma-evil); border-color: var(--sq-karma-evil); }
  .kb.neutral { color: var(--sq-karma-neutral); }

  .prog {
    grid-area: prog;
    height: clamp(4px, 3.2cqh, 8px);
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }
  .prog > i {
    display: block; height: 100%; width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--fill-a), var(--fill-b));
    transition: width .3s ease;
  }

  .meta {
    grid-area: meta;
    align-self: end;               /* 资源行贴卡片底（身份+进度靠顶） */
    display: flex; flex-direction: column;
    gap: clamp(2px, 1.4cqh, 5px);
    min-width: 0;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; min-width: 0;
    font-size: clamp(9px, 6.8cqh, 12px);
    color: var(--ink-2);
  }
  .row > .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row > .val { flex: 0 0 auto; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .row > .val.em { color: var(--primary); font-weight: 600; }

  /* ── 壁纸透底态（平台关卡 #86）：宿主抽掉玻璃卡底，文字直接压壁纸——
   * 徽标去描边留落影、正文加黑柔光晕，明暗两态都可读 ── */
  :root[data-xhub-wallpaper-clear="1"] .kb {
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }
  :root[data-xhub-wallpaper-clear="1"] .world,
  :root[data-xhub-wallpaper-clear="1"] .name > b,
  :root[data-xhub-wallpaper-clear="1"] .realm,
  :root[data-xhub-wallpaper-clear="1"] .row { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45); }
  :root[data-xhub-wallpaper-clear="1"] { --track: rgba(255, 255, 255, 0.28); }

  /* ── 形态分支（manifest.moduleVariants：标准 / 紧凑 / 通栏）─────────────
   * 宿主把当前形态写到 <html data-xhub-variant>，切形态实时更新；无属性 = 标准。
   * 分支只用属性选择器（CSS 无条件表达式，x-hub surfaces §3.2）；三形态共用本文件。 */
  /* 紧凑（2×2）：砍掉资源/洞府副行，只留 身份 / 进度 */
  :root[data-xhub-variant="compact"] body {
    grid-template-areas:
      "id    karma"
      "prog  prog";
    grid-template-rows: auto auto;
    align-content: center;
  }
  :root[data-xhub-variant="compact"] .meta { display: none; }
  /* 窄格（2×2）里道号与境界同排会互相挤断——紧凑态境界另起一行，道号独占整列 */
  :root[data-xhub-variant="compact"] .name { flex-direction: column; align-items: flex-start; gap: 1px; }

  /* 通栏（6×2）：三列横排——左身份 / 中进度+资源 / 右道途；身份列不参与收缩，防道号被挤断 */
  :root[data-xhub-variant="wide"] body {
    grid-template-columns: auto minmax(90px, 1fr) auto;
    grid-template-areas:
      "id   prog karma"
      "id   meta karma";
    grid-template-rows: auto auto;
    align-content: center;
    align-items: center;
    column-gap: clamp(10px, 2cqw, 18px);
  }
  :root[data-xhub-variant="wide"] .id { justify-content: center; }
  :root[data-xhub-variant="wide"] .name > b { font-size: clamp(14px, 11cqh, 20px); }
  :root[data-xhub-variant="wide"] .kb { align-self: center; }
  :root[data-xhub-variant="wide"] .meta { align-self: center; flex-direction: row; gap: clamp(8px, 2cqw, 18px); }
  :root[data-xhub-variant="wide"] .row { flex: 0 1 auto; gap: 6px; }

  /* 矮格降级（标准兜底）：容器查询按实际高度收副行；通栏显式展开不受影响 */
  @container (max-height: 150px) {
    body .meta { display: none; }
  }
  :root[data-xhub-variant="wide"] .meta { display: flex; }

  /* ── 空态（未入世）：只留 世界名 + 开启提示，居中 ── */
  body.is-empty {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "id";
    grid-template-rows: auto;
    align-content: center;
  }
  body.is-empty .realm,
  body.is-empty .kb,
  body.is-empty .prog,
  body.is-empty .meta { display: none; }
</style>

<script>
(function () {
  var SQ = window.SQ;
  var state = {};
  var VARIANTS = ['compact', 'standard', 'wide'];

  /* 形态落地（x-hub surfaces §3.1 / 易错点 #6c）：宿主会写 <html data-xhub-variant>，
     但 ?xhub-variant=<id> 只在首帧有值——浏览器直开预览时要自己落到 DOM 属性上，
     否则纯 CSS 分支永远不触发。
     ⚠️ 只在 query 带合法形态时才接管：无条件写会覆盖宿主已注入的属性。
     两者都没有 = 无属性 = 按 standard 渲染（基础样式即标准形态）。 */
  (function initVariant() {
    var q = '';
    try { q = new URLSearchParams(location.search).get('xhub-variant') || ''; } catch (e) { q = ''; }
    if (VARIANTS.indexOf(q) >= 0) document.documentElement.setAttribute('data-xhub-variant', q);
  })();

  var $ = function (id) { return document.getElementById(id); };
  function set(id, text) { $(id).textContent = text || ''; }

  function render() {
    document.title = SQ.t('app.name');
    var body = document.body;
    var p = state.profile;
    var ws = p && p.worldId ? state.worlds[p.worldId] : null;

    /* 空态（未入世 / 读档失败）：只留世界名 + 开启提示 */
    if (!ws) {
      body.classList.add('is-empty');
      set('c-world', SQ.t('app.name'));
      set('c-role', SQ.t('module.empty'));
      set('c-realm', ''); set('c-karma', '');
      set('c-qi-t', ''); set('c-stone-t', ''); set('c-cave-t', ''); set('c-cave-m', '');
      $('c-bar').style.width = '0%';
      return;
    }
    body.classList.remove('is-empty');

    var wid = p.worldId;
    var pack = SQ.Worlds[wid].pack;
    var cap = pack.capOf(ws, p) || 0;
    var pct = cap > 0 ? Math.min(100, (ws.qi / cap) * 100) : 0;

    set('c-world', SQ.t('app.name') + ' · ' + (p.worldName || ''));
    set('c-role', SQ.displayName(state));
    /* 境界 + 修为进度：一屏可读，免去再看进度条猜百分比 */
    set('c-realm', SQ.t('realm.' + ws.realm, null, wid) + ' · ' + pct.toFixed(0) + '%');
    $('c-bar').style.width = pct.toFixed(1) + '%';

    set('c-qi-t', SQ.t('resource.primary', null, wid) + ' ' + SQ.fmt(ws.qi));
    set('c-stone-t', SQ.t('resource.currency', null, wid) + ' ' + SQ.fmt(ws.stones));

    /* 道途徽标：正道金 / 魔道红 / 左道青灰（UI 文档 §四） */
    var sys = pack.worldSystems;
    var tier = sys ? sys.tierOf(ws) : 'neutral';
    var kb = $('c-karma');
    kb.className = 'kb ' + tier;
    set('c-karma', SQ.t('karma.tier.' + tier, null, wid));

    /* 洞府 flavour：驻留洞府名 + 灵脉倍率 */
    var cv = SQ.Cave.current(ws, pack);
    var mult = SQ.Cave.multOf(ws, pack, pack.data, SQ.Mods.collect(p, ws, pack, pack.data));
    set('c-cave-t', SQ.t('cave.system', null, wid) + ' ' + SQ.t('cave.' + cv.id + '.name', null, wid));
    set('c-cave-m', '×' + mult.toFixed(2));
  }

  async function refresh() {
    try {
      /* A2（第册三十批 · 排期 A2）：卡片**只读**。原先每 30s 走一次 `SQ.claim`，与 view 侧每秒的
       * claim 争同一个键，而 `core.js` 那把 `opChain` 写锁是**每 JS 上下文各一把**（跨上下文互不可见）
       * ⇒ 两边的「读-改-写」会互吞离线结算。卡片本就是展示面（第二十一批已删跳转、只读），结算交回
       * view 一侧 ⇒ 少一个写入者。原注那句「卡片上也已结算离线收益」随之作废（它描述的正是要撤的行为）。
       * 判据 = 审计 **D10**（module 件里禁出现任何写入口），走查 `verify-ui-modulecard` 同源对表照跑。 */
      var sRead = await SQ.load();
      if (sRead) state = sRead;
      render();
    } catch (e) {
      document.body.classList.add('is-empty');
      set('c-role', SQ.t('ui.error.short'));
    }
  }

  /* 卡片**不绑跳转**（第二十一批）：切形态要调宿主那条尚未注册的桥 API，预检的 warn 就来自它的字面量，
   * 故整段删除、卡片只读（cursor 已在样式里回 default）。全名与来龙去脉只记在 docs（主设计 §七A 第 63 条）——
   * 预检是纯文本匹配，注释里写它的点号名同样会被判"用到"。
   * shortcut: 宿主把它注册进 capabilities 后若要恢复"点卡进全量"，届时连同能力探测一起加回。 */

  refresh();
  setInterval(refresh, 30000);
})();
</script>
