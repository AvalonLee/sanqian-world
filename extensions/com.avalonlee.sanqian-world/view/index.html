    ui.tab = 'idle'; ui.newLogDot = false; ui.newFeedDot = false;
    ui.lastLogKey = ''; ui.lastFeedKey = ''; ui.seenOfflineAt = 0; ui.spouseLogSeen = 0;
    ui.seenDeathAt = 0; ui.deathPending = false;   /* 坐化呈报基线随清档复位（寿元批） */
    ui.announcedLogKey = ''; ui.karmaRank = '';   /* 名号段位基线复位（新档重新入世后由 enterMain 对齐） */
    /* 走查 v2.5 §6：重置后四类红点基线清零（新档从头计数） */
    ui.lastArtsSig = 0; ui.lastTreasureSig = 0; ui.lastBondSig = 0; ui.lastShopSig = 0;
    ui.newArtsDot = false; ui.newTreasureDot = false; ui.newBondDot = false; ui.newShopDot = false;
    ui.achvSnap = achvRedDotSig();          /* 成就页红点基线：重置后从头计数 */
    show('c1');
  }

  /* 角色身份三元组（道名/世界/境界）：顶栏、角色浮层标题、设置页存档提示三处共用同一来源，
   * 防三处各自拼接漂移（I2 收口）。 */
  function identityParts() {
    return { name: SQ.displayName(state), world: state.profile.worldName, realm: t('realm.' + ws().realm) };
  }

  function renderTop() {
    var w = ws(), p = pack();
    var sys = p.worldSystems;
    var tier = sys ? sys.tierOf(w) : 'neutral';
    /* 走查 v2.7 §1：第一行 = 角色名称 · 境界 · 势力（未加入不显示势力）；第二行 = 名号徽章 + 灵石。
     * 位置互换（v4）：角色名称移到第一行正文，世界名改由 #m-wm 水印承载；世界名前不再加「@」。
     * 善恶名号批 v3：名号徽章（如「极道魔尊」）位于第二行最左侧，为顶栏唯一善恶入口（点按开善恶浮层）。
     * 水印（方案 B3）：水印改作世界名——半透明竖排大字，位于面板底色与文字层之间。
     * 布局：徽章为 flex:0 0 auto（固定不缩），灵石与元信息可缩省略号，防势力名过长溢出。 */
    var idp = identityParts();
    var fac = SQ.Factions.current(w);
    var rankId = (sys && sys.rankOf) ? sys.rankOf(w) : 'zuodao';
    $('m-wm').textContent = idp.world;
    $('m-who').innerHTML =
      '<span class="who-meta">' + esc(idp.name) + ' · ' + esc(idp.realm) + (fac ? ' · ' + esc(fac.name) : '') + '</span>';
    /* 第二行最左 = 名号徽章（data-act="karma" → 善恶浮层）；其后 = 灵石 */
    var rk = $('m-rank');
    rk.className = 'rankchip ' + tier;
    rk.textContent = t('karma.rank.' + rankId);
    $('m-stones').textContent = t('resource.currency') + ' ' + SQ.fmt(w.stones);
    /* 第三行 = 战力 + 修为（走查 v2.7 §1：修为以「万」为单位，SQ.fmt 缩放） */
    var m3 = SQ.Mods.collect(state.profile || { talents: [] }, w, p, p.data);
    $('m-sub').textContent = t('resource.power') + ' ' + SQ.fmt(SQ.Mods.powerOf(w, p, p.data, m3)) +
      ' · ' + t('resource.primary') + ' ' + SQ.fmt(w.qi) + ' / ' + SQ.fmt(SQ.Idle.capOf(w, p, p.data, m3));
  }

  function renderTab() {
    _mods = null;                       /* 渲染入口清 mods 记忆（见 mods() 那条注）*/
    if (ui.tab === 'idle') renderIdle();
    else if (ui.tab === 'combat') renderCombat();
    else if (ui.tab === 'arts') renderArts();
    else if (ui.tab === 'treasure') renderTreasure();
    else if (ui.tab === 'shop') SQ.UI.shop.render(ctx());
    else if (ui.tab === 'faction') renderFaction();
    else if (ui.tab === 'bonds') renderBonds('tab');
    else if (ui.tab === 'event') renderEvent();
    else if (ui.tab === 'alchemy') renderAlchemy();
    else if (ui.tab === 'prodigy') SQ.UI.jianghu.render(ctx());
    else if (ui.tab === 'sect') renderSect();
    else if (ui.tab === 'achv') SQ.UI.achv.render(ctx());
    else if (ui.tab === 'legacy') renderLegacy();
    else if (ui.tab === 'journal') SQ.UI.journal.render(ctx());
    else if (ui.tab === 'settings') renderSettings();
  }

  function renderAll() {
    _mods = null;                       /* 整轮渲染一次聚合：renderTop 与 renderTab 各自入口清 */
    renderTop();
    renderTabbar();
    /* 惰性页（journal/settings 每次重进时重建）：清掉上一状态残留，避免离开后仍显示旧数据 */
    $('tab-journal').innerHTML = '';
    $('tab-settings').innerHTML = '';
    renderTab();
    checkSpouseLog();   /* 双修解除叙事（B4）：spouseLog.at 键控会话一次 */
  }

  /* ── 渡劫演出（F7：悬念 1s 不可跳 → 成败帧：损失明细 + 成算复盘 + 计数；reduced-motion 直出）── */
  var tribTimer = null, tribUnlocked = false;
  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }
  function snapTrib() {
    try {
      var w = ws(), p = pack(), d = D(), m = mods();
      var ti = p.worldSystems.tribInfo(w, p, d, m);
      var loss = p.worldSystems.tribLoss(w, p, d, m);
      ui.tribSnap = ti ? {
        p: Math.round(ti.p * 100), loss: Math.round(loss * 100),
        /* 护法叙事三态素材（B6）：道号 / 道侣形态名（护法恰为道侣时）/ 魔道独行 */
        guardNpc: ti.parts.guardianNpc || null, guardBonus: ti.parts.guardian || 0,
        evil: p.worldSystems.tierOf(w) === 'evil',
        spouseForm: (w.spouse && ti.parts.guardianNpc === w.spouse.npcId) ? w.spouse.form : null
      } : null;
    } catch (e) { ui.tribSnap = null; }
  }
  /* 渡劫呈报（渡劫演出重做批）：主题感知卡片 + 成算环蓄势 → 结果帧数据行。
   * 环 = 成算（0~100%），胜主色 / 败警戒色；数据行陈列成算 / 损失 / 次数 / 护法。 */
  var TRIB_ARC_C = 264;   /* 环周长 = 2πr（r = 42） */
  function tribArc(p, color) {
    var arc = $('trib-arc');
    if (!arc) return;
    arc.style.stroke = color;
    arc.style.strokeDashoffset = String(TRIB_ARC_C * (1 - Math.max(0, Math.min(100, p)) / 100));
  }
  function tribRow(label, value, tone) {
    return '<div class="tr' + (tone ? ' ' + tone : '') + '"><span>' + esc(label) + '</span><b>' + esc(value) + '</b></div>';
  }
  function showTrib() {
    var w = ws();
    var win = w.tribulation.lastResult === 'success';
    var snap = ui.tribSnap;
    var box = $('trib-box');
    var p = snap ? snap.p : 0;
    box.className = 'trib-card charging';
    /* 悬念帧：环自 0 蓄势到成算（reduced-motion 直落） */
    var arc = $('trib-arc');
    arc.style.transition = 'none';
    arc.style.stroke = 'var(--primary)';
    arc.style.strokeDashoffset = String(TRIB_ARC_C);
    $('trib-ring-p').textContent = snap ? String(p) : '--';
    $('trib-t1').textContent = t('trib.suspense');
    $('trib-t2').textContent = t('trib.attempts', { n: w.tribulation.attempts });
    $('trib-rows').innerHTML = '';
    $('trib-guard').classList.add('hide');
    $('trib-skip').classList.add('hide');
    tribUnlocked = false;
    $('trib-stage').classList.remove('hide');
    var charge = function () { arc.style.transition = ''; tribArc(p, 'var(--primary)'); };
    if (reducedMotion()) charge(); else requestAnimationFrame(charge);
    function reveal() {
      box.className = 'trib-card ' + (win ? 'win' : 'lose');
      tribArc(p, win ? 'var(--primary)' : 'var(--bad)');
      $('trib-t1').textContent = win ? t('trib.result.win') : t('trib.result.lose');
      $('trib-t2').textContent = win
        ? t('tribulation.success', { realm: t('realm.' + w.realm) }) + ' · ' + t('tribulation.reset')
        : t('tribulation.reset');
      /* 数据行：成算 / [败] 修为损失 / 渡劫次数 / 护法加项 */
      var rows = '';
      if (snap) rows += tribRow(t('trib.row.p'), p + '%', 'hot');
      if (!win && snap) rows += tribRow(t('trib.row.loss'), snap.loss + '%', 'bad');
      rows += tribRow(t('trib.row.n'), t('trib.attempts', { n: w.tribulation.attempts }));
      if (snap) rows += snap.guardBonus > 0
        ? tribRow(t('tribulation.guardian'), '+' + snap.guardBonus.toFixed(2), 'hot')
        : tribRow(t('tribulation.guardian'), t('tribulation.guardian.none'));
      $('trib-rows').innerHTML = rows;
      /* 护法叙事行（B6 · 帧四）：成功三态（道号+加项 / 道侣形态名 / 魔道独行） */
      var tg = $('trib-guard');
      if (win && snap && snap.guardNpc && snap.guardBonus > 0) {
        tg.textContent = snap.spouseForm
          ? t('tribulation.guardianSpouse', { name: t('bond.' + snap.guardNpc + '.name'), form: t('bond.spouse.form.' + snap.spouseForm) })
          : t('tribulation.guardianLine', { name: t('bond.' + snap.guardNpc + '.name') });
        tg.classList.remove('hide');
      } else if (win && snap && snap.evil) {
        tg.textContent = t('tribulation.guardianNone');
        tg.classList.remove('hide');
      }
      $('trib-skip').textContent = t('trib.skip');
      $('trib-skip').classList.remove('hide');
      tribUnlocked = true;
    }
    if (reducedMotion()) reveal();
    else setTimeout(reveal, 1000);
    if (tribTimer) clearTimeout(tribTimer);
    /* 悬念 1s（不可跳）+ 结果帧 2s 自动关（交互说明 §4.9）；reduced-motion 直出后同样 2s */
    tribTimer = setTimeout(function () { if (tribUnlocked) hideTrib(); }, reducedMotion() ? 2000 : 3000);
  }
  function hideTrib() {
    $('trib-stage').classList.add('hide');
    if (tribTimer) { clearTimeout(tribTimer); tribTimer = null; }
  }
  $('trib-stage').addEventListener('click', function () { if (tribUnlocked) hideTrib(); });

  /* ── 抉择模态（F3）：三分支 + 信息层（成算/花费/缺项置灰）+ 判定演出 + 结果页 + 独占全屏演出。
   * karma 不预告（按钮无道心数值）；确定性判定不满足 → 置灰；attr/power 类给出成算或可预判结果。── */
  var choiceResult = null;
  var judgingTimers = [];
  function findEvent(id) { return SQ.Events.findById(pack(), id); }
  function branchChecks(br) { return br.check ? (Array.isArray(br.check) ? br.check : [br.check]) : []; }

  function checkPreview(chk) {
    var w = ws(), d = D(), m = mods(), p = pack();
    var sys = p.worldSystems;
    var type = chk.type || 'attr';
    if (type === 'attr') {
      var eff = sys.effectsOf ? sys.effectsOf(w) : null;
      var dc = SQ.Attrs.dcStdOf(w, d) * d.ATTR_DIFF[chk.dc] * (eff ? eff.checkDcMult : 1);
      var v = w.attrs[chk.attr] || 0;
      /* 判定加点三源合计封顶（引擎同口径 #131）：摄魂 + 斩三尸 + 秦老丈 ≤ +15pp */
      var ppAdd = Math.min(d.CHECK_BONUS_CAP != null ? d.CHECK_BONUS_CAP : 0.15,
        ((m.hooks.shehun) || 0) + ((m.sum && m.sum.checkBonus) || 0) + ((m.bonds && m.bonds.checkPp) || 0));
      var pp = 0.5 + (v - dc) / (2 * dc) + ppAdd;
      pp = Math.max(d.ATTR_P_CLAMP[0], Math.min(d.ATTR_P_CLAMP[1], pp));
      /* N20 接线：难度名此前不上屏（ATTR_DIFF 四档只在引擎侧乘算，玩家看到的是「属性 + 成算」，看不出这一门难在哪）       * ⇒ 动态取词 `t('dc.' + chk.dc)`，A6 的拼接前缀覆盖口径与 `odds.*` 同族 */
      var lblDc = t('event.check.type.attr', { attr: t('attr.' + chk.attr) }) + ' · ' + t('dc.' + chk.dc);
      return { kind: 'odds', label: lblDc,
        text: lblDc + ' · ' + t('event.check.odds', { odds: t(SQ.Attrs.oddsKey(pp)) }), ok: true };
    }
    if (type === 'karma') {
      var k = sys.karmaOf(w);
      return { kind: 'det', ok: (chk.min == null || k >= chk.min) && (chk.max == null || k <= chk.max), label: t('event.check.type.karma') };
    }
    if (type === 'align') {
      return { kind: 'det', ok: sys.tierOf(w) === chk.need, label: t('event.check.type.align') };
    }
    if (type === 'stones') {
      var lo = Array.isArray(chk.cost) ? chk.cost[0] : (chk.cost || 0);
      var hi = Array.isArray(chk.cost) ? chk.cost[1] : lo;
      return { kind: 'det', ok: w.stones >= lo, label: t('event.check.type.stones'),
        text: t('event.check.cost.stones', { n: lo === hi ? SQ.fmt(lo) : SQ.fmt(lo) + '~' + SQ.fmt(hi), cur: t('resource.currency') }) };
    }
    if (type === 'qi') {
      var pq = Math.round((Array.isArray(chk.pct) ? chk.pct[0] : (chk.pct || 0)) * 100);
      return { kind: 'det', ok: w.qi > 0, label: t('event.check.type.qi'),
        text: t('event.check.cost.qi', { res: t('resource.primary'), p: pq }) };
    }
    if (type === 'art') {
      var artsMap = p.artsMap();
      var ids = chk.id ? [chk.id] : (w.artsKnown || []).filter(function (aid) {
        var a = artsMap[aid];
        if (!a) return false;
        if (chk.tier != null && a.tier !== chk.tier) return false;
        if (chk.alignment && a.alignment !== chk.alignment) return false;
        return true;
      });
      var oka = ids.length > 0 && ids.every(function (aid) { return (w.artsKnown || []).indexOf(aid) >= 0; });
      if (oka && chk.slotted) oka = ids.some(function (aid) { return (w.artsSlots || []).indexOf(aid) >= 0; });
      return { kind: 'det', ok: oka, label: t('event.check.type.art') };
    }
    if (type === 'gear') {
      var okg = false;
      for (var slot in w.gear) {
        var it = w.gear[slot];
        if (!it) continue;
        if (chk.slot && it.slot !== chk.slot) continue;
        if (chk.tierMin != null && it.tier < chk.tierMin) continue;
        if (chk.special && it.special !== chk.special) continue;
        okg = true; break;
      }
      return { kind: 'det', ok: okg, label: t('event.check.type.gear') };
    }
    if (type === 'companion') {
      /* 第九类（B7 · 引擎卷 §3.5）：护法位档 ≥ minTier；魔道档必然失败 →「无人可援」置灰提示不隐藏 */
      var gC = SQ.Bonds ? SQ.Bonds.guardianOf(w, p, d) : null;
      var okC = !!(SQ.Bonds && SQ.Bonds.companionOk(w, p, d, chk.minTier));
      var lackC = okC ? '' : ((gC && gC.evil) ? t('event.check.companion.none') : t('event.check.companion.need', { n: chk.minTier || 1 }));
      return { kind: 'det', ok: okC, label: t('event.check.type.companion'), lack: lackC,
        text: okC
          ? t('event.check.type.companion') + ' · ' + t('bond.' + gC.npcId + '.name') + bondTierNum(gC.tier)
          : lackC };
    }
    if (type === 'power') {
      var pw = SQ.Mods.powerOf(w, p, d, m);
      var nd = d.ZONES[w.zone].need * (chk.ratio != null ? chk.ratio : 1);
      return { kind: 'det', ok: pw >= nd, label: t('event.check.type.power') };
    }
    if (type === 'ambushFoe') {
      /* 敌手快照（第卌四批 · §6.1B）：只报「你多少 / 对方多少」，**不置灰**——
       * 打得过打不过都是玩家的一念，这一族的「难」不该由 disabled 替他决定。
       * 成算不显示：引擎是双方各 ±10% 浮动的对局，写一个百分比就是假精确（切磋那边同理只给让差档）。 */
      var fo = (w.pendingChoice && w.pendingChoice.foe) || null;
      var fpw = fo && fo.power > 0 ? fo.power : 0;
      return { kind: 'odds', ok: true, label: t('event.check.type.ambushFoe'),
        text: fpw ? t('event.ambush.ui.vs', { a: SQ.fmt(SQ.Mods.powerOf(w, p, d, m)), b: SQ.fmt(fpw) })
          : t('event.check.type.ambushFoe') };
    }
    return { kind: 'det', ok: true, label: '' };
  }

  /* ── 自动奇遇（自动批）：开启后奇遇触发不再弹抉择模态，自动择一「可用」分支并结算 ──
   * 可用 = 确定性判定全过（与抉择模态按钮置灰同一套 checkPreview 口径）；
   * 倾向（体验批）：settings.eventPref 指定分支且可用 → 直接选它；否则可用分支中随机择一
   * （机缘本就无常）；全部不可用（理论不发生，防御）退化为全分支随机。
   * 结算走与手动抉择完全相同的 SQ.Actions.resolveChoice 单一通道，toast 告知抉择结果。 */
  function autoEventOn() {
    /* 战术限时抉择（第卌四批 · §6.1B）不受自动奇遇代择：用户原话「必须手动选，限时，超时默认迎战」——
     * 自动模式的语义是「机缘当前替玩家拿主意」，而这一族要保留的正是那一念之间。
     * 判据 = 走查 verify-ui-ambush A1（开着 autoEvent 也不代择，浮层与挂起都还在）。 */
    var wp = ws();
    if (wp && wp.pendingChoice) {
      var evp = findEvent(wp.pendingChoice.id);
      if (evp && evp.tactical) return false;
    }
    return !!(state.settings && state.settings.autoEvent);
  }
  function autoEventPref() {
    var p = state.settings && state.settings.eventPref;
    return (p === 'right' || p === 'evil' || p === 'neutral') ? p : 'none';
  }
  var autoEventBusy = false;                     /* 秒级 tick 防重入：resolveChoice 异步落盘期间不再重复触发 */
  function autoAvailableBranches(ev) {
    var out = [];
    ['right', 'evil', 'neutral'].forEach(function (bk) {
      var br = ev.choices && ev.choices[bk];
      if (!br) return;
      var ok = branchChecks(br).every(function (c) { return checkPreview(c).ok; });
      if (ok) out.push(bk);
    });
    return out;
  }
  async function autoResolveChoice() {
    if (autoEventBusy || !autoEventOn()) return;
    var pend = ws() && ws().pendingChoice;
    if (!pend) return;
    var ev = findEvent(pend.id);
    if (!ev) return;
    var bks = autoAvailableBranches(ev);
    if (!bks.length) bks = Object.keys(ev.choices || {});
    if (!bks.length) return;
    var pref = autoEventPref();
    var bk = (pref !== 'none' && bks.indexOf(pref) >= 0)
      ? pref
      : bks[Math.floor(Math.random() * bks.length)];
    autoEventBusy = true;
    try {
      var res = await SQ.Actions.resolveChoice(state, bk);
      if (res) {
        toast(t('event.auto.resolved', { name: t('event.' + ev.id + '.name'), branch: t('branch.' + bk) }));
        if (res.eff && (res.eff.exclusiveGear || res.eff.exclusiveArt)) showExclusive(res.eff);
        /* bond 升档 toast：与手动抉择同一白名单（交互说明 §2.3） */
        var bd = res.eff && res.eff.bond;
        if (bd && bd.tierUp && !bd.blocked) {
          toast(t('bond.toast.tier', { name: t('bond.' + bd.npc + '.name'), title: t('bond.' + bd.npc + '.title.' + bd.tier) }));
          if (bd.tier === 3) toast(t('bond.toast.guardian', { name: t('bond.' + bd.npc + '.name') }));
        }
      }
      renderAll();
    } finally { autoEventBusy = false; }
  }

  function showChoice() {
    var pend = ws().pendingChoice;
    if (!pend) return;
    var ev = findEvent(pend.id);
    if (!ev) return;
    choiceResult = null;
    judgingTimers.forEach(function (tm) { clearTimeout(tm); });
    judgingTimers = [];
    $('mc-badges').innerHTML =
      '<span class="mbadge">' + esc(t('event.tier.' + ev.tier)) + '</span>' +
      '<span class="mbadge ' + (ev.nature === 'good' ? 'good' : 'bad') + '">' + esc(t('event.nature.' + ev.nature)) + '</span>' +
      (ev.special ? '<span class="mbadge sp">' + esc(t('event.badge.special')) + '</span>' : '') +
      (ev.once ? '<span class="mbadge sp">' + esc(t('event.badge.once')) + '</span>' : '');
    $('mc-title').textContent = t('event.' + ev.id + '.name');
    $('mc-story').textContent = t('event.' + ev.id + '.story') +
      /* 敌手快照（第卌四批 · 袭击/寻仇）：名号与战力在触发时刻已定，屏上如实报——
       * 名录里那人此刻可能已绝交/已出榜，但**那一刀是真的冲你来过**，不回填成别人 */
      (pend.foe ? '\n' + t('event.ambush.ui.foe', { name: pend.foe.nm, p: SQ.fmt(pend.foe.power) }) : '');
    var bh = '';
    var tac = ev.tactical === true;   /* 战术抉择（迎战 / 避战 / 认输）与善恶无关：不打「正道/魔道」前缀 */
    ['right', 'evil', 'neutral'].forEach(function (bk) {
      var br = ev.choices[bk];
      if (!br) return;
      var infos = [], disabled = false, lackParts = [];
      branchChecks(br).forEach(function (chk) {
        var pv = checkPreview(chk);
        infos.push(pv.text || pv.label);
        if (pv.kind === 'det' && !pv.ok) { disabled = true; lackParts.push(pv.lack || pv.label); }
      });
      if (disabled) infos.push(t('event.branch.lack', { req: lackParts.join(' · ') }));
      var hasLock = (br.gain || []).some(function (g) { return g.type === 'bondLock'; });
      /* 情谊生裂角标（缘尽收敛批）：轻中度背叛分支的预告——措辞比「绝缘」轻，明示不致缘尽 */
      var hasDrain = (br.gain || []).some(function (g) { return g.type === 'bondDrain'; });
      bh += '<button class="branch ' + bk + '-b" data-act="choose" data-v="' + bk + '"' + (disabled ? ' disabled' : '') + '>' +
        '<span class="bk">' + (tac ? '' : esc(t('branch.' + bk)) + ' · ') + esc(t('event.' + ev.id + '.branch.' + bk)) +
        (hasLock ? ' <span class="ebadge gray">' + esc(t('event.badge.bondlock')) + '</span>' : '') +
        (!hasLock && hasDrain ? ' <span class="ebadge gray">' + esc(t('event.badge.bonddrain')) + '</span>' : '') + '</span>' +
        (infos.length ? '<span class="bi">' + esc(infos.join(' · ')) + '</span>' : '') +
        '</button>';
    });
    $('mc-branches').innerHTML = bh;
    $('mc-branches').classList.remove('hide');
    if (tac) ambushCountdown();
    else {
      ambushHalt();
      $('mc-foot').textContent = t('event.modal.foot');
      $('mc-foot').classList.remove('hide');
    }
    $('mc-judging').classList.add('hide');
    $('mc-result').classList.add('hide');
    $('modal-choice').classList.remove('hide');
  }

  /* ── 限时抉择（第卌四批 · 数值详设 §6.1B）：袭击 / 族中寻仇必须手动择，超时默认迎战。
   * 计时器归浮层自己养：秒级 tick 在「抉择浮层开着」时整段让路（见 startTick 首行那句 return），
   * 挂在 tick 上等于永远不倒数。**离线不倒数**——关掉页面就是把这抉择留到下次进线，
   * 不会「睡一觉被仇家打死」（用户定的这条与「限时」并不冲突：限时限的是你盯着屏幕的那一刻）。
   * 超时结算走与玩家手点**完全同一条** `SQ.Actions.resolveChoice`，不另开结算口——
   * 否则「超时迎战胜」与「手点迎战胜」的账会分叉（本仓「单一通道」纪律）。
   * shortcut: 重新载入页面会把这一轮的时限重新给满（刷新即可拖延）；要收紧就得把剩余量落盘、
   * 按在线时长扣减，代价是每秒一次写档——不值。 */
  var ambushTimer = null;
  function ambushHalt() {
    if (ambushTimer) { clearInterval(ambushTimer); ambushTimer = null; }
  }
  function ambushFoot(left) {
    $('mc-foot').textContent = t('event.modal.foot') +
      (left > 0 ? ' · ' + t('event.ambush.ui.remain', { t: timeLeftText(left) }) : '');
    $('mc-foot').classList.remove('hide');
  }
  function ambushCountdown() {
    ambushHalt();
    var A = D().AMBUSH || {};
    var left = A.DECIDE_MS || 0;
    ambushFoot(left);
    if (!(left > 0)) return;
    ambushTimer = setInterval(async function () {
      var w = ws();
      if (!w || !w.pendingChoice || $('modal-choice').classList.contains('hide')) { ambushHalt(); return; }
      left -= 1000;
      if (left > 0) { ambushFoot(left); return; }
      ambushHalt();
      ambushFoot(0);
      toast(t('event.ambush.ui.timeout'));
      var res = await SQ.Actions.resolveChoice(state, 'right');
      if (res && res.eff && (res.eff.exclusiveGear || res.eff.exclusiveArt)) showExclusive(res.eff);
      renderAll();
    }, 1000);
  }

  /* 独占奖励全屏演出（获得即演；点击或 2.8s 自动收起） */
  function showExclusive(eff) {
    var isGear = !!eff.exclusiveGear;
    var name = isGear ? t('gear.ex.' + eff.exclusiveGear) : t('skill.' + eff.exclusiveArt + '.name');
    $('excl-t1').textContent = isGear ? t('event.exclusive.title') : t('event.exclusive.art');
    $('excl-t2').textContent = name;
    $('excl-t3').textContent = t('event.exclusive.hint');
    $('excl-stage').classList.remove('hide');
    setTimeout(function () { $('excl-stage').classList.add('hide'); }, 2800);
  }
  $('excl-stage').addEventListener('click', function () { $('excl-stage').classList.add('hide'); });

  /* 名号更迭全屏演出（善恶名号批）：跨段瞬间弹，小标 + 大名号 + 尾注；点按或 3.2s 自动收。
   * 与独占演出同「获得即演」纪律；轻幕 + 按档位着色（正/左/魔三色）。 */
  var rankStageTimer = null;
  function showKarmaRank(rankId, tier) {

    st.className = 'rank-mask ' + tier;

    rankStageTimer = setTimeout(function () { st.classList.add('hide'); }, 3200);
  }
  $('rank-stage').addEventListener('click', function () { $('rank-stage').classList.add('hide'); });

  /* 洞府入驻轻演出（批 2 · B3 · 稿三）：只给「第一次拥有」——洞府名 + caveMult + 灵气叙事全文，
   * 点按跳过 / 4.2s 自动收；迁居（已持有间切换）不出本演出，只弹一行 toast。 */
  var caveStageTimer = null;
  function showCaveEnter(caveId, mult) {
    $('cvs-t1').textContent = t('cave.system');
    $('cvs-t2').textContent = t('cave.' + caveId + '.name');
    $('cvs-t3').textContent = t('cave.show.mult', { mult: mult.toFixed(2) });

    clearTimeout(caveStageTimer);
    $('cave-stage').classList.add('hide');
  });

  function renderChoiceResult(res) {
    choiceResult = res;
    $('mc-branches').classList.add('hide');
    $('mc-foot').classList.add('hide');
    $('mc-judging').classList.add('hide');
    $('mc-result').classList.remove('hide');
    var br = res.ev && res.ev.choices ? res.ev.choices[res.branch] : null;
    var checks = br ? branchChecks(br) : [];
    var ck = $('mc-check');
    if (checks.length) {
      ck.textContent = res.pass ? t('event.result.pass') : t('event.result.fail');
      ck.className = 'res-check ' + (res.pass ? 'pass' : 'fail');
    } else {
      ck.textContent = '';
      ck.className = 'res-check';
    }
    $('mc-karma').textContent = res.karmaTxt;
    $('mc-karma').className = 'res-karma ' + (res.karma >= 0 ? 'pos' : 'neg');
    $('mc-eff').textContent = SQ.Events.effText(ws(), pack(), D(), res.eff || {});
    var exEl = $('mc-excl');
    if (res.eff && (res.eff.exclusiveGear || res.eff.exclusiveArt)) {
      /* 独占已入手：全屏演出之外，结果页留一行豁免规则提示（UI §3.5） */
      exEl.textContent = t('event.exclusive.hint');
      exEl.classList.remove('hide');
    } else {
      exEl.classList.add('hide');
    }
    /* 绝交锁结果页末行灰字（B7）：「有些事做了，就再没有回头路」
     * 缘尽收敛批（引擎卷 v1.10 §3.6）：门槛不合已降级为情谊生裂 → 换软措辞末行，
     * 明确告知「未至恩断义绝、尚可挽回」，与 res.eff.bondLock 互斥（events.js 已同步撤销）。 */
    var blEl = $('mc-bondlock');
    if (res.eff && res.eff.bondLock) {
      blEl.textContent = t('log.eff.bondLock', { name: t('bond.' + res.eff.bondLock + '.name') });
      blEl.classList.remove('hide');
    } else if (res.eff && res.eff.bondDrain) {
      blEl.textContent = t('log.eff.bondDrain.hint', { name: t('bond.' + res.eff.bondDrain + '.name') });
      blEl.classList.remove('hide');
    } else {
      blEl.classList.add('hide');
    }
    $('mc-ok').textContent = t('ui.confirm');
  }
  $('mc-ok').addEventListener('click', function () { $('modal-choice').classList.add('hide'); renderAll(); });

  /* 闭关明细行（面板与出关呈报同源同数，走查稿② 第 4/6 项）：
   * 离线效率拆解 + 12h 上限是否触顶 + 奇遇时钟冻结读数（在线爬钟的悬念钩子） */
  function offlineDetail(lo) {
    var w = ws(), m = mods(), d = D();
    var base = Math.round(d.OFFLINE_EFF * 100);
    var bonus = Math.round(((m.sum && m.sum.offlineEff) || 0) * 100);
    var capH = d.OFFLINE_CAP_H + ((m.hooks && m.hooks.changye) || 0);
    var cs = Math.max(0, Math.floor(w.eventClock || 0));
    return t('offline.panel.detail', {
      base: base, bonus: bonus, eff: base + bonus, cap: capH,
      capNote: (lo && lo.secs > capH * 3600) ? t('offline.cap.hit') : t('offline.cap.miss'),
      clock: t('ui.time.ms', { m: Math.floor(cs / 60), s: cs % 60 })
    });
  }

  /* 出关呈报（F4：lastOffline.at 键控 · 会话一次 · EVENT_CHOICE 优先顺延）
   * 正文改为数据网格：只陈列本次离线所得的数字（修为/灵石/时长/渡劫），不再走散文句式 */
  function showOfflineReport() {
    var lo = ws().lastOffline;
    if (!lo) return;
    ui.seenOfflineAt = lo.at;
    var lsecs = isFinite(lo.secs) ? lo.secs : 0;   /* 防脏字段：NaN/undefined 一律按 0 计 */
    var lh = Math.floor(lsecs / 3600), lm = Math.floor((lsecs % 3600) / 60);
    var lt = lh > 0 ? t('ui.time.hm', { h: lh, m: lm }) : t('ui.time.m', { m: Math.max(1, lm) });
    var ventureLo = lo.mode === 'venture';
    var trib = lo.trib || { n: 0, s: 0, f: 0 };
    $('mo-title').textContent = t('offline.report.title');
    $('mo-sub').textContent = t(ventureLo ? 'offline.panel.title.v' : 'offline.panel.title');
    $('mo-stats').innerHTML =
      '<div class="o"><div class="on">' + esc(t('resource.primary')) + '</div>' +
        '<div class="ov">+' + SQ.fmt(lo.qi) + '</div></div>' +
      '<div class="o"><div class="on">' + esc(t('resource.currency')) + '</div>' +
        '<div class="ov">+' + SQ.fmt(lo.stones || 0) + '</div></div>' +
      '<div class="o"><div class="on">' + esc(t('offline.stat.dur')) + '</div>' +
        '<div class="ov">' + esc(lt) + '</div></div>' +
      '<div class="o"><div class="on">' + esc(t('tribulation.tag')) + '</div>' +
        '<div class="ov">' + trib.n + '<span class="u">' + esc(t('offline.stat.times')) + '</span></div>' +
        (trib.n > 0 ? '<div class="os">' + esc(t('offline.stat.trib.split', { s: trib.s, f: trib.f })) + '</div>' : '') +
      '</div>';
    $('mo-hint').textContent = offlineDetail(lo) + ' · ' +
      t(ventureLo ? 'offline.report.hint.v' : 'offline.report.hint');
    $('mo-ok').textContent = t('offline.report.ok');
    $('modal-offline').classList.remove('hide');
  }
  /* 坐化呈报（寿元批 2026-10-15 · §6.1A）：引擎在 claim 内已经判死、结完遗泽、把 ws 换成新世，
   * 这里只交代「为什么死 + 这一世带走了什么」，确定即进创角——绝不做「无声被扔回创角屏」。
   * 与出关呈报同一浮层组件（不加新 DOM id ⇒ A3 零新增面），at 键控会话一次。 */
  function showDeathReport() {
    var ld = ws().lastDeath;
    if (!ld) return;
    ui.seenDeathAt = ld.at;
    ui.deathPending = true;
    $('mo-title').textContent = t('life.death.title');
    /* 死因取话（第卌八批）：旧写法是 `cause === 'daoshang' ? 道伤 : 寿尽` 的二元 ternary，
     * 新增的 zhesou 会被静默归成「寿元耗尽」——那句谎话正是本仓登记过的「兜底键复用」那一形。
     * 三个键名都按字面量写全：A6 的反向扫描只认字面量，动态拼串会把它判成孤儿。 */
    $('mo-sub').textContent = t(ld.cause === 'daoshang' ? 'life.death.daoshang'
      : (ld.cause === 'zhesou' ? 'life.death.zhesou' : 'life.death.shoujin'));
    $('mo-stats').innerHTML = '';
    $('mo-hint').textContent = t('life.death.stats', {
      age: SQ.fmt(ld.age || 0),
      realm: t('realm.' + Math.min(ld.realm || 0, D().REALMS.length - 1)),
      dao: ld.dao || 0, n: SQ.fmt(ld.total || 0)
    });
    $('mo-ok').textContent = t('life.death.ok');
    $('modal-offline').classList.remove('hide');
  }
  $('mo-ok').addEventListener('click', function () {
    $('modal-offline').classList.add('hide');
    /* 死后的「转世重生」= 进创角（与兵解/飞升收线同一条路）；出关呈报仍走原路重绘 */
    if (ui.deathPending) { ui.deathPending = false; enterRebirthCreation(); playRecapLastBio(); return; }
    renderAll();
  });

  /* ── 角色浮层 ── */
  function showRole() {
    var w = ws(), d = D(), m = mods(), p = pack();
    var idp = identityParts();
    $('mr-title').textContent = idp.name + ' · ' + idp.world + ' · ' + idp.realm;
    var h = '';
    /* 天道段（天道系统批 B3）：称号「我命由我不由天」/ 逆天盾 / 逆天值展示 */
    var tdRole = w.tiandao;
    if (tdRole && (tdRole.title || tdRole.shield || tdRole.defy > 0)) {
      h += '<div class="tdrow">' +
        (tdRole.title ? '<span class="tdtitle">' + esc(t('tiandao.title')) + '</span>' : '') +
        (tdRole.shield ? '<span class="tdtitle">' + esc(t('tiandao.shield')) + '</span>' : '') +
        (tdRole.defy > 0 ? '<span class="tddefy">' + esc(t('tiandao.defy.val', { n: tdRole.defy })) + '</span>' : '') +
        '</div>';
    }
    var metaT = (state.meta && state.meta.titles) || [];
    if (metaT.length) {
      /* 称号墙：改与成就页同款 chips（一枚称号整块不换行）——旧 `.kv` 写法把「称号墙」标签与称号串
       * 一起塞进 flex 两端对齐的一行里，窄浮层下标签会被从中间截断（"墙" 独自掉到次行） */
      h += '<p class="hint" style="margin:0 0 4px">' + esc(t('codex.ui.titles')) + '</p>' +
        '<div class="chips">' + metaT.slice(-6).map(function (id) {
          return '<span class="tdtitle">' + esc(t('codex.title.' + id)) + '</span>';
        }).join('') + '</div>';
    }
    h += '<p class="hint">' + esc(t('role.attrs.title')) + '</p>';
    d.ATTRS.forEach(function (id) {
      var v = w.attrs[id] || 0;
      var dc2 = SQ.Attrs.dcStdOf(w, d) * 2;
      h += '<div class="kv"><span>' + esc(t('attr.' + id)) + ' <span class="hint">' + esc(t('attr.desc.' + id)) + '</span></span><span>' + Math.floor(v) + '</span></div>';
      h += '<div class="bar slim"><i style="width:' + Math.min(100, (v / dc2) * 100).toFixed(1) + '%"></i></div>';
      /* 构成明细 */
      var base = SQ.Attrs.baseOf(w, d);
      var nurture = SQ.Attrs.artsNurtureOf(w, p, d, id);   /* 与引擎同一处算式（含品阶阶梯），视图不再自己抄一遍 */
      var gearV = 0;
      for (var slot in w.gear) {
        var it = w.gear[slot];
        if (it && it.attrValue && it.attrValue.attr === id) gearV += it.attrValue.value;
      }
      var evB = (w.attrEventBonus || {})[id] || 0;
      var buffV = Math.max(0, Math.round((v - base - nurture - gearV - evB) * 10) / 10);
      h += '<div class="detailbox"><div class="kv"><span>' + esc(t('attr.part.base')) + '</span><span>' + base + '</span></div>' +
           '<div class="kv"><span>' + esc(t('attr.part.arts')) + '</span><span>+' + nurture + '</span></div>' +
           '<div class="kv"><span>' + esc(t('attr.part.gear')) + '</span><span>+' + gearV + '</span></div>' +
           '<div class="kv"><span>' + esc(t('attr.part.event')) + '</span><span>' + (evB >= 0 ? '+' : '−') + Math.abs(evB) + '</span></div>' +
           (buffV ? '<div class="kv"><span>' + esc(t('attr.part.buff')) + '</span><span>+' + buffV + '</span></div>' : '') +
           '<div class="kv hint"><span>' + esc(t('attr.dc', { n: SQ.Attrs.dcOf(w, d, 'medium') })) + '</span></div></div>';
    });
    $('mr-attrs').innerHTML = h;
    var tb = $('mr-talents');
    tb.innerHTML = '';
    (state.profile.talents || []).forEach(function (el) { tb.appendChild(talentCard(el, wid())); });
    $('mr-karma').textContent = t('karma.system') + ' →';
    $('mr-close').textContent = t('ui.close');
    /* 洗髓入口（v1.8 §十）：本世有预算才露出，手中无缘时置灰（灰置而非隐藏——玩家要看得见「还有这条路」） */
    var swapCap = (D().TALENT_SWAP || {}).PER_LIFE || 0;
    var wb = $('mr-wash');
    if (swapCap > 0) {
      wb.classList.remove('hide');
      wb.textContent = t('talent.swap.entry', { owed: w.talentOwed || 0, cap: swapCap });
      wb.disabled = !((w.talentOwed || 0) > 0);
    } else wb.classList.add('hide');
    $('modal-role').classList.remove('hide');
  }
  $('mr-close').addEventListener('click', function () { $('modal-role').classList.add('hide'); });
  $('mr-karma').addEventListener('click', function () { $('modal-role').classList.add('hide'); showKarma(); });

  /* ── 洗髓浮层（天赋池设计 v1.8 §十 · 洗髓批）：三格择一替换 + 三候选择一 ──
   * 候选只掷一次并存在 washDraft 里（选格不重掷，否则「看着换」变成「赌着换」）；
   * 真正改档只走 SQ.Talents.applySwap 单口，视图不自带判定。 */
  var washDraft = { slot: -1, cand: -1, cands: [] };
  function washCard(el, i, act, picked) {
    var d = talentCard(el, wid());
    d.setAttribute('data-act', act);
    d.setAttribute('data-v', i);
    d.className += ' pickable' + (picked ? ' pick' : '');
    return d;
  }
  function renderWash() {
    var sl = $('tw-slots');
    sl.innerHTML = '';
    (state.profile.talents || []).forEach(function (el, i) { sl.appendChild(washCard(el, i, 'washSlot', i === washDraft.slot)); });
    var cb = $('tw-cands');
    cb.innerHTML = '';
    washDraft.cands.forEach(function (el, i) { cb.appendChild(washCard(el, i, 'washPick', i === washDraft.cand)); });
    $('tw-ok').disabled = !(washDraft.slot >= 0 && washDraft.cand >= 0);
  }
  function showWash() {
    var w = ws(), cap = (D().TALENT_SWAP || {}).PER_LIFE || 0;
    if (!(cap > 0)) return;
    if (!((w.talentOwed || 0) > 0)) { toast(t('talent.swap.none')); return; }
    washDraft.cands = SQ.Talents.candidates(wid(), state.profile, 3);
    washDraft.slot = -1; washDraft.cand = -1;
    $('tw-title').textContent = t('talent.swap.title');
    $('tw-sub').textContent = t('talent.swap.sub', {
      n: Math.max(0, cap - (w.talentUsed || 0)), cap: cap, owed: w.talentOwed || 0
    });
    $('tw-pick-label').textContent = t('talent.swap.pick');
    $('tw-cand-label').textContent = t('talent.swap.cand');
    $('tw-close').textContent = t('ui.cancel');
    $('tw-ok').textContent = t('talent.swap.ok');
    renderWash();
    $('modal-role').classList.add('hide');
    $('modal-talentwash').classList.remove('hide');
  }
  async function doWash() {
    var cand = washDraft.cands[washDraft.cand];
    if (washDraft.slot < 0 || !cand) { toast(t('talent.swap.need')); return; }
    var res = null;
    await SQ.mutate(state, function (s) {
      var id = s.profile.worldId;
      res = SQ.Talents.applySwap(id, s.profile, s.worlds[id], SQ.Worlds[id].pack.data, washDraft.slot, cand.id);
      if (res.ok) SQ.Log.push(s.worlds[id], 'sys', SQ.t('talent.swap.done', {
        from: SQ.t('talent.' + res.from + '.name', null, id),
        to: SQ.t('talent.' + res.to + '.name', null, id)
      }, id));
    });
    if (!res || !res.ok) {
      /* 引擎拒因只有 none（无缘）与形状类（格号/候选非法、撞已持有）两类 ⇒ 前者说「手中没有洗髓缘」，
       * 后者属档面异常，一律回「本世之数已尽」并重的渲染，绝不打裸英文 */
      toast(t(res && res.reason === 'none' ? 'talent.swap.none' : 'talent.swap.cap'));
      renderAll();
      return;
    }
    $('modal-talentwash').classList.add('hide');
    toast(t('talent.swap.done', {
      from: t('talent.' + res.from + '.name', null, wid()),
      to: t('talent.' + res.to + '.name', null, wid())
    }));
    renderAll();
  }
  $('tw-close').addEventListener('click', function () { $('modal-talentwash').classList.add('hide'); });

  /* ── karma 浮层（F5：四行构成 + 色带游标 + 差值双提示 + ALIGN_EFFECTS 摘要六行 + 护法行灰置） ── */
  function showKarma() {
    var w = ws(), p = pack(), d = D();
    var sys = p.worldSystems;
    var tier = sys.tierOf(w);
    var parts = sys.karmaParts(w);
    $('mkd-title').textContent = t('karma.system');
    $('mkd-value').textContent = t('karma.tier.' + tier) + ' · ' + (w.karma > 0 ? '+' : '') + w.karma;
    $('mkd-value').style.color = 'var(--sq-karma-' + tier + ')';
    var pos = (w.karma + d.KARMA_CLAMP) / (2 * d.KARMA_CLAMP);
    $('mkd-bar').style.width = (pos * 100).toFixed(1) + '%';
    /* 差值双提示：左道显示两侧距离；正/魔显示距极处 */
    var nextTxt;
    var eK = SQ.XKarma.edgeOf(d);   /* 边界取自 KARMA_TIERS，视图不再抄 200（#293(e) 钉这条取数口） */
    if (tier === 'neutral') {
      nextTxt = t('karma.next', { tier: t('karma.tier.right'), n: Math.max(0, eK.up - w.karma) }) +
        ' · ' + t('karma.next', { tier: t('karma.tier.evil'), n: Math.max(0, w.karma - eK.down) });
    } else if (tier === 'right') {
      nextTxt = w.karma >= d.KARMA_CLAMP ? t('karma.maxed') : t('karma.next', { tier: t('karma.extreme'), n: d.KARMA_CLAMP - w.karma });
    } else {
      nextTxt = w.karma <= -d.KARMA_CLAMP ? t('karma.maxed') : t('karma.next', { tier: t('karma.extreme'), n: w.karma + d.KARMA_CLAMP });
    }
    $('mkd-next').textContent = nextTxt;
    function sgn(n) { return (n >= 0 ? '+' : '') + n; }
    $('mkd-parts').innerHTML =
      '<div class="kv"><span>' + esc(t('karma.part.arts')) + '</span><span>' + sgn(parts.arts) + '</span></div>' +
      '<div class="kv"><span>' + esc(t('karma.part.gear')) + '</span><span>' + sgn(parts.gear) + '</span></div>' +
      '<div class="kv"><span>' + esc(t('karma.part.events')) + '</span><span>' + sgn(parts.events) + '</span></div>' +
      '<div class="kv"><span>' + esc(t('karma.part.drift')) + '</span><span>' + sgn(Math.round(parts.drift)) + '</span></div>';
    /* 名号九段天梯（善恶名号批）：九段全列，当前段高亮并按其档位着色；区间由 KARMA_RANKS 下界推导 */
    var rows = d.KARMA_RANKS || [];
    var rankNow = sys.rankOf ? sys.rankOf(w) : 'zuodao';
    var lh = '';
    rows.forEach(function (row, i) {
      var lo = (row[0] === -Infinity) ? -d.KARMA_CLAMP : Math.ceil(row[0]);
      var hi = (i === 0) ? d.KARMA_CLAMP : Math.ceil(rows[i - 1][0]) - 1;
      if (rows[i - 1] && rows[i - 1][0] === -Infinity) hi = d.KARMA_CLAMP;
      var on = row[1] === rankNow;
      var rTier = SQ.XKarma.tierOf((lo + hi) / 2);
      lh += '<div class="rrow' + (on ? ' on ' + rTier : '') + '">' +
        '<span>' + esc(t('karma.rank.' + row[1])) + '</span>' +
        '<span class="rr-range">' + sgn(lo) + ' ~ ' + sgn(hi) + '</span></div>';
    });
    $('mkd-ranktitle').textContent = t('karma.rank.ladder');
    $('mkd-ranks').innerHTML = lh;
    $('mkd-rate').textContent = t('karma.rateHint.' + tier);
    /* ALIGN_EFFECTS 摘要六行（当前档位实时值）+ 品阶上浮（魔道档）+ 护法行灰置（批 3） */
    var eff = sys.effectsOf(w);
    var eh = '';
    function effRow(label, val) {
      return '<div class="kv"><span>' + esc(label) + '</span><span>' + esc(val) + '</span></div>';
    }
    eh += effRow(t('karma.eff.qiRate'), '×' + eff.qiRateMult.toFixed(2));
    eh += effRow(t('karma.eff.combatPower'), '×' + eff.combatPowerMult.toFixed(2));
    eh += effRow(t('karma.eff.eventRate'), '×' + eff.eventRateMult.toFixed(2));
    eh += effRow(t('karma.eff.dropRate'), '×' + eff.dropRateMult.toFixed(2));
    eh += effRow(t('karma.eff.checkDc'), '×' + eff.checkDcMult.toFixed(2));
    eh += effRow(t('karma.eff.trib'), (eff.tribBonusFlat >= 0 ? '+' : '') + Math.round(eff.tribBonusFlat * 100) + '%');
    if (eff.dropTierUpChance > 0) eh += effRow(t('karma.eff.tierUp'), Math.round(eff.dropTierUpChance * 100) + '%');
    (function () {
      /* 护法行激活（B6 · 批 3）：魔道档红字独行 / 生效金加项 / 无人灰置 */
      var gK = SQ.Bonds.guardianOf(ws(), pack(), D());
      var evilK = pack().worldSystems.tierOf(ws()) === 'evil';
      var txtK, clsK = ' hint';
      if (evilK) { txtK = t('bond.guard.evil'); }
      else if (gK && gK.bonus > 0) { clsK = ''; txtK = '+' + gK.bonus.toFixed(2) + ' · ' + t('bond.' + gK.npcId + '.name') + bondTierNum(gK.tier); }
      else { txtK = '—'; }
      eh += '<div class="kv' + clsK + '"><span>' + esc(t('karma.eff.guardian')) + '</span><span>' + esc(txtK) + '</span></div>';
    })();
    $('mkd-efftitle').textContent = t('karma.effects.title');
    $('mkd-effects').innerHTML = eh;
    $('mkd-close').textContent = t('ui.cancel');
    $('modal-karma').classList.remove('hide');
  }
  $('mkd-close').addEventListener('click', function () { $('modal-karma').classList.add('hide'); });

  /* ── 通用确认 ── */
  var confirmCb = null;
  var confirmCancelCb = null;   /* 取消回调（系统深化批 B4 · 献秘二选一） */
  function askConfirm(title, text, cb, cancelCb) {
    $('cf-title').textContent = title;
    $('cf-text').textContent = text;
    $('cf-cancel').textContent = t('ui.cancel');
    $('cf-ok').textContent = t('ui.confirm');
    confirmCb = cb;
    confirmCancelCb = cancelCb || null;   /* 系统深化批 B4：献秘二选一（确认=带秘 / 取消=好聚好散）需要取消回调 */
    $('modal-confirm').classList.remove('hide');
  }
  $('cf-cancel').addEventListener('click', function () {
    $('modal-confirm').classList.add('hide');
    confirmCb = null;
    var ccb = confirmCancelCb; confirmCancelCb = null;
    if (ccb) ccb();
  });
  $('cf-ok').addEventListener('click', function () {
    $('modal-confirm').classList.add('hide');
    var cb = confirmCb; confirmCb = null; confirmCancelCb = null;
    if (cb) cb();
  });

  /* ══════════ 天道系统（天道系统批 B1~B4 · 天道设计 v1.1）══════════
   * 问天浮层：卦位六选 + 香火四档 + 奏疏生成/一键复制（V1 人工中继）+ 自问自卜（V1.5 本地模拟）
   * + 接旨粘贴解析；圣旨揭晓：卷轴展开 + 判词逐字 + 领旨/抗旨（抗旨 CONFIRM 明示逆天值收益与档位后果）；
   * 天象浮层：即开即消红点；逆天大劫入口在渡劫预估浮层（detailTrib 段）。 */
  var tdTypeTimer = null;
  var GIFT_N = 6, GIFT_ROLL_MS = 600000;   /* 六款页游贴片 · 10 现实分钟换一张（会话态，不入存档） */

  /* 恶搞彩蛋：修行页右侧那张贴在墙上的「充值大礼包」。
   * 零机制是本条的底线——点击只出一句提示，不发资源、不写档、不入 Ledger、不碰 cooldown。 */
  function renderGiftPack() {
    var now = Date.now();
    if (ui.giftI < 0 || now >= ui.giftUntil) {
      ui.giftI = Math.floor(Math.random() * GIFT_N);
      ui.giftUntil = now + GIFT_ROLL_MS;
    }
    var gk = 'eggs.gift.p' + ui.giftI + '.';   /* 前缀先落变量：内联在 t(' 里会被 A2 当成整键静态引用（本仓同款先例 = legacy.shop.qirate） */
    return '<span class="giftcard" data-act="giftBuy">' +
      '<span class="gtag">' + esc(t('eggs.gift.tag')) + '</span>' +
      '<span class="gname">' + esc(t(gk + 'name')) + '</span>' +
      '<span class="goffer">' + esc(t(gk + 'offer')) + '</span>' +
      '<span class="gbtn">' + esc(t('eggs.gift.btn')) + '</span></span>';
  }

  function renderTiandaoRow() {
    var w = ws(), d = D();
    if (!SQ.Tiandao || !w.tiandao) return '';
    var td = w.tiandao;
    var unseen = SQ.Tiandao.unseenOmens(w);
    var stage = SQ.Tiandao.stageOf(w, d);
    var h = '<div class="tdrow">';
    /* 问天入口（第卅九批 · 用户令「隐藏游戏问天功能」）：**用既有 .hide 工具类收掉，不删代码**——
     * 引擎（Tiandao.ask / 奏疏 / 圣旨浮层）与词表键原样留着，恢复只需去掉这一个类名；
     * 判据 = 走查 `verify-ui-tiandao` B1（在 DOM 但 `offsetParent === null` ⇒ 玩家看不见也点不着），
     * 后续链路仍由该篇以 dispatchEvent 驱动（委托挂在 document 上，隐藏元素被合成点击照跑）。 */
    h += '<button class="tdbtn hide" data-act="openTiandao">' + esc(t('tiandao.entry')) +
      (unseen ? '<i class="pdot"></i>' : '') + '</button>';
    h += '<button class="tdbtn plain" data-act="openOmens">' + esc(t('tiandao.omen.chip')) +
      (unseen ? '<i class="pdot"></i>' : '') + '</button>';
    if (td.defy > 0 || stage) h += '<span class="tddefy">' + esc(t('tiandao.defy.val', { n: td.defy })) + '</span>';
    if (stage) h += '<span class="tdstage' + (stage === 'nijie' ? ' nijie' : '') + '">' + esc(t('tiandao.stage.' + stage)) + '</span>';
    if (td.title) h += '<span class="tdtitle">' + esc(t('tiandao.title')) + '</span>';
    /* N20 接线：盾此前只有名、语义（用后即失 / 只保修为）全靠玩家自己猜；正典在天道卷 line253/325 */
    if (td.shield) h += '<span class="tdtitle">' + esc(t('tiandao.shield')) + '</span>' +
      '<span class="hint">' + esc(t('tiandao.shield.desc')) + '</span>';
    if (w.realm >= ((d.LEGACY || {}).BINGJIE_MIN_REALM || 4) && SQ.Legacy) {
      h += '<button class="tdbtn plain" data-act="dissolve">' + esc(t('legacy.ui.bingjie.btn')) + '</button>';
    }
    h += renderGiftPack();   /* 页游充值贴片彩蛋（恶搞，零机制） */
    h += '</div>';
    return h;
  }

  function openTiandao() {
    var d = D();
    ui.tdHex = ui.tdHex || 'wenjie';
    ui.tdIncense = ui.tdIncense || 0;
    $('mtd-title').textContent = t('tiandao.modal.title');
    $('mtd-hexlabel').textContent = t('tiandao.modal.hex');
    $('mtd-inclabel').textContent = t('tiandao.modal.incense');
    $('mtd-localhint').textContent = t('tiandao.local.hint');
    $('mtd-reclabel').textContent = t('tiandao.receive.ph');
    $('mtd-memo').textContent = t('tiandao.btn.memo');
    $('mtd-local').textContent = t('tiandao.btn.local');
    $('mtd-copy').textContent = t('tiandao.btn.copy');
    $('mtd-parse').textContent = t('tiandao.btn.receive');
    $('mtd-close').textContent = t('ui.close');
    $('mtd-free').placeholder = t('tiandao.free.ph');
    $('mtd-memoout').placeholder = t('tiandao.memo.ph');
    renderTdModal();
    $('modal-tiandao').classList.remove('hide');
  }

  function renderTdModal() {
    var w = ws(), d = D();
    var td = w.tiandao || { defy: 0, lastAskAt: 0 };
    var hx = '';
    (d.TIANDAO.HEXAGRAMS || []).forEach(function (id) {
      hx += '<button class="' + (ui.tdHex === id ? 'on' : '') + '" data-act="tdHex" data-v="' + id + '">' +
        esc(t('tiandao.hex.' + id)) + '<span class="hx">' + esc(t('tiandao.hexdesc.' + id)) + '</span></button>';
    });
    $('mtd-hex').innerHTML = hx;
    var inc = '';
    (d.TIANDAO.INCENSE_RANKS || []).forEach(function (n, i) {
      inc += '<button class="' + (ui.tdIncense === i ? 'on' : '') + '" data-act="tdIncense" data-v="' + i + '">' +
        esc(n === 0 ? t('tiandao.incense.0') : t('tiandao.incense.n', { n: SQ.fmt(n) })) + '</button>';
    });
    $('mtd-incense').innerHTML = inc;
    $('mtd-free').classList.toggle('hide', ui.tdHex !== 'blank');
    var left = (td.lastAskAt || 0) + d.TIANDAO.ASK_CD_MS - Date.now();
    var cooling = left > 0;
    $('mtd-cd').textContent = cooling ? t('tiandao.cd', { t: timeLeftText(left) }) : '';
    $('mtd-memo').disabled = cooling;
    $('mtd-local').disabled = cooling;

    $('mtd-defy').innerHTML = '<span>' + esc(t('tiandao.defy.val', { n: td.defy || 0 })) +
      (stage ? ' · ' + esc(t('tiandao.stage.' + stage)) + ' — ' + esc(t('tiandao.stage.' + stage + '.desc')) : '') + '</span>';
  }

  /* 奏疏文本框自适应高度：按内容撑开（上限六成屏高，超出由浮层滚动承接），
   * 避免用户只框选到可见首段就复制——「复制不全」的直接诱因 */
  function fitMemoOut(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight + 2, Math.round(window.innerHeight * 0.6)) + 'px';
  }

  /* 领旨 / 抗旨后清空本轮问天残留（奏疏文本框 + 复制按钮 + 接旨粘贴框 + 圣旨缓存）：
   * 一轮问天已了结，下次打开问天不应再显示上一轮奏疏（用户反馈：领完旨后重开问天仍留着旧奏疏） */
  function resetTdMemo() {
    var ta = $('mtd-memoout');
    ta.value = '';
    ta.classList.add('hide');
    $('mtd-copy').classList.add('hide');
    $('mtd-receive').value = '';
    ui.tdDec = null;
  }

  async function tdRunAsk(local) {
    var free = ui.tdHex === 'blank' ? $('mtd-free').value : '';
    var r = await SQ.Actions.tdAsk(state, ui.tdHex, ui.tdIncense, free);
    if (r && r.ok) {
      if (local) {
        var dec = SQ.Tiandao.localDecree(ws(), pack(), D(), Date.now());
        showDecree(dec);
      } else {
        var taM = $('mtd-memoout');
        taM.value = r.text;
        taM.classList.remove('hide');
        fitMemoOut(taM);
        $('mtd-copy').classList.remove('hide');
        toast(t('tiandao.memo.ready', { n: r.text.length }));
      }
    } else if (r && r.reason === 'cooldown') {
      toast(t('tiandao.cd', { t: timeLeftText(Math.max(0, r.until - Date.now())) }));
    } else if (r && r.reason === 'stones') {
      toast(t('tiandao.stones.lack'));
    }
    renderTdModal();
    renderAll();
  }

  function decreeEffText(dec) {
    var p = dec.payload || {};
    switch (dec.type) {
      case 'bless': return t('tiandao.eff.bless', { n: '+' + (p.tribBonus || 0).toFixed(2) });
      case 'curse': return t('tiandao.eff.curse', { n: (p.tribBonus || 0).toFixed(2) });
      case 'gift': return t('tiandao.eff.gift', { n: SQ.fmt(p.stones || 0) });
      case 'punish': return t('tiandao.eff.punish', { n: Math.round((p.mult || 0) * 100), h: p.hours || 24 });
      case 'karma': return t('tiandao.eff.karma', { n: (p.karma >= 0 ? '+' : '') + (p.karma || 0) });
      case 'bond': return t('tiandao.eff.bond', { name: p.target ? t('bond.' + p.target + '.name') : t('tiandao.eff.bond.any'), n: p.bond || 0 });
      case 'affix': return t('tiandao.eff.affix', { name: p.affixId ? t('affix.' + p.affixId + '.name') : t('tiandao.eff.affix.any') });
      default: return t('tiandao.eff.' + dec.type);
    }
  }

  function showDecree(dec) {
    ui.tdDec = dec;
    var w = ws();
    $('mdc-type').textContent = t('tiandao.decree.type', { type: t('tiandao.type.' + dec.type) });
    $('mdc-meta').innerHTML =
      '<span>' + esc(t('tiandao.decree.hex', { hex: t('tiandao.hex.' + dec.hexagram) })) + '</span>' +
      '<span>' + esc(t('tiandao.decree.tier', { tier: t('tiandao.tier.' + dec.tier) })) + '</span>';
    $('mdc-eff').textContent = decreeEffText(dec);
    $('mdc-omen').textContent = t('tiandao.omen.wrap', { s: dec.omen || '' });
    var vd = $('mdc-verdict');
    vd.textContent = '';
    if (tdTypeTimer) { clearInterval(tdTypeTimer); tdTypeTimer = null; }
    if (reducedMotion() || !dec.verdict) {
      vd.textContent = dec.verdict || '';
    } else {
      var vi = 0;
      tdTypeTimer = setInterval(function () {
        vi += 2;
        vd.textContent = dec.verdict.slice(0, vi);
        if (vi >= dec.verdict.length) { clearInterval(tdTypeTimer); tdTypeTimer = null; }
      }, 40);
    }
    var isSeen = SQ.Tiandao.seen(w, dec);
    $('mdc-btns').classList.toggle('hide', isSeen);
    $('mdc-seen').textContent = isSeen ? t('tiandao.seen') : '';
    $('mdc-accept').textContent = t('tiandao.btn.accept');
    $('mdc-defy').textContent = t('tiandao.btn.defy');
    $('mdc-close').textContent = t('ui.close');
    $('modal-decree').classList.remove('hide');
  }

  function openOmens() {
    var w = ws();
    $('mom-title').textContent = t('tiandao.omen.title');
    var q = ((w.tiandao || {}).omenQueue || []).slice().reverse();
    $('mom-body').innerHTML = q.length ? q.map(function (o) {
      return '<div class="omenitem"><div class="ot">' + esc(t('tiandao.omen.node.' + o.node)) + '</div>' + esc(o.text) + '</div>';
    }).join('') : '<p class="hint">' + esc(t('tiandao.omen.empty')) + '</p>';
    $('mom-close').textContent = t('ui.close');
    $('modal-omens').classList.remove('hide');
    if (SQ.Tiandao.unseenOmens(w)) SQ.Actions.tdOmensSeen(state).then(renderAll);   /* 即开即消红点 */
  }

  /* ── 兵解 · 盖棺之传（第册批）：逐字节奏抄接旨判词那一段（+3 字 / 24ms，500 字 ≈ 4 秒），
   * reducedMotion 直出全文。定时器自查隐藏态自收 ⇒ 四条关法（入世钮 / 点遮罩 / ESC /
   * enterRebirthCreation 的 MASKS 全关）都不会留下一个还在往暗处写字的 interval。
   * shortcut: 中途按「入世」即离场，未写完的正文不在屏上补全——全文恒在轮回页「前世书」，无丢失。 ── */
  var recapTimer = null;
  function showRecap(title, text) {
    var el = $('mrp-text');
    $('mrp-title').textContent = title;
    $('mrp-go').textContent = t('legacy.ui.recap.go');
    el.textContent = '';
    el.scrollTop = 0;
    if (recapTimer) { clearInterval(recapTimer); recapTimer = null; }
    if (reducedMotion()) el.textContent = text;
    else {
      var vi = 0;
      recapTimer = setInterval(function () {
        if ($('modal-recap').classList.contains('hide')) { clearInterval(recapTimer); recapTimer = null; return; }
        vi += 3;
        el.textContent = text.slice(0, vi);
        el.scrollTop = el.scrollHeight;   /* 滚的是正文那一格：标题与「入世」钮都不跟着滚走 */
        if (vi >= text.length) { clearInterval(recapTimer); recapTimer = null; }
      }, 24);
    }
    $('modal-recap').classList.remove('hide');
  }
  $('mrp-go').addEventListener('click', function () {
    if (recapTimer) { clearInterval(recapTimer); recapTimer = null; }
    $('modal-recap').classList.add('hide');
  });

  /* ── 盖棺之传的通用出口（N61 · 第册十二批）：五条终局路（飞升 / 兵解 / 寿尽 / 道伤 / 折寿）
     * 演的是同一句标题、同一份正文 = 引擎刚写进 `meta.biographies` 的那一世末条 ⇒ 视图零自造文本
     * （第册批那条纪律沿用）。**必须在 enterRebirthCreation() 之后调用**：它会把 MASKS 全关一遍，
     * 反序就把自己刚开的浮层关掉（兵解那一路第册批已踩过）。 ── */
  function playRecapLastBio() {
    var bs = state.meta.biographies || [];
    var bio = bs[bs.length - 1];
    if (bio && bio.text) showRecap(t('legacy.ui.recap.title'), bio.text);
  }

  /* 复制奏疏：先走同步 execCommand（内嵌 webview 无剪贴板权限时唯一可用路径，
   * 且在全选态下必然复制全文），失败再试异步 clipboard；两条都失败则明示手动全选，
   * 不再无脑弹「已复制」——旧实现在 clipboard 存在但被拒时静默失败且谎报成功 */
  function copyMemoOut() {
    var ta = $('mtd-memoout');
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); } catch (e) { /* 选区失败仍尝试剪贴板 */ }
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (ok) { toast(t('tiandao.memo.copied')); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(function () {
        toast(t('tiandao.memo.copied'));
      }, function () {
        toast(t('tiandao.memo.manual'));
      });
      return;
    }
    toast(t('tiandao.memo.manual'));
  }

  $('mtd-memo').addEventListener('click', function () { tdRunAsk(false); });
  $('mtd-local').addEventListener('click', function () { tdRunAsk(true); });
  $('mtd-copy').addEventListener('click', copyMemoOut);
  $('mtd-parse').addEventListener('click', function () {
    var raw = $('mtd-receive').value;
    if (!raw || !raw.trim()) return;
    showDecree(SQ.Tiandao.parseReply(raw, ws(), pack(), D(), Date.now()));

  $('mtd-close').addEventListener('click', function () { $('modal-tiandao').classList.add('hide'); });
  $('mdc-close').addEventListener('click', function () {
    if (tdTypeTimer) { clearInterval(tdTypeTimer); tdTypeTimer = null; }
    $('modal-decree').classList.add('hide');
  });
  $('mom-close').addEventListener('click', function () { $('modal-omens').classList.add('hide'); });
  $('mdc-accept').addEventListener('click', async function () {
    var dec = ui.tdDec;
    if (!dec) return;
    var r = await SQ.Actions.tdAccept(state, dec);
    if (r && r.ok) {
      $('modal-decree').classList.add('hide');
      resetTdMemo();
      var gt = r.gains || {};
      if (gt.stones) toast(t('tiandao.log.gift', { n: SQ.fmt(gt.stones), cur: t('resource.currency') }));
      else if (gt.bond && !gt.bond.blocked && gt.bond.n) toast(t('tiandao.eff.bond', { name: t('bond.' + gt.bond.npc + '.name'), n: gt.bond.n }));
      else toast(t('tiandao.log.accept', { type: t('tiandao.type.' + dec.type) }));
      renderAll();
      /* 敕赐奇遇落地 → 同样遵守「自动奇遇」设定：开启自动结算，关闭才弹抉择层 */
      if (ws().pendingChoice) { if (autoEventOn()) autoResolveChoice(); else showChoice(); }
    } else if (r && r.reason === 'seen') toast(t('tiandao.seen'));
    else if (r && r.reason === 'busy') toast(t('tiandao.busy'));
    else toast(t('tiandao.invalid'));
  });
  $('mdc-defy').addEventListener('click', function () {
    var dec = ui.tdDec;
    if (!dec) return;
    var w = ws(), d = D();
    var gain = (d.TIANDAO.DEFY_GAIN || {})[dec.tier] || 10;
    if (pack().worldSystems.tierOf(w) === 'evil') gain = Math.floor(gain * (d.TIANDAO.DEFY_DEMON_MULT || 1.5));
    askConfirm(t('tiandao.btn.defy'), t('tiandao.defy.confirm', { n: gain }), async function () {
      var r = await SQ.Actions.tdDefy(state, dec);
      if (r && r.ok) {
        $('modal-decree').classList.add('hide');
        resetTdMemo();
        toast(t('tiandao.log.defy', { n: r.gain, total: r.defy }));
        if (r.unlocked) toast(t('tiandao.stage.nijie.desc'));
        renderAll();
      } else if (r && r.reason === 'seen') toast(t('tiandao.seen'));
    });
  });

  /* 叛投敌对执行（势力全录卷 §九 · B4）：takeIntel = 第二级献秘确认结果 */
  async function runDefect(fid, takeIntel) {
    var rD = await SQ.Actions.defectFaction(state, fid, takeIntel);
    if (rD && rD.ok) {
      toast(t('faction.defect.karma', { name: rD.to.name }));
    } else if (rD) {
      toast(t('faction.defect.fail.' + rD.reason));
    }
    renderAll();
  }

  /* 调遣同门候选（势力全录卷 §8.2 · B4）：同势力 + 好感 ≥1 + field 型 perk + 非炉鼎采补中；
   * canPick=false 附置灰原因 key（chan = channel 型/炉鼎，affinity = 好感未至） */
  function dispatchCandidates(w, d) {
    var out = [];
    var fid = w.factionId;
    if (!fid) return out;
    var luNpc = (w.spouse && w.spouse.form === 'luding') ? w.spouse.npcId : null;
    (((d || D()).COMPANIONS) || []).forEach(function (c) {
      if ((w.factionNpcs || {})[c.id] !== fid) return;
      var pk = c.perk || {};
      var fieldOk = !!(pk.field && pk.perTier && SQ.Mods.FIELDS.indexOf(pk.field) >= 0);
      var tier = SQ.Bonds ? SQ.Bonds.tierOf(w, c.id, d || D()) : 0;
      var luding = c.id === luNpc;
      out.push({
        id: c.id, pk: pk, tier: tier,
        canPick: fieldOk && !luding && tier >= 1,
        reason: (!fieldOk || luding) ? 'faction.office.dispatch.chan'
          : (tier < 1 ? 'faction.office.dispatch.affinity' : null)
      });
    });
    return out;
  }

  /* ── 浮层关闭纪律（交互说明 §4.4）：浮层类点遮罩 / 物理返回均可关；
   * EVENT_CHOICE 例外——仅分支按钮可关，点遮罩给轻震反馈提示「必须选择」 ★ ── */
  var MASKS = ['modal-role', 'modal-karma', 'modal-offline', 'modal-lock', 'modal-confirm',
    'modal-ledger', 'modal-arts', 'modal-realm', 'modal-gearcodex', 'modal-recall', 'modal-bonds', 'modal-propose',
    'modal-slotpick', 'modal-tiandao', 'modal-decree', 'modal-omens', 'rank-stage', 'modal-matwudao',
    'modal-heirchoice', 'modal-talentwash', 'modal-recap'];
  document.addEventListener('click', function (e) {
    var el = e.target;
    if (!el.classList || !el.classList.contains('mask')) return;
    if (el.id === 'modal-choice') {
      if (!$('mc-branches').classList.contains('hide') && !reducedMotion()) {
        var box = el.querySelector('.modal');
        if (box) {
          box.classList.remove('nudge');
          void box.offsetWidth;                       /* 强制重排以便重复触发 */
          box.classList.add('nudge');
          setTimeout(function () { box.classList.remove('nudge'); }, 420);
        }
      }
      return;
    }
    if (MASKS.indexOf(el.id) < 0) return;
    if (el.id === 'modal-confirm') confirmCb = null;
    el.classList.add('hide');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;                   /* 物理返回/ESC：浮层类可关，抉择模态不在此列 */
    MASKS.forEach(function (id) {
      if (id === 'modal-confirm') confirmCb = null;
      $(id).classList.add('hide');
    });
  });

  /* 命名框的字跨重渲染存活（GitHub issue #5 · 融合坛自定义名打不进字）：
   * 立派名早有 `ui.sectRollName` 这条口，融合坛自定义名此前没有——DOM 一重建就清空，
   * 于是「输入框里的字」只活在节点上。两处一律收进 ui.* 单源，渲染时再回填 value。 */
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'INPUT') return;
    if (t.classList.contains('fusename')) ui.fuseName = t.value;
    else if (t.id === 'sect-name-input') ui.sectRollName = t.value;
  });

  /* 输入闸（GitHub issue #5）：焦点在输入框里时 tick 不重建 DOM（见 startTick），
   * 焦点离开输入框（focusout）时补一次渲染 ⇒ 读数最多只停更到打完字，不会长期不刷新。 */
  document.addEventListener('focusout', function (e) {
    var t = e.target;
    if (!t || (t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA')) return;
    if ($('sc-main').classList.contains('hide')) return;   /* 创角屏的输入框（#c1-name）不归游戏页渲染管 */
    renderAll();   /* 顶栏读数与红点也一并补上（tick 跳过的是整次 DOM 重建）*/
  });

  /* ══════════ 六向长线批视图（轮回/图鉴/炼丹/天骄/融合器灵/宗门 六页）══════════ */

  /* ── 真灵承继选择（轮回卷 §3.4「可选一件」玩家入口 · 器灵卷 §九）───────────────
   * 判据全部取自引擎同源口 SQ.Legacy.heirEligible / heirCandidates（视图零自造规则）：
   *   · 未持 shop.heir 资格 ⇒ 不弹层、直过（零打扰，转世链与改造前逐字同径）；
   *   · 持格但本世零觉醒候选 ⇒ 不弹层、直过（**无浮层亦无死链**：不摆一个点不动的按钮）；
   *   · 候选 ≥1（含恰好 1 件）⇒ 一律弹层，选中态预标；一次转世只弹一次（择定即落 meta.heirChoice，
   *     由 finishRebirth 消费后清空）；改主意走轮回页「换一件」入口重开。
   * 择定落库走 SQ.mutate 事务口（与购买/转世同纪律，直写内存态会被下一次 claim 覆盖）。*/
  function heirNameOf(id) { return id ? t('treasure.' + id + '.name') : ''; }
  /* 承继态一行（浮层与轮回页复用）：择定 > 显式不带 > 在档续带 > 未择定
   * （空串 ⇒ 由 sub 行说明「自动带入第一件已觉醒者」口径，不另立键）
   * N18：择定件**已失**（既不在候选、也不是在档续带件）时不再谎报「已择定」，
   * 改说失效原因——引擎侧 legacy.js:438-439 对脏选降级为「取第一件已觉醒者 / 原样续带」，
   * 玩家侧此前零解释且零改选入口（候选为空时整块连「换一件」都不出）。 */
  function heirStatusText(meta, cands) {
    if (meta.heirChoice === SQ.Legacy.HEIR_NONE) return t('spirit.ui.heir.skipped');
    if (meta.heirChoice) {
      var cs = cands || SQ.Legacy.heirCandidates(ws(), pack());
      var hit = false, ci = 0;
      for (; ci < cs.length; ci++) if (cs[ci].id === meta.heirChoice) { hit = true; break; }
      if (!hit && meta.heirTreasure !== meta.heirChoice) {
        return t('spirit.ui.heir.lost', { name: heirNameOf(meta.heirChoice) });
      }
      return t('spirit.ui.heir.picked', { name: heirNameOf(meta.heirChoice) });
    }
    if (meta.heirTreasure) return t('spirit.ui.heir.carry', { name: heirNameOf(meta.heirTreasure) });
    return '';
  }
  function renderHeirChoice() {
    var w = ws(), p = pack(), d = D();
    var meta = state.meta || {};
    var cands = SQ.Legacy.heirCandidates(w, p);
    var sel = meta.heirChoice || meta.heirTreasure || (cands[0] || {}).id || '';
    $('hc-title').textContent = t('spirit.ui.heir.title');
    $('hc-sub').textContent = t('spirit.ui.heir.sub');
    $('hc-carry').textContent = heirStatusText(meta, cands);
    var h = '';
    cands.forEach(function (c) {
      var on = c.id === sel;
      h += '<div class="lrow' + (on ? ' cur' : '') + '"><div class="nm">' + esc(heirNameOf(c.id)) +
        ' <span class="special-mark">' + esc(t('spirit.ui.awake')) + '</span></div>' +
        '<div class="meta">' + esc(t('spirit.ui.persona', { p: c.sp.p ? t('spirit.persona.' + c.sp.p + '.name') : t('spirit.ui.gray') })) +
        ' · ' + esc(t('spirit.ui.warm', { w: Math.floor(c.sp.w || 0), need: SQ.Fusion ? SQ.Fusion.needOf(d, c.def) : 0 })) +
        '</div><div class="acts"><button class="' + (on ? 'primary' : '') + '" data-act="heirPick" data-v="' + c.id + '">' +
        esc(t('spirit.ui.heir.pick')) + '</button></div></div>';
    });
    $('hc-list').innerHTML = h || ('<p class="hint">' + esc(t('spirit.ui.heir.empty')) + '</p>');
    $('hc-verdict').textContent = t('spirit.ui.verdict') + ' · ' + t('spirit.ui.heir.note');
    $('hc-cancel').textContent = t('ui.cancel');
    $('hc-none').textContent = t('spirit.ui.heir.skip');
  }
  /* onPick(choice) — choice = 法宝 id / 'none'（引擎哨兵 HEIR_NONE）/ null（取消，不落库） */
  function openHeirPicker(onPick) {
    ui.heirPick = onPick;
    renderHeirChoice();
    $('modal-heirchoice').classList.remove('hide');
  }
  async function commitHeirChoice(ch) {
    var cb = ui.heirPick; ui.heirPick = null;
    $('modal-heirchoice').classList.add('hide');
    if (!cb) return;
    if (ch == null) { cb(null); return; }
    await SQ.mutate(state, function (s) { s.meta.heirChoice = ch; });
    cb(ch);
  }
  $('hc-cancel').addEventListener('click', function () { commitHeirChoice(null); });
  $('hc-none').addEventListener('click', function () { commitHeirChoice(SQ.Legacy.HEIR_NONE); });
  /* 转世前置门：不需要问就直过（回调同帧执行，转世链零改动） */
  function askHeirChoice(cont) {
    var meta = state.meta || {};
    if (!SQ.Legacy || !SQ.Legacy.heirEligible(meta)) { cont(); return; }
    if (!SQ.Legacy.heirCandidates(ws(), pack()).length) { cont(); return; }
    if (meta.heirChoice) { cont(); return; }          /* 本世已择定：一次转世只弹一次 */
    openHeirPicker(function (ch) { if (ch == null) return; toast(heirToastText(ch)); cont(); });
  }
  /* 「换一件」重开入口（轮回页常驻）：转世后改主意 / 择定后反悔，覆写 meta.heirChoice 即可 */
  function openHeirSwitch() {
    openHeirPicker(function (ch) {
      if (ch == null) return;
      toast(heirToastText(ch));
      renderAll();
    });
  }
  function heirToastText(ch) {
    return ch === SQ.Legacy.HEIR_NONE ? t('spirit.ui.heir.skipped')
      : t('spirit.ui.heir.done', { name: heirNameOf(ch) });
  }

  /* ── §5.2 结算浮层分项行（兵解预估预览复用）：逐行只渲染 preview() 产物，视图零自造数 ──
   * 总结区（境界/渡劫成败/首通区数/结缘人数）由 preview.summary 供数 → 预览与实结同源。*/
  function settlePreviewText(pv) {
    var rows = [t('legacy.ui.preview.title') + ' · ' + t('legacy.ui.preview.life', { n: pv.life })];
    var sm = pv.summary || {};
    rows.push(t('legacy.ui.preview.realm') + ' · ' + t('realm.' + (sm.realm || 0)));
    rows.push(t('legacy.ui.preview.trib', { w: sm.tribWin || 0, l: sm.tribFail || 0 }));
    rows.push(t('legacy.ui.preview.zones', { n: sm.zones || 0 }));
    rows.push(t('legacy.ui.preview.bonds', { n: sm.bonds || 0 }));
    (pv.lines || []).forEach(function (ln) {
      if (ln.nominal <= 0) return;
      rows.push(t('legacy.score.' + ln.key.replace(/\..*$/, '')) + ' ' + SQ.fmt(ln.got) +
        (ln.owned && ln.got === 0 ? ' · ' + t('legacy.score.owned') : ''));
    });
    rows.push(t('legacy.ui.preview.subtotal') + ' ' + SQ.fmt(pv.subtotal));
    rows.push(t('legacy.ui.preview.mult') + ' ×' + pv.mult.toFixed(1));
    rows.push(t('legacy.ui.preview.total') + ' ' + SQ.fmt(pv.total));
    rows.push(t('legacy.ui.preview.imm') + ' ' + SQ.fmt(pv.immediate));
    rows.push(t('legacy.ui.preview.balance') + ' ' + SQ.fmt(pv.balanceAfter));
    return rows.join('\n');
  }

  function enterRebirthCreation() {
    MASKS.forEach(function (id) { $(id).classList.add('hide'); });
    confirmCb = null;
    draft.name = ''; draft.roll = null; draft.worldId = null; draft.worldNames = {}; draft.bias = 'neutral'; draft.legacy = null;
    $('c1-name').value = '';
    $('c1-err').classList.add('hide');
    ui.tab = 'idle';
    show('c1');
  }

  function legacyReasonText(r) {
    if (!r || !r.reason) return '';
    if (r.reason === 'cd' && r.until) return t('legacy.ui.feisheng.cd', { t: timeLeftText(Math.max(0, r.until - Date.now())) });
    /* 飞升门槛原因（真仙未满 / 修为未盈满，轮回卷 §1.1）先取本族正典行——此前 `qi` 一路穿透，
     * 拼出的 legacy.ui.fail.qi 全库无键 ⇒ 裸拉丁内部字段名直接上屏（A4 精神越线 + 玩家读不懂） */
    var kl = 'legacy.ui.feisheng.lock.' + r.reason;
    if (t(kl) !== kl) return t(kl);
    var k = 'legacy.ui.fail.' + r.reason;
    return t(k) !== k ? t(k) : t('legacy.ui.fail.other');
  }


  /* 成就页整段（achvCard / codexFaceCard / renderAchv）已外置成 view/achv.js（第册五批 · N34 第二刀） */

  /* ── 轮回页（SYS · 轮回卷 B1 + 图鉴卷 B2：余额/商店/九面图鉴/称号墙/前世书/飞升兵解）── */
  function renderLegacy() {
    var w = ws(), d = D(), p = pack(), m = mods();
    var meta = state.meta || {};
    var st = meta.stats || {};
    var h = '<div class="pagehead split"><div class="chips"><button class="on">' + esc(t('legacy.system')) + '</button></div>' +
      '<span class="tdtitle">' + esc(t('legacy.ui.balance', { n: SQ.fmt(meta.karma || 0) })) + '</span></div>';
    h += '<div class="kv"><span class="hint">' + esc(t('legacy.ui.stats', {
      lives: st.lives || 0, asc: st.ascensions || 0, dis: st.dissolutions || 0,
      death: st.deaths || 0,   /* 身死 = 被动了结（寿尽 / 道伤）计数，与玩家主动兵解分列（寿元批） */
      realm: t('realm.' + Math.min(st.realmMax || 0, d.REALMS.length - 1))
    })) + '</span></div>';
    /* 飞升 / 兵解入口 */
    if (w.realm >= d.REALMS.length - 1 && SQ.Legacy) {
      var fsChk = SQ.Legacy.canFeisheng(w, p, d, meta, Date.now(), state.profile);
      var fsInfo = SQ.Legacy.feishengInfo(w, p, d, m);
      h += '<div class="tribready" style="margin-top:8px"><div class="tr-t">' + esc(t('legacy.ui.feisheng.btn')) + '</div>' +
        (fsInfo ? '<div class="hint">' + esc(t('legacy.ui.feisheng.p', { p: Math.round(fsInfo.p * 100) })) + '</div>' : '') +
        '<div class="hint">' + esc(fsChk.ok ? t('legacy.ui.feisheng.confirm') : legacyReasonText(fsChk)) + '</div>' +
        (fsChk.ok ? '<button class="primary" data-act="ascend" style="width:100%;margin-top:6px">' + esc(t('legacy.ui.feisheng')) + '</button>' : '') +
        '</div>';
    }
    if (w.realm >= ((d.LEGACY || {}).BINGJIE_MIN_REALM || 4) && SQ.Legacy) {
      h += '<button data-act="dissolve" style="width:100%;margin:8px 0">' + esc(t('legacy.ui.bingjie.btn')) + '</button>';
    }
    /* 真灵承继常驻态 +「换一件」入口（轮回卷 §3.4 · 器灵卷 §九）：
     * 未持 shop.heir 资格整块不出现（零打扰）；持格且本世零觉醒候选**且无失效择定**时整块不出现——
     * **不留一个点不开的按钮**。N18 例外：择定件已失时**必须留入口**，否则那条脏择定永远清不掉
     *（浮层内候选为空有专项说明 +「本次不带」可清除，见 spirit.ui.heir.empty）。 */
    var heirCands = SQ.Legacy && SQ.Legacy.heirEligible(meta) ? SQ.Legacy.heirCandidates(w, p) : [];
    if (heirCands.length || (SQ.Legacy && SQ.Legacy.heirEligible(meta) && meta.heirChoice && meta.heirChoice !== SQ.Legacy.HEIR_NONE)) {
      var heirLine = heirStatusText(meta, heirCands);
      h += '<div class="tribready" style="margin-top:8px"><div class="tr-t">' + esc(t('spirit.ui.heir.title')) + '</div>' +
        '<div class="hint">' + esc(t('spirit.ui.heir.sub')) + '</div>' +
        (heirLine ? '<div class="hint" style="font-weight:650">' + esc(heirLine) + '</div>' : '') +
        '<button data-act="heirSwitch" style="width:100%;margin-top:6px">' + esc(t('spirit.ui.heir.switch')) + '</button></div>';
    }
    /* 遗泽商店（价目总表 6800 · 已购置灰不隐藏） */
    h += '<p class="hint" style="margin:10px 0 2px;font-weight:650">' + esc(t('legacy.ui.shop')) + '</p>';
    h += '<p class="hint" style="margin:0 0 6px">' + esc(t('legacy.ui.shop.hint')) + '</p>';
    h += '<div class="shopgrid">';
    SQ.Legacy.shopItems(d).forEach(function (it) {
      var owned = (meta.spent || {})[it.key] != null;

  /* ── 全局动作委托 ── */
  document.addEventListener('click', async function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.dataset.act, v = el.dataset.v;
    var keepScroll = document.querySelector('.tabbody') ? document.querySelector('.tabbody').scrollTop : 0;
    if (act === 'tab') { switchTab(v); return; }
    /* 更新公告（第册四批）：点「知道了」才落库并收层；落库走 SQ.mutate 事务口（直写内存态会被下一次 claim 覆盖） */
    if (act === 'noteClose') {
      if (SQ.UI && SQ.UI.updateNote) {
        var noteId = SQ.UI.updateNote.id;
        SQ.UI.updateNote.hide();
        await SQ.mutate(state, function (s) { s.profile.seenNote = noteId; });
      }
      return;
    }
    /* 法与器合并页（页面整合批 2026-10-06 · UI 卷 §3.4a；标签化批 2026-10-09 改顶部标签）：
     * `lawChip` = 页顶两枚标签（功法 / 法器），互斥显示，切一枚就只渲染那一段。
     * `lawJump` = 概览条三格，语义随标签化改：**目标段没选中 → 切过去并回顶**（原来「锚跳到看不见的段」
     * 在无滚动可依托的标签态下等于没反应）；**目标段已选中 → 仍滚到该段段标**（长段内回段首，
     * 滚动容器是 `.tabbody` 而非 window，`prefers-reduced-motion` 直出——与渡劫演出同口径）。
     * 两条都必须 `return`：委托尾部会把 `.tabbody.scrollTop` 复原成动作前的值（keepScroll），
     * 不 return 就切完标签又被拽回原处——与 `logFilter` 同口径。 */
    if (act === 'lawChip') { lawChipTo(v); return; }
    /* 江湖榜换榜（第册一批③）：`ui.jhb` 只在内存（与 `ui.lawChip` 同纪律——选看哪一榜不是角色状态，
     * 写进存档等于给主档加一个与游玩时长相关的增长项）；切榜等价换页 ⇒ 滚动归零。 */
    if (act === 'jbChip') {
      SQ.UI.jianghu.actChip(ctx(), v);
      return;
    }
    if (act === 'lawJump') {
      if (lawChipOf() !== (v === 'qi' ? 'qi' : 'fa')) { lawChipTo(v); return; }
      var lawT = document.getElementById('lawsec-' + v);
      var lawB = document.querySelector('.tabbody');
      if (lawT && lawB) {
        var lawTop = lawB.scrollTop + (lawT.getBoundingClientRect().top - lawB.getBoundingClientRect().top) - 8;
        if (lawTop < 0) lawTop = 0;
        if (reducedMotion()) lawB.scrollTop = lawTop;
        else if (lawB.scrollTo) lawB.scrollTo({ top: lawTop, behavior: 'smooth' });
        else lawB.scrollTop = lawTop;
      }
      return;
    }
    if (act === 'claim') {
      var before = ws().tribulation.attempts;
      snapTrib();
      await SQ.claim(state);
      afterClaim(before);
      renderAll();
      return;
    }
    if (act === 'detailRate') { ui.detailRate = !ui.detailRate; renderTab(); return; }
    if (act === 'detailTrib') { ui.detailTrib = !ui.detailTrib; renderTab(); return; }
    if (act === 'role') { showRole(); return; }
    if (act === 'washOpen') { showWash(); return; }
    if (act === 'washSlot') { washDraft.slot = parseInt(v, 10); renderWash(); return; }
    if (act === 'washPick') { washDraft.cand = parseInt(v, 10); renderWash(); return; }
    if (act === 'washOk') { await doWash(); return; }

     比长度会让红点永久失效。 */
    var logKey = logKeyOf(w.log);
    if (logKey && logKey !== ui.lastLogKey && ui.tab !== 'journal') {
      /* 去重：动作处已就同一日志弹过（announcedLogKey）则不再重复呈报；
         无自提示的动作（如坊市购入）仍由 tick 呈报，反馈不丢。 */
      if (logKey !== ui.announcedLogKey) {
        var latest = w.log[w.log.length - 1];
        /* event 类走奇遇模态/叙事流；karma 类（名号更迭）改由全屏演出呈报，不再重复 toast */
        if (latest && latest.cat !== 'event' && latest.cat !== 'karma') toast(latest.text);
      }
      ui.newLogDot = true;
    }
    ui.lastLogKey = logKey;
    /* 神秘商人开席提示（第卅九批 · 用户报「黑市/特席从没见过」）：席期只有 MERCHANT_DURATION_MS，
     * 而 settle 侧先写 shop 类日志、resolveBranch 随后写 event 类尾行 ⇒ 上面那条「只 toast 末行且跳过 event」
     * 的规则天然把开席吞掉。这里按开席时刻去重，一次开席只提示一次（含载入时仍在席期的补提示）。 */
    var mu = ((w.shop || {}).merchant || {}).until || 0;
    if (mu !== ui.lastMerchUntil) {
      ui.lastMerchUntil = mu;
      if (mu > Date.now()) toast(t('shop.merchant.open'));
    }
    var feedKey = feedKeyOf(w.eventHistory.feed);
    if (feedKey && feedKey !== ui.lastFeedKey && ui.tab !== 'event') ui.newFeedDot = true;
    ui.lastFeedKey = feedKey;
    /* 走查 v2.5 §6：新功法/新法宝/新道友/坊市补货 红点——同「先判定后推基线」纪律 */
    var sigs = resDotSigs(w);
    if (sigs.arts !== ui.lastArtsSig && ui.tab !== 'arts') ui.newArtsDot = true;
    ui.lastArtsSig = sigs.arts;
    if (sigs.treasure !== ui.lastTreasureSig && ui.tab !== 'treasure') ui.newTreasureDot = true;
    ui.lastTreasureSig = sigs.treasure;
    if (sigs.bonds !== ui.lastBondSig && ui.tab !== 'bonds') ui.newBondDot = true;
    ui.lastBondSig = sigs.bonds;
    if (sigs.shop !== ui.lastShopSig && ui.tab !== 'shop') ui.newShopDot = true;
    ui.lastShopSig = sigs.shop;
    /* 名号更迭演出（善恶名号批）：段位基线跨段即演（日志同源由 recalcDerived 入档 'karma'）。
       仅在无其它浮层/演出时触发，避免叠层；有浮层则保持旧基线，顺延下次收功再演。 */
    var rankSys = pack().worldSystems;
    var rankNow = (rankSys && rankSys.rankOf) ? rankSys.rankOf(w) : '';
    if (ui.karmaRank && rankNow && rankNow !== ui.karmaRank && !overlayOpen()) {
      showKarmaRank(rankNow, rankSys.tierOf(w));
      ui.karmaRank = rankNow;
    }
  }

  /* 是否有浮层/演出遮挡（名号更迭演出避让判定）：任一可见即顺延，不叠层 */
  function overlayOpen() {
    return !!document.querySelector('.mask:not(.hide), .trib-mask:not(.hide), .cave-stage:not(.hide),' +
      ' .spouse-stage:not(.hide), .excl-mask:not(.hide)');
  }

  /* 红点信号（走查 v2.5 §6）：功法=已学会部数、法宝=在库件数、道友=已结缘人数、坊市=补货时间戳 */
  function resDotSigs(w) {
    var bonded = 0;
    (D().COMPANIONS || []).forEach(function (c) {
      var a = (w.bonds || {})[c.id] || 0;
      if (a >= 1) bonded++;
    });
    return {
      arts: (w.artsKnown || []).length,
      treasure: (w.treasures && w.treasures.owned ? w.treasures.owned.length : 0),
      bonds: bonded,
      /* 坊市 = 补货时间戳 + **商人席的开席时刻**（第卅九批：特席只活 MERCHANT_DURATION_MS，
       * 原签名不含它 ⇒ 12h 冷却换来的一次到货从不点亮 tab，玩家实测「从没见过」）。
       * 只取 until 原值不做时间比较：席过期的那一 tick 若参与签名，会把红点在**收尾时**再点一次。 */
      shop: (w.shop && w.shop.nextRestock || 0) + '#' + ((w.shop && w.shop.merchant || {}).until || 0)
    };
  }

  /* 未读判定基线标识：log 尾插、feed 头插（unshift），二者均封顶 50 条，
     长度到顶后不再增长——只能比「最新一条」的标识。 */
  function logKeyOf(log) {
    var e = log && log[log.length - 1];
    return e ? (e.ts + ':' + e.cat + ':' + e.text) : '';
  }
  function feedKeyOf(feed) {
    var f = feed && feed[0];
    return f ? (f.ts + ':' + f.id + ':' + f.branch) : '';
  }

  var tickTimer = null;
  function stopTick() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }
  function startTick() {
    if (tickTimer) return;
    tickTimer = setInterval(async function () {
      if (!$('modal-choice').classList.contains('hide')) return; /* 选择模态期间暂停自动结算展示 */
      var prev = ws() ? ws().tribulation.attempts : 0;
      var keep = document.querySelector('.tabbody') ? document.querySelector('.tabbody').scrollTop : 0;
      /* 输入闸（GitHub issue #5 · 用户报「融合坛自定义名输入框无法输入文字，点击后很快丢失焦点」）：
       * renderAll() 把当前页整块 innerHTML 重建 ⇒ 正在打字的 <input> 换成新节点，焦点被抢、字一起丢。
       * 结算照跑（玩家进程不能停），只跳过这一次 DOM 重建；focusout 时补渲染。 */
      var ae = document.activeElement;
      var typing = !!(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA'));
      try {
        snapTrib();                       /* 劫前成算/损失快照（F7 复盘行） */
        await SQ.claim(state);
        afterClaim(prev);
        if (typing || document.hidden) return;
        /* document.hidden：面板收在后台时结算与落盘照跑（进度不能停），只跳过每秒一次的整页 DOM 重建；
         * 回到可见由下面的 visibilitychange 立刻补一帧 ⇒ 玩家看到的不会是旧数。 */
        renderAll();
        var tb = document.querySelector('.tabbody');
        if (tb) tb.scrollTop = keep;
      } catch (e) {
        /* C2（排期 C2 · 第册卅一批）：整段静默 catch ⇒ 渲染器**每秒抛一次也是零信号**（既不是 pageerror，
         * `assets/**` 又零 `console.*`，任何门禁都照不到）。现按 checkIo 同形记一次人话提示：签名去重
         * （同一枚错只播一次，不每秒刷屏），换一枚错才再播；打印面复用既有 `toast()`，不新开横幅。 */
        var sigTick = 'render:' + ((e && (e.name + ':' + e.message)) || 'unknown');
        if (ui.tickErrSeen !== sigTick) { ui.tickErrSeen = sigTick; toast(t('ui.error.render')); }
      }
    }, 1000);
  }
  /* 回到前台立刻补一帧（tick 里 document.hidden 那支跳过的渲染在这里接回来）*/
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && ws()) { _mods = null; renderAll(); }
  });

  /* ── MAIN 入口 ── */
  function enterMain() {
    ui.lastAttempts = ws().tribulation.attempts;
    /* 基线对齐当前存档：进场前（含离线结算）已产生的叙事/日志视为已读，
       只对本次会话内新增的亮红点——离线那批由「出关呈报」浮层交代 */
    ui.lastLogKey = logKeyOf(ws().log);
    ui.announcedLogKey = ui.lastLogKey;      /* 进场前（含离线）已产生的日志视为已呈报，首 tick 不重复弹 */
    ui.karmaRank = pack().worldSystems.rankOf(ws());   /* 名号段位基线：进场前（含离线）跨段不补演，只演本次会话内新跨段 */
    ui.lastFeedKey = feedKeyOf(ws().eventHistory.feed);
    ui.newLogDot = false; ui.newFeedDot = false;
    ui.rumorSeenAt = null;                /* G17 传闻红点基线：进场惰性对齐（存档既有传闻不打扰） */
    var baseSigs = resDotSigs(ws());          /* 走查 v2.5 §6：四类红点基线对齐当前档 */
    ui.lastArtsSig = baseSigs.arts; ui.lastTreasureSig = baseSigs.treasure;
    ui.lastBondSig = baseSigs.bonds; ui.lastShopSig = baseSigs.shop;
    ui.newArtsDot = false; ui.newTreasureDot = false; ui.newBondDot = false; ui.newShopDot = false;
    ui.achvSnap = achvRedDotSig();          /* 成就页红点基线：进场前（含离线）已达成者视为已读 */
    /* 回线首帧呈报闸（离线≤5min 不打扰批）：仅当 boot 的 claim 真的结算了离线才弹。
       判定依据：settle 与 core.claim 共用同一枚 now ⇒ 真结算时 lastOffline.at 恰等于 lastSave；
       离线 ≤5min 未触发结算（settle 不写 lastOffline），存档里残留的是上一段旧记录，
       其 at 早于本次 lastSave —— 直接标为已读，不再打扰。 */
    var lo0 = ws().lastOffline;
    ui.seenOfflineAt = (lo0 && lo0.at === ws().lastSave) ? 0 : (lo0 ? lo0.at : 0);
    switchTab('idle');
    show('main');
    checkIo();                              /* boot 的 load/save 若失败，进场即提示（#89） */
    var w0 = ws();
    if (w0.pendingChoice) {
      if (autoEventOn()) autoResolveChoice();   /* 自动批：进线即自动结算，不弹窗 */
      else showChoice();
    }
    else if (w0.lastOffline && w0.lastOffline.at !== ui.seenOfflineAt) showOfflineReport();
    /* 更新公告（第册四批 · 判定与渲染全在 view/updatenote.js）：排在遇袭抉择与出关呈报**之后**，
       公告是最低优先级的打断，不能盖掉那些要玩家做决定的层。 */
    if (SQ.UI && SQ.UI.updateNote && SQ.UI.updateNote.needed((state.profile || {}).seenNote)) SQ.UI.updateNote.show(wid());
    startTick();
  }

  /* ── boot 模式：先 await 读档再首绘 ── */
  async function boot() {
    bindCreationTexts();
    show('loading');
    try {
      var s = await SQ.claim(state);
      /* 死在门口（寿元批）：boot 那一次离线结算里就已完成强制转世 ⇒ 档案名已空、进不了主界面。
       * 不能把人无声扔在创角屏——先演坐化呈报，确定后仍是创角流程。 */
      var ld0 = ((s.worlds || {})[s.profile.worldId] || {}).lastDeath;
      if (!hasProfile(s) && ld0 && ld0.at !== ui.seenDeathAt) { show('c1'); showDeathReport(); return; }
      if (hasProfile(s)) enterMain();
      /* 读档失败回落空档 ⇒ 屏上是一张干净的创角屏。不提示就是「无声以为档没了」，
       * 而玩家此时顺手新建 = `SQ.mutate` 起手又读失败 → 拿空档落盘 → **盖掉盘上那份完好但读不动的载荷**。
       * tick 只在 enterMain 后起（startTick 在那条路上），所以这两支是 checkIo 唯一的补位点。 */
      else { show('c1'); checkIo(); }
    } catch (e) {
      show('c1'); checkIo();
    }
  }
  boot();
})();
</script>
</body>
</html>
