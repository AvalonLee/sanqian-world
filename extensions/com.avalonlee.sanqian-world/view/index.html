        : t('life.row', { age: SQ.fmt(li.age), left: SQ.fmt(Math.max(0, Math.ceil(li.left))) })
      ) + '</span>' + (li.near ? '<span class="bad">' + esc(t('life.near', { left: SQ.fmt(Math.ceil(li.left)) })) + '</span>' : '') + ventSpan + '</div>';
    if (li.daoLv >= 1) {
      h += '<div class="kv"><span' + (li.daoNear ? ' class="bad"' : '') + '>' +
        esc(t('daoshang.row', { n: li.daoLv, cap: li.daoMax })) + '</span>' +
        (li.daoNear ? '<span class="bad">' + esc(t('daoshang.near')) + '</span>' : '') + '</div>';
    }
    /* 修为大数字（修行状态批 v2.1）：**全位数字逐秒跳动**——不带 万/亿 缩放（缩放会把
     * 低境界产出量化到 0.1万/步，数字长时间纹丝不动）、不带「修为」单位字，只留 / 上限；
     * 每秒 tick 由 renderAll 重绘，配合全位数字形成最直观的增长动效 */
    h += '<div class="kv"><span class="big">' + fmtFull(w.qi) + '</span><span class="hint">/ ' + fmtFull(cap) + '</span></div>';
    h += '<div class="bar"><i style="width:' + Math.min(100, (w.qi / cap) * 100).toFixed(1) + '%"></i></div>';
    if (full) h += '<p class="fullcap">' + esc(t('idle.maxed')) + '</p>';
    h += '<div class="kv"><span>' + esc(t('idle.rate', { n: rate.toFixed(1) })) + '</span>' +
         '<button class="linkbtn chip" data-act="detailRate">' + esc(t('idle.detail')) + '</button></div>';
    if (ui.detailRate) {
      h += '<div class="detailbox">';
      h += '<div class="kv"><span>' + esc(t('idle.base')) + '</span><span>' + d.REALMS[w.realm].baseQi + '/s</span></div>';
      Object.keys(m.detail.qiRate || {}).forEach(function (src) {   /* 来源清单取 mods 自己记的键（审计 #11：原先硬列 10 项，漏 cave/caveFac/treasure/synergy/legacy ⇒ 明细相加 < 顶部数） */
        var v = (m.detail.qiRate || {})[src] || 0;
        if (v) h += '<div class="kv"><span>' + esc(t('idle.' + src)) + '</span><span>' + (v > 0 ? '+' : '') + pct(v) + '</span></div>';
      });
      var sys = p.worldSystems;
      if (sys) h += '<div class="kv"><span>' + esc(t('idle.align')) + '</span><span>×' + sys.alignMultOf(w).toFixed(2) + '</span></div>';
      /* caveMult 独立乘区（B7 · 数值详设 §8.2）：挂在末端单列一行，不混进 qiRate 加算池 */
      var cm = SQ.Cave.multOf(w, p, d, m);
      if (cm !== 1) {
        h += '<div class="kv"><span>' + esc(t('idle.cave')) + ' · ' + esc(t('cave.' + SQ.Cave.current(w, p).id + '.name')) +
          '</span><span>×' + cm.toFixed(2) + '</span></div>';
      }
      /* 模式乘区与初境加速（审计 #4 的可见面）：这两重以前只在引擎里乘，屏上看不见 ⇒ 明细各行相乘永远
       * 对不上顶部的 N/秒。数字一律取自表（MODES[mode].qiMult / NEWBIE_RAMP），视图不再抄字面量。 */
      var modeM225 = (d.MODES && d.MODES[w.mode]) ? d.MODES[w.mode].qiMult : 1;
      if (modeM225 !== 1) {
        h += '<div class="kv"><span>' + esc(t('idle.mode.' + w.mode)) + '</span><span>×' + modeM225.toFixed(2) + '</span></div>';
      }
      var rampM225 = (d.NEWBIE_RAMP && w.realm <= d.NEWBIE_RAMP.realms) ? d.NEWBIE_RAMP.qiMult : 1;
      if (rampM225 !== 1) {
        h += '<div class="kv"><span>' + esc(t('idle.newbie')) + '</span><span>×' + rampM225.toFixed(2) + '</span></div>';
      }
      h += '</div>';
    }
    if (need != null) {
      h += '<div class="kv"><span>' + esc(t('idle.next', { realm: t('realm.' + (w.realm + 1)), n: SQ.fmt(Math.max(0, need - w.qi)), res: t('resource.primary') })) + '</span></div>';
      /* 渡劫倒计时（第十八批 · 用户令「修行页要让人知道大约多久后可以渡劫」）：**纯派生显示量**——
       * 差额取 `needEffOf`（与手动渡劫按钮同一口径，不是 capOf 那个修为上限），增速取 `effRate`（与 settle 同一个式子），
       * 格式复用拜访/飞升冷却那一个 `timeLeftText`；不入存档、不改任何结算。增速为 0（如离线效率算不进在线口径）时不印。 */
      if (need > w.qi && rate > 0) {
        h += '<div class="kv hint"><span>' + esc(t('idle.trib.eta',
          { time: timeLeftText((need - w.qi) / rate * 1000) })) + '</span></div>';
      }
      var ti = p.worldSystems.tribInfo(w, p, d, m);
      if (ti) {
        h += '<div class="kv"><span>' + esc(t('tribulation.estimate', { p: Math.round(ti.p * 100) })) + '</span>' +
             '<button class="linkbtn chip" data-act="detailTrib">' + esc(t('tribulation.detail')) + '</button></div>';
        if (ui.detailTrib) {
          h += '<div class="detailbox">' +
            '<div class="kv"><span>' + esc(t('tribulation.base')) + '</span><span>' + ti.parts.base.toFixed(2) + '</span></div>' +
            '<div class="kv"><span>' + esc(t('tribulation.resist')) + '</span><span>+' + ti.parts.resist.toFixed(3) + '</span></div>' +
            '<div class="kv"><span>' + esc(t('tribulation.power')) + '</span><span>+' + ti.parts.power.toFixed(3) + '</span></div>' +
            '<div class="kv"><span>' + esc(t('tribulation.talent')) + '</span><span>' + (ti.parts.talent >= 0 ? '+' : '') + ti.parts.talent.toFixed(3) + '</span></div>' +
            /* N20 接线：一次性修正（丹方 / 奇遇 / 突破前置写入 `ws.tribulation.next`）此前只并进 talent 同池、             * 出处不列（与心魔 / 雷蕴签名同款展示纪律：并入同池仍单列出处） */
            ((w.tribulation && w.tribulation.next) ? '<div class="kv"><span>' + esc(t('tribulation.next')) + '</span><span>' +
              (w.tribulation.next >= 0 ? '+' : '') + w.tribulation.next.toFixed(3) + '</span></div>' : '') +
            /* 心魔行（系统深化批 B2 · 数值详设 §8.3.2）：层数与对 p 的影响（−0.0n）——
             * 已并入 parts.talent 同池，此处单列出处（与雷蕴签名行同款展示纪律） */
            (ti.parts.xinmoStacks > 0 ? '<div class="kv"><span>' + esc(t('tribulation.xinmo.row', { n: ti.parts.xinmoStacks })) +
              '</span><span class="bad">' + ti.parts.xinmo.toFixed(2) + '</span></div>' : '') +
            '<div class="kv"><span>' + esc(t('tribulation.karma')) + '</span><span>' + (ti.parts.karma >= 0 ? '+' : '') + ti.parts.karma.toFixed(2) + '</span></div>' +
            (ti.parts.alignFlat ? '<div class="kv"><span>' + esc(t('tribulation.alignFlat')) + '</span><span>+' + ti.parts.alignFlat.toFixed(2) + '</span></div>' : '') +
            /* 洞府签名「雷蕴」= 渡劫加项（B7）；签名已并入 parts.talent 同池，此处单列出处 */
            (caveSigOf('tribBonus') ? '<div class="kv"><span>' + esc(t('tribulation.caveSig')) + ' · ' +
              esc(t('cave.' + SQ.Cave.current(w, p).id + '.signature')) + '</span><span>+' + caveSigOf('tribBonus').toFixed(2) + '</span></div>' : '') +
            (function () {
              /* 护法加项行（B6 · 交互说明 §4.2）：生效 = 道号+档+加项；魔道/无人 = 灰字「无人护法」。
               * 职司护法标记（系统深化批 B2/B4 · 势力全录卷 §8.3）：officeGuard 为真时追加「职司护法 +0.02」
               * 分解行——门中长老坐镇，无护法道友也按档3 floor 计。 */
              var gN = ti.parts.guardianNpc;
              var gTier = gN ? SQ.Bonds.tierOf(w, gN, d) : 0;
              var ogRow = ti.parts.officeGuard
                ? '<div class="kv"><span>' + esc(t('faction.office.trib', { n: '0.02' })) + '</span><span>✓</span></div>'
                : '';
              return '<div class="kv' + (ti.parts.guardian > 0 ? '' : ' hint') + '"><span>' + esc(t('tribulation.guardian')) +
                (gN ? ' · ' + esc(t('bond.' + gN + '.name')) + bondTierNum(gTier) : '') + '</span><span>' +
                (ti.parts.guardian > 0 ? '+' + ti.parts.guardian.toFixed(2) : esc(t('tribulation.guardian.none'))) + '</span></div>' + ogRow;
            })() +
            /* 天道段（天道系统批 B3）：天道修正行（护佑/劫云 + 天睐天怒档位）+ 逆天大劫挑战入口
             * （defy ≥100 亮起、可无限期推迟——独立劫不推进境界） */
            (function () {
              var tdR = w.tiandao;
              if (!tdR || !SQ.Tiandao) return '';
              var rows = '';
              if (ti.parts.tiandao) {
                rows += '<div class="kv"><span>' + esc(t('tiandao.nextTrib')) + '</span><span>' +
                  (ti.parts.tiandao > 0 ? '+' : '') + ti.parts.tiandao.toFixed(2) + '</span></div>';
              }
              if (ti.parts.feud) {
                rows += '<div class="kv"><span>' + esc(t('prodigy.detail.feudstate')) + '</span><span class="bad">' + ti.parts.feud.toFixed(2) + '</span></div>';
              }
              if (ti.parts.soul) {
                rows += '<div class="kv"><span>' + esc(t('spirit.skill.hun.name')) + '</span><span>+' + ti.parts.soul.toFixed(2) + '</span></div>';
              }
              var stR = SQ.Tiandao.stageOf(w, d);
              /* 档位罚值取表（审计 #5）：原先这里硬编码 -0.03 / -0.01，而 `D.TIANDAO.DEFY_TRIB_MODS = [-0.01, -0.02]`
               * ⇒ 天怒那行屏上比引擎多罚 0.01，且与同一面板上方 `ti.parts.tiandao`（引擎实算）两个数打架。
               * 取不到表就不印这一行——宁缺一行，不编一个数。 */
              var dmR = d.TIANDAO && d.TIANDAO.DEFY_TRIB_MODS;
              if ((stR === 'lai' || stR === 'nu') && dmR && dmR.length >= 2) {
                /* 引擎 `tribModOf` 是**两档相加**（armed.lai 与 armed.nu 可以同时亮：实测逆天 25 + 37 = 62 ⇒ 双旗），
                 * 而 `stageOf` 只回一个档名 ⇒ 按档名取一支会少算另一支，屏上 −0.02 与同面板上方引擎实算 −0.03
                 * 打架 = 本行立时要消灭的那一类。现按引擎同一式取「已亮档之和」。 */
                var arR = (w.tiandao && w.tiandao.armed) || {};
                var penR = (arR.lai ? dmR[0] : 0) + (arR.nu ? dmR[1] : 0);
                rows += '<div class="kv"><span>' + esc(t('tiandao.tribrow')) + ' · ' + esc(t('tiandao.stage.' + stR)) +
                  '</span><span class="bad">' + penR.toFixed(2) + '</span></div>';
              }
              if (tdR.defy >= (d.TIANDAO.DEFY_STAGES || [30, 60, 100])[2]) {
                var ni = SQ.Tiandao.nijieInfo(w, p, d, m);
                rows += '<div class="tribready" style="margin-top:8px"><div class="tr-t">' + esc(t('tiandao.stage.nijie')) + '</div>' +
                  (ni ? '<div class="hint">' + esc(t('tiandao.nijie.p', { p: Math.round(ni.p * 100) })) + '</div>' : '') +
                  '<button class="primary" data-act="nijie" style="width:100%;margin-top:6px">' + esc(t('tiandao.nijie.btn')) + '</button></div>';
              }
              return rows;
            })() +
            '</div>';
        }
      }
      /* 手动渡劫入口：仅「自动渡劫已关闭」时出现；修为圆满才亮按钮（need 与 tryTrib 同一口径） */
      if (!(state.settings && state.settings.autoTrib) && w.qi >= need) {
        h += '<div class="tribready">' +
          '<div class="tr-t">' + esc(t('trib.manual.ready')) + '</div>' +
          '<div class="hint">' + esc(t('trib.manual.hint')) + '</div>' +
          '<button class="primary" data-act="trib" style="width:100%;margin-top:8px">' + esc(t('trib.manual.btn')) + '</button>' +
          '</div>';
      }
    } else {
      h += '<div class="kv"><span class="fullcap">' + esc(t('idle.maxed')) + '</span></div>';
      /* 飞升大劫入口（轮回卷 §1.2）：真仙盈满亮起——独立终局劫 base 0.25、
       * 失败不扣修为不计连败、24h 重试；成功 = 满额遗泽转世（毕业仪式） */
      var fsChk = SQ.Legacy ? SQ.Legacy.canFeisheng(w, p, d, state.meta, Date.now(), state.profile) : { ok: false };
      if (fsChk.ok) {
        var fsInfo = SQ.Legacy.feishengInfo(w, p, d, m);
        h += '<div class="tribready"><div class="tr-t">' + esc(t('legacy.ui.feisheng.btn')) + '</div>' +
          (fsInfo ? '<div class="hint">' + esc(t('legacy.ui.feisheng.p', { p: Math.round(fsInfo.p * 100) })) + '</div>' : '') +
          '<button class="primary" data-act="ascend" style="width:100%;margin-top:6px">' + esc(t('legacy.ui.feisheng')) + '</button></div>';
      } else if (fsChk.reason === 'cd') {
        h += '<div class="kv hint"><span>' + esc(t('legacy.ui.feisheng.cd', { t: timeLeftText(Math.max(0, fsChk.until - Date.now())) })) + '</span></div>';
      }
    }
    /* ── 临时增益图标行（系统深化批 B2）：破境高光 / 道伤封固 / 声威大振 / 同门来助等来源溯源展示；
     * eventShield 为「护佑」层数 chip（冥佑层语义）。词表未登记的来源只显示字段与数值。 ── */
    var nowB = Date.now();
    var buffChips = (w.buffs || []).filter(function (b) { return b.until > nowB; });
    if (buffChips.length) {
      var shieldN = buffChips.filter(function (b) { return b.field === 'eventShield'; }).length;
      var chips = buffChips.filter(function (b) { return b.field !== 'eventShield'; }).map(function (b) {
        var srcKey = b.source ? ('buff.src.' + b.source) : '';
        var srcName = srcKey && t(srcKey) !== srcKey ? t(srcKey) : '';
        var harmful = (b.field === 'shopCost') ? (b.mult > 0) : (b.mult < 0);
        return '<span class="buffchip' + (harmful ? ' deb' : '') + '">' +
          (srcName ? esc(srcName) + ' · ' : '') +
          esc(t('talent.field.' + b.field)) + ' ' + (b.mult >= 0 ? '+' : '−') + pct(Math.abs(b.mult)) +
          ' · ' + esc(timeLeftText(b.until - nowB)) + '</span>';
      });
      if (shieldN) chips.push('<span class="buffchip">' + esc(t('buff.shield', { n: shieldN })) + '</span>');
      h += '<div class="buffrow">' + chips.join('') + '</div>';
    }
    /* ── 结算区（修行状态批 v2.1 重排）：修行状态（模式卡）→ 修行所得（离线结算）→ 收功 ──
     * 三块合成一个连贯区块：玩家先选状态、再看上次离线结算、最后手动收功，
     * 概念上互为上下游；不再散落在页首与页尾。 */
    var mode = w.mode || 'seclude';
    /* 历练入口预告（体验手感批 v2.12）：当前秘境战力不足 = 与秘境页瓶颈同一 powerOf 口径 */
    var pwForMode = SQ.Mods.powerOf(w, p, d, m);
    var znCur = (d.ZONES || [])[w.zone] || {};
    var ventureWeak = !!znCur.need && pwForMode < znCur.need;
    h += '<div class="sechead"><span class="t">' + esc(t('idle.mode.title')) + '</span></div>';
    h += '<div class="modesel">';
    /* 历练模式卡常驻词缀行（数值详设 §2.5「切入即见、不隐藏」：秘境页顶部 + 本卡双落点） */
    var affM = SQ.Combat.affixDef(w, d);
    ['seclude', 'venture'].forEach(function (mk) {
      var on = mode === mk;
      h += '<div class="modeopt' + (on ? ' on' : '') + '" data-act="setMode" data-v="' + mk + '">' +
        '<div class="mt">' + esc(t('idle.mode.' + mk)) + '</div>' +
        '<div class="md">' + esc(t('idle.mode.' + mk + '.desc')) + '</div>' +
        (mk === 'venture' && affM
          ? '<div class="mat">' + esc(t('zone.affix.line', {
              name: t('affix.' + affM.id + '.name'), desc: t('affix.' + affM.id + '.desc') })) + '</div>'
          : (mk === 'seclude' && affM
            ? '<div class="mat">' + esc(t('zone.affix.seclude')) + '</div>' : '')) +
        (mk === 'venture' && ventureWeak
          ? '<div class="mw">' + esc(t('idle.mode.venture.warn', { zone: t('combat.zone.' + w.zone) })) + '</div>'
          : (on ? '<div class="mat">' + esc(mk === 'venture'
            ? t('idle.mode.venture.at', { zone: t('combat.zone.' + w.zone) })
            : t('idle.mode.seclude.at')) + '</div>' : '')) +
        '</div>';
    });
    h += '</div>';
    /* 修行所得常驻面板（F4：lastOffline 为 null 不渲染）。
     * 潜心悟道叙事变体（修行状态批）：离山时在历练 → 标题/正文走 *.v 文案，数值同源不变；
     * 标题缀相对时间（v2.1），明确这是「上次归来」的结算而非实时数据 */
    if (w.lastOffline) {
      var lo = w.lastOffline;
      var ventureLo = lo.mode === 'venture';
      var lsecs = isFinite(lo.secs) ? lo.secs : 0;   /* 防脏字段：NaN/undefined 一律按 0 计 */
      var lh = Math.floor(lsecs / 3600), lm = Math.floor((lsecs % 3600) / 60);
      var lt = lh > 0 ? t('ui.time.hm', { h: lh, m: lm }) : t('ui.time.m', { m: Math.max(1, lm) });
      h += '<div class="offbox"><div class="ot">' +
        esc(t(ventureLo ? 'offline.panel.title.v' : 'offline.panel.title') + ' · ' + timeAgo(lo.at)) + '</div>' +
        esc(t(ventureLo ? 'offline.panel.body.v' : 'offline.panel.body', {
          t: lt, res: t('resource.primary'), qi: SQ.fmt(lo.qi), cur: t('resource.currency'),
          stones: SQ.fmt(lo.stones || 0), gate: t('tribulation.tag'),
          n: lo.trib ? lo.trib.n : 0, s: lo.trib ? lo.trib.s : 0, f: lo.trib ? lo.trib.f : 0
        })) +
        '<div class="hint" style="margin-top:3px">' + esc(offlineDetail(lo)) + '</div></div>';
    }
    /* 收功按钮已移除（v2.2）：自动心跳每秒做同一套结算+落盘，手动按钮语义重复——
     * 结算区收敛为「修行状态 → 修行所得」纯展示区块 */
    h += '<div class="cards" style="margin-top:12px">' + (state.profile.talents || []).map(function (el) {
      var c = talentCard(el, wid());
      return '<div class="' + c.className + '">' + c.innerHTML + '</div>';
    }).join('') + '</div>';
    /* ── 自动区（自动批）：自动渡劫（自设置页迁入）+ 自动奇遇（新增），修行页页尾统一挂靠 ── */
    var autoT = !!(state.settings && state.settings.autoTrib);
    var autoE = !!(state.settings && state.settings.autoEvent);
    var autoR = ws().gearAutoRefine !== false;   /* 自动炼化（issue #2）：缺省开 = 旧行为 */
    h += '<div class="sechead" style="margin-top:14px"><span class="t">' + esc(t('idle.auto.sec')) + '</span></div>';
    h += '<div class="setrow"><span class="sl">' + esc(t('settings.auto.title')) +
      '<span class="sd">' + esc(t('settings.auto.desc')) + '</span></span>' +
      '<button class="switch' + (autoT ? ' on' : '') + '" data-act="toggleAutoTrib" role="switch" aria-checked="' + autoT + '">' +
      '<i></i><span>' + esc(autoT ? t('settings.auto.on') : t('settings.auto.off')) + '</span></button></div>';
    h += '<div class="setrow"><span class="sl">' + esc(t('settings.autoevent.title')) +
      '<span class="sd">' + esc(t('settings.autoevent.desc')) + '</span></span>' +
      '<button class="switch' + (autoE ? ' on' : '') + '" data-act="toggleAutoEvent" role="switch" aria-checked="' + autoE + '">' +
      '<i></i><span>' + esc(autoE ? t('settings.auto.on') : t('settings.auto.off')) + '</span></button></div>';
    h += '<div class="setrow"><span class="sl">' + esc(t('settings.gearrefine.title')) +
      '<span class="sd">' + esc(t('settings.gearrefine.desc')) + '</span></span>' +
      '<button class="switch' + (autoR ? ' on' : '') + '" data-act="toggleGearRefine" role="switch" aria-checked="' + autoR + '">' +
      '<i></i><span>' + esc(autoR ? t('settings.auto.on') : t('settings.auto.off')) + '</span></button></div>';
    /* 奇遇倾向（体验批）：自动抉择时的分支偏好——优先选倾向分支，不可用则随机其他。
     * 仅自动奇遇开启时展开（子选项，关闭时无意义，避免界面干扰）。 */
    if (autoE) {
      var prefNow = autoEventPref();
      h += '<div class="setrow col"><span class="sl">' + esc(t('settings.eventpref.title')) +
        '<span class="sd">' + esc(t('settings.eventpref.desc')) + '</span></span>' +
        '<div class="chips">' +
        ['none', 'right', 'evil', 'neutral'].map(function (pk) {
          return '<button class="' + (prefNow === pk ? 'on' : '') + '" data-act="setEventPref" data-v="' + pk + '">' +
            esc(t('event.pref.' + pk)) + '</button>';
        }).join('') + '</div></div>';
    }
    $('tab-idle').innerHTML = h;
  }

  /* ── Tab 2 秘境 ── */
  function renderCombat() {
    var w = ws(), m = mods(), d = D(), p = pack();
    var power = SQ.Mods.powerOf(w, p, d, m);
    var maxUn = SQ.Combat.maxUnlocked(w, d);
    /* 战力已上移修行页重点展示；此处只留历练战绩（战力绝对值见修行页） */
    var h = '<p class="hint" style="margin:0 0 8px">' + esc(t('ui.kills', { n: SQ.fmt(w.kills) })) + ' · ' +
      esc(t('ui.total', { n: SQ.fmt(w.total || 0) })) + '</p>';
    /* 首通 ↔ 洞府联动（B6）：3 处福地以秘境首通为资格 → 两柱互相引流 */
    var caveByZone = {};
    SQ.Cave.list(pack()).forEach(function (c) {
      var zc = c.reqs && c.reqs.zoneCleared;
      if (zc != null) caveByZone[zc] = c;
    });
    function zoneRow(i) {
      var z = d.ZONES[i];
      var locked = w.realm < z.unlock;
      var cur = w.zone === i;
      var bn = !locked && power < z.need;
      var rh = '<div class="lrow zcard' + (cur ? ' cur hero' : '') + (locked ? ' locked' : '') + '" data-zone="' + i + '">';
      rh += '<div class="nm">' + esc(locked ? t('zone.unknown') : t('combat.zone.' + i)) +
           (cur ? ' <span class="tierbadge t4">' + esc(t('zone.current')) + '</span>' : '') +
           ((w.cleared || []).indexOf(i) >= 0 ? ' <span class="tierbadge t1">' + esc(t('zone.cleared')) + '</span>' : '') +
           /* 金虚线联动角标：点击跳本页洞天节（未首通 = 预告「首通可开福地」） */
           (caveByZone[i] ? '<span class="cavelink" data-act="openCave">' +
             esc(t((w.cleared || []).indexOf(i) >= 0 ? 'zone.cavelink' : 'zone.cavelink.locked',
               { name: t('cave.' + caveByZone[i].id + '.name') })) + '</span>' : '') + '</div>';
      if (locked) {
        rh += '<div class="meta">' + esc(t('zone.locked', { realm: t('realm.' + z.unlock) })) + '</div>';
      } else {
        /* 数值行合并（信息密度批）：需求战力 · 灵石 · 战力三态同排一行 */
        var pwCls = power >= z.need * 1.2 ? 'ok' : (power >= z.need ? 'tight' : 'bad');
        rh += '<div class="zstats"><span>' + esc(t('zone.need', { n: SQ.fmt(z.need) })) + '</span>' +
          '<span>' + esc(t('zone.stones', { n: SQ.fmt(z.stones) })) + '</span>' +
          '<span class="zone-pw ' + pwCls + '">' + esc(pwCls === 'bad'
            ? t('zone.pw.bad', { n: SQ.fmt(z.need - power) })
            : t('zone.pw.' + pwCls, { p: Math.round((power / z.need - 1) * 100) })) + '</span></div>';
        if (bn) rh += '<div class="meta red">' + esc(t('combat.bottleneck')) + ' — ' + esc(t('combat.bottleneck.hint')) + '</div>';
        if (cur) {
          /* 当前秘境 hero：左栏 = 天时 + 域主，右栏 = 进度 + 残片（宽屏双栏、窄屏单栏） */
          var zhL = '', zhR = '';
          /* 区域词缀 chip（B3 · 切入即见：名 + 效果 + 剩余时长；数值详设 §2.5） */
          var aff = SQ.Combat.affixDef(w, d);
          if (aff) {
            zhL += '<div class="affixrow"><span class="affixchip">' + esc(t('affix.' + aff.id + '.name')) + '</span>' +
              '<span class="meta">' + esc(t('affix.' + aff.id + '.desc')) + ' · ' +
              esc(t('zone.affix.left', { t: timeLeftText((w.zoneAffix && w.zoneAffix.until || 0) - Date.now()) })) + '</span></div>';
          } else {
            zhL += '<div class="meta hint">' + esc(t('zone.affix.none')) + '</div>';
          }
          /* 域主现世（B3 · 数值详设 §2.6）：ready → 域主线 + 挑战按钮（CD 态置灰倒计时）；dead → 已斩角标 */
          var zb = w.zoneBoss;
          if (zb && zb.zone === i && zb.state === 'ready') {
            var bossNeed = Math.round(z.need * (d.BOSS_MULT != null ? d.BOSS_MULT : 1.8));
            var cdLeft = (zb.retryAt || 0) - Date.now();
            zhL += '<div class="bossrow"><span class="tierbadge tboss">' + esc(t('zone.boss.tag')) + '</span>' +
              '<span class="zone-pw ' + (power >= bossNeed ? 'ok' : 'bad') + '">' +
              esc(t('zone.boss.need', { need: SQ.fmt(bossNeed), m: (d.BOSS_MULT != null ? d.BOSS_MULT : 1.8) })) + '</span></div>';
            zhL += cdLeft > 0
              ? '<div class="acts"><button disabled>' + esc(t('zone.boss.cd', { t: timeLeftText(cdLeft) })) + '</button></div>'
              : '<div class="acts"><button class="primary" data-act="challengeBoss">' + esc(t('zone.boss.challenge')) + '</button></div>';
          } else if (zb && zb.zone === i && zb.state === 'dead') {
            zhL += '<div class="meta"><span class="tierbadge t1">' + esc(t('zone.boss.dead')) + '</span></div>';
          }
          zhR += '<div class="bar slim"><i style="width:' + (w.prog[i] || 0) + '%"></i></div>';
          zhR += '<div class="meta">' + esc(t('zone.prog', { n: w.prog[i] || 0 })) + (bn ? ' <span class="red">(' + esc(t('combat.bottleneck')) + ' 90)</span>' : '') + '</div>';
          /* 探宝残片进度与兑换入口（B3 · 数值详设 §2.7 + 扩容批四选）：z6~8 设施图纸/情报/丹方/器图纸四按钮 */
          var shN = Math.max(0, Math.floor((w.shards || [])[i] || 0));
          var shNeed = d.SHARD_NEED != null ? d.SHARD_NEED : 20;
          zhR += '<div class="shardrow"><span class="meta">' + esc(t('zone.shard.name')) + ' ' +
            esc(t('zone.shard.prog', { n: shN, need: shNeed })) + '</span>';
          if (shN >= shNeed) {
            zhR += (i >= 6 && i <= 8)
              ? '<span class="acts"><button data-act="exchangeShard" data-v="' + i + '" data-c="fac">' +
                esc(t('zone.shard.pick.fac')) + '</button>' +
                '<button data-act="exchangeShard" data-v="' + i + '" data-c="intel">' +
                esc(t('zone.shard.pick.intel')) + '</button>' +
                (d.ALCHEMY ? '<button data-act="exchangeShard" data-v="' + i + '" data-c="recipe">' +
                esc(t('alchemy.shard.pick.recipe')) + '</button>' +
                '<button data-act="exchangeShard" data-v="' + i + '" data-c="bp">' +
                esc(t('alchemy.shard.pick.bp')) + '</button>' : '') + '</span>'
              : '<span class="acts"><button data-act="exchangeShard" data-v="' + i + '">' +
                esc(t('zone.shard.exchange')) + '</button></span>';
          }
          zhR += '</div>';
          rh += '<div class="zhero"><div class="zhcol">' + zhL + '</div><div class="zhcol">' + zhR + '</div></div>';
        } else {
          rh += '<div class="acts zfoot"><button data-act="setZone" data-v="' + i + '">' + esc(t('zone.enter')) + '</button></div>';
        }
      }
      return rh + '</div>';
    }
    /* 列表排序（B6 · 帧一）：进行中置顶 → 未首通按阶梯在上（下一目标牵引）→
     * 分隔线 → 已首通折叠在下（回访刷取入口，倒序 = 越新越近手边） */
    var cleared = w.cleared || [];
    var curI = w.zone;
    var upper = [], lower = [];
    d.ZONES.forEach(function (z, i) {
      if (i === curI) return;
      (cleared.indexOf(i) >= 0 ? lower : upper).push(i);
    });
    h += '<div class="secbar"><span>' + esc(t('zone.sec')) + '</span></div>';
    h += '<div class="zonegrid">';
    h += zoneRow(curI);
    upper.forEach(function (i) { h += zoneRow(i); });
    if (lower.length) {
      h += '<div class="zsep">—— ' + esc(t('zone.clearedsec')) + ' ——</div>';
      lower.reverse().forEach(function (i) { h += zoneRow(i); });
    }
    h += '</div>';
    /* ── 洞天福地（合并批）：原「洞天」独立页内容内联到本页——与秘境同页卡片化，
       互为引流（秘境卡「福地」角标 ↔ 洞天卡首通资格 chips）；当前驻留福地为通栏 hero ── */
    var caveCur = SQ.Cave.current(w, p);
    var caveLeft = SQ.Cave.cooldownLeft(w, Date.now());
    h += '<div class="secbar" id="cave-sec"><span>' + esc(t('cave.title')) + '</span>' +
      '<span class="secnote">' + esc(t('cave.cur', {
        name: t('cave.' + caveCur.id + '.name'), mult: SQ.Cave.multOf(w, p, d, m).toFixed(2)
      }) + ' · ' + (caveLeft > 0 ? t('cave.cd', { t: fmtGameDur(caveLeft) }) : t('cave.cd.ready'))) + '</span></div>';
    h += '<div class="cavegrid">' + caveDexHTML(caveLeft, true) + '</div>';
    $('tab-combat').innerHTML = h;
  }

  /* ── Tab 3 功法（批 2 · B4：主修角标 + 品阶×阵营双维分组 + 架上三态 + 独占剪影；
   * 「待重修」金标与渡劫 24h 横幅随第廿五批撤除——渡劫不再清功法等级）── */
  /* 相对时间（百器录首获 / 回看首遇共用） */
  function timeAgo(ts) {
    if (!isFinite(ts)) ts = Date.now();            /* 防脏字段：NaN/undefined 一律按「此刻」计 */
    var s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return t('ui.time.ago.now');
    if (s < 3600) return t('ui.time.ago.m', { n: Math.floor(s / 60) });
    if (s < 86400) return t('ui.time.ago.h', { n: Math.floor(s / 3600) });
    return t('ui.time.ago.d', { n: Math.floor(s / 86400) });
  }
  function fmtDate(ts) {
    /* 防脏字段：null / NaN / Infinity 一律按「此刻」计，杜绝「NaN-NaN-NaN NaN:NaN」 */
    if (ts == null || (typeof ts === 'number' && !isFinite(ts))) ts = Date.now();
    var dt = new Date(ts);
    function p2(n) { return ('0' + n).slice(-2); }
    return dt.getFullYear() + '-' + p2(dt.getMonth() + 1) + '-' + p2(dt.getDate()) + ' ' + p2(dt.getHours()) + ':' + p2(dt.getMinutes());
  }
  /* 独占载体溯源（B4/B5 共用）：扫全事件表三分支 gain → {ev, branch} */
  function carrierOf(kind, id) {
    var out = null;
    allEventList().forEach(function (ev) {
      ['right', 'evil', 'neutral'].forEach(function (bk) {
        var br = ev.choices && ev.choices[bk];
        if (!br) return;
        (br.gain || []).forEach(function (g) {
          if (out) return;
          if (kind === 'art' && g.type === 'exclusiveArt' && g.id === id) out = { ev: ev, branch: bk };
          if (kind === 'gear' && g.type === 'exclusiveGear' && g.id === id) out = { ev: ev, branch: bk };
        });
      });
    });
    return out;
  }
  /* 品阶 → 色阶（功法 / 丹药 / 丹方同一谱系，**映射只这一处**）；未知档落 t0 而非 'tundefined'。 */
  var TIER_CLS = { huang: 0, xuan: 2, di: 3, tian: 4 };
  function artTierCls(a) { return 't' + (TIER_CLS[a && a.tier] != null ? TIER_CLS[a.tier] : 0); }
  function tierCls(tier) { return TIER_CLS[tier] != null ? 't' + TIER_CLS[tier] : ''; }
  /* 法宝「先天 / 后天」→ 色阶：同一套 t 类，映射只这一处（原四处逐字抄 `xian ? 4 : 2`）*/
  function treasureKindCls(kind) { return 't' + (kind === 'xian' ? 4 : 2); }
  /* 未获得行（B4：获取途径教学行 + 缺项红字；系统深化批 B4：情报角标 + 豁免提示行） */
  /* ══════════ Tab · 法与器（页面整合批 2026-10-06 · UI 卷 §3.4a；标签化批 2026-10-09 改顶部标签）══════════
   * 原「功法」「法器」两页并为一页（tab id 沿用 `arts`，导航 13 → **12** 项）。
   * 标签化批：并页后实测**单页太长**（功法段 = 6 槽 + 待修习架 + 图鉴横幅 + 融合坛，法器段 = 百器录
   * 横幅 + 4 槽 + 库藏阁，一屏放不下、看一半要滚到底再滚回来），故把「单页纵向五段」改成
   * **顶部 chip 二枚 + 只渲染选中段**：① chip 行（吸顶）② 概览条（跨轴摘要，两段之间恒在）
   * ③ 段标 ④ 段体。段体本身仍**逐段照搬**（元素与交互零删改）：`artsBody()`（原 renderArts 主体）
   * / `gearBody()`（原 renderGear），都是返回 HTML 串的纯渲染器（实测两者只做读侧计算，无落状态副作用）。
   * 红点键 `newArtsDot` 与签名 `lastArtsSig` 零改动——只换承载页，法器侧本无红点。
   * 🔧 第册八批（N34 第五刀）`artsBody` 及其四条动作外置 `view/arts.js` ‖ 第册十批（第六刀）`gearBody`
   * 与器段渲染族、百器录外置 `view/gear.js`，融合坛与悟道石并进 `view/arts.js`（就渲染在「法」段里）。
   * 下面那行因此两侧都按 `SQ.UI.arts.body(ctx())` / `SQ.UI.gear.body(ctx())` 调用；本页只剩页框三件
   * （chip 行 / 概览条 / 段标）在内核。 */
  function renderArts() {
    var c = lawChipOf();
    $('tab-arts').innerHTML =
      lawChipBar() +
      lawareBar() +
      (c === 'qi'
        ? secDiv('arts.seg.qi', 'arts.seg.qi.sub', 'qi') + SQ.UI.gear.body(ctx())
        : secDiv('arts.seg.fa', 'arts.seg.fa.sub', 'fa') + SQ.UI.arts.body(ctx()));
  }

  /* 顶部标签表（标签化批）：**词表零新键**——两枚 chip 复用既有系统名键 `skill.system`（功法）/
   * `gear.system`（法器）。这二键在 UI 卷 §3.4a 早已注明还兼着日志页分类标签，同词复用不破那处语义。
   * 容器类名 = `chips lawchips`：`chips` 取全局 chip 样式，`lawchips` 是**吸顶规则的专名挂点**
   * （段内融合坛那排 `.chips` 与本行同为 `#tab-arts` 直接子代，只靠 `>` 区不开——真机走查 N4 抓到）。 */
  var LAW_CHIPS = [{ id: 'fa', sys: 'skill.system' }, { id: 'qi', sys: 'gear.system' }];
  function lawChipOf() { return ui.lawChip === 'qi' ? 'qi' : 'fa'; }
  function lawChipBar() {
    var cur = lawChipOf();
    return '<div class="chips lawchips">' + LAW_CHIPS.map(function (c) {
      return '<button type="button" class="' + (cur === c.id ? 'on' : '') + '" data-act="lawChip" data-v="' +
        c.id + '">' + esc(t(c.sys)) + '</button>';
    }).join('') + '</div>';
  }
  /* 切标签 = 换渲染主体 + 滚动归零（等价于换页：留在原 scrollY 会把新段的**中间**当成开头）。
   * `ui.lawChip` 只在内存（与 `ui.logFilter` / `ui.artsGroup` 同纪律）——选看哪一段不是角色状态，
   * 写进存档等于给主档加一个与游玩时长相关的增长项（同「度量只活在内存」那条裁定）。
   * tick 侧 renderTab() 复用当前 chip ⇒ 每秒重渲染不会把用户选的标签抢回去。 */
  function lawChipTo(v) {
    ui.lawChip = v === 'qi' ? 'qi' : 'fa';
    renderArts();
    var b = document.querySelector('.tabbody');
    if (b) b.scrollTop = 0;
  }

  /* ① 概览条：主修 / 佩器 / 战力 三格，点格切到对应段（`lawJump` 在标签化批的语义见委托处）——
   * **合并页存在的理由**：进页一眼看到「法」「器」两条轴的当前态，切段时摘要不跟着滚走。 */
  function lawareBar() {
    var w = ws(), m = mods(), d = D(), p = pack();
    var mainId = SQ.Arts.mainArt(w);
    var mainTxt = mainId
      ? t('arts.ov.main.val', { name: t('skill.' + mainId + '.name'), lv: w.artsLevels[mainId] || 0 })
      : t('arts.ov.main.none');
    var slots = d.GEAR_SLOTS || [];
    var worn = 0, resSum = 0;
    slots.forEach(function (s) { if (w.gear[s]) { worn++; resSum += w.gear[s].resist || 0; } });
    return '<div class="laware">' +
      '<button type="button" data-act="lawJump" data-v="fa"><span class="k">' + esc(t('arts.ov.main')) +
        '</span><span class="v' + (mainId ? '' : ' none') + '">' + esc(mainTxt) + '</span></button>' +
      '<button type="button" data-act="lawJump" data-v="qi"><span class="k">' + esc(t('arts.ov.gear')) +
        '</span><span class="v">' + esc(t('arts.ov.gear.val',
          { n: worn, total: slots.length, r: SQ.fmt(resSum) })) + '</span></button>' +
      '<button type="button" data-act="lawJump" data-v="fa"><span class="k">' + esc(t('arts.ov.power')) +
        '</span><span class="v">' + esc(SQ.fmt(SQ.Mods.powerOf(w, p, d, m))) + '</span></button>' +
      '</div>';
  }

  /* ②④ 段标：单字大字 + 一句副标 + 锚点 id（概览条 lawJump 滚到这里） */
  function secDiv(nameKey, subKey, anchor) {
    return '<div class="secdiv" id="lawsec-' + anchor + '"><span class="zi">' + esc(t(nameKey)) +
      '</span><span class="sub">' + esc(t(subKey)) + '</span></div>';
  }





  /* ── Tab 4 法器（批 2 · B5：百器录横幅+浮层 / 4 槽来源行 / 独占替换 CONFIRM / 极品 ※）── */
  function statLine(it) {
    var parts = [];
    parts.push(t('gear.stat.atk') + ' ' + SQ.fmt(it.atk));
    if (it.qiBonus) parts.push(t('talent.field.qiRate') + ' +' + pct(it.qiBonus));
    if (it.resist) parts.push(t('gear.stat.resist') + ' ' + SQ.fmt(it.resist));
    if (it.attrValue) parts.push(t('attr.' + it.attrValue.attr) + ' +' + it.attrValue.value);
    return parts.join(' · ');
  }

  /* ── Tab · 法宝（灵宝 · 法宝全录）：法宝栏 3 槽 + 法宝库 + 祭炼/认主 + 造化 ──
   * 法宝独立于四槽法器：无 atk/resist、不入自动择优、不可炼化，只带一条签名效果。 */
  /* 法宝卡（卡片化批）：名号/品阶/品相 + 等级·签名效果 + 描述 + 缺项红字 + 祭出/收起/祭炼动作 */
  function treasureCard(w, p, d, e, mode) {
    var dd = SQ.Treasures.def(p, e.id);
    if (!dd) return '';
    var lv = SQ.Treasures.levelOf(e), max = SQ.Treasures.maxOf(p, dd);
    var eq = SQ.Treasures.isEquipped(w, e.id);
    var lacks = SQ.Treasures.lacksTexts(w, p, d, dd);
    var h = '<div class="tcard' + (eq ? ' rare' : '') + '">';
    h += '<div class="tname">' + esc(t('treasure.' + e.id + '.name')) +
      ' <span class="tierbadge ' + treasureKindCls(dd.kind) + '">' + esc(t('treasure.kind.' + dd.kind)) + '</span>' +
      ' <span class="align-sym">' + esc(t('treasure.grade.' + dd.grade)) + '</span>' +
      (eq ? ' <span class="special-mark">' + esc(t('treasure.equip')) + '</span>' : '') + '</div>';
    h += '<div class="teff">' + esc(t('treasure.lv.' + dd.kind, { n: lv, cap: max })) +
      ' · ' + esc(SQ.Treasures.fxText(w, p, dd, e)) + '</div>';
    h += '<div class="tdesc">' + esc(t('treasure.' + e.id + '.desc')) + '</div>';
    if (dd.kind === 'xian') {
      /* N52（第册十二批）：认主进度按件 ⇒ 这句只报「这件」的剩余，公式在引擎那一处（bondHoursLeft），视图不抄第二份 */
      var bondLeft = SQ.Treasures.bondHoursLeft(p, e);
      h += '<div class="tdesc">' + esc(t('treasure.bond.hint', { n: (p.treasures.BOND_COST || 3), h: (p.treasures.BOND_HOURS || 8) })) +
        (bondLeft > 0 ? ' · ' + esc(t('treasure.bond.left', { n: bondLeft })) : '') + '</div>';
    }
    if (!eq && lacks.length) h += '<div class="tdesc" style="color:var(--danger)">' + esc(lacks.join(' · ')) + '</div>';
    var acts = '';
    if (eq) {
      acts += '<button data-act="unequipTreasure" data-v="' + e.id + '">' + esc(t('treasure.unequip')) + '</button>';
    } else if (mode === 'bag') {
      acts += '<button class="primary" data-act="equipTreasure" data-v="' + e.id + '"' + (lacks.length ? ' disabled' : '') + '>' +
        esc(t('treasure.equip')) + '</button>';
    }
    if (mode === 'bag' && dd.kind === 'hou') {
      var cost = SQ.Treasures.refineCost(w, p, d, e.id);
      if (cost != null) {
        acts += '<button data-act="refineTreasure" data-v="' + e.id + '"' + (w.stones < cost ? ' disabled' : '') + '>' +
          esc(t('treasure.refine')) + ' ' + SQ.fmt(cost) + '</button>';
      } else {
        acts += '<span class="tdesc">' + esc(t('treasure.refine.max')) + '</span>';
      }
    }
    if (acts) h += '<div class="acts">' + acts + '</div>';
    return h + '</div>';
  }

  /* 法宝图鉴卡：未得（owned=false）者名号 / 品阶 / 效果 / 描述全部以问号遮蔽 */
  function treasureCodexCard(w, p, d, it) {
    var dd = it.def;
    var q = t('treasure.codex.mask'), qq = t('treasure.codex.unknown');
    var h = '<div class="tcard' + (it.owned ? '' : ' dim') + '">';
    if (!it.owned) {
      h += '<div class="tname">' + esc(qq) +
        ' <span class="tierbadge ' + treasureKindCls(dd.kind) + '">' + esc(q) + '</span>' +
        ' <span class="align-sym">' + esc(q) + '</span></div>';
      h += '<div class="teff">' + esc(q) + '</div>';
      h += '<div class="tdesc">' + esc(q) + '</div>';
      return h + '</div>';
    }
    h += '<div class="tname">' + esc(t('treasure.' + dd.id + '.name')) +
      ' <span class="tierbadge ' + treasureKindCls(dd.kind) + '">' + esc(t('treasure.kind.' + dd.kind)) + '</span>' +
      ' <span class="align-sym">' + esc(t('treasure.grade.' + dd.grade)) + '</span>' +
      (it.equipped ? ' <span class="special-mark">' + esc(t('treasure.equip')) + '</span>' : '') + '</div>';
    h += '<div class="teff">' + esc(t('treasure.lv.' + dd.kind, { n: it.level, cap: SQ.Treasures.maxOf(p, dd) })) +
      ' · ' + esc(SQ.Treasures.fxText(w, p, dd, it.entry)) + '</div>';
    h += '<div class="tdesc">' + esc(t('treasure.' + dd.id + '.desc')) + '</div>';
    return h + '</div>';
  }

  function renderTreasure() {
    var w = ws(), p = pack(), d = D();
    var ts = p.treasures;
    if (!ts) { $('tab-treasure').innerHTML = '<div class="lrow locked"><div class="meta">' + esc(t('treasure.empty')) + '</div></div>'; return; }
    var tr = w.treasures || { owned: [], slots: [null, null, null] };
    var slots = tr.slots || [];
    var eqN = slots.filter(function (x) { return !!x; }).length;
    var h = '';
    /* 法宝栏 */
    h += '<div class="sechead"><span class="t">' + esc(t('treasure.slots', { n: eqN, cap: ts.SLOTS })) +
      '</span><span class="s">' + esc(t('treasure.hint')) + '</span></div>';
    h += '<div class="cards trgrid">';
    for (var i = 0; i < ts.SLOTS; i++) {
      var id = slots[i];
      var e = id ? SQ.Treasures.entryOf(w, id) : null;
      if (!SQ.Treasures.slotUnlocked(w, p, i)) {
        h += '<div class="tcard dim"><div class="tslot">' + esc(t('treasure.slot.n', { n: i + 1 })) + '</div><div class="tdesc">' +
          esc(t('treasure.slot.locked', { realm: t('realm.' + ts.SLOT_UNLOCK[i]) })) + '</div></div>';
      } else if (!e) {
        h += '<div class="tcard dim"><div class="tslot">' + esc(t('treasure.slot.n', { n: i + 1 })) + '</div><div class="tdesc">' +
          esc(t('treasure.empty')) + '</div></div>';
      } else {
        h += treasureCard(w, p, d, e, 'slot');
      }
    }
    h += '</div>';
    /* 法宝库 */
    var owned = tr.owned || [];
    h += '<div class="sechead"><span class="t">' + esc(t('treasure.bag', { n: owned.length })) + '</span></div>';
    if (!owned.length) h += '<div class="lrow locked"><div class="meta">' + esc(t('treasure.bag.empty')) + '</div></div>';
    else h += '<div class="cards trgrid">' + owned.map(function (e) { return treasureCard(w, p, d, e, 'bag'); }).join('') + '</div>';
    /* 法宝图鉴：全录 30 件一览；未得者名号/品阶/效果/描述一律问号遮蔽 */
    var cx = SQ.Treasures.codex(w, p);
    var cxGot = cx.filter(function (x) { return x.owned; }).length;
    h += '<div class="sechead"><span class="t">' + esc(t('treasure.codex.title')) +
      '</span><span class="s">' + esc(t('treasure.codex.banner', { n: cxGot, total: cx.length })) + '</span></div>';
    h += '<p class="hint" style="margin:2px 0 6px">' + esc(t('treasure.codex.hint')) + '</p>';
    h += '<div class="cards trgrid">' + cx.map(function (it) { return treasureCodexCard(w, p, d, it); }).join('') + '</div>';
    /* 造化（X11 阴阳乾坤鼎，须祭出） */
    if (SQ.Treasures.isEquipped(w, 'x11')) {
      h += '<div class="sechead"><span class="t">' + esc(t('treasure.convert.title')) + '</span></div>';
      h += '<div class="lrow"><div class="meta hint">' + esc(t('treasure.x11.desc')) + '</div>' +
        '<div class="row" style="margin-top:6px"><input class="trconv" type="number" min="0" step="1000" value="0" ' +
        'placeholder="' + esc(t('treasure.convert.qi')) + '" style="flex:1;min-width:0">' +
        '<button data-act="treasureConvert">' + esc(t('treasure.convert.qi')) + '</button></div>' +
        '<div class="acts"><button data-act="treasurePill">' +
        esc(t('treasure.convert.pill', { n: SQ.fmt(ts.PILL_COST), cur: t('resource.currency') })) + '</button></div></div>';
    }
    h += renderSpiritPanel();
    $('tab-treasure').innerHTML = h;
  }
  $('mgc-close').addEventListener('click', function () { $('modal-gearcodex').classList.add('hide'); });

  /* 奇遇回看浮层（批 2 · 交互说明 ★）：story 全文 + 首遇时间 + 上次选择与结果。
   * 入口三处：图鉴已解锁格 / 法宝来源行（event）/ 百器录独占格载体事件。 */
  function openRecall(eventId) {
    var w = ws();
    var ev = findEvent(eventId);
    var ts = ev ? (w.eventHistory.seen || {})[eventId] : null;
    if (!ev || ts == null) return;                 /* 未遇不开——上游已做轻震反馈 */
    $('mrc-title').textContent = t('event.recall.title', { name: t('event.' + eventId + '.name') });
    $('mrc-story').textContent = t('event.' + eventId + '.story');
    $('mrc-first').textContent = t('event.recall.first', { d: fmtDate(ts), ago: timeAgo(ts) });
    var last = null;
    (w.eventHistory.feed || []).forEach(function (f) {
      if (f.id === eventId && (!last || (f.ts || 0) > (last.ts || 0))) last = f;
    });
    if (last) {
      var k = last.karma >= 0 ? t('event.karma.pos', { n: last.karma }) : t('event.karma.neg', { n: last.karma });
      var chk = last.hadCheck ? t('event.recall.check', { r: last.pass ? t('check.ok') : t('check.fail') }) : '';
      $('mrc-last').textContent = t('event.recall.last', { branch: t('event.' + eventId + '.branch.' + last.branch), karma: k }) + chk;
      $('mrc-eff').textContent = t('event.recall.eff', { txt: SQ.Events.effText(w, pack(), D(), last.eff || {}) });
      $('mrc-last').classList.remove('hide');
      $('mrc-eff').classList.remove('hide');
    } else {
      /* feed 上限 50 条被挤出：首遇时间仍在，抉择明细如实缺省（不编造） */
      $('mrc-last').classList.add('hide');
      $('mrc-eff').classList.add('hide');
    }
    $('mrc-close').textContent = t('ui.close');
    $('modal-recall').classList.remove('hide');
  }
  $('mrc-close').addEventListener('click', function () { $('modal-recall').classList.add('hide'); });

  /* ══ 批 3 · 侣柱 G14（B1~B4/B7~B9）══ */
  function bondTierNum(n) { return t('bond.tiernum.' + n); }
  function nextBondThreshold(tier) {
    var ts = D().BOND_TIERS;
    return tier >= ts.length ? (D().BOND_MAX || 100) : ts[tier];
  }
  function bondRedDotSig() {
    /* 侣 chip 红点（B1 · §2.2）：有人升档 或 候选可提亲——签名变化即亮，进浮层重置 */
    var w = ws(), p = pack(), d = D();
    var sig = [];
    SQ.Bonds.list(p).forEach(function (c) { sig.push(c.id + ':' + SQ.Bonds.tierOf(w, c.id, d)); });
    SQ.Bonds.list(p).forEach(function (c) {
      if (c.category === 'spouse' && SQ.Bonds.canPropose(w, p, d, c.id, Date.now()).ok) sig.push('p:' + c.id);
    });
    return sig.join(',');
  }
  function caveRedDotSig() {
    /* 地 chip 红点（B1 · §2.2 同侣 chip 口径）：新福地解锁——境界 / 首通 / 缘法门控达成。
     * 只取「与灵石 / 冷却 / 当前驻留无关」的资格项：灵石涨落不参与签名，避免红点反复闪烁
     * （与侣 chip 的「满档 / 升档」同为稳定阈值型信号）；进洞天节即消。 */
    var w = ws(), p = pack(), d = D();
    if (!w || !p) return '';   /* 未入世 / 世界包未载：无红点可言（switchTab 可能先于 profile 就绪） */
    var sig = [];
    SQ.Cave.list(p).forEach(function (c) {
      var lack = SQ.Cave.canEnter(w, p, d, c.id, Date.now()).lack.filter(function (x) {
        return x.kind !== 'stones' && x.kind !== 'cooldown' && x.kind !== 'same';
      });
      if (!lack.length) sig.push(c.id);
    });
    return sig.join(',');
  }
  function achvRedDotSig() {
    /* 成就页红点：meta.achv 跨世只增（Codex.scan 追加、不重排不清），故取「已录条数 + 最新一条 id」
     * 为签名——达成新成就即签名变化 → 红点亮；进成就页消账。
     * 与日志/奇遇的「最新条标识」同纪律（不靠数组长度单判，避免将来若发生裁剪时静默失效）。 */
    var meta = state.meta;
    var a = (meta && meta.achv) || [];
    return a.length ? (a.length + ':' + a[a.length - 1]) : '';
  }
  /* 个体助力当前值文案：channel 型各自单位（判定 pp / 冥佑描述），field 与其余走百分比 */
  function perkValueRaw(c, tier) {
    var pk = c.perk || {};
    var v = pk.perTier != null ? pk.perTier * tier : 0;
    if (pk.channel === 'checkPp') return '+' + (Math.round(v * 1000) / 10) + 'pp';
    if (pk.channel === 'shield') return t('bond.perk.shieldval');
    return (v < 0 ? '−' : '+') + pct(Math.abs(v));
  }
  function perkValueText(c, tier) {
    var pk = c.perk || {};
    if (pk.channel === 'shield') return t('bond.perk.shieldval');
    var vm = pk.perTier != null ? pk.perTier * maxBondTier() : 0;
    var maxTxt = pk.channel === 'checkPp' ? '+' + (Math.round(vm * 1000) / 10) + 'pp' : (vm < 0 ? '−' : '+') + pct(Math.abs(vm));
    return t('bond.perk.cur', { v: perkValueRaw(c, tier), n: bondTierNum(tier), max: maxTxt });
  }
  function palCell(c, w, d) {
    var p = pack();
    var tier = SQ.Bonds.tierOf(w, c.id, d);
    var aff = Math.max(0, SQ.Bonds.affinityOf(w, c.id));
    var g = SQ.Bonds.guardianOf(w, p, d);
    var isGuard = !!(g && g.npcId === c.id && g.bonus > 0);
    var isSpouse = !!(w.spouse && w.spouse.npcId === c.id);
    if (SQ.Bonds.locked(w, c.id)) {
      /* 缘尽格：身份永不揭示（稿一批注）——赎回成功才揭名，故 data-v 只作动作载荷不进可见文本。
       * 可赎者（未赎过 + 遗泽足）挂「赎」角标提示可点；不可赎者点按出原因 toast + 轻震。 */
      var costR = (d.BOND_REDEEM_COST != null ? d.BOND_REDEEM_COST : 30);
      var doneR = (w.redeemedIds || []).indexOf(c.id) >= 0;
      var canR = !doneR && ((state.meta && state.meta.karma) || 0) >= costR;
      return '<div class="pal dead" data-act="bondDead" data-v="' + c.id + '">' +
        (canR ? '<span class="pcorner rd">' + esc(t('bond.redeem.badge')) + '</span>' : '') +
        '<div class="ava">' + esc(t('bond.deadava')) + '</div>' +
        '<div class="nm">' + esc(t('event.codex.unknown')) + '</div>' +
        '<div class="deadtag">' + esc(t('bond.locked')) + '</div></div>';
    }
    /* 候选「双」角标无论结缘与否都挂（收集牵引：有一位可结道侣的人藏在？） */
    var corner = (c.category === 'spouse' ? '<span class="pcorner sh">' + esc(t('bond.badge.spouse')) + '</span>' : '') +
      (isGuard ? '<span class="pcorner um"' + (c.category === 'spouse' ? ' style="right:17px"' : '') + '>☂</span>' : '');
    if (tier < 1) {
      /* 势力批 v2.4 §6：负好感（−20~−2）= 厌恶——剪影格上加红字标签，与「未结缘」区分 */
      var rawAff = SQ.Bonds.affinityOf(w, c.id);
      var hateTag = (rawAff < 0 && !SQ.Bonds.locked(w, c.id))
        ? '<div class="tier hate">' + esc(t('bond.negative') + ' ' + rawAff) + '</div>'
        : '<div class="tier">' + esc(t('bond.unmet')) + '</div>';
      /* 未识格改为可点开（好感三渠道批）：此前只轻震、无任何出路，结识唯一途径是抽到出身事件；
       * 现点开进「隐匿详情」（renderBondUnknown，身份仍不揭示），内含渠道 A 拜访按钮 = 主动结识口。 */
      return '<div class="pal lock' + (c.category === 'spouse' ? ' sp' : '') + '" data-act="bondOpen" data-v="' + c.id + '">' + corner +
        '<div class="ava">' + esc(t('ui.qmark')) + '</div><div class="nm">' + esc(t('event.codex.unknown')) + '</div>' +
        hateTag + '</div>';
    }
    var canP = c.category === 'spouse' && SQ.Bonds.canPropose(w, p, d, c.id, Date.now()).ok;
    var tierTxt = t('bond.' + c.id + '.title.' + tier) + bondTierNum(tier) +
      (isSpouse && w.spouse.form === 'luding' ? ' · ' + t('bond.spouse.form.luding') : '') +
      (canP ? ' · ' + t('bond.propose.ready') : '');
    return '<div class="pal' + (c.category === 'spouse' ? ' sp' : '') + '" data-act="bondOpen" data-v="' + c.id + '">' + corner +
      '<div class="ava">' + esc(t('bond.' + c.id + '.ava')) + '</div>' +
      '<div class="nm">' + esc(t('bond.' + c.id + '.name')) + '</div>' +
      '<div class="tier"' + (isSpouse && w.spouse.form === 'luding' ? ' style="color:var(--bad)"' : '') + '>' + esc(tierTxt) + '</div>' +
      '<div class="pb"><i style="width:' + Math.min(100, aff) + '%;' + (isSpouse && w.spouse.form === 'luding' ? 'background:var(--bad)' : '') + '"></i></div>' +
      '<div class="fv">' + esc(tier >= maxBondTier() ? t('bond.fv.max', { n: aff }) : t('bond.fv.next', { n: aff, next: nextBondThreshold(tier) })) + '</div></div>';
  }
  /* 道友名录：浮层（openBonds）与「道友」页（势力批 v2.4 §9）共用同一套渲染；
   * dest = 'tab' 渲染进 #tab-bonds，缺省 = 浮层 #mbd-body。 */
  function renderBonds(dest) {
    /* dest = 「用户最后打开的是哪一个容器」，只由用户动作改写：`renderTab()` 的秒级 tick 也带 'tab'
     * 走进这里，若让它顺手改写 ui.bondsDest，**浮层开着时容器就被偷换成 'tab'** ⇒ 拜访 / 赠丹成功后
     * 重渲渲到背后的道友页上，屏上那颗按钮停在旧态（第十九批 · 用户报「点完还亮着，关掉重开才显冷却」）。
     * 浮层可见期间不夺。 */
    if (dest && (dest !== 'tab' || $('modal-bonds').classList.contains('hide'))) ui.bondsDest = dest;
    /* 容器由**本次调用的 dest** 决定，不由归属决定：否则 tick 带着 'tab' 进来时，
     * 归属被守住（仍 = 'modal'）却把名录渲进浮层里，等于把 bug 换了个方向（走查 A4 即此形）*/
    var isTab = (dest || ui.bondsDest) === 'tab';
    var w = ws(), p = pack(), d = D();
    var g = SQ.Bonds.guardianOf(w, p, d);
    var evil = p.worldSystems.tierOf(w) === 'evil';
    if (!isTab) {
      $('mbd-title').textContent = ui.bondDetail ? t('bond.detail.back') : t('bond.title');
      $('mbd-title').style.cursor = ui.bondDetail ? 'pointer' : '';
      $('mbd-close').textContent = t('ui.close');
    }
    /* 详情五段式只属于名录浮层（浮层走查修复）：道友页自身永远保持名录——
     * 否则秒级 tick 的 renderBonds('tab') 会因共享的 ui.bondDetail 把背后的道友页一并切成详情 */
    if (!isTab && ui.bondDetail) { renderBondDetail(); return; }
    var h = '';
    /* 护法位摘要行三态（稿一/稿四）：魔道整块置灰独行 / 生效带加项 / 档不足或无人。
     * 择选批：非魔道三态均可点开「择护法」浮层，由玩家自选在任护法 */
    if (evil) {
      h += '<div class="guardline dead"><span>' + esc(t('bond.guard.none')) + '</span><span class="g">' + esc(t('bond.guard.evil')) + '</span></div>';
    } else if (g && g.bonus > 0) {
      h += '<div class="guardline pickable" data-act="guardPickOpen"><span>' + esc(t('bond.guard.line', {
        name: t('bond.' + g.npcId + '.name'), title: t('bond.' + g.npcId + '.title.' + g.tier), num: bondTierNum(g.tier)
      })) + '</span><span class="g">' + esc(t('bond.guard.eff', { b: g.bonus.toFixed(2) })) + '</span></div>';
    } else if (g) {
      h += '<div class="guardline pickable" data-act="guardPickOpen"><span>' + esc(t('bond.guard.line', {
        name: t('bond.' + g.npcId + '.name'), title: t('bond.' + g.npcId + '.title.' + g.tier), num: bondTierNum(g.tier)
      })) + '</span><span class="g">' + esc(t('bond.guard.low')) + '</span></div>';
    } else {
      h += '<div class="guardline pickable" data-act="guardPickOpen"><span>' + esc(t('bond.guard.none')) + '</span><span class="g">' + esc(t('bond.guard.low')) + '</span></div>';
    }
    /* 双修状态行：未结缘虚线灰 / 生效 / 炉鼎暗红「回头即散」——择选批：两态均可点开「择道侣」浮层 */
    if (w.spouse) {
      var sf = w.spouse.form;
      h += '<div class="spouserow' + (sf === 'luding' ? ' luding' : '') + ' pickable" data-act="spousePickOpen"><span>' + esc(t('bond.spouse.active', {
        form: t('bond.spouse.form.' + sf), name: t('bond.' + w.spouse.npcId + '.name'),
        eff: t('bond.form.eff.' + sf).split(' · ')[0]
      })) + '</span>' + (sf === 'luding' ? '<span>' + esc(t('bond.spouse.luding.warn')) + '</span>' : '') + '</div>';
    } else {
      h += '<div class="spouserow none pickable" data-act="spousePickOpen"><span>' + esc(t('bond.spouse.none')) + '</span><span>' + esc(t('bond.spouse.nonetip')) + '</span></div>';
    }
    var friends = SQ.Bonds.list(p).filter(function (c) { return c.category !== 'spouse'; });
    var spouses = SQ.Bonds.list(p).filter(function (c) { return c.category === 'spouse'; });
    var fKnown = friends.filter(function (c) { return SQ.Bonds.tierOf(w, c.id, d) >= 1; }).length;
    var fDead = friends.filter(function (c) { return SQ.Bonds.locked(w, c.id); }).length;
    h += '<div class="sechead"><span class="t">' + esc(t('bond.sec.friend')) + ' · ' + friends.length + '</span><span class="s">' +
      esc(t(fDead ? 'bond.sec.countdead' : 'bond.sec.count', { n: fKnown, total: friends.length, d: fDead })) + '</span></div><div class="palgrid">';
    friends.forEach(function (c) { h += palCell(c, w, d); });
    h += '</div>';
    h += '<div class="sechead"><span class="t">' + esc(t('bond.sec.spouse')) + ' · ' + spouses.length + '</span><span class="s">' +
      esc(w.spouse ? t('bond.sec.spdoing', { n: 1 }) : t('bond.sec.sptip')) + '</span></div><div class="palgrid">';
    spouses.forEach(function (c) { h += palCell(c, w, d); });
    h += '</div>';
    if (isTab) $('tab-bonds').innerHTML = h;
    else $('mbd-body').innerHTML = h;
  }
  /* 格位详情五段式（B3 · 稿二）：头部 / 好感进度尺四档刻度 / 个体助力 / 小传正典 / 出身事件或结缘条件 */
  function renderBondDetail() {
    var w = ws(), p = pack(), d = D();
    var id = ui.bondDetail;
    var c = SQ.Bonds.byId(p, id);
    if (!c) { ui.bondDetail = null; renderBonds('modal'); return; }
    var tier = SQ.Bonds.tierOf(w, id, d);
    var rawAff = SQ.Bonds.affinityOf(w, id);
    var hate = rawAff < 0 && !SQ.Bonds.locked(w, id);
    var aff = Math.max(0, rawAff);
    var g = SQ.Bonds.guardianOf(w, p, d);
    var isGuard = !!(g && g.npcId === id && g.bonus > 0);
    var isSpouse = !!(w.spouse && w.spouse.npcId === id);
    var luOff = isSpouse && w.spouse.form === 'luding';
    /* 未识（含厌恶 −20~−2）→ 隐匿详情：身份不揭示（沿用名录格「？」口径），只给渠道 A 一条主动结识口。

  /* ── 好感三渠道批（2026-10-06 · 引擎卷 v1.11 §3.2a / UI 卷 §3.4c）──────────────────
   * 渠道 A 拜访论道 + 渠道 B 赠丹 的视图侧：两个纯拼接渲染器 + 三个只读取数助手。
   * 口径纪律：① 按钮上标出的增量 = **引擎会真给的数**（拜访按档位递减 + 同向加成；赠丹按丹方 tier
   * × 丹纹倍率，再对「距满档余量」取 min，绝不显示会被 clamp 吃掉的虚数）；② 未识者的「同道相投」
   * 角标**不显示**（阵营属身份信息，结识后才可见，与「？」剪影口径一致）；③ 双特例丹（破障 / 镇劫）
   * 不进赠丹列表——引擎侧同样拒（reason 'once'），两层同口径。 */
  function maxBondTier() { return D().BOND_TIERS.length; }
  function visitGainOf(id, tier) {
    var w = ws(), p = pack(), d = D();
    var tbl = d.BOND_VISIT_BY_TIER || [3, 3, 2, 1, 0];
    var base = tbl[Math.min(Math.max(0, tier), tbl.length - 1)] || 0;
    if (!(base > 0)) return { n: 0, align: false };
    /* 同向加成只对**已相识**生效（引擎同口径）：未识者阵营未揭，不给加成也不显示角标 */
    if (tier < 1) return { n: base, align: false };
    var c = SQ.Bonds.byId(p, id);
    var kd = (p.worldSystems && p.worldSystems.tierOf) ? p.worldSystems.tierOf(w) : 'neutral';
    var sameDir = !!(c && c.align && c.align === kd);
    return { n: base + (sameDir ? (d.BOND_VISIT_ALIGN_BONUS != null ? d.BOND_VISIT_ALIGN_BONUS : 1) : 0), align: sameDir };
  }
  function visitBtn(id, tier) {
    var w = ws(), d = D();
    if (SQ.Bonds.locked(w, id)) return '<div class="dd hint">' + esc(t('bond.fail.lock')) + '</div>';
    if (SQ.Bonds.scarred(w, id)) return '<div class="dd hint">' + esc(t('bond.fail.scar')) + '</div>';
    if (tier >= maxBondTier()) return '<div class="dd hint">' + esc(t('bond.visit.fail.max')) + '</div>';
    var g = visitGainOf(id, tier);
    var cd = d.BOND_VISIT_CD_MS;   /* 表值直取（审计 #10）：兜底字面量就是第二事实源；缺键由审计 A10 拦，视图不编数 */
    var wait = (w.bondVisitAt || 0) + cd - Date.now();
    if (wait > 0) {
      return '<button class="actbtn" type="button" disabled><span class="an">' + esc(t('bond.visit.btn')) +
        '</span><span class="cd">' + esc(t('bond.visit.cd', { t: timeLeftText(wait) })) + '</span></button>';
    }
    return '<button class="actbtn" type="button" data-act="bondVisit" data-v="' + id + '"><span class="an">' +
      esc(t('bond.visit.btn')) + '</span>' +
      (g.align ? '<span class="ab">' + esc(t('bond.visit.align')) + '</span>' : '') +
      (tier < 1 ? '<span class="mt">' + esc(t('bond.visit.met')) + '</span>' : '') +
      '<span class="gv">' + esc(t('bond.visit.gain', { n: g.n })) + '</span></button>';
  }
  /* 可赠丹药清单：库存 >0 且非双特例（once）；丹纹版（尾 _rw）单列一颗 */
  function giftablePills(w, d) {
    var al = w && w.alchemy, out = [];
    if (!al || !al.pills) return out;
    for (var k in al.pills) {
      if (!(al.pills[k] > 0)) continue;
      /* 两族合一（第十七批）：可赠与否只认引擎那一个判据（pillDefOf.nogift）——
       * 底牌族 = 自产破障 / 镇劫 / 洗髓 + 成品破障，视图不再自带一份名单（两份名单必然漂） */
      var pd = SQ.Alchemy.pillDefOf(D(), k);
      if (!pd || pd.nogift) continue;
      out.push({ key: k, n: al.pills[k], rune: pd.rune });
    }
    return out;
  }
  /* 赠丹名义增量：档次一律问引擎那一个判据 `SQ.Alchemy.pillDefOf`（两族合一 · 第十七批）。
   * 旧写法在这里**另摆了一份只查 RECIPES 的名单** ⇒ 成品丹（D.PILLS）查不到 tier ⇒ 增量 0 ⇒ 赠丹 chip
   * 被整颗跳过；引擎侧 bonds.js 用 pd.tier 是给的，#297(f) 因此全绿 —— 又是一处「引擎对、屏上错」。 */
  function pillGiftGain(d, key) {
    var pd = SQ.Alchemy.pillDefOf(d, key);
    if (!pd) return 0;
    var tierName = pd.tier || null;
    if (!tierName) (((d.ALCHEMY || {}).RECIPES) || []).forEach(function (r) {
      if (r && r.pill === pd.id && r.tier) tierName = r.tier;
    });
    var tbl = d.BOND_GIFT_BY_TIER || {};
    var n0 = tbl[tierName] != null ? tbl[tierName] : 0;
    return pd.rune ? Math.round(n0 * (d.BOND_GIFT_RUNE_MULT != null ? d.BOND_GIFT_RUNE_MULT : 1.5)) : n0;
  }
  /* 赠丹段（GitHub issue #4）：无日次上限，能送几颗只看丹匣库存 ⇒ 这里不再算「今日 n/cap」*/
  function bondActSection(id) {
    var w = ws(), d = D();
    var tier = SQ.Bonds.tierOf(w, id, d);
    var h = '<div class="dsec"><div class="dt">' + esc(t('bond.detail.act')) + '</div>' +
      '<div class="dd hint" style="margin-bottom:8px">' + esc(t('bond.act.tip')) + '</div>' + visitBtn(id, tier);
    h += '<div class="kv" style="margin-top:12px"><span class="hint">' +
      esc(t('bond.gift.head')) + '</span></div>';
    if (SQ.Bonds.locked(w, id) || SQ.Bonds.scarred(w, id)) return h + '</div>';
    if (tier >= maxBondTier()) return h + '<div class="dd hint">' + esc(t('bond.gift.fail.max')) + '</div></div>';
    var pills = giftablePills(w, d);
    if (!pills.length) return h + '<div class="dd hint">' + esc(t('bond.gift.empty')) + '</div></div>';
    var head = Math.max(0, (d.BOND_MAX || 100) - Math.max(0, SQ.Bonds.affinityOf(w, id)));
    var chips = '';
    pills.forEach(function (pl) {
      var g = Math.min(pillGiftGain(d, pl.key), head);
      if (!(g > 0)) return;
      chips += '<button type="button" data-act="bondGift" data-v="' + id + '" data-c="' + pl.key + '">' +
        esc(t((SQ.Alchemy.pillDefOf(d, pl.key) || {}).nameKey ||
          'alchemy.pill.' + pl.key + '.name')) +   /* 两族名各按本族键族（成品丹是 `pill.*`，M4）*/
        '<span class="gv">+' + g + '</span><span class="st">' + esc(t('bond.gift.stock', { n: pl.n })) + '</span></button>';
    });
    if (!chips) return h + '<div class="dd hint">' + esc(t('bond.gift.fail.max')) + '</div></div>';
    h += '<div class="chips">' + chips + '</div>';
    return h + '</div>';
  }
  /* 未识 / 厌恶者的隐匿详情：身份不揭示（「？」+ 未结缘或厌恶值），只给渠道 A 主动结识口 */
  function renderBondUnknown(id, rawAff) {

  /* 拒绝原因 → 文案：按 visit / gift / 共用三组前缀依次探键（SQ.t 缺键回传键名本身，据此判存在）*/
  function bondFailText(r) {

    if (why === 'cooldown') return t('bond.visit.fail.cooldown', { t: timeLeftText(Math.max(0, (r && r.waitMs) || 0)) });
    var ks = ['bond.visit.fail.' + why, 'bond.gift.fail.' + why, 'bond.fail.' + why];
    for (var i = 0; i < ks.length; i++) if (SQ.t(ks[i], null, wid()) !== ks[i]) return t(ks[i]);
    return t('bond.fail.unknown');
  }

  /* 冷却剩余时差文案（提亲冷却复用洞府时分秒口径） */
  function timeLeftText(ms) {
    if (!isFinite(ms)) ms = 0;                     /* 防脏字段：NaN/undefined 一律按 0 计，杜绝「NaN时NaN分」 */
    var s = Math.max(0, Math.floor(ms / 1000));
    var d = Math.floor(s / 86400), hh = Math.floor((s % 86400) / 3600);
    if (d > 0) return t('ui.time.d', { d: d, h: hh });
    if (hh > 0) return t('ui.time.hm', { h: hh, m: Math.floor((s % 3600) / 60) });
    /* 不足 1 小时 ⇒ 走「X 分钟」（UI 卷 §六 时间格式正典，离线呈报同口径）。
     * 2026-10-09 拜访冷却由 1h 改 5 分钟后，这条分支成了拜访按钮的**主路径**——旧实现在此显示
     * 「0时4分」，属代码与正典不符的一处（一直存在，只是过去 <1h 的窗口少、不显眼）。
     * 分钟**向上取整且至少 1**：最后 40 秒显示「1分钟」而不是「0分钟」，免得看着像已经结束。 */
    return t('ui.time.m', { m: Math.max(1, Math.ceil(s / 60)) });
  }

  /* 提亲 CONFIRM 三形态（B4 · 稿三）：当前档位描金、其余置灰全文可见、炉鼎代价红字三重明示 */
  var proposeTarget = null;
  function openPropose(npcId) {

        '<div class="fn"' + (f === 'luding' ? ' style="color:var(--bad)"' : '') + '>' + esc(t('bond.spouse.form.' + f)) +
        ' <span class="st">' + esc(t(cur ? 'bond.form.cur' : 'bond.form.off', { align: t('align.' + def.tier) })) + '</span></div>' +
        '<div class="cond">' + esc(t('bond.form.cond.' + f)) + '</div>' +
        '<div class="eff">' + esc(t('bond.form.eff.' + f)) + '</div>' +
        (f === 'luding' ? '<div class="cost">' + esc(t('bond.form.cost.luding')) + '</div>' : '') + '</div>';
    });
    $('mpr-forms').innerHTML = fh;
    $('mpr-no').textContent = t('bond.propose.no');
    $('mpr-ok').textContent = t('bond.propose.go', { form: t('bond.spouse.form.' + chk.form) });
    $('mpr-foot').textContent = t('bond.propose.foot');
    $('modal-propose').classList.remove('hide');
  }
  $('mpr-no').addEventListener('click', function () { $('modal-propose').classList.add('hide'); proposeTarget = null; });
  $('mpr-ok').addEventListener('click', async function () {
    var npcId = proposeTarget;
    $('modal-propose').classList.add('hide');
    proposeTarget = null;
    if (!npcId) return;
    var res = await SQ.Actions.proposeSpouse(state, npcId);
    if (res && res.ok) showSpouse(npcId, res.form);
    else if (res) toast(t('bond.propose.fail.' + (res.reason || 'unknown')));
    renderAll();
    if (!$('modal-bonds').classList.contains('hide')) renderBonds('modal');   /* 显式指明浮层容器（浮层走查修复） */
  });
  /* 结契轻演出（结缘词全屏 2s，点按跳过；文案写意留白红线——文本全在词表正典） */
  var spouseStageTimer = null;
  function showSpouse(npcId, form) {
    $('sps-t1').textContent = t('bond.show.title', { form: t('bond.spouse.form.' + form) });
    $('sps-t2').textContent = t('spouse.' + npcId + '.' + form);
    $('sps-t3').textContent = t('bond.show.skip');
    var st = $('spouse-stage');
    st.classList.remove('hide');
    clearTimeout(spouseStageTimer);
    spouseStageTimer = setTimeout(function () { st.classList.add('hide'); }, reducedMotion() ? 1200 : 2600);
  }
  $('spouse-stage').addEventListener('click', function () {
    clearTimeout(spouseStageTimer);
    $('spouse-stage').classList.add('hide');
  });
  /* 双修解除叙事（B4 · v1.4 口径4）：spouseLog.at 键控会话消费一次；炉鼎文案自带缘锁提示 */
  function checkSpouseLog() {
    var w = ws();
    if (!w || !w.spouseLog) return;
    var sl = w.spouseLog;
    if (ui.spouseLogSeen === sl.at) return;
    ui.spouseLogSeen = sl.at;
    toast(t('bond.spouse.dissolve.' + sl.reason, { name: t('bond.' + sl.npcId + '.name') }));
  }

  /* ── Tab 5 坊市 ── */
  /* 坊市那族标签 / 件名 / 计价 / 货架卡已随第册六批整段搬进 view/shop.js（`SQ.UI.shop.*`）；
     门中供给那一行仍回头调 pillAffix / pillCat —— 势力页外置时这层临时调用自然消失。 */

  /* ── 势力页（G16 · 势力批 v2.4 + 深化批 v1.23）：当前效力（职级/声望/捐献）+ 冲突横幅 + 委托 + 供给 + 16~20 张势力卡（固定池名门角标）── */
  function factionRelChips(w, f) {
    var chips = '';
    (w.factions || []).forEach(function (o) {
      if (o.id === f.id) return;
      var rel = f.rel[o.id] || 'neutral';
      if (rel === 'neutral' && !ui.facRelAll) return;   /* 默认只列友好/敌对，点「全部」展开 */
      chips += '<span class="relchip ' + rel + '">' + esc(o.name) +
        '<i>' + esc(t('faction.rel.' + rel)) + '</i></span>';
    });
    return chips;
  }
  function factionMembers(w, f) {
    var n = 0;
    for (var k in (w.factionNpcs || {})) if (w.factionNpcs[k] === f.id) n++;
    return n;
  }
  function renderFaction() {
    var w = ws(), d = D();
    var cur = SQ.Factions.current(w);
    var h = '';
    if (cur) {
      var rank = SQ.Factions.rankOf(w, d, cur.id);
      var rep = SQ.Factions.repOf(w, cur.id);
      var th = (d.FACTION_RANKS || {}).TH || [0];
      var nextTh = rank < th.length - 1 ? th[rank + 1] : null;
      var pk = SQ.Factions.perkOf(w, d) || cur.perk;
      h += '<div class="facbanner"><span class="ft">' + esc(t('faction.page.cur', { name: cur.name })) +
        '</span><span class="fg">' + esc(t('talent.field.' + cur.perk.field)) + ' +' +
        (cur.perk.field === 'tribBonus' ? pk.v.toFixed(2) : Math.round(pk.v * 100) + '%') +
        (rank > 0 ? esc(' · ' + t('faction.rank.perk', { m: ((d.FACTION_RANKS || {}).PERK_MULT || [1])[rank] })) : '') +
        '</span></div>';
      /* 职级贡献行（势力全录卷 §三） */
      h += '<div class="facbanner"><span class="ft">' + esc(nextTh != null
        ? t('faction.rank.cur', { rank: t('faction.rank.' + rank), rep: rep, next: nextTh })
        : t('faction.rank.max', { rank: t('faction.rank.' + rank), rep: rep })) + '</span>' +
        (rank > 0 ? '<span class="fg">' + esc(t('faction.rank.perk', { m: ((d.FACTION_RANKS || {}).PERK_MULT || [1])[rank] })) + '</span>' : '') +
        '</div>';
      /* ── 职级实权（势力全录卷 §八 · B4）：职位行双段式「职级：{称号} · 职位：{职位}」（§8.1 同名警示——
       * 称号是名分线、职位是实权线，禁止裸称职位名）+ 两枚技能按钮各带 CD 态 ── */
      var office = SQ.Factions.officeOf(w, d, cur.id);
      var offCfg = d.FACTION_OFFICE || {};
      var offCd = offCfg.CD_MS;
      var fo = w.factionOffice || { dispatchAt: 0, guardAt: 0 };
      var nowO = Date.now();
      var dispCd = Math.max(0, (fo.dispatchAt || 0) + offCd - nowO);
      var guardCd = Math.max(0, (fo.guardAt || 0) + offCd - nowO);
      h += '<div class="facbanner"><span class="ft">' + esc(t('faction.office.line', {
        txt: office
          ? t('faction.rank.' + rank) + ' · ' + t('faction.office.' + office)
          : t('faction.office.locked', { r: t('faction.rank.3'), office: t('faction.office.steward') })
      })) +
        '</span>' +
        (w.tribulation && w.tribulation.officeGuard
          ? '<span class="fg">' + esc(t('faction.office.guard.armed')) + '</span>' : '') + '</div>';
      if (office) {
        var dispCand = dispatchCandidates(w, d);
        var dispReady = dispCand.some(function (c) { return c.canPick; });
        h += '<div class="row" style="margin:6px 0 2px">';
        h += '<button style="flex:1" data-act="officePick"' + ((dispCd > 0 || !dispReady) ? ' disabled' : '') + '>' +
          esc(dispCd > 0 ? t('faction.office.dispatch.cd') : t('faction.office.dispatch')) + '</button>';
        if (office === 'elder') {
          h += '<button style="flex:1" class="' + (w.tribulation.officeGuard ? '' : 'primary') + '" data-act="officeGuard"' +
            (guardCd > 0 ? ' disabled' : '') + '>' +
            esc(guardCd > 0 ? t('faction.office.guard.cd') : t('faction.office.guard')) + '</button>';
        }
        h += '</div>';
        if (dispCd <= 0 && !dispReady) {
          h += '<p class="hint" style="margin:2px 0">' + esc(t('faction.office.dispatch.none')) + '</p>';
        }
        /* 调遣选择列表（§8.9）：头像位名称 + perk 预览 + 好感档；channel 型/炉鼎置灰注明 */
        if (ui.officePick) {
          h += '<div class="detailbox"><div class="kv"><span>' + esc(t('faction.office.dispatch.pick')) + '</span>' +
            '<button class="linkbtn" data-act="officePickCancel">' + esc(t('ui.cancel')) + '</button></div>';
          dispCand.forEach(function (c) {
            var nm = t('bond.' + c.id + '.name');
            var perkTxt = c.pk.field
              ? t('talent.field.' + c.pk.field) + ' ' + (c.pk.perTier > 0 ? '+' : '') + (Math.round(c.pk.perTier * c.tier * 1000) / 10) + '%'
              : t('faction.office.dispatch.chan');
            h += '<div class="kv"><span>' + esc(nm) + (c.tier >= 1 ? ' ' + bondTierNum(c.tier) : '') +
              ' <span class="hint">' + esc(perkTxt) + '</span></span>' +
              '<button data-act="officeDispatch" data-v="' + c.id + '"' + (c.canPick ? '' : ' disabled') + '>' +
              esc(t('faction.office.dispatch')) + '</button></div>';
            if (!c.canPick && c.reason) {
              h += '<div class="hint" style="margin:-4px 0 4px">' + esc(t(c.reason)) + '</div>';
            }
          });
          h += '</div>';
        }
      }
      /* 叛离入口（2026-10-05 可见性修复）：原入口只在势力卡底部——当前势力所在栏在页面深处
       * （魔道栏卡片位于 2500px 长页的 1100px 处），需长滚才见，玩家反馈「没看到叛离选项」。
       * 现提到「当前效力」区块独立一行（去向选择浮层紧随其下展开），与卡片内入口并存同触发。
       * 宗主锁定态沿用卡片口径（宗门不可弃，传位方可下山）。 */
      if (w.factionId === 'sect' && w.sect && !w.sect.succession) {
        h += '<div class="row" style="margin:8px 0 2px"><button style="flex:1" disabled>' +
          esc(t('sect.ui.leave.lock')) + '</button></div>';
      } else {
        h += '<div class="row" style="margin:8px 0 2px"><button class="danger" style="flex:1" data-act="leaveFaction">' +
          esc(t('faction.leave')) + '</button></div>';
      }
      /* 叛离去向选择（势力全录卷 §九 · B4 两级弹窗第一级）：敌对红标「叛投」+ 三行代价预览入口 */
      if (ui.leavePick) {
        h += '<div class="detailbox"><div class="kv"><span>' + esc(t('faction.defect.title')) + '</span>' +
          '<button class="linkbtn" data-act="leavePick">' + esc(t('ui.cancel')) + '</button></div>';
        h += '<div class="kv"><span>' + esc(t('faction.leave')) + '</span>' +
          '<button data-act="leavePlain">' + esc(t('faction.leave')) + '</button></div>';
        (w.factions || []).forEach(function (f) {
          if (f.id === cur.id) return;
          var relD = SQ.Factions.relationOf(w, cur.id, f.id);
          var enemyD = relD === 'enemy';
          h += '<div class="kv"><span>' + esc(f.name) +
            (enemyD ? ' <span class="tierbadge tboss">' + esc(t('faction.defect.enemytag')) + '</span>' : '') + '</span>' +
            '<button class="' + (enemyD ? 'primary' : '') + '" data-act="defectGo" data-v="' + f.id + '"' +
            (enemyD ? '' : ' disabled') + '>' + esc(t(enemyD ? 'faction.defect.title' : 'faction.cd.wait')) + '</button></div>';
        });
        h += '</div>';
      }
      /* 捐献三档（每 2h 窗口上限提示） */
      var don = w.factionDonate || { at: 0, used: 0 };
      var capD = (d.FACTION_DONATE || {}).WINDOW_CAP || 300;
      var inWin = Date.now() - (don.at || 0) <= ((d.FACTION_DONATE || {}).WINDOW_MS);
      var capLeft = inWin ? Math.max(0, capD - (don.used || 0)) : capD;
      h += '<div class="row" style="margin:6px 0 2px">';
      ((d.FACTION_DONATE || {}).TIERS || []).forEach(function (amt) {
        var repW = Math.min(Math.floor(amt / ((d.FACTION_DONATE || {}).STONES_PER_REP)), capLeft);
        var canPay = w.stones >= Math.min(amt, repW * ((d.FACTION_DONATE || {}).STONES_PER_REP));
        h += '<button style="flex:1" data-act="facDonate" data-v="' + amt + '"' +
          ((capLeft > 0 && canPay) ? '' : ' disabled') + '>' +
          esc(t('faction.donate.btn', { n: SQ.fmt(amt), rep: repW })) + '</button>';
      });
      h += '</div>';
      h += '<p class="hint" style="margin:2px 0">' + esc(t('faction.donate.hint', { cap: capD })) + '</p>';
      if (capLeft <= 0) h += '<p class="hint" style="margin:2px 0">' + esc(t('faction.donate.cap')) + '</p>';
    } else {
      h += '<div class="facbanner none"><span class="ft">' + esc(t('faction.page.none')) + '</span></div>';
    }
    /* 势力冲突横幅（势力全录卷 §七 战功制 · B4）：交战方 → 应战（无判定入场）；
     * 入场后 → 战功进度条（实时读记账，不可重复点击）+ 闭关不产战功提示；第三方 → 观望 */
    var war = w.factionWar;
    if (war && war.until > Date.now()) {
      var mySide = SQ.Factions.warSideOf(w);
      var meritNeed = SQ.Factions.meritNeedOf(w, d);
      h += '<div class="facbanner" style="border-color:var(--bad)"><span class="ft">' +
        esc(t('faction.war.banner', {
          a: SQ.Factions.nameOf(w, war.aId), b: SQ.Factions.nameOf(w, war.bId),
          t: fmtLeft(war.until - Date.now())
        })) + '</span>' +
        (war.joined === 'in'
          ? '<span class="fg">' + esc(t('faction.war.merit.prog', { m: war.merit || 0, n: meritNeed })) + '</span>'
          : (mySide
            ? '<button class="primary" data-act="warJoin">' + esc(t('faction.war.join')) + '</button>'
            : '<span class="fg hint">' + esc(t('faction.war.watch')) + '</span>')) + '</div>';
      if (war.joined === 'in') {
        h += '<div class="bar slim"><i style="width:' +
          Math.min(100, ((war.merit || 0) / Math.max(1, meritNeed)) * 100).toFixed(1) + '%"></i></div>';
        if ((w.mode || 'seclude') === 'seclude') {
          h += '<p class="hint" style="margin:2px 0">' + esc(t('faction.war.merit.seclude')) + '</p>';
        }
      }
    }
    /* 冲突结果卡残留期（§7.4）：结算已出的 warResult 传闻卡在传闻栏展示，此处不重复 */
    /* 门中委托（势力全录卷 §四）——第卅九批改形：单槽 → **板面最多 3 张不同类型**
     * （`w.factionQuests` 数组，交付按 type 寻址；补单仍吃 factionQuestCd 30 分钟闸）。 */
    if (cur) {
      h += '<p class="hint" style="margin:10px 0 2px;font-weight:650">' + esc(t('faction.quest.title')) + '</p>';
      var qlist = (w.factionQuests || []).filter(function (q) { return q && q.expireAt > Date.now(); });
      if (qlist.length) {
        qlist.forEach(function (q) {
          var pr = SQ.Factions.questProgress(w, pack(), d, q);
          h += '<div class="faccard cur"><div class="fh"><span class="fn">' +
            esc(t('faction.quest.' + q.type, { n: SQ.fmt(q.target) })) + '</span>' +
            '<span class="fm">' + esc(t('faction.quest.left', { t: fmtLeft(q.expireAt - Date.now()) })) + '</span></div>' +
            '<div class="fperk">' + esc(t('faction.quest.prog', { cur: SQ.fmt(pr.cur), target: SQ.fmt(pr.target) })) +
            ' · ' + esc(t('faction.quest.reward', { rep: q.rep, stones: q.stones ? ' + ' + SQ.fmt(q.stones) + ' ' + t('resource.currency') : '' })) + '</div>' +
            '<div class="acts"><button class="' + (pr.done ? 'primary' : '') + '" data-act="questClaim" data-v="' + esc(q.type) + '"' +
            (pr.done ? '' : ' disabled') + '>' + esc(t('faction.quest.claim')) + '</button></div></div>';
        });
      } else {
        h += '<p class="hint" style="padding:6px 0">' + esc(t('faction.quest.none')) + '</p>';
      }
      /* 门中供给（势力全录卷 §六） */
      h += '<p class="hint" style="margin:10px 0 2px;font-weight:650">' + esc(t('faction.supply.title')) + '</p>';
      var rankC = SQ.Factions.rankOf(w, d, cur.id);
      var repC = SQ.Factions.repOf(w, cur.id);
      h += '<div class="cardgrid">';
      var mSup = mods();   /* 一次取全乘区，供下面四个 SKU 的供给价共用（审计 #6：别在循环里逐件重算 Mods.collect） */
      (d.FACTION_SUPPLY || []).forEach(function (si) {
        var pill = null;
        (d.PILLS || []).forEach(function (p2) { if (p2.id === si.pill) pill = p2; });
        if (!pill) return;
        var costS = SQ.Shop.supplyPriceOf(pill, w, d, mSup);   /* 与引擎 buySupply 同一个取数口（审计 #8） */
        var onCd = Date.now() - ((w.factionSupply || {})[si.sku] || 0) < (d.FACTION_SUPPLY_CD_MS);
        var lockRank = rankC < si.rank, lockRep = repC < si.rep, lockSt = w.stones < costS;
        var btnTxt = onCd ? t('faction.supply.cd') : lockRank ? t('faction.supply.locked', { rank: t('faction.rank.' + si.rank) })
          : t('faction.supply.cost', { rep: si.rep, n: SQ.fmt(costS) });
        /* 与坊市货架同一对标签（`pillAffix` / `pillCat`）——这四颗丹就是 `D.PILLS`，两处口径必须一致 */
        h += '<div class="faccard carditem"><div class="fh"><span class="fn">' + esc(t('faction.supply.sku.' + si.sku)) + '</span>' + SQ.UI.shop.pillAffix(ctx(), pill) + SQ.UI.shop.pillCat(ctx()) + '</div>' +
          '<div class="fd">' + esc(t('pill.' + si.pill + '.desc')) + '</div>' +
          '<div class="acts"><button data-act="supplyBuy" data-v="' + si.sku + '"' +
          ((onCd || lockRank || lockRep || lockSt) ? ' disabled' : '') + '>' + esc(btnTxt) + '</button></div></div>';
      });
      h += '</div>';
    }
    if ((w.factionCdUntil || 0) > Date.now()) {
      h += '<p class="hint">' + esc(t('faction.cd', { t: fmtGameDur(Math.max(0, w.factionCdUntil - Date.now())) })) + '</p>';
    }
    h += '<p class="hint" style="margin:6px 0 2px">' + esc(t('faction.page.hint')) + '</p>';
    /* 走查 v2.5 §1：三栏布局（正道 | 左道 | 魔道），势力各归其位；名称后不再缀阵营字 */
    var toggle = '<button class="linkbtn" data-act="facRelAll">' +
      esc(t(ui.facRelAll ? 'event.feed.less' : 'arts.group.all')) + '</button>';
    h += '<div class="sechead"><span class="t">' + esc(t('faction.system')) + ' · ' + (w.factions || []).length + '</span>' + toggle + '</div>';
    var colAligns = ['right', 'neutral', 'evil'];

      h += '<div class="faccol"><div class="faccolhead kb ' + al + '">' + esc(t('align.' + al)) +
        ' · ' + list.length + '</div>';
      list.forEach(function (f) { h += factionCard(w, f, cur); });
      h += '</div>';
    });
    h += '</div>';
    $('tab-faction').innerHTML = h;
  }

  /* 势力卡（走查 v2.5 §1 抽出 + 深化批 v1.23）：名称不带阵营字——阵营由所在栏表达；
   * 固定势力挂「名门」角标；当前效力卡显示职级放大后的 perk 实效 */
  function factionCard(w, f, cur) {
    var isCur = cur && cur.id === f.id;
    var perkV = f.perk.v;
    if (isCur) {
      var pkC = SQ.Factions.perkOf(w, D());
      if (pkC) perkV = pkC.v;
    }
    var perkTxt = t('talent.field.' + f.perk.field) + ' +' +
      (f.perk.field === 'tribBonus' ? perkV.toFixed(2) : Math.round(perkV * 100) + '%');
    var cdLeft = (w.factionCdUntil || 0) > Date.now();
    var rankC = isCur ? SQ.Factions.rankOf(w, D(), f.id) : -1;
    /* 江湖名录取数（第卌七批）：固定势力在卡上写清「掌门 / 太上」是谁——名录认不出就不写这一行，
     * 视图不编名字（同第卌四批「不编一个假境界出来」那条纪律）；行样式复用 `.fd`，不新增 CSS。 */
    var mst = f.fixed && SQ.Jianghu ? SQ.Jianghu.masterOf(pack(), f.id) : null;
    var eld = f.fixed && SQ.Jianghu ? SQ.Jianghu.elderOf(pack(), f.id) : null;
    var mstLine = (mst && eld) ? '<div class="fd">' + esc(t('faction.master.line', {
      name: mst.nm, realm: t('realm.' + mst.rlm), elder: eld.nm })) + '</div>' : '';
    var c = '<div class="faccard' + (isCur ? ' cur' : '') + '">' +
      '<div class="fh"><span class="fn">' + esc(f.name) +
      (f.fixed ? '<span class="tierbadge t1">' + esc(t('faction.fixed.tag')) + '</span>' : '') +
      (isCur ? '<span class="tierbadge t1">' + esc(t('faction.joined')) + '</span>' : '') +
      (isCur && rankC > 0 ? '<span class="tierbadge t2">' + esc(t('faction.rank.' + rankC)) + '</span>' : '') +
      '</span>' +
      '<span class="fm">' + esc(t('faction.members', { n: factionMembers(w, f) })) + '</span></div>' +
      '<div class="fd">' + esc(t(f.desc)) + '</div>' + mstLine +
      '<div class="fperk">' + esc(t('faction.perk')) + ' · <b>' + esc(perkTxt) + '</b></div>' +
