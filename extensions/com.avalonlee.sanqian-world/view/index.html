  /* ══════════ Tab · 法与器（页面整合批 2026-10-06 · UI 卷 §3.4a；标签化批 2026-10-09 改顶部标签）══════════
   * 原「功法」「法器」两页并为一页（tab id 沿用 `arts`，导航 13 → **12** 项）。
   * 标签化批：并页后实测**单页太长**（功法段 = 6 槽 + 待修习架 + 图鉴横幅 + 融合坛，法器段 = 百器录
   * 横幅 + 4 槽 + 库藏阁，一屏放不下、看一半要滚到底再滚回来），故把「单页纵向五段」改成
   * **顶部 chip 二枚 + 只渲染选中段**：① chip 行（吸顶）② 概览条（跨轴摘要，两段之间恒在）
   * ③ 段标 ④ 段体。段体本身仍**逐段照搬**（元素与交互零删改）：`artsBody()`（原 renderArts 主体）
   * / `gearBody()`（原 renderGear），都是返回 HTML 串的纯渲染器（实测两者只做读侧计算，无落状态副作用）。
   * 红点键 `newArtsDot` 与签名 `lastArtsSig` 零改动——只换承载页，法器侧本无红点。 */
  function renderArts() {
    var c = lawChipOf();
    $('tab-arts').innerHTML =
      lawChipBar() +
      lawareBar() +
      (c === 'qi'
        ? secDiv('arts.seg.qi', 'arts.seg.qi.sub', 'qi') + gearBody()
        : secDiv('arts.seg.fa', 'arts.seg.fa.sub', 'fa') + artsBody());
  }

  /* 顶部标签表（标签化批）：**词表零新键**——两枚 chip 复用既有系统名键 `skill.system`（功法）/
   * `gear.system`（法器）。这二键在 UI 卷 §3.4a 早已注明还兼着日志页分类标签，同词复用不破那处语义。
   * 容器类名 = `chips lawchips`：`chips` 取全局 chip 样式，`lawchips` 是**吸顶规则的专名挂点**
   * （段内融合坛那排 `.chips` 与本行同为 `#tab-arts` 直接子代，只靠 `>` 区不开——真机走查 N4 抓到）。 */
  var LAW_CHIPS = [{ id: 'fa', sys: 'skill.system' }, { id: 'qi', sys: 'gear.system' }];
  function lawChipOf() { return ui.lawChip === 'qi' ? 'qi' : 'fa'; }
  function lawChipBar() {
    var cur = lawChipOf();
    return '<div class="chips lawchips">' + LAW_CHIPS.map(function (c) {
      return '<button type="button" class="' + (cur === c.id ? 'on' : '') + '" data-act="lawChip" data-v="' +
        c.id + '">' + esc(t(c.sys)) + '</button>';
    }).join('') + '</div>';
  }
  /* 切标签 = 换渲染主体 + 滚动归零（等价于换页：留在原 scrollY 会把新段的**中间**当成开头）。
   * `ui.lawChip` 只在内存（与 `ui.logFilter` / `ui.artsGroup` 同纪律）——选看哪一段不是角色状态，
   * 写进存档等于给主档加一个与游玩时长相关的增长项（同「度量只活在内存」那条裁定）。
   * tick 侧 renderTab() 复用当前 chip ⇒ 每秒重渲染不会把用户选的标签抢回去。 */
  function lawChipTo(v) {
    ui.lawChip = v === 'qi' ? 'qi' : 'fa';

    var b = document.querySelector('.tabbody');
    if (b) b.scrollTop = 0;
  }

  /* ① 概览条：主修 / 佩器 / 战力 三格，点格切到对应段（`lawJump` 在标签化批的语义见委托处）——
   * **合并页存在的理由**：进页一眼看到「法」「器」两条轴的当前态，切段时摘要不跟着滚走。 */
  function lawareBar() {
    var w = ws(), m = mods(), d = D(), p = pack();
    var mainId = SQ.Arts.mainArt(w);
    var mainTxt = mainId
      ? t('arts.ov.main.val', { name: t('skill.' + mainId + '.name'), lv: w.artsLevels[mainId] || 0 })
      : t('arts.ov.main.none');
    var slots = d.GEAR_SLOTS || [];
    var worn = 0, resSum = 0;
    slots.forEach(function (s) { if (w.gear[s]) { worn++; resSum += w.gear[s].resist || 0; } });
    return '<div class="laware">' +
      '<button type="button" data-act="lawJump" data-v="fa"><span class="k">' + esc(t('arts.ov.main')) +
        '</span><span class="v' + (mainId ? '' : ' none') + '">' + esc(mainTxt) + '</span></button>' +
      '<button type="button" data-act="lawJump" data-v="qi"><span class="k">' + esc(t('arts.ov.gear')) +
        '</span><span class="v">' + esc(t('arts.ov.gear.val',
          { n: worn, total: slots.length, r: SQ.fmt(resSum) })) + '</span></button>' +
      '<button type="button" data-act="lawJump" data-v="fa"><span class="k">' + esc(t('arts.ov.power')) +
        '</span><span class="v">' + esc(SQ.fmt(SQ.Mods.powerOf(w, p, d, m))) + '</span></button>' +
      '</div>';
  }

  /* ②④ 段标：单字大字 + 一句副标 + 锚点 id（概览条 lawJump 滚到这里） */
  function secDiv(nameKey, subKey, anchor) {
    return '<div class="secdiv" id="lawsec-' + anchor + '"><span class="zi">' + esc(t(nameKey)) +
      '</span><span class="sub">' + esc(t(subKey)) + '</span></div>';
  }

  /* ③ 功法段（原 renderArts 主体逐段照搬：待重修横幅 / 槽位抉择横幅 / 修习槽 6 格 /
   * 自行领悟 / 已学会 / 品阶×阵营分组切换 / 功法图鉴 / 融合坛） */
  function artsBody() {
    var w = ws(), m = mods(), d = D(), p = pack();
    var am = p.artsMap();
    /* 「待重修」金标：纯等级制——已装备功法等级为 0 即挂标，修习练回（非 0）即摘标（纯视觉，不动数值）。
     * 顶部横幅仍是渡劫成功后的 24h 预期管理（lastSuccessTs 上界兜底），与金标解耦。 */
    var lsTs = (w.tribulation && w.tribulation.lastSuccessTs) || 0;
    var inReset = lsTs > 0 && (Date.now() - lsTs < 86400000);
    var pendingReset = function (id) { return !!id && (w.artsLevels[id] || 0) === 0; };
    var anyPending = inReset && w.artsSlots.some(pendingReset);
    var h = '';
    if (anyPending) h += '<div class="resetbanner">' + esc(t('ui.arts.reset_hint')) + '</div>';
    /* 满槽抉择态横幅（批 2·B4）：正典文案 + 取消；**原位替换入口渲染在下方每个槽卡内**
     * （`slotReplace` + `data-r`）——此处只留提示不留按钮，是因为「替换哪一格」必须由玩家逐格点定。 */
    if (ui.slotPickFor) {
      h += '<div class="resetbanner">' + esc(t('arts.slotpick.title', { name: t('skill.' + ui.slotPickFor + '.name') })) +
        ' <button class="linkbtn" data-act="slotPickCancel">' + esc(t('ui.cancel')) + '</button></div>';
    }
    h += '<div class="kv"><span>' + esc(t('arts.slots', { n: w.artsSlots.length, cap: d.ARTS_SLOTS })) + ' · ' +
      esc(t('arts.shelf', { n: (w.shelf || []).length, cap: d.SHELF_CAP })) + '</span></div>';
    h += '<p class="hint" style="margin:0 0 8px">' + esc(t('arts.practice.hint')) + '</p>';
    h += '<div class="cards" style="grid-template-columns:repeat(3,1fr)">';
    for (var i = 0; i < d.ARTS_SLOTS; i++) {
      var id = w.artsSlots[i];
      /* 主修 = 修习槽第 1 位（B4 · 引擎卷 §4.2）：角标 + 定位锚（法柱 chip 滚动到此） */
      /* 槽序即语义：第 1 位 = 主修（引擎卷 §4.2）。data-slot = 槽序号，供替换态定位与走查取数。 */
      var isMain = (i === 0 && id && SQ.Arts.mainArt(w) === id);
      if (id) {
        var a = am[id];
        var lvS = w.artsLevels[id] || 0;
        var prS = SQ.Arts.practiceOf(w, id, d);
        h += '<div class="tcard ' + (a.alignment === 'evil' ? 'neg' : a.alignment === 'right' ? 'pos' : '') + '"' +
             (isMain ? ' data-mainart="1"' : '') + ' data-slot="' + i + '">' +
             (isMain ? '<span class="corner maincorner">' + esc(t('arts.main')) + '</span>' : '') +
             '<div class="tname">' + esc(t('skill.' + id + '.name')) + '</div>' +
             '<div class="teff">Lv' + lvS +
               (pendingReset(id) ? ' <span class="goldmark">' + esc(t('arts.reset')) + '</span>' : '') + '</div>' +
             '<div class="tdesc">' + esc(t('special.' + a.special.pool + '.name')) + '</div>' +
             /* 精通迷你条（修行状态批）：主修（第 1 位）增速最高 */
             '<div class="tpract"><span class="pbar"><i style="width:' +
               (lvS >= d.ARTS_MAX_LV ? 100 : prS).toFixed(0) + '%"></i></span><span class="hint">' +
               esc(lvS >= d.ARTS_MAX_LV ? t('arts.max') : t('arts.practice', { p: Math.floor(prS) })) + '</span></div>' +
             /* 满槽「原位替换」（批 2·B4 引擎支路 + 本批补渲染点）：抉择态下每格挂「替换」——
              * data-v = 待入槽功法、data-r = 被顶下的在槽功法，handler 走 Arts.slot 的 replaceId 分支。
              * 缺这一段 = 整条替换链不可达（引擎 + handler + 文案三件齐全、只无渲染点）：玩家只能
              * 「卸下再装」，新功法落到队列**尾部**，「主修 = 修习槽第 1 位」（引擎卷 §4.2）语义被静默改掉。 */
             (ui.slotPickFor ? '<div class="tacts-src"><button data-act="slotReplace" data-v="' +
               esc(ui.slotPickFor) + '" data-r="' + esc(id) + '">' + esc(t('arts.slotpick.replace')) +
               '</button></div>' : '') +
             '</div>';
      } else {
        h += '<div class="tcard"' + (i === 0 ? ' data-mainart="1"' : '') + '><div class="tdesc" style="text-align:center;padding:14px 0">' +
             (i === 0 ? esc(t('arts.main.empty')) : esc(t('arts.empty'))) + '</div></div>';
      }
    }
    h += '</div>';
    /* ── 自行领悟（自悟批 · 需求 §2）：在线修持中随机领悟市面传承功法，进度满（保底）必得一部 ── */
    (function () {
      var pct = SQ.Arts.selfLearnPct(w, d);
      var cands = SQ.Arts.selfLearnCands(w, p, d).length;
      h += '<div class="sechead"><span class="t">' + esc(t('arts.selflearn.sec')) + '</span>' +
           '<span class="s">' + esc(t('arts.selflearn.cands', { n: cands })) + '</span></div>';
      h += '<div class="tcard selflearn">' +
           '<div class="tpract"><span class="pbar"><i style="width:' + pct.toFixed(0) + '%"></i></span>' +
           '<span class="hint">' + esc(t('arts.selflearn.pct', { p: pct.toFixed(0) })) + '</span></div>' +
           '<div class="hint">' + esc(t(cands ? 'arts.selflearn.hint' : 'arts.selflearn.none')) + '</div>' +
           '</div>';
    })();
    /* ── 已学会（走查 v2.5 §4）：紧贴修习槽——装入/升级/精通一屏可达 ── */
    var knownS = (w.artsKnown || []).slice().sort(function (x, y) {
      return ((w.artsSlots || []).indexOf(y) >= 0 ? 1 : 0) - ((w.artsSlots || []).indexOf(x) >= 0 ? 1 : 0);
    });
    h += '<div class="sechead"><span class="t">' + esc(t('arts.sec.known')) +
      ' · ' + knownS.length + '</span></div>';
    if (!knownS.length) h += '<div class="lrow locked"><div class="meta">' + esc(t('arts.known.empty')) + '</div></div>';
    /* 走查 v2.6 §2：卡片化——同行卡片数随窗口宽度自适应（auto-fill） */
    h += '<div class="cards artgrid">' + knownS.map(function (x) { return artCard(x, w, m); }).join('') + '</div>';
    /* ── 功法图鉴（走查 v2.5 §4 + v2.8 §1：待修习架功法回归各品阶/阵营小节，弃置在卡内）── */
    var grp = ui.artsGroup;
    h += '<div class="grouper"><span class="gseg">' +
      '<span class="' + (grp === 'tier' ? 'on' : '') + '" data-act="artsGroup" data-v="tier">' + esc(t('arts.group.tier')) + '</span>' +
      '<span class="' + (grp === 'align' ? 'on' : '') + '" data-act="artsGroup" data-v="align">' + esc(t('arts.group.align')) + '</span></span>';
    (grp === 'tier' ? ['huang', 'xuan', 'di', 'tian'] : ['right', 'neutral', 'evil']).forEach(function (v) {
      h += '<span class="gchip' + (ui.artsGroupVal === v ? ' on' : '') + '" data-act="artsGroupVal" data-v="' + v + '">' +
        esc(grp === 'tier' ? t('arts.tierchar.' + v) : t('align.' + v)) + '</span>';
    });
    h += '</div>';
    h += '<div class="sechead"><span class="t">' + esc(t('arts.codex.title')) + '</span></div>';
    var groups = grp === 'tier' ? ['huang', 'xuan', 'di', 'tian'] : ['right', 'neutral', 'evil'];
    if (ui.artsGroupVal) groups = [ui.artsGroupVal];
    var allIds = Object.keys(am);
    groups.forEach(function (gv) {
      var ids = allIds.filter(function (x) { return grp === 'tier' ? am[x].tier === gv : am[x].alignment === gv; });
      if (!ids.length) return;
      var sil = [], ownedS = [], unownedS = [];
      ids.forEach(function (x) {
        if (!SQ.Arts.owned(w, x) && ((am[x].obtain || {}).type === 'event_locked')) { sil.push(x); return; }
        if (SQ.Arts.owned(w, x)) ownedS.push(x);
        else unownedS.push(x);
      });
      h += '<div class="sechead"><span class="t">' +
        esc(grp === 'tier' ? t('arts.sec.tier', { g: t('arts.tierchar.' + gv) }) : t('arts.sec.align', { g: t('align.' + gv) })) +
        '</span>' + (sil.length ? '<span class="s">' + esc(t('arts.sec.excl', { n: sil.length })) + '</span>' : '') + '</div>';
      sil.forEach(function (x) { h += artSilhouette(x, am[x]); });
      h += '<div class="cards">' + ownedS.concat(unownedS).map(function (x) { return artCodexCard(x, w); }).join('') + '</div>';
    });
    h += renderFuseAltar();
    return h;
  }

  /* 已学会卡（走查 v2.6 §2）：详情卡——名号/品阶/Lv/签名/滋养/精通 + 装入/移出/升级/散功 */
  function artCard(id, w, m) {
    var d = D(), p = pack();
    var a = p.artsMap()[id];
    var slotted = (w.artsSlots || []).indexOf(id) >= 0;
    var lv = w.artsLevels[id] || 0;
    var pr = SQ.Arts.practiceOf(w, id, d);
    var h = '<div class="tcard ' + (a.alignment === 'evil' ? 'neg' : a.alignment === 'right' ? 'pos' : '') + '">';
    h += '<div class="tname">' + esc(t('skill.' + id + '.name')) +
      ' <span class="tierbadge ' + artTierCls(a) + '">' + esc(t('skill.tier.' + a.tier)) + '</span>' +
      (slotted ? '<span class="tierbadge t1">' + esc(t('zone.current')) + '</span>' : '') + '</div>';
    h += '<div class="hint">Lv' + lv + (lv >= d.ARTS_MAX_LV ? ' · ' + esc(t('arts.max')) : '') +
      ' · ' + esc(t('special.' + a.special.pool + '.name')) +
      ' · ' + esc(t('skill.nurture.' + a.attr)) + '</div>';
    /* 走查 v2.7 §3：功法带来的具体增益（当前等级实际生效值，多效果并列） */
    var effParts = Object.keys(a.effects || {}).map(function (k) {
      if (lv > 0) {
        var v = a.effects[k] * lv;
        return t('talent.field.' + k) + ' ' + (v >= 0 ? '+' : '−') + pct(Math.abs(v));
      }
      return t('talent.field.' + k) + ' ' + t('arts.gain.perslot', { p: Math.round(a.effects[k] * 100) });
    });
    h += '<div class="meta">' + esc(effParts.join(' · ')) + '</div>';
    if (lv < d.ARTS_MAX_LV) {
      h += '<div class="pbar"><i style="width:' + pr.toFixed(0) + '%"></i></div>' +
        '<div class="hint">' + esc(t('arts.practice', { p: Math.floor(pr) })) + '</div>';
    }
    h += '<div class="acts">';
    h += slotted
      ? '<button data-act="unslotArt" data-v="' + id + '">' + esc(t('arts.unequip')) + '</button>'
      : '<button data-act="slotArt" data-v="' + id + '">' + esc(t('arts.equip')) + '</button>';
    if (lv < d.ARTS_MAX_LV) {
      var cost = SQ.Arts.upgradeCost(w, p, d, id, m);
      h += '<button data-act="upgradeArt" data-v="' + id + '"' + (w.qi < cost ? ' disabled' : '') + '>' +
        esc(t('arts.upgrade.qi', { n: SQ.fmt(cost), res: t('resource.primary') })) + '</button>';
    }
    if (!slotted && SQ.Arts.canSalvage(w, p, d, id)) {
      h += '<button data-act="salvageArt" data-v="' + id + '">' + esc(t('arts.salvage')) + '</button>';
    } else if (!slotted) {
      /* N20 接线：此前散功钮静默消失（初始自带 / 不可散功的功法玩家看不到任何解释） */
      h += '<span class="hint">' + esc(t('arts.salvage.lock')) + '</span>';
    }
    h += '</div></div>';
    return h;
  }

  /* 图鉴卡（走查 v2.6 §2）：已录=状态行；未获得=获取途径+缺项红字；全部只读 */
  function artCodexCard(id, w) {
    var d0 = D();
    var a = pack().artsMap()[id];
    var known = (w.artsKnown || []).indexOf(id) >= 0;
    var shelf = (w.shelf || []).indexOf(id) >= 0;
    var lv = w.artsLevels[id] || 0;
    var via = obtainVia(a);
    var h = '<div class="tcard' + (known ? '' : ' dim') + '">';
    h += '<div class="tname">' + esc(t('skill.' + id + '.name')) +
      ' <span class="tierbadge ' + artTierCls(a) + '">' + esc(t('skill.tier.' + a.tier)) + '</span></div>';
    if (known) {
      h += '<div class="hint">' + esc(t('arts.codex.known', { lv: lv })) + '</div>';
    } else if (shelf) {
      h += '<div class="hint">' + esc(t('arts.codex.shelf')) + '</div>';
      /* 待修习架功法：复检未过，先弃置止损（走查 v2.8 §1——弃置动作随卡走） */
      h += '<div class="acts"><button data-act="salvageArt" data-v="' + id + '">' +
        esc(t('arts.discard')) + ' · +' + esc(SQ.fmt(SQ.Arts.dupValue(w, pack(), d0, id))) + ' ' + esc(t('resource.currency')) + '</button></div>';
    } else {
      h += '<div class="hint">' + esc(t('arts.state.unowned', { via: via })) + '</div>';
      var lacks = artLackTexts(id);
      if (lacks.length) h += '<div class="hint" style="color:var(--bad)">' + esc(t('arts.state.lackline', { req: lacks.join(' · ') })) + '</div>';
    }
    h += '</div>';
    return h;
  }


  /* ── Tab 4 法器（批 2 · B5：百器录横幅+浮层 / 4 槽来源行 / 独占替换 CONFIRM / 极品 ※）── */
  function statLine(it) {
    var parts = [];
    parts.push(t('gear.stat.atk') + ' ' + SQ.fmt(it.atk));
    if (it.qiBonus) parts.push(t('talent.field.qiRate') + ' +' + pct(it.qiBonus));
    if (it.resist) parts.push(t('gear.stat.resist') + ' ' + SQ.fmt(it.resist));
    if (it.attrValue) parts.push(t('attr.' + it.attrValue.attr) + ' +' + it.attrValue.value);
    return parts.join(' · ');
  }
  /* 特殊词条效果行（百器录格）：数值从引擎表推导，禁手写数字 */
  function specialEffText(id) {
    var d = D();
    if (id === 'ignore_req') return t('gear.special.ignore_req');
    if (id === 'adamantine') return t('gear.stat.resist') + ' +' + d.ADAMANTINE_RESIST;
    var eff = (d.GEAR_SPECIAL_EFFECTS || {})[id] || {};
    return Object.keys(eff).map(function (f) {
      var v = eff[f];
      var txt = Math.abs(v) < 1 ? (v > 0 ? '+' : '−') + pct(Math.abs(v)) : (v > 0 ? '+' : '') + v;
      return t('talent.field.' + f) + ' ' + txt;
    }).join(' · ');
  }
  /* 当前持有扫描（百器录状态行）：佩戴中 / 在库（件名）/ 已炼化 */
  function gearHolder(w, match) {
    var d = D(), found = null, where = null;
    d.GEAR_SLOTS.forEach(function (s) {
      var it = w.gear[s];
      if (it && !found && match(it)) { found = it; where = 'worn'; }
    });
    if (!found) (w.stash || []).forEach(function (it) {
      if (!found && match(it)) { found = it; where = 'stash'; }
    });
    return found ? { item: found, where: where } : null;
  }
  function gearHolderState(hold) {
    if (!hold) return t('gear.codex.state.refined');
    return hold.where === 'worn' ? t('gear.codex.state.worn') : t('gear.codex.state.stash', { name: hold.item.name });
  }
  /* 来源行（B5：zone 跳秘境 · event 跳图鉴回看 story · shop 标注） */
  function gearSrcLine(it) {
    var s = it.source;
    if (!s) return '';
    if (s.type === 'zone' && s.ref != null && D().ZONES[s.ref]) {
      return '<div class="srcrow"><span class="src" data-act="tab" data-v="combat">' +
        esc(t('gear.src.zone', { name: t('combat.zone.' + s.ref) })) + ' ›</span></div>';
    }
    if (s.type === 'event' && s.ref) {
      return '<div class="srcrow"><span class="src" data-act="recallEvent" data-v="' + esc(s.ref) + '">' +
        esc(t('gear.src.event', { name: t('event.' + s.ref + '.name') })) + ' ›</span></div>';
    }
    if (s.type === 'shop') return '<div class="srcrow">' + esc(t('gear.src.shop')) + '</div>';
    if (s.type === 'exclusive') return '<div class="srcrow">' + esc(t('gear.src.exclusive')) + '</div>';
    return '';
  }
  /* 法器卡（卡片化批）：槽位名 + 名号/品阶/阵营 + 属性行 + 评分 + 缺项红字 + 来源行 + 动作 */
  function gearCard(it, w, slotLabel, stashIdx) {
    if (!it) return '<div class="tcard dim"><div class="tslot">' + esc(slotLabel) + '</div>' +
      '<div class="tdesc">' + esc(t('gear.empty')) + '</div></div>';
    var h = '<div class="tcard">';
    h += '<div class="tslot">' + esc(slotLabel) + '</div>';
    h += '<div class="tname">' + esc(it.name) +
         ' <span class="tierbadge t' + it.tier + '">' + esc(t('gear.tier.' + it.tier)) + '</span>' +
         ' <span class="align-sym align-' + it.alignment + '">' + esc(t('align.sym.' + it.alignment)) + '</span>' +
         (it.special ? ' <span class="special-mark">' + esc(t('gear.special.' + it.special)) + '</span>' : '') +
         (it.prime ? ' <span class="primetag">' + esc(t('gear.prime')) + '</span>' : '') +
         (it.exclusive ? ' <span class="ebadge gold">' + esc(t('event.badge.exGear')) + '</span>' : '') + '</div>';
    h += '<div class="teff">' + esc(statLine(it)) + '</div>';
    h += '<div class="tdesc">' + esc(t('gear.score', { n: SQ.fmt(SQ.Gear.scoreOf(it)) })) + '</div>';
    if (!SQ.Gear.canWear(it, w)) {
      /* 库藏阁红字：要求与剩余境界差（B5）；极品 ※ = 追加一阶的可解释性标注 */
      h += '<div class="tdesc" style="color:var(--danger)">' + esc(t('gear.lack.stash', {
        realm: t('realm.' + it.reqs.realm), star: it.prime ? '※' : '', n: Math.max(1, it.reqs.realm - w.realm)
      })) + '</div>';
      if (it.prime) h += '<div class="tdesc">' + esc(t('gear.prime.note')) + '</div>';
    }
    if (it.exclusive) h += '<div class="tdesc">' + esc(t(stashIdx != null ? 'gear.ex.lock' : 'gear.ex.norefine')) + '</div>';
    h += gearSrcLine(it);
    /* 库藏阁条目操作（批 2·B5 独占手动替换 + 道具处置打磨包手动炼化出口） */
    if (stashIdx != null) {
      var cur = w.gear[it.slot];
      var acts = '';
      if (SQ.Gear.canWear(it, w) && (it.exclusive || (cur && cur.exclusive))) {
        acts += '<button data-act="swapGear" data-v="' + stashIdx + '">' +
          esc(t(cur && cur.exclusive && !it.exclusive ? 'gear.swap.btn' : 'gear.swap.wear')) + '</button>';
      }
      if (!it.exclusive) {
        acts += '<button data-act="refineGear" data-v="' + stashIdx + '">' +
          esc(t('gear.refine.btn', { n: SQ.fmt(SQ.Gear.refineValue(it, w, D(), mods())) })) + '</button>';
      }
      if (acts) h += '<div class="acts">' + acts + '</div>';
    }
    return h + '</div>';
  }
  /* ⑤ 法器段（原 renderGear 主体逐段照搬：百器录横幅 / 已佩 4 槽 / 库藏阁）——
   * 页面整合批 2026-10-06 由「写 #tab-gear」改为「返回 HTML 串」，供合并页拼接。
   * ⚠️ UI 卷 §3.4a 勘误：原设计文档末项「最近拾得滚动列表」在本函数里从来不存在，
   * 实际只有百器录 / 已佩 / 库藏阁三段；已按代码现实收敛登记，不在本批补做。 */
  function gearBody() {
    var w = ws(), d = D();
    var seen = w.gearSeen || {};
    var spIds = (d.GEAR_SPECIALS || []).map(function (s) { return s.id; });
    var exIds = Object.keys(d.EXCLUSIVE_GEAR || {});
    var sGot = spIds.filter(function (x) { return seen[x] != null; }).length;
    var eGot = exIds.filter(function (x) { return seen['ex_' + x] != null; }).length;
    /* 页首百器录横幅（B5）：计数三分，点开 = 12 格双节浮层 */
    var h = '<div class="gbanner" data-act="openGearCodex"><span class="l">' + esc(t('gear.codex.title')) + '</span>' +
      '<span class="r">' + esc(t('gear.codex.banner', {
        n: sGot + eGot, total: spIds.length + exIds.length, s: sGot, st: spIds.length, e: eGot, et: exIds.length
      })) + ' ›</span></div>';
    var worn = 0, resSum = 0;
    d.GEAR_SLOTS.forEach(function (s) { if (w.gear[s]) { worn++; resSum += w.gear[s].resist || 0; } });
    h += '<div class="sechead"><span class="t">' + esc(t('gear.sec.worn')) + '</span><span class="s">' +
      esc(t('gear.sec.wornsub', { n: worn, total: d.GEAR_SLOTS.length, r: SQ.fmt(resSum) })) + '</span></div>';
    h += '<div class="cards geargrid">' + d.GEAR_SLOTS.map(function (slot) {
      return gearCard(w.gear[slot], w, t('gear.slot.' + slot));
    }).join('') + '</div>';
    h += '<div class="sechead"><span class="t">' + esc(t('gear.stash', { n: w.stash.length, cap: SQ.Gear.stashCap(w, d, mods()) })) +
      '</span><span class="s">' + esc(t('gear.stash.hint')) + '</span></div>';
    if (!w.stash.length) h += '<div class="lrow locked"><div class="meta">' + esc(t('gear.empty')) + '</div></div>';
    else h += '<div class="cards geargrid">' + w.stash.map(function (it, i) {
      return gearCard(it, w, t('gear.slot.' + it.slot), i);
    }).join('') + '</div>';
    return h;
  }

  /* ── Tab · 法宝（灵宝 · 法宝全录）：法宝栏 3 槽 + 法宝库 + 祭炼/认主 + 造化 ──
   * 法宝独立于四槽法器：无 atk/resist、不入自动择优、不可炼化，只带一条签名效果。 */
  /* 法宝卡（卡片化批）：名号/品阶/品相 + 等级·签名效果 + 描述 + 缺项红字 + 祭出/收起/祭炼动作 */
  function treasureCard(w, p, d, e, mode) {
    var dd = SQ.Treasures.def(p, e.id);
    if (!dd) return '';
    var lv = SQ.Treasures.levelOf(e), max = SQ.Treasures.maxOf(p, dd);
    var eq = SQ.Treasures.isEquipped(w, e.id);
    var lacks = SQ.Treasures.lacksTexts(w, p, d, dd);
    var h = '<div class="tcard' + (eq ? ' rare' : '') + '">';
    h += '<div class="tname">' + esc(t('treasure.' + e.id + '.name')) +
      ' <span class="tierbadge t' + (dd.kind === 'xian' ? 4 : 2) + '">' + esc(t('treasure.kind.' + dd.kind)) + '</span>' +
      ' <span class="align-sym">' + esc(t('treasure.grade.' + dd.grade)) + '</span>' +
      (eq ? ' <span class="special-mark">' + esc(t('treasure.equip')) + '</span>' : '') + '</div>';
    h += '<div class="teff">' + esc(t('treasure.lv.' + dd.kind, { n: lv, cap: max })) +
      ' · ' + esc(SQ.Treasures.fxText(w, p, dd, e)) + '</div>';
    h += '<div class="tdesc">' + esc(t('treasure.' + e.id + '.desc')) + '</div>';
    if (dd.kind === 'xian') h += '<div class="tdesc">' + esc(t('treasure.bond.hint', { n: (p.treasures.BOND_COST || 3) })) + '</div>';
    if (!eq && lacks.length) h += '<div class="tdesc" style="color:var(--danger)">' + esc(lacks.join(' · ')) + '</div>';
    var acts = '';
    if (eq) {
      acts += '<button data-act="unequipTreasure" data-v="' + e.id + '">' + esc(t('treasure.unequip')) + '</button>';
    } else if (mode === 'bag') {
      acts += '<button class="primary" data-act="equipTreasure" data-v="' + e.id + '"' + (lacks.length ? ' disabled' : '') + '>' +
        esc(t('treasure.equip')) + '</button>';
    }
    if (mode === 'bag' && dd.kind === 'hou') {
      var cost = SQ.Treasures.refineCost(w, p, d, e.id);
      if (cost != null) {
        acts += '<button data-act="refineTreasure" data-v="' + e.id + '"' + (w.stones < cost ? ' disabled' : '') + '>' +
          esc(t('treasure.refine')) + ' ' + SQ.fmt(cost) + '</button>';
      } else {
        acts += '<span class="tdesc">' + esc(t('treasure.refine.max')) + '</span>';
      }
    }
    if (acts) h += '<div class="acts">' + acts + '</div>';
    return h + '</div>';
  }

  /* 法宝图鉴卡：未得（owned=false）者名号 / 品阶 / 效果 / 描述全部以问号遮蔽 */
  function treasureCodexCard(w, p, d, it) {
    var dd = it.def;
    var q = t('treasure.codex.mask'), qq = t('treasure.codex.unknown');
    var h = '<div class="tcard' + (it.owned ? '' : ' dim') + '">';
    if (!it.owned) {
      h += '<div class="tname">' + esc(qq) +
        ' <span class="tierbadge t' + (dd.kind === 'xian' ? 4 : 2) + '">' + esc(q) + '</span>' +
        ' <span class="align-sym">' + esc(q) + '</span></div>';
      h += '<div class="teff">' + esc(q) + '</div>';
      h += '<div class="tdesc">' + esc(q) + '</div>';
      return h + '</div>';
    }
    h += '<div class="tname">' + esc(t('treasure.' + dd.id + '.name')) +
      ' <span class="tierbadge t' + (dd.kind === 'xian' ? 4 : 2) + '">' + esc(t('treasure.kind.' + dd.kind)) + '</span>' +
      ' <span class="align-sym">' + esc(t('treasure.grade.' + dd.grade)) + '</span>' +
      (it.equipped ? ' <span class="special-mark">' + esc(t('treasure.equip')) + '</span>' : '') + '</div>';
    h += '<div class="teff">' + esc(t('treasure.lv.' + dd.kind, { n: it.level, cap: SQ.Treasures.maxOf(p, dd) })) +
      ' · ' + esc(SQ.Treasures.fxText(w, p, dd, it.entry)) + '</div>';
    h += '<div class="tdesc">' + esc(t('treasure.' + dd.id + '.desc')) + '</div>';
    return h + '</div>';
  }

  function renderTreasure() {
    var w = ws(), p = pack(), d = D();
    var ts = p.treasures;
    if (!ts) { $('tab-treasure').innerHTML = '<div class="lrow locked"><div class="meta">' + esc(t('treasure.empty')) + '</div></div>'; return; }
    var tr = w.treasures || { owned: [], slots: [null, null, null] };
    var slots = tr.slots || [];
    var eqN = slots.filter(function (x) { return !!x; }).length;
    var h = '';
    /* 法宝栏 */
    h += '<div class="sechead"><span class="t">' + esc(t('treasure.slots', { n: eqN, cap: ts.SLOTS })) +
      '</span><span class="s">' + esc(t('treasure.hint')) + '</span></div>';
    h += '<div class="cards trgrid">';
    for (var i = 0; i < ts.SLOTS; i++) {
      var id = slots[i];
      var e = id ? SQ.Treasures.entryOf(w, id) : null;
      if (!SQ.Treasures.slotUnlocked(w, p, i)) {
        h += '<div class="tcard dim"><div class="tslot">' + esc(t('treasure.slot.n', { n: i + 1 })) + '</div><div class="tdesc">' +
          esc(t('treasure.slot.locked', { realm: t('realm.' + ts.SLOT_UNLOCK[i]) })) + '</div></div>';
      } else if (!e) {
        h += '<div class="tcard dim"><div class="tslot">' + esc(t('treasure.slot.n', { n: i + 1 })) + '</div><div class="tdesc">' +
          esc(t('treasure.empty')) + '</div></div>';
      } else {
        h += treasureCard(w, p, d, e, 'slot');
      }
    }
    h += '</div>';
    /* 法宝库 */
    var owned = tr.owned || [];
    h += '<div class="sechead"><span class="t">' + esc(t('treasure.bag', { n: owned.length })) + '</span></div>';
    if (!owned.length) h += '<div class="lrow locked"><div class="meta">' + esc(t('treasure.bag.empty')) + '</div></div>';
    else h += '<div class="cards trgrid">' + owned.map(function (e) { return treasureCard(w, p, d, e, 'bag'); }).join('') + '</div>';
    /* 法宝图鉴：全录 30 件一览；未得者名号/品阶/效果/描述一律问号遮蔽 */
    var cx = SQ.Treasures.codex(w, p);
    var cxGot = cx.filter(function (x) { return x.owned; }).length;
    h += '<div class="sechead"><span class="t">' + esc(t('treasure.codex.title')) +
      '</span><span class="s">' + esc(t('treasure.codex.banner', { n: cxGot, total: cx.length })) + '</span></div>';
    h += '<p class="hint" style="margin:2px 0 6px">' + esc(t('treasure.codex.hint')) + '</p>';
    h += '<div class="cards trgrid">' + cx.map(function (it) { return treasureCodexCard(w, p, d, it); }).join('') + '</div>';
    /* 造化（X11 阴阳乾坤鼎，须祭出） */
    if (SQ.Treasures.isEquipped(w, 'x11')) {
      h += '<div class="sechead"><span class="t">' + esc(t('treasure.convert.title')) + '</span></div>';
      h += '<div class="lrow"><div class="meta hint">' + esc(t('treasure.x11.desc')) + '</div>' +
        '<div class="row" style="margin-top:6px"><input class="trconv" type="number" min="0" step="1000" value="0" ' +
        'placeholder="' + esc(t('treasure.convert.qi')) + '" style="flex:1;min-width:0">' +
        '<button data-act="treasureConvert">' + esc(t('treasure.convert.qi')) + '</button></div>' +
        '<div class="acts"><button data-act="treasurePill">' +
        esc(t('treasure.convert.pill', { n: SQ.fmt(ts.PILL_COST), cur: t('resource.currency') })) + '</button></div></div>';
    }
    h += renderSpiritPanel();
    $('tab-treasure').innerHTML = h;
  }
  /* 百器录浮层（B5 · 帧四）：12 格双节；已录格点按 = 首获详情 toast；未录格点按 = 轻震 */
  function renderGearCodex() {
    var w = ws(), d = D();
    var seen = w.gearSeen || {};
    var spIds = (d.GEAR_SPECIALS || []).map(function (s) { return s.id; });
    var exIds = Object.keys(d.EXCLUSIVE_GEAR || {});
    var sGot = spIds.filter(function (x) { return seen[x] != null; }).length;
    var eGot = exIds.filter(function (x) { return seen['ex_' + x] != null; }).length;
    $('mgc-title').textContent = t('gear.codex.title');
    $('mgc-close').textContent = t('ui.close');
    var h = '<div class="sechead" style="margin-top:0"><span class="t">' + esc(t('gear.codex.sec.special')) +
      ' ' + sGot + '/' + spIds.length + '</span><span class="s">' + esc(t('gear.codex.hint1')) + '</span></div><div class="codexgrid">';
    spIds.forEach(function (id) {
      var ts = seen[id];
      if (ts == null) {
        h += '<div class="ccell lock" data-act="codexNudge"><span class="q">' + esc(t('ui.qmark')) +
          '</span><span class="cn">' + esc(t('gear.special.' + id)) + '</span></div>';
        return;
      }
      var hold = gearHolder(w, function (it) { return it.special === id && !it.exclusive; });
      h += '<div class="ccell got' + (hold ? '' : ' stale') + '" data-act="gcDetail" data-v="' + id + '" data-ts="' + ts + '">' +
        '<span class="cn">✦ ' + esc(t('gear.special.' + id)) + '</span>' +
        '<span class="ct">' + esc(specialEffText(id)) + '</span>' +
        '<span class="ct">' + esc(t('gear.codex.first', { t: timeAgo(ts) })) + '</span>' +
        '<span class="ct' + (hold ? '' : ' stale') + '">' + esc(gearHolderState(hold)) + '</span></div>';
    });
    h += '</div>';
    h += '<div class="sechead"><span class="t">' + esc(t('gear.codex.sec.ex')) + ' ' + eGot + '/' + exIds.length +
      '</span><span class="s">' + esc(t('gear.codex.hint2')) + '</span></div><div class="codexgrid" style="grid-template-columns:repeat(2,1fr)">';
    exIds.forEach(function (gid) {
      var ts = seen['ex_' + gid];
      var car = carrierOf('gear', gid);
      var evName = car ? t('event.' + car.ev.id + '.name') : t('event.codex.unknown');
      if (ts == null) {
        /* 未遇：连载体奇遇名都只显事件名不显 story（与奇遇图鉴「？」同语义）；宝角标灰态 */
        h += '<div class="ccell lock" data-act="codexNudge"><span class="bz">' + esc(t('event.badge.exGear')) + '</span>' +
          '<span class="q">' + esc(t('ui.qmark')) + '</span><span class="cn">' + esc(t('gear.ex.' + gid)) + '</span>' +
          '<span class="ct">' + esc(t('gear.codex.via', { ev: evName }) + t('gear.codex.unmet')) + '</span></div>';
        return;
      }
      var hold = gearHolder(w, function (it) { return it.exclusive === gid; });
      var seenEv = car && (w.eventHistory.seen || {})[car.ev.id] != null;
      h += '<div class="ccell got exgot" data-act="gcDetail" data-v="ex_' + gid + '" data-ts="' + ts + '">' +
        '<span class="bz">' + esc(t('event.badge.exGear')) + '</span>' +
        '<span class="cn">' + esc(t('gear.ex.' + gid)) + '</span>' +
        '<span class="ct">' + esc(specialEffText((d.EXCLUSIVE_GEAR[gid] || {}).special)) + '</span>' +
        '<span class="ct">' + esc(t('gear.codex.first', { t: timeAgo(ts) }) + ' · ' + gearHolderState(hold)) + '</span>' +
        (seenEv ? '<span class="ct src" data-act="recallEvent" data-v="' + esc(car.ev.id) + '">' +
          esc(t('gear.codex.via', { ev: evName })) + ' ›</span>' : '') + '</div>';
    });
    h += '</div>';
    h += '<p class="hint" style="margin-top:10px;line-height:1.7">' + esc(t('gear.codex.note')) + '</p>';
    $('mgc-body').innerHTML = h;
  }
  function openGearCodex() { renderGearCodex(); $('modal-gearcodex').classList.remove('hide'); }
  $('mgc-close').addEventListener('click', function () { $('modal-gearcodex').classList.add('hide'); });

  /* 奇遇回看浮层（批 2 · 交互说明 ★）：story 全文 + 首遇时间 + 上次选择与结果。
   * 入口三处：图鉴已解锁格 / 法宝来源行（event）/ 百器录独占格载体事件。 */
  function openRecall(eventId) {
    var w = ws();
    var ev = findEvent(eventId);
    var ts = ev ? (w.eventHistory.seen || {})[eventId] : null;
    if (!ev || ts == null) return;                 /* 未遇不开——上游已做轻震反馈 */
    $('mrc-title').textContent = t('event.recall.title', { name: t('event.' + eventId + '.name') });
    $('mrc-story').textContent = t('event.' + eventId + '.story');
    $('mrc-first').textContent = t('event.recall.first', { d: fmtDate(ts), ago: timeAgo(ts) });
    var last = null;
    (w.eventHistory.feed || []).forEach(function (f) {
      if (f.id === eventId && (!last || (f.ts || 0) > (last.ts || 0))) last = f;
    });
    if (last) {
      var k = last.karma >= 0 ? t('event.karma.pos', { n: last.karma }) : t('event.karma.neg', { n: last.karma });
      var chk = last.hadCheck ? t('event.recall.check', { r: last.pass ? t('check.ok') : t('check.fail') }) : '';
      $('mrc-last').textContent = t('event.recall.last', { branch: t('event.' + eventId + '.branch.' + last.branch), karma: k }) + chk;
      $('mrc-eff').textContent = t('event.recall.eff', { txt: SQ.Events.effText(w, pack(), D(), last.eff || {}) });
      $('mrc-last').classList.remove('hide');
      $('mrc-eff').classList.remove('hide');
    } else {
      /* feed 上限 50 条被挤出：首遇时间仍在，抉择明细如实缺省（不编造） */
      $('mrc-last').classList.add('hide');
      $('mrc-eff').classList.add('hide');
    }
    $('mrc-close').textContent = t('ui.close');
    $('modal-recall').classList.remove('hide');
  }
  $('mrc-close').addEventListener('click', function () { $('modal-recall').classList.add('hide'); });

  /* ══ 批 3 · 侣柱 G14（B1~B4/B7~B9）══ */
  function bondTierNum(n) { return t('bond.tiernum.' + n); }
  function bondMaxTier() { return (D().BOND_TIERS || [1, 30, 70, 100]).length; }
  function nextBondThreshold(tier) {
    var ts = D().BOND_TIERS || [1, 30, 70, 100];
    return tier >= ts.length ? (D().BOND_MAX || 100) : ts[tier];
  }
  function bondRedDotSig() {
    /* 侣 chip 红点（B1 · §2.2）：有人升档 或 候选可提亲——签名变化即亮，进浮层重置 */
    var w = ws(), p = pack(), d = D();
    var sig = [];
    SQ.Bonds.list(p).forEach(function (c) { sig.push(c.id + ':' + SQ.Bonds.tierOf(w, c.id, d)); });
    SQ.Bonds.list(p).forEach(function (c) {
      if (c.category === 'spouse' && SQ.Bonds.canPropose(w, p, d, c.id, Date.now()).ok) sig.push('p:' + c.id);
    });
    return sig.join(',');
  }
  function caveRedDotSig() {
    /* 地 chip 红点（B1 · §2.2 同侣 chip 口径）：新福地解锁——境界 / 首通 / 缘法门控达成。
     * 只取「与灵石 / 冷却 / 当前驻留无关」的资格项：灵石涨落不参与签名，避免红点反复闪烁
     * （与侣 chip 的「满档 / 升档」同为稳定阈值型信号）；进洞天节即消。 */
    var w = ws(), p = pack(), d = D();
    if (!w || !p) return '';   /* 未入世 / 世界包未载：无红点可言（switchTab 可能先于 profile 就绪） */
    var sig = [];
    SQ.Cave.list(p).forEach(function (c) {
      var lack = SQ.Cave.canEnter(w, p, d, c.id, Date.now()).lack.filter(function (x) {
        return x.kind !== 'stones' && x.kind !== 'cooldown' && x.kind !== 'same';
      });
      if (!lack.length) sig.push(c.id);
    });
    return sig.join(',');
  }
  function achvRedDotSig() {
    /* 成就页红点：meta.achv 跨世只增（Codex.scan 追加、不重排不清），故取「已录条数 + 最新一条 id」
     * 为签名——达成新成就即签名变化 → 红点亮；进成就页消账。
     * 与日志/奇遇的「最新条标识」同纪律（不靠数组长度单判，避免将来若发生裁剪时静默失效）。 */
    var meta = state.meta;
    var a = (meta && meta.achv) || [];
    return a.length ? (a.length + ':' + a[a.length - 1]) : '';
  }
  /* 个体助力当前值文案：channel 型各自单位（判定 pp / 冥佑描述），field 与其余走百分比 */
  function perkValueRaw(c, tier) {
    var pk = c.perk || {};
    var v = pk.perTier != null ? pk.perTier * tier : 0;
    if (pk.channel === 'checkPp') return '+' + (Math.round(v * 1000) / 10) + 'pp';
    if (pk.channel === 'shield') return t('bond.perk.shieldval');
    return (v < 0 ? '−' : '+') + pct(Math.abs(v));
  }
  function perkValueText(c, tier) {
    var pk = c.perk || {};
    if (pk.channel === 'shield') return t('bond.perk.shieldval');
    var vm = pk.perTier != null ? pk.perTier * bondMaxTier() : 0;
    var maxTxt = pk.channel === 'checkPp' ? '+' + (Math.round(vm * 1000) / 10) + 'pp' : (vm < 0 ? '−' : '+') + pct(Math.abs(vm));
    return t('bond.perk.cur', { v: perkValueRaw(c, tier), n: bondTierNum(tier), max: maxTxt });
  }
  function palCell(c, w, d) {
    var p = pack();
    var tier = SQ.Bonds.tierOf(w, c.id, d);
    var aff = Math.max(0, SQ.Bonds.affinityOf(w, c.id));
    var g = SQ.Bonds.guardianOf(w, p, d);
    var isGuard = !!(g && g.npcId === c.id && g.bonus > 0);
    var isSpouse = !!(w.spouse && w.spouse.npcId === c.id);
    if (SQ.Bonds.locked(w, c.id)) {
      /* 缘尽格：身份永不揭示（稿一批注）——赎回成功才揭名，故 data-v 只作动作载荷不进可见文本。
       * 可赎者（未赎过 + 遗泽足）挂「赎」角标提示可点；不可赎者点按出原因 toast + 轻震。 */
      var costR = (d.BOND_REDEEM_COST != null ? d.BOND_REDEEM_COST : 30);
      var doneR = (w.redeemedIds || []).indexOf(c.id) >= 0;
      var canR = !doneR && ((state.meta && state.meta.karma) || 0) >= costR;
      return '<div class="pal dead" data-act="bondDead" data-v="' + c.id + '">' +
        (canR ? '<span class="pcorner rd">' + esc(t('bond.redeem.badge')) + '</span>' : '') +
        '<div class="ava">' + esc(t('bond.deadava')) + '</div>' +
        '<div class="nm">' + esc(t('event.codex.unknown')) + '</div>' +
        '<div class="deadtag">' + esc(t('bond.locked')) + '</div></div>';
    }
    /* 候选「双」角标无论结缘与否都挂（收集牵引：有一位可结道侣的人藏在？） */
    var corner = (c.category === 'spouse' ? '<span class="pcorner sh">' + esc(t('bond.badge.spouse')) + '</span>' : '') +
      (isGuard ? '<span class="pcorner um"' + (c.category === 'spouse' ? ' style="right:17px"' : '') + '>☂</span>' : '');
    if (tier < 1) {
      /* 势力批 v2.4 §6：负好感（−20~−2）= 厌恶——剪影格上加红字标签，与「未结缘」区分 */
      var rawAff = SQ.Bonds.affinityOf(w, c.id);

  /* 道友名录：浮层（openBonds）与「道友」页（势力批 v2.4 §9）共用同一套渲染；

  function renderBonds(dest) {

    if (!isTab && ui.bondDetail) { renderBondDetail(); return; }

    if (evil) {

    if (w.spouse) {

    h += '<div class="sechead"><span class="t">' + esc(t('bond.sec.friend')) + ' · ' + friends.length + '</span><span class="s">' +

  /* 格位详情五段式（B3 · 稿二）：头部 / 好感进度尺四档刻度 / 个体助力 / 小传正典 / 出身事件或结缘条件 */

    if (tier < 1 && !SQ.Bonds.locked(w, id)) { renderBondUnknown(id, rawAff); return; }
    var h = '<div class="bd-head' + (c.category === 'spouse' ? ' sp' : '') + '">' +

    h += '<div class="dsec"><div class="dt">' + esc(t('bond.detail.perk')) + '</div>' +

    /* 所属势力（势力批 v2.4 §3）：随世界生成动态归属，散人/在册皆明示 */
    var nf = SQ.Factions.npcFactionOf(w, id);
    h += '<div class="dsec"><div class="dt">' + esc(t('bond.detail.flavor')) + '</div>' +
      '<div class="dd"><span class="facsig' + (nf ? (' fac-' + nf.align) : '') + '">' +
      esc(nf ? t('faction.bond.line', { name: nf.name, align: t('align.' + nf.align) }) : t('faction.bond.none')) +
      '</span>' + esc(t('bond.' + id + '.flavor')) + '</div></div>';
    if (c.category === 'spouse') {
      /* 候选：出身事件段替换为结缘条件段 + 满档「提亲 ♡」主按钮（稿二批注） */
      h += '<div class="dsec"><div class="dt">' + esc(t('bond.detail.spousecond')) + '</div><div class="dd">' + esc(t('bond.spousecond.text')) + '</div>';
      var chk = SQ.Bonds.canPropose(w, p, d, id, Date.now());
      if (isSpouse) {
        h += '<div class="dd" style="color:var(--spouse);margin-top:8px">' + esc(t('bond.spouse.active', {
          form: t('bond.spouse.form.' + w.spouse.form), name: t('bond.' + id + '.name'),
          eff: t('bond.form.eff.' + w.spouse.form).split(' · ')[0]
        })) + (w.spouse.form === 'luding' ? ' · ' + esc(t('bond.spouse.luding.warn')) : '') + '</div>';
      } else if (chk.ok) {
        h += '<button class="primary" style="width:100%;margin-top:10px" data-act="proposeOpen" data-v="' + id + '">' + esc(t('bond.propose.btn')) + '</button>';
      } else {
        var whyKey = 'bond.propose.fail.' + chk.reason;
        var whyVars = chk.reason === 'cooldown' ? { t: timeLeftText(Math.max(0, (w.spouseCdUntil || 0) - Date.now())) } : {};
        h += '<div class="dd hint" style="margin-top:8px">' + esc(t(whyKey, whyVars)) + '</div>';
      }
      h += '</div>';
    } else {
      var carEv = (c.carrierEvents || [])[0];
      if (carEv) {
        var seen = (w.eventHistory.seen || {})[carEv] != null;
        h += '<div class="dsec"><div class="dt">' + esc(t('bond.detail.origin')) + '</div>' +
          '<div class="srcline"' + (seen ? ' data-act="recallEvent" data-v="' + carEv + '"' : '') + '><span>' +
          esc(t('bond.origin.via', { ev: seen ? t('event.' + carEv + '.name') : t('event.codex.unknown') })) + '</span>' +
          (seen ? '<span class="go">' + esc(t('bond.origin.go')) + '</span>' : '') + '</div></div>';

          esc(t('bond.guard.record', { n: w.guardLog.count, s: w.guardLog.success })) + '</div></div>';

    if (ui.bondsDest === 'tab') $('tab-bonds').innerHTML = h;
    else $('mbd-body').innerHTML = h;
  }
  /* ── 好感三渠道批（2026-10-06 · 引擎卷 v1.11 §3.2a / UI 卷 §3.4c）──────────────────
   * 渠道 A 拜访论道 + 渠道 B 赠丹 的视图侧：两个纯拼接渲染器 + 三个只读取数助手。
   * 口径纪律：① 按钮上标出的增量 = **引擎会真给的数**（拜访按档位递减 + 同向加成；赠丹按丹方 tier
   * × 丹纹倍率，再对「距满档余量」取 min，绝不显示会被 clamp 吃掉的虚数）；② 未识者的「同道相投」
   * 角标**不显示**（阵营属身份信息，结识后才可见，与「？」剪影口径一致）；③ 双特例丹（破障 / 镇劫）
   * 不进赠丹列表——引擎侧同样拒（reason 'once'），两层同口径。 */
  function maxBondTier() { return (D().BOND_TIERS || [1, 30, 70, 100]).length; }
  function visitGainOf(id, tier) {
    var w = ws(), p = pack(), d = D();
    var tbl = d.BOND_VISIT_BY_TIER || [3, 3, 2, 1, 0];
    var base = tbl[Math.min(Math.max(0, tier), tbl.length - 1)] || 0;
    if (!(base > 0)) return { n: 0, align: false };
    /* 同向加成只对**已相识**生效（引擎同口径）：未识者阵营未揭，不给加成也不显示角标 */
    if (tier < 1) return { n: base, align: false };
    var c = SQ.Bonds.byId(p, id);
    var kd = (p.worldSystems && p.worldSystems.tierOf) ? p.worldSystems.tierOf(w) : 'neutral';
    var sameDir = !!(c && c.align && c.align === kd);
    return { n: base + (sameDir ? (d.BOND_VISIT_ALIGN_BONUS != null ? d.BOND_VISIT_ALIGN_BONUS : 1) : 0), align: sameDir };
  }
  function visitBtn(id, tier) {
    var w = ws(), d = D();
    if (SQ.Bonds.locked(w, id)) return '<div class="dd hint">' + esc(t('bond.fail.lock')) + '</div>';
    if (SQ.Bonds.scarred(w, id)) return '<div class="dd hint">' + esc(t('bond.fail.scar')) + '</div>';
    if (tier >= maxBondTier()) return '<div class="dd hint">' + esc(t('bond.visit.fail.max')) + '</div>';
    var g = visitGainOf(id, tier);
    var cd = d.BOND_VISIT_CD_MS != null ? d.BOND_VISIT_CD_MS : 300000;   /* 兜底与表同值：视图倒计时不许在表缺键时悄悄回到 1h */
    var wait = (w.bondVisitAt || 0) + cd - Date.now();
    if (wait > 0) {
      return '<button class="actbtn" type="button" disabled><span class="an">' + esc(t('bond.visit.btn')) +
        '</span><span class="cd">' + esc(t('bond.visit.cd', { t: timeLeftText(wait) })) + '</span></button>';
    }
    return '<button class="actbtn" type="button" data-act="bondVisit" data-v="' + id + '"><span class="an">' +
      esc(t('bond.visit.btn')) + '</span>' +
      (g.align ? '<span class="ab">' + esc(t('bond.visit.align')) + '</span>' : '') +
      (tier < 1 ? '<span class="mt">' + esc(t('bond.visit.met')) + '</span>' : '') +
      '<span class="gv">' + esc(t('bond.visit.gain', { n: g.n })) + '</span></button>';
  }
  /* 可赠丹药清单：库存 >0 且非双特例（once）；丹纹版（尾 _rw）单列一颗 */
  function giftablePills(w, d) {
    var al = w && w.alchemy, out = [];
    if (!al || !al.pills) return out;
    var AP = (d.ALCHEMY || {}).APILLS || {};
    for (var k in al.pills) {
      if (!(al.pills[k] > 0)) continue;
      var rune = /_rw$/.test(k);
      var def = AP[rune ? k.replace(/_rw$/, '') : k];
      if (!def || def.once) continue;
      out.push({ key: k, n: al.pills[k], rune: rune });
    }
    return out;
  }
  /* 赠丹名义增量（丹方 tier → BOND_GIFT_BY_TIER，丹纹 ×倍率取整）；调用方再对余量取 min */
  function pillGiftGain(d, key) {
    var rune = /_rw$/.test(key);
    var base = rune ? key.replace(/_rw$/, '') : key;
    var tierName = null;
    (((d.ALCHEMY || {}).RECIPES) || []).forEach(function (r) {
      if (r && r.pill === base && r.tier) tierName = r.tier;
    });
    var tbl = d.BOND_GIFT_BY_TIER || {};
    var n0 = tbl[tierName] != null ? tbl[tierName] : 0;
    return rune ? Math.round(n0 * (d.BOND_GIFT_RUNE_MULT != null ? d.BOND_GIFT_RUNE_MULT : 1.5)) : n0;
  }
  /* 今日剩余可赠次数（与引擎同口径：Alchemy.gameDayOf，1 游戏日 = 1 现实秒）*/
  function giftLeft(w, d) {
    var cap = d.BOND_GIFT_DAILY != null ? d.BOND_GIFT_DAILY : 3;
    var al = w && w.alchemy;
    if (!al || !SQ.Alchemy || !SQ.Alchemy.gameDayOf) return cap;
    var day = SQ.Alchemy.gameDayOf(w, state.profile, Date.now());
    var g = al.giftDay;
    if (!g || g.day !== day) return cap;
    return Math.max(0, cap - (g.n || 0));
  }
  function bondActSection(id) {
    var w = ws(), d = D();
    var tier = SQ.Bonds.tierOf(w, id, d);
    var h = '<div class="dsec"><div class="dt">' + esc(t('bond.detail.act')) + '</div>' +
      '<div class="dd hint" style="margin-bottom:8px">' + esc(t('bond.act.tip')) + '</div>' + visitBtn(id, tier);
    var cap = d.BOND_GIFT_DAILY != null ? d.BOND_GIFT_DAILY : 3;
    var left = giftLeft(w, d);
    h += '<div class="kv" style="margin-top:12px"><span class="hint">' +
      esc(t('bond.gift.head', { n: cap - left, cap: cap })) + '</span></div>';
    if (SQ.Bonds.locked(w, id) || SQ.Bonds.scarred(w, id)) return h + '</div>';
    if (tier >= maxBondTier()) return h + '<div class="dd hint">' + esc(t('bond.gift.fail.max')) + '</div></div>';
    var pills = giftablePills(w, d);
    if (!pills.length) return h + '<div class="dd hint">' + esc(t('bond.gift.empty')) + '</div></div>';
    var head = Math.max(0, (d.BOND_MAX || 100) - Math.max(0, SQ.Bonds.affinityOf(w, id)));
    var chips = '';
    pills.forEach(function (pl) {
      var g = Math.min(pillGiftGain(d, pl.key), head);
      if (!(g > 0)) return;
      chips += '<button type="button" data-act="bondGift" data-v="' + id + '" data-c="' + pl.key + '"' +
        (left > 0 ? '' : ' disabled') + '>' + esc(t('alchemy.pill.' + pl.key + '.name')) +
        '<span class="gv">+' + g + '</span><span class="st">' + esc(t('bond.gift.stock', { n: pl.n })) + '</span></button>';
    });
    if (!chips) return h + '<div class="dd hint">' + esc(t('bond.gift.fail.max')) + '</div></div>';
    h += '<div class="chips">' + chips + '</div>';
    if (!(left > 0)) h += '<div class="dd hint">' + esc(t('bond.gift.fail.daily', { n: cap })) + '</div>';
    return h + '</div>';
  }
  /* 未识 / 厌恶者的隐匿详情：身份不揭示（「？」+ 未结缘或厌恶值），只给渠道 A 主动结识口 */
  function renderBondUnknown(id, rawAff) {
    var h = '<div class="bd-head"><div class="ava">' + esc(t('ui.qmark')) + '</div><div class="id"><b>' +
      esc(t('event.codex.unknown')) + '</b><div class="sub">' +
      esc(rawAff < 0 ? (t('bond.negative') + ' ' + rawAff) : t('bond.unmet')) + '</div></div></div>' +
      '<div class="dsec"><div class="dt">' + esc(t('bond.detail.act')) + '</div>' +
      '<div class="dd hint" style="margin-bottom:8px">' + esc(t('bond.act.tip')) + '</div>' +
      visitBtn(id, 0) + '</div>';
    if (ui.bondsDest === 'tab') $('tab-bonds').innerHTML = h;
    else $('mbd-body').innerHTML = h;
  }
  /* 拒绝原因 → 文案：按 visit / gift / 共用三组前缀依次探键（SQ.t 缺键回传键名本身，据此判存在）*/
  function bondFailText(r) {
    var why = (r && r.reason) || 'unknown';
    if (why === 'cooldown') return t('bond.visit.fail.cooldown', { t: timeLeftText(Math.max(0, (r && r.waitMs) || 0)) });
    var ks = ['bond.visit.fail.' + why, 'bond.gift.fail.' + why, 'bond.fail.' + why];
    for (var i = 0; i < ks.length; i++) if (SQ.t(ks[i], null, wid()) !== ks[i]) return t(ks[i], why === 'daily' ? { n: (D().BOND_GIFT_DAILY != null ? D().BOND_GIFT_DAILY : 3) } : null);
    return t('bond.fail.unknown');
  }

  /* 冷却剩余时差文案（提亲冷却复用洞府时分秒口径） */
  function timeLeftText(ms) {
    if (!isFinite(ms)) ms = 0;                     /* 防脏字段：NaN/undefined 一律按 0 计，杜绝「NaN时NaN分」 */
    var s = Math.max(0, Math.floor(ms / 1000));
    var d = Math.floor(s / 86400), hh = Math.floor((s % 86400) / 3600);
    if (d > 0) return t('ui.time.d', { d: d, h: hh });
    if (hh > 0) return t('ui.time.hm', { h: hh, m: Math.floor((s % 3600) / 60) });
    /* 不足 1 小时 ⇒ 走「X 分钟」（UI 卷 §六 时间格式正典，离线呈报同口径）。
     * 2026-10-09 拜访冷却由 1h 改 5 分钟后，这条分支成了拜访按钮的**主路径**——旧实现在此显示
     * 「0时4分」，属代码与正典不符的一处（一直存在，只是过去 <1h 的窗口少、不显眼）。
     * 分钟**向上取整且至少 1**：最后 40 秒显示「1分钟」而不是「0分钟」，免得看着像已经结束。 */
    return t('ui.time.m', { m: Math.max(1, Math.ceil(s / 60)) });
  }

  /* ── Tab 5 坊市 ── */
  /* 丹药双标签子函数（**同型面第二处**）：门中供给（势力页 §六）卖的就是 `D.PILLS` 这四颗丹，
   * 坊市加了标签而那里不加 = 造一处新的不一致，故词缀 / 分类各抽一个纯函数、两处共用。 */
  function pillAffix(pill) {
    /* tier = 展示用字段（与同名丹方同档），不参与结算；缺字段就不挂词缀，不猜 */
    if (!pill || !pill.tier || !tierCls(pill.tier)) return '';
    return '<span class="tierbadge ' + tierCls(pill.tier) + '">' + esc(t('goods.tier.' + pill.tier)) + '</span>';
  }
  function pillCat() { return '<span class="catbadge">' + esc(t('shop.cat.pill')) + '</span>'; }
  /* 货架卡片双标签（坊市标签批 2026-10-09 · UI 卷 §3.4）：词缀 chip（品阶 / 性质，彩色 tierbadge）
   * + 分类 chip（灰描边 catbadge）。**一处取数、两处共用**——坊市货架与神秘商人特席此前各拼一套
   * （特席：法器有品阶、功法没有、丹药一个都没有），那正是「同一种货两张卡三种口径」的成因。
   * ⚠️ 无词缀的货类（材料包 / 图纸 / 丹炉成品 / 灵石包）**如实留空**，不为了凑齐两枚 chip 编一个档次。
   * 返回串以空格起头，直接拼在名称后。 */
  function shopTagHtml(it) {
    var d = D(), p = pack(), aff = '', cat = '', k = it.kind, gp = it.pack;
    if (k === 'gear' && it.gear) {
      aff = '<span class="tierbadge t' + it.gear.tier + '">' + esc(t('gear.tier.' + it.gear.tier)) + '</span>';
      cat = '<span class="catbadge">' + esc(t('gear.system')) + '</span>';
    } else if (k === 'arts') {
      var a = p.artsMap()[it.ref];
      if (a && tierCls(a.tier)) aff = '<span class="tierbadge ' + tierCls(a.tier) + '">' + esc(t('skill.tier.' + a.tier)) + '</span>';
      cat = '<span class="catbadge">' + esc(t('skill.system')) + '</span>';
    } else if (k === 'pill') {
      var pl2 = null;
      (d.PILLS || []).forEach(function (x) { if (x.id === it.ref) pl2 = x; });
      aff = pillAffix(pl2); cat = pillCat();
    } else if (k === 'treasure') {
      var td = SQ.Treasures.def(p, it.ref);
      if (td) aff = '<span class="tierbadge t' + (td.kind === 'xian' ? 4 : 2) + '">' + esc(t('treasure.kind.' + td.kind)) + '</span>';
      cat = '<span class="catbadge">' + esc(t('treasure.system')) + '</span>';
    } else if (k === 'pack' && gp) {
      if (gp.type === 'recipe') {
        var rc = ((d.ALCHEMY || {}).RECIPES || []).filter(function (r) { return r.id === gp.ref; })[0];
        if (rc && rc.tier && tierCls(rc.tier)) aff = '<span class="tierbadge ' + tierCls(rc.tier) + '">' + esc(t('goods.tier.' + rc.tier)) + '</span>';
      }
      cat = '<span class="catbadge">' + esc(t('alchemy.system')) + '</span>';
    } else if (k === 'pack') {
      cat = '<span class="catbadge">' + esc(t('shop.cat.pack')) + '</span>';
    }
    return (aff ? ' ' + aff : '') + (cat ? ' ' + cat : '');
  }

  function shopItemRow(it, idx, black, w) {

    } else {
      h += '<div class="nm">' + esc(t('shop.pack.name')) + shopTagHtml(it) + '</div>';
      h += '<div class="meta">' + esc(t('shop.pack.desc')) + ' → ' + SQ.fmt(it.stones) + ' ' + esc(t('resource.currency')) + '</div>';
    }
    if (it.sold) {

      var mS = mods();

        h += '<div class="bondline">' + esc(t('shop.bond.discount', { p: Math.round(-bS * 100) })) + '</div>';

      h += '<div class="acts"><button data-act="buy" data-v="' + idx + '" data-b="' + (black ? 1 : 0) + '">' +

  /* ── 势力页（G16 · 势力批 v2.4 + 深化批 v1.23）：当前效力（职级/声望/捐献）+ 冲突横幅 + 委托 + 供给 + 16~20 张势力卡（固定池名门角标）── */
  function factionRelChips(w, f) {
    var chips = '';
    (w.factions || []).forEach(function (o) {
      if (o.id === f.id) return;
      var rel = f.rel[o.id] || 'neutral';

      chips += '<span class="relchip ' + rel + '">' + esc(o.name) +
        '<i>' + esc(t('faction.rel.' + rel)) + '</i></span>';

  }
  function factionMembers(w, f) {
    var n = 0;
    for (var k in (w.factionNpcs || {})) if (w.factionNpcs[k] === f.id) n++;
