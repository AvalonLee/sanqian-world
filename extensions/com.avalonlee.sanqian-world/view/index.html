    h += '<p class="hint" style="margin:10px 0 2px;font-weight:650">' + esc(t('alchemy.ui.mats')) + '</p>';
    var matIds = Object.keys(w.materials || {});
    if (!matIds.length) h += '<p class="hint">' + esc(t('alchemy.ui.mats.empty')) + '</p>';
    else {
      h += '<p class="hint" style="margin:0 0 4px">' + esc(t('alchemy.ui.refine.hint')) + '</p><div class="cardgrid">';

        '<div class="acts"><button data-act="alSell" data-v="' + mid + '" data-c="1">' + esc(t('alchemy.ui.sell')) + '</button>' +
        '<button data-act="alSell" data-v="' + mid + '" data-c="0">' + esc(t('alchemy.ui.sellall')) + '</button>' +
        (SQ.Alchemy.groupOf(d, mid) < 3 ? '<button data-act="alRefine" data-v="' + mid + '"' +
          ((w.materials[mid] >= (A.REFINE_IN || 4)) ? '' : ' disabled') + '>' + esc(t('alchemy.ui.refine')) + '</button>' : '') +
        '</div></div>';

    /* 采集 / 灵田已改自动轴（采集：驻区历练每 1 游戏年入账 1~4 枚本区材料；灵田：驻留福地每 6 游戏月入账 1~4 枚），
     * 无手动入口；材料产出说明见「秘境洞天 → 洞天福地 → 附属设施 · 灵田」描述。 */
    $('tab-alchemy').innerHTML = h;

  /* ── 天骄页（天骄卷 B4：同代榜 + 详情 + 切磋）── */
  function renderProdigy() {
    var w = ws(), d = D(), p = pack(), m = mods();
    /* 「效力于你」角标数据源：宗门弟子档里的天骄来源位 `pr`（零新增存档字段，派生态） */
    var srvSet = {};
    if (w.sect && w.sect.disciples) w.sect.disciples.forEach(function (x) { if (x.pr) srvSet[x.pr] = 1; });
    var h = '<div class="pagehead split"><div class="chips"><button class="on">' + esc(t('prodigy.board.title')) + '</button></div>' +
      '<span class="hint">' + esc(t('prodigy.board.hint')) + '</span></div>';
    if (!(w.prodigies || []).length) {
      h += '<p class="hint">' + esc(t('prodigy.board.empty')) + '</p>';
      $('tab-prodigy').innerHTML = h;
      return;
    }
    var show = SQ.Prodigy.boardShow(d);
    /* 榜面数据源：优先读 10 游戏年一刷的冻结快照（tick 内写入）；无快照（首次未结算）回落实时榜 */
    var rows = [];
    var snap = SQ.Prodigy.rankRows(w);
    if (snap) {
      snap.forEach(function (r) { rows.push({ me: !!r.me, id: r.me ? null : r.id, realm: r.realm, power: r.power }); });
    } else {
      SQ.Prodigy.board(w, p, d, m).rows.forEach(function (r) {
        rows.push({ me: !!r.me, id: r.me ? null : r.id, realm: r.realm, power: r.power });
      });
    }
    var myRank = 1;
    rows.forEach(function (r, i) { if (r.me) myRank = i + 1; });
    h += '<div class="kv"><span class="hint">' + esc(t('prodigy.board.myrank', { n: myRank })) + '</span>' +
      '<span class="hint">' + esc(t('prodigy.board.refresh', { y: Math.round((d.PRODIGY.RANK_REFRESH_MS || 3600000) / 360000) })) + '</span></div>';
    /* 榜面只展前 N 位详情；玩家若在 N 名之外，追加其所在位次（带省略号分隔） */
    var list = rows.slice(0, show).map(function (r, i) { return { r: r, rank: i + 1, gap: false }; });
    if (myRank > show) rows.forEach(function (r, i) { if (r.me) list.push({ r: r, rank: i + 1, gap: true }); });
    list.forEach(function (item) {
      var r = item.r, rank = item.rank;
      var pr = r.me ? null : SQ.Prodigy.byId(w, r.id);
      if (!r.me && !pr) return;                     /* 快照后已斩杀出榜者略过 */
      var isMe = r.me;
      if (item.gap) h += '<p class="hint" style="text-align:center;margin:2px 0">⋯</p>';
      var nm = isMe ? t('prodigy.board.me') : SQ.Prodigy.nameOf(w, pr, p);
      var align = isMe ? null : pr.al;
      var relTxt = '';
      if (!isMe) {
        if (pr.feud) relTxt = '<span class="bad">' + esc(t('prodigy.rel.feud')) + '</span>';
        else {
          var aff = (w.bonds || {})[pr.id] || 0;
          if (aff >= 1) relTxt = esc(t('prodigy.rel.friend')) + ' ' + aff;
        }
        if (pr.eternal) relTxt += ' <span class="tierbadge t4">' + esc(t('prodigy.detail.eternal')) + '</span>';
        if (pr.boost) relTxt += ' <span class="tierbadge t2">' + esc(t('prodigy.detail.boost')) + '</span>';
        if (srvSet[pr.id]) relTxt += ' <span class="tierbadge t3">' + esc(t('prodigy.detail.serving')) + '</span>';
      }
      h += '<div class="lrow' + (isMe ? ' cur' : '') + '"><div class="nm">' + rank + '. ' +
        (isMe ? '<b>' + esc(nm) + '</b>' : '<button class="linkbtn" data-act="prodDetail" data-v="' + r.id + '">' + esc(nm) + '</button>') +
        (align != null ? ' <span class="align-sym align-' + ['right', 'neutral', 'evil'][align] + '">' + esc(t('align.sym.' + ['right', 'neutral', 'evil'][align])) + '</span>' : '') +
        ' ' + relTxt + '</div>' +
        '<div class="meta">' + esc(t('realm.' + r.realm)) + ' · ' + esc(t('resource.power')) + ' ' + SQ.fmt(r.power) +
        (!isMe ? ' · ' + esc(SQ.Prodigy.factionNameOf(w, pr, p)) : '') + '</div></div>';
      if (!isMe && ui.prodOpen === r.id) {
        var cdLeft = pr.lastSparAt + (d.PRODIGY.SPAR_CD_DAYS || 7) * 86400000 - Date.now();
        /* 强弱差让展示（切磋平衡批 §5.3 v2）：ratio = 浮动前真战力比——信息全透明正典纪律 */
        var pdD = d.PRODIGY || {}, hcD = pdD.HANDICAP || {};
        var myPD = SQ.Mods.powerOf(w, p, d, m);
        var q0D = SQ.Prodigy.powerOf(w, pr, d);
        var ratioD = q0D > 0 ? myPD / q0D : 999;
        var crushD = ratioD >= (hcD.crush != null ? hcD.crush : 1.5);
        var braveD = !crushD && ratioD <= (hcD.brave != null ? hcD.brave : 0.8);
        var hcKey = crushD ? 'crush' : (braveD ? 'brave' : 'even');
        h += '<div class="detailbox">' +
          '<div class="kv"><span>' + esc(t('prodigy.detail.faction')) + '</span><span>' + esc(SQ.Prodigy.factionNameOf(w, pr, p)) + '</span></div>' +
          /* N20 接线：关系档此前只在榜行露出（relTxt），详情面整行缺席；正典 = 天骄卷 line128 详情页列「关系档与好感」 */
          (relTxt ? '<div class="kv"><span>' + esc(t('prodigy.detail.rel')) + '</span><span>' + relTxt + '</span></div>' : '') +
          '<div class="kv"><span>' + esc(t('prodigy.detail.apt')) + '</span><span>' + esc(t('prodigy.apt.' + pr.apt)) + '</span></div>' +
          '<div class="kv"><span>' + esc(t('prodigy.detail.talent')) + '</span><span>' +
          (pr.tl || []).map(function (tid) { return esc(t('talent.' + tid + '.name')); }).join(' · ') + '</span></div>' +
          '<div class="kv"><span>' + esc(t('prodigy.detail.wl', { w: pr.wl[0], l: pr.wl[1], d: pr.wl[2] })) + '</span>' +
          '<span>' + esc(t('prodigy.detail.bond', { n: (w.bonds || {})[pr.id] || 0 })) + '</span></div>' +
          (pr.feud ? '<div class="kv"><span class="bad">' + esc(t('prodigy.detail.feudstate')) + '</span></div>' : '') +
          '<div class="kv"><span>' + esc(t('prodigy.spar.vs', { a: SQ.fmt(myPD), b: SQ.fmt(q0D) })) + '</span>' +
          '<span class="tierbadge ' + (crushD ? 't1' : (braveD ? 't4' : 't2')) + '">' + esc(t('prodigy.spar.handicap.' + hcKey)) + '</span></div>' +
          '<div class="meta hint">' + esc(t('prodigy.spar.handicap.' + hcKey + '.hint')) + '</div>';
        if (cdLeft > 0) {
          h += '<button disabled style="width:100%;margin-top:6px">' + esc(t('prodigy.spar.cd', { t: timeLeftText(cdLeft) })) + '</button>';
        } else {
          h += '<div class="acts" style="margin-top:6px">' + ['light', 'std', 'heavy'].map(function (kd) {
            var stk = SQ.Prodigy.sparStake(w, d, kd);
            return '<button data-act="sparProd" data-v="' + pr.id + '" data-c="' + kd + '"' +
              (w.stones < stk ? ' disabled' : '') + '>' +
              esc(t('prodigy.spar.kind.' + kd) + ' ' + SQ.fmt(stk)) + '</button>';
          }).join('') + '</div>' +
          '<div class="meta hint">' +
          esc(t('prodigy.spar.matp', { p: Math.round((braveD ? (hcD.braveMatP != null ? hcD.braveMatP : 0.15) : (pdD.SPAR_MAT_P || 0.10)) * 100) })) +
          ' · ' + esc(t('prodigy.spar.feudp', { p: Math.round((pdD.SPAR_FEUD_P || 0.30) * 100) })) +
          '/' + esc(t('prodigy.spar.kind.heavy')) + ' ' + Math.round((pdD.SPAR_FEUD_P_HEAVY || 0.40) * 100) + '%</div>';
        }
        h += '</div>';
      }
    });
    $('tab-prodigy').innerHTML = h;
  }

  /* ── 宗门页（自立门户卷 B6：开宗流程 / 弟子 / 设施 / 战争 / 传位）── */
  function renderSect() {
    var w = ws(), d = D(), p = pack(), m = mods();

      var chk = SQ.Sect.canFound(w, p, d, state.meta);
      var gates = [
        { ok: (w.realm || 0) >= (d.SECT.FOUND_REALM || 4), txt: t('sect.ui.gate.realm') },
        { ok: !!w.factionId && w.factionId !== 'sect' ? SQ.Factions.rankOf(w, d) >= (d.SECT.FOUND_RANK || 4) : w.everDefected === true, txt: t('sect.ui.gate.identity') },
        { ok: (w.factionRepPeak || 0) >= (d.SECT.FOUND_REP_PEAK || 2000), txt: t('sect.ui.gate.peak', { n: w.factionRepPeak || 0 }) },

      ];
      h += '<div class="reqchips">' + gates.map(function (g) {

        ['right', 'neutral', 'evil'].forEach(function (a) {

        });
        h += '</div><p class="hint">' + esc(t('sect.align.' + ui.sectPick.align + '.rule')) + '</p>';
        h += '<div class="sectnamebox"><input id="sect-name-input" class="tdta" style="min-height:38px" maxlength="6" placeholder="' + esc(t('sect.ui.name.ph')) + '" value="' + esc(ui.sectRollName || '') + '"></div>';
        /* N20 接线：正典「掷名可重掷 · 免费无限次」（自立门户卷 §2.2）此前在 UI 完全没有入口，         * sectFound 的 nameIdx 形参一直闲置 ⇒ 补钮并走引擎同一式子（SQ.Sect.rollIdx / nameOfIdx，不抄第二份表名） */
        h += '<button class="linkbtn" data-act="sectRollName" style="margin-top:6px">' + esc(t('sect.ui.name.roll')) + '</button>';
        h += '<button class="primary" data-act="sectFound" style="width:100%;margin-top:8px">' + esc(t('sect.found.btn')) + '</button>';
      }
      if (w.sect === null && SQ.Sect.canFound(w, p, d, state.meta).reason === 'done') {
        h += '<p class="hint">' + esc(t('sect.ui.succ.done')) + '</p>';

    }
    h += '<div class="kv"><span><b>' + esc(sec.name) + '</b> · ' + esc(t('sect.gate.' + sec.gate + '.name')) + ' · ' + esc(t('sect.align.' + sec.align + '.name')) + '</span>' +
      '<span>' + esc(t('sect.ui.rep', { n: SQ.fmt(SQ.Sect.sectRep(w, d)) })) + '</span></div>';
    h += '<div class="kv"><span>' + esc(t('sect.ui.power', { n: SQ.fmt(SQ.Sect.sectPower(w, p, d, m)) })) + '</span>' +
      '<span>' + esc(t('sect.ui.war.record', { w: sec.warRecord.wins, l: sec.warRecord.loses })) + '</span>' +
      /* 弟子出力折算战功（自立门户卷 §战功制 line 219 / WAR_DISC_K）：`discipleMerit` 一直在参战
       * 结算里加进 war.merit（`factions.js:349-350`），但界面上玩家只看得到总数、看不到是哪笔贡献
       * ⇒ 词条在册却零渲染点（N20 逐条核对中判为「该接线」的那一条），此处显形为一条 kv。 */

    /* N20 接线：继位择人的规则（供奉不可继位）此前只靠按钮 disabled 隐含，无一句释文 */
    if (sec.disciples.length) h += '<p class="hint">' + esc(t('sect.ui.succ.pick')) + '</p>';
    if (!sec.disciples.length) h += '<p class="hint">' + esc(t('sect.disc.empty')) + '</p>';
    sec.disciples.forEach(function (dsc) {
      var nm = SQ.Sect.discName(w, dsc, p);
      var pw = SQ.Sect.discPower(w, p, d, dsc);
      h += '<div class="lrow"><div class="nm">' + esc(nm) +
        (dsc.offering ? ' <span class="tierbadge t4">' + esc(t('sect.disc.offering')) + '</span>' : '') +
        (dsc.tianjiao ? ' <span class="tierbadge t2">' + esc(t('prodigy.system')) + '</span>' : '') + '</div>' +
        '<div class="meta">' + (dsc.offering ? '' : esc(t('sect.disc.row', { name: '', apt: t('sect.disc.apt.' + dsc.tier), realm: t('realm.' + dsc.realm) }) + ' · ')) +
        esc(t('sect.disc.power', { n: SQ.fmt(pw) })) +
        /* N20 接线：升境进度引擎每月结算（sect.js PROG_NEED 余数结转），视图此前完全不显 */
        (!dsc.offering && (d.SECT.PROG_NEED || [])[dsc.realm] != null ? ' · ' +
          esc(t('sect.disc.prog', { p: SQ.fmt(Math.floor(dsc.prog || 0)), need: SQ.fmt((d.SECT.PROG_NEED || [])[dsc.realm]) })) : '') +
        '</div>' +
        '<div class="acts">';
      if (!dsc.offering) {
        [0, 1, 2].forEach(function (iv) {
          h += '<button data-act="sectInvest" data-v="' + dsc.id + '" data-c="' + iv + '" class="' + (dsc.inv === iv ? 'primary' : '') + '">' + esc(t('sect.disc.inv.' + iv)) + '</button>';
        });
      }
      h += '<button data-act="sectDispatch" data-v="' + dsc.id + '">' + esc(t('sect.ui.dispatch')) + '</button>';
      if (w.realm >= d.REALMS.length - 1) h += '<button data-act="sectSucceed" data-v="' + dsc.id + '"' + (dsc.offering ? ' disabled' : '') + '>' + esc(t('sect.ui.succ.btn')) + '</button>';
      h += '</div></div>';
    });
    /* 招收 / 供奉 */
    var cand = sec.candidate;
    if (cand) {
      h += '<div class="lrow"><div class="nm">' + esc(SQ.Sect.discName(w, { nm: cand.nm, offering: null }, p)) + ' · ' + esc(t('sect.disc.apt.' + cand.tier)) + '</div>' +
        '<div class="meta">' + esc(t('sect.disc.candidate', { name: '' })) + '</div>' +
        '<div class="acts"><button class="primary" data-act="sectAccept">' + esc(t('sect.ui.accept')) + '</button>' +
        '<button data-act="sectReject">' + esc(t('sect.ui.reject')) + '</button></div></div>';
    } else {
      var rCd = sec.recruitAt > 0 && Date.now() - sec.recruitAt < (d.SECT.RECRUIT_CD_MS || 86400000);
      h += '<button data-act="sectRecruit"' + (rCd ? ' disabled' : '') + ' style="margin:6px 0">' +
        esc(rCd ? t('sect.ui.recruit.cd', { t: timeLeftText(sec.recruitAt + d.SECT.RECRUIT_CD_MS - Date.now()) }) : t('sect.disc.recruit')) + '</button>';
    }
    /* 请为供奉（bond ≥70 道友，≤2 名） */
    var offN = sec.disciples.filter(function (x) { return x.offering; }).length;
    if (offN < (d.SECT.OFFER_CAP || 2) && sec.disciples.length < SQ.Sect.discCap(w, d)) {
      var candB = (d.COMPANIONS || []).filter(function (c) {
        return ((w.bonds || {})[c.id] || 0) >= (d.SECT.OFFER_BOND || 70) && !sec.disciples.some(function (x) { return x.offering === c.id; });
      });
      if (candB.length) {
        h += '<div class="chips">';
        candB.forEach(function (c) {
          h += '<button data-act="sectOffer" data-v="' + c.id + '">' + esc(t('sect.disc.offer.btn')) + ' · ' + esc(t('bond.' + c.id + '.name')) + '</button>';
        });
        h += '</div><p class="hint">' + esc(t('sect.disc.offer.need')) + '</p>';
      }
    }
    /* 四设施 */
    h += '<p class="hint" style="margin:10px 0 2px;font-weight:650">' + esc(t('sect.ui.facs')) + '</p>';
    (d.SECT.FAC_IDS || []).forEach(function (fid) {
      var lv = sec.fac[fid] || 0;
      var maxed = lv >= (d.SECT.FAC_MAX || 5);
      var cost = maxed ? 0 : (d.SECT.FAC_COST || [])[lv];
      h += '<div class="lrow"><div class="nm">' + esc(t('sect.fac.' + fid + '.name')) + ' <span class="hint">' + esc(t('sect.fac.lv', { lv: lv })) + '</span></div>' +
        '<div class="meta">' + esc(t('sect.fac.' + fid + '.desc')) + (fid === 'danfang'
          ? (lv < 1 ? ' · ' + esc(t('sect.fac.danfang.pending'))
            : ' · ' + esc(t('sect.fac.danfang.mat', { m: ((d.ALCHEMY || {}).TRIBUTE || {}).FAC_MONTHS || 30 })))
          : '') + '</div>' +
        '<div class="acts"><button data-act="sectBuild" data-v="' + fid + '"' + ((maxed || w.stones < cost) ? ' disabled' : '') + '>' +
        esc(maxed ? t('sect.fac.max') : t('sect.fac.cost', { n: SQ.fmt(cost) })) + '</button></div></div>';
    });
    /* 战争：对敌下战书；进行中战争走既有应战入口（势力页/传闻卡同源） */
    var sectEntry = null;
    (w.factions || []).forEach(function (f) { if (f.id === 'sect') sectEntry = f; });
    if (sectEntry && !w.factionWar) {
      var enemies = (w.factions || []).filter(function (f) { return f.id !== 'sect' && (sectEntry.rel || {})[f.id] === 'enemy'; });
      if (enemies.length) {
        h += '<p class="hint" style="margin:10px 0 2px;font-weight:650">' + esc(t('sect.war.btn')) + '</p><div class="chips">';
        var dCd = (sec.declareAt || 0) > 0 && Date.now() - sec.declareAt < (d.SECT.WAR_DECLARE_CD_MS || 86400000);
        enemies.forEach(function (f) {
          h += '<button data-act="sectWar" data-v="' + f.id + '"' + (dCd ? ' disabled' : '') + '>' + esc(f.name) + '</button>';
        });
        h += '</div>';
      }
    }
    if (w.factionWar && SQ.Factions.warSideOf(w)) {
      h += '<p class="hint" style="margin-top:8px">' + esc(t('sect.war.guard')) + ' → ' + esc(t('rumor.war.go')) + '</p>';
    }
    $('tab-sect').innerHTML = h;
  }

    if ((fu.customs || []).length) {
      h += '<p class="hint" style="margin:12px 0 2px;font-weight:650">' + esc(t('fuse.ui.customs')) + '</p>';
      h += '<div class="meta hint" style="margin-top:8px">' + esc(t('fuse.chaos.hint')) + '</div>';
    }
    var fuR0 = (fu.lastReforgeAt || 0) + ((d.FUSE || {}).REFORGE_CD_MS || 86400000);
    (fu.customs || []).forEach(function (c) {

      var hasStoneR = ((w.materials || {})['mat_wudao'] || 0) >= 1;
      var canR = cdR <= 0 && w.stones >= costR && hasStoneR;
      var rBtnTxt = cdR > 0 ? t('fuse.reforge.cd', { t: timeLeftText(cdR) })
        : t('fuse.reforge.btn') + ' · ' + t('fuse.reforge.cost', { n: SQ.fmt(costR) });
      h += '<div class="lrow"><div class="nm">' + esc(c.name) + ' <span class="tierbadge t' + c.tier + '">' + esc(t('skill.tier.' + ['huang', 'xuan', 'di', 'tian'][c.tier])) + '</span>' +
        ' <span class="hint">' + esc(t('fuse.ui.gen', { n: c.gen })) + '</span>' +

        '<div class="meta">' + esc(SQ.effectsToText(c.effects, 'xiuxian')) + '</div>' +
        '<div class="meta hint">' + esc(c.parents.map(function (pp) { return pp.name; }).join(' + ')) + '</div>' +
        '<div class="acts"><button data-act="customReforge" data-v="' + c.id + '"' + (canR ? '' : ' disabled') + '>' + esc(rBtnTxt) + '</button></div></div>';
    });
    return h;

  /* ── 器灵面板（法宝页尾 · 融合器灵卷 B5）── */
  function renderSpiritPanel() {

    if (!SQ.Fusion) return '';
    var entries = SQ.Fusion.equippedEntries(w, p);

      else if (sk && sk.def.field) {
        var liveS = (w.buffs || []).some(function (b) { return b.source === 'spirit_' + sk.id && b.until > Date.now(); });
        if (liveS) { state2 = t('spirit.ui.skill.active'); disabled = true; }

        '<div class="meta">' + esc(t('spirit.ui.skill')) + ' · ' + esc(sk ? t('spirit.skill.' + sk.id + '.name') + ' — ' + t('spirit.skill.' + sk.id + '.desc') : '') +
        (state2 ? ' · ' + esc(state2) : '') + '</div>' +
        '<div class="acts"><button data-act="spiritSkill" data-v="' + pr.e.id + '"' + (disabled ? ' disabled' : '') + '>' + esc(t('spirit.ui.skill.btn')) + '</button></div></div>';
    });

  /* ── 全局动作委托 ── */
  document.addEventListener('click', async function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.dataset.act, v = el.dataset.v;
    var keepScroll = document.querySelector('.tabbody') ? document.querySelector('.tabbody').scrollTop : 0;
    if (act === 'tab') { switchTab(v); return; }
    /* 法与器合并页（页面整合批 2026-10-06 · UI 卷 §3.4a；标签化批 2026-10-09 改顶部标签）：
     * `lawChip` = 页顶两枚标签（功法 / 法器），互斥显示，切一枚就只渲染那一段。
     * `lawJump` = 概览条三格，语义随标签化改：**目标段没选中 → 切过去并回顶**（原来「锚跳到看不见的段」
     * 在无滚动可依托的标签态下等于没反应）；**目标段已选中 → 仍滚到该段段标**（长段内回段首，
     * 滚动容器是 `.tabbody` 而非 window，`prefers-reduced-motion` 直出——与渡劫演出同口径）。
     * 两条都必须 `return`：委托尾部会把 `.tabbody.scrollTop` 复原成动作前的值（keepScroll），
     * 不 return 就切完标签又被拽回原处——与 `logFilter` 同口径。 */
    if (act === 'lawChip') { lawChipTo(v); return; }
    if (act === 'lawJump') {
      if (lawChipOf() !== (v === 'qi' ? 'qi' : 'fa')) { lawChipTo(v); return; }
      var lawT = document.getElementById('lawsec-' + v);
      var lawB = document.querySelector('.tabbody');
      if (lawT && lawB) {
        var lawTop = lawB.scrollTop + (lawT.getBoundingClientRect().top - lawB.getBoundingClientRect().top) - 8;
        if (lawTop < 0) lawTop = 0;
        if (reducedMotion()) lawB.scrollTop = lawTop;
        else if (lawB.scrollTo) lawB.scrollTo({ top: lawTop, behavior: 'smooth' });
        else lawB.scrollTop = lawTop;
      }
      return;
    }
    if (act === 'claim') {
      var before = ws().tribulation.attempts;
      snapTrib();
      await SQ.claim(state);
      afterClaim(before);
      renderAll();
      return;
    }
    if (act === 'detailRate') { ui.detailRate = !ui.detailRate; renderTab(); return; }
    if (act === 'detailTrib') { ui.detailTrib = !ui.detailTrib; renderTab(); return; }
    if (act === 'role') { showRole(); return; }
    if (act === 'karma') { showKarma(); return; }
    if (act === 'matWudao') { openMatWudao(); return; }
    if (act === 'setZone') { await SQ.Actions.setZone(state, parseInt(v)); renderAll(); return; }
    /* ── 系统深化批 B3：域主挑战（一次性掷判，胜负 toast + 引擎日志）/ 残片兑换（z6~8 带 choice）── */
    if (act === 'challengeBoss') {
      var zbZ = ws().zoneBoss ? ws().zoneBoss.zone : ws().zone;
      var resB = await SQ.Actions.challengeBoss(state);
      if (resB && resB.ok) {
        toast(resB.win
          ? t('zone.boss.win', { zone: t('combat.zone.' + zbZ), gear: resB.item.name, stones: SQ.fmt(resB.stones) })
          : t('zone.boss.lose', { zone: t('combat.zone.' + zbZ) }));
      } else if (resB && resB.reason === 'cd') {
        toast(t('zone.boss.cd', { t: timeLeftText(resB.retryAt - Date.now()) }));
      }
      renderAll();
      return;
    }
    if (act === 'exchangeShard') {
      var resS = await SQ.Actions.exchangeShard(state, parseInt(v), el.dataset.c || null);
      if (resS && resS.ok) toast(t('zone.shard.done'));
      else if (resS && resS.reason === 'shards') toast(t('zone.shard.fail', { n: resS.have, need: resS.need }));
      renderAll();
      return;
    }
    /* 修行状态切换（模式二选一）：mutate 内幂等 + 写日志；重绘全页（修行页选中态/秘境页提示联动） */
    if (act === 'setMode') { await SQ.Actions.setMode(state, v); renderAll(); return; }
    /* ── G16 势力（势力批 v2.4）：加入 CONFIRM / 叛离 CONFIRM / 特席购买 / 关系全列开关 ── */
    if (act === 'facRelAll') { ui.facRelAll = !ui.facRelAll; renderTab(); return; }
    if (act === 'joinFaction') {
      var fJ = SQ.Factions.byId(ws(), v);
      if (!fJ) return;
      /* 择门批（需求 3）：已在一门时不可另投（按钮已置灰，此处兜底 + 提示） */
      if (ws().factionId) { toast(t('faction.join.occupied')); return; }
      askConfirm(t('faction.join'), t('faction.confirm.join', { name: fJ.name }), async function () {
        var resJ = await SQ.Actions.joinFaction(state, v);
        if (resJ && resJ.ok) toast(t('faction.log.join', { name: fJ.name }));
        else if (resJ && resJ.reason === 'sect') toast(t('faction.join.sectlock'));
        else if (resJ && resJ.reason === 'occupied') toast(t('faction.join.occupied'));
        renderAll();
      });
      return;
    }
    /* 叛离入口（系统深化批 B4 改造）：升级为去向感知两级弹窗——处理见下方 leaveFaction/defectGo 段 */
    if (act === 'buyMerchant') { await SQ.Actions.buyMerchant(state, parseInt(v)); renderAll(); return; }
    if (act === 'slotArt') {
      /* 满槽 → 进入替换选择模式（B4：点按入槽，满槽弹替换；原位替换保主修位语义） */
      var wSA = ws();
      if ((wSA.artsSlots || []).length >= D().ARTS_SLOTS && (wSA.artsSlots || []).indexOf(v) < 0) {
        ui.slotPickFor = v;
        renderTab();
        return;
      }
      await SQ.Actions.slotArt(state, v);
      ui.slotPickFor = null;
      renderAll();
      return;
    }
    if (act === 'slotReplace') {
      await SQ.Actions.slotArt(state, v, el.dataset.r);
      ui.slotPickFor = null;
      renderAll();
      return;
    }
    if (act === 'slotPickCancel') { ui.slotPickFor = null; renderTab(); return; }
    if (act === 'artsGroup') { ui.artsGroup = v; ui.artsGroupVal = null; renderTab(); return; }
    if (act === 'artsGroupVal') { ui.artsGroupVal = ui.artsGroupVal === v ? null : v; renderTab(); return; }
    if (act === 'unslotArt') { await SQ.Actions.unslotArt(state, v); renderAll(); return; }
    if (act === 'upgradeArt') { await SQ.Actions.upgradeArt(state, v); renderAll(); return; }
    if (act === 'shopTab') { ui.shopBlack = v === '1'; renderTab(); return; }
    if (act === 'refreshShop') {
      await SQ.Actions.refreshShop(state, ui.shopBlack);
      renderAll();
      return;
    }
    if (act === 'toggleAutoTrib') {
      await SQ.Actions.setAutoTrib(state, !(state.settings && state.settings.autoTrib));
      renderTab();
      return;
    }
    /* 自动奇遇（自动批）：开关即时生效，存 settings.autoEvent（mutate 落盘） */
    if (act === 'toggleAutoEvent') {
      await SQ.Actions.setAutoEvent(state, !(state.settings && state.settings.autoEvent));
      /* 开启瞬间若已有挂起抉择，立即自动结算，不留残窗 */
      if ((state.settings && state.settings.autoEvent) && ws() && ws().pendingChoice) autoResolveChoice();
      renderTab();
      return;
    }
    if (act === 'tabUp' || act === 'tabDown') {
      await moveTab(v, act === 'tabUp' ? -1 : 1);
      renderTabbar();
      renderSettings();
      return;
    }
    /* 奇遇倾向（体验批）：改偏好即落盘；下次自动抉择按新倾向取分支 */
    if (act === 'setEventPref') {
      await SQ.Actions.setEventPref(state, v);
      renderTab();
      return;
    }
    if (act === 'trib') {
      /* 手动渡劫：劫前成算快照 → 掷判 → 走与自动渡劫同一套呈报（演出/红点/重绘） */
      var prevT = ws().tribulation.attempts;
      snapTrib();
      var resT = await SQ.Actions.tryTrib(state);
      if (resT) { afterClaim(prevT); renderAll(); }
      return;
    }
    if (act === 'buy') {
      var black = el.dataset.b === '1';

    if (sigs.arts !== ui.lastArtsSig && ui.tab !== 'arts') ui.newArtsDot = true;
    ui.lastArtsSig = sigs.arts;
    if (sigs.treasure !== ui.lastTreasureSig && ui.tab !== 'treasure') ui.newTreasureDot = true;
    ui.lastTreasureSig = sigs.treasure;
    if (sigs.bonds !== ui.lastBondSig && ui.tab !== 'bonds') ui.newBondDot = true;
    ui.lastBondSig = sigs.bonds;
    if (sigs.shop !== ui.lastShopSig && ui.tab !== 'shop') ui.newShopDot = true;
    ui.lastShopSig = sigs.shop;
    /* 名号更迭演出（善恶名号批）：段位基线跨段即演（日志同源由 recalcDerived 入档 'karma'）。
       仅在无其它浮层/演出时触发，避免叠层；有浮层则保持旧基线，顺延下次收功再演。 */
    var rankSys = pack().worldSystems;
    var rankNow = (rankSys && rankSys.rankOf) ? rankSys.rankOf(w) : '';
    if (ui.karmaRank && rankNow && rankNow !== ui.karmaRank && !overlayOpen()) {
      showKarmaRank(rankNow, rankSys.tierOf(w));
      ui.karmaRank = rankNow;
    }
  }

  /* 是否有浮层/演出遮挡（名号更迭演出避让判定）：任一可见即顺延，不叠层 */
  function overlayOpen() {
    return !!document.querySelector('.mask:not(.hide), .trib-mask:not(.hide), .cave-stage:not(.hide),' +
      ' .spouse-stage:not(.hide), .excl-mask:not(.hide)');
  }

  /* 红点信号（走查 v2.5 §6）：功法=已学会部数、法宝=在库件数、道友=已结缘人数、坊市=补货时间戳 */
  function resDotSigs(w) {
    var bonded = 0;
    (D().COMPANIONS || []).forEach(function (c) {
      var a = (w.bonds || {})[c.id] || 0;
      if (a >= 1) bonded++;
    });
    return {
      arts: (w.artsKnown || []).length,
      treasure: (w.treasures && w.treasures.owned ? w.treasures.owned.length : 0),
      bonds: bonded,
      shop: w.shop && w.shop.nextRestock || 0
    };
  }

  /* 未读判定基线标识：log 尾插、feed 头插（unshift），二者均封顶 50 条，
     长度到顶后不再增长——只能比「最新一条」的标识。 */
  function logKeyOf(log) {
    var e = log && log[log.length - 1];
    return e ? (e.ts + ':' + e.cat + ':' + e.text) : '';
  }
  function feedKeyOf(feed) {
    var f = feed && feed[0];
    return f ? (f.ts + ':' + f.id + ':' + f.branch) : '';
  }

  var tickTimer = null;
  function stopTick() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }
  function startTick() {
    if (tickTimer) return;
    tickTimer = setInterval(async function () {
      if (!$('modal-choice').classList.contains('hide')) return; /* 选择模态期间暂停自动结算展示 */
      var prev = ws() ? ws().tribulation.attempts : 0;
      var keep = document.querySelector('.tabbody') ? document.querySelector('.tabbody').scrollTop : 0;
      try {
        snapTrib();                       /* 劫前成算/损失快照（F7 复盘行） */
        await SQ.claim(state);
        afterClaim(prev);
        renderAll();
        var tb = document.querySelector('.tabbody');
        if (tb) tb.scrollTop = keep;
      } catch (e) { /* 单次 tick 失败静默 */ }
    }, 1000);
  }

  /* ── MAIN 入口 ── */
  function enterMain() {
    ui.lastAttempts = ws().tribulation.attempts;
    /* 基线对齐当前存档：进场前（含离线结算）已产生的叙事/日志视为已读，
       只对本次会话内新增的亮红点——离线那批由「出关呈报」浮层交代 */
    ui.lastLogKey = logKeyOf(ws().log);
    ui.announcedLogKey = ui.lastLogKey;      /* 进场前（含离线）已产生的日志视为已呈报，首 tick 不重复弹 */
    ui.karmaRank = pack().worldSystems.rankOf(ws());   /* 名号段位基线：进场前（含离线）跨段不补演，只演本次会话内新跨段 */
    ui.lastFeedKey = feedKeyOf(ws().eventHistory.feed);
    ui.newLogDot = false; ui.newFeedDot = false;
    ui.rumorSeenAt = null;                /* G17 传闻红点基线：进场惰性对齐（存档既有传闻不打扰） */
    var baseSigs = resDotSigs(ws());          /* 走查 v2.5 §6：四类红点基线对齐当前档 */
    ui.lastArtsSig = baseSigs.arts; ui.lastTreasureSig = baseSigs.treasure;
    ui.lastBondSig = baseSigs.bonds; ui.lastShopSig = baseSigs.shop;
    ui.newArtsDot = false; ui.newTreasureDot = false; ui.newBondDot = false; ui.newShopDot = false;
    ui.achvSnap = achvRedDotSig();          /* 成就页红点基线：进场前（含离线）已达成者视为已读 */
    /* 回线首帧呈报闸（离线≤5min 不打扰批）：仅当 boot 的 claim 真的结算了离线才弹。
       判定依据：settle 与 core.claim 共用同一枚 now ⇒ 真结算时 lastOffline.at 恰等于 lastSave；
       离线 ≤5min 未触发结算（settle 不写 lastOffline），存档里残留的是上一段旧记录，
       其 at 早于本次 lastSave —— 直接标为已读，不再打扰。 */
    var lo0 = ws().lastOffline;
    ui.seenOfflineAt = (lo0 && lo0.at === ws().lastSave) ? 0 : (lo0 ? lo0.at : 0);
    switchTab('idle');
    show('main');
    checkIo();                              /* boot 的 load/save 若失败，进场即提示（#89） */
    var w0 = ws();
    if (w0.pendingChoice) {
      if (autoEventOn()) autoResolveChoice();   /* 自动批：进线即自动结算，不弹窗 */
      else showChoice();
    }
    else if (w0.lastOffline && w0.lastOffline.at !== ui.seenOfflineAt) showOfflineReport();
    startTick();
  }

  /* ── boot 模式：先 await 读档再首绘 ── */
  async function boot() {
    bindCreationTexts();
    show('loading');
    try {
      var s = await SQ.claim(state);
      if (hasProfile(s)) enterMain();
      else show('c1');
    } catch (e) {
      show('c1');
    }
  }
  boot();
})();
</script>
</body>
</html>
