<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>三千世界</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="wrap">
  <!-- LOADING -->
  <div id="sc-loading" class="panel"><p class="sub" id="loading-text">…</p></div>

  <!-- 屏 1 · 起名（步序 1） -->
  <div id="sc-c1" class="panel hide">
    <div class="stepper" id="c1-steps"></div>
    <h1 id="c1-title"></h1>
    <label class="kv"><span id="c1-label"></span></label>
    <input id="c1-name" maxlength="8" />
    <p class="err hide" id="c1-err"></p>
    <div class="row between">
      <button id="c1-random"></button>
      <button id="c1-next" class="primary"></button>
    </div>
  </div>

  <!-- 屏 3 · 观天赋 + 问道初心（步序 3；天赋池由屏 2 所选世界决定） -->
  <div id="sc-c2" class="panel hide">
    <div class="stepper" id="c2-steps"></div>
    <h1><span id="c2-title"></span><span class="combo-badge" id="c2-combo"></span></h1>
    <p class="hint" id="c2-hint"></p>
    <div class="cards" id="c2-cards"></div>
    <div class="synnote hide" id="c2-syn"></div>
    <h1 style="font-size:15px;margin-top:16px" id="c2b-title"></h1>
    <p class="hint" id="c2b-hint"></p>
    <div class="biascards" id="c2-bias"></div>
    <div class="row between">
      <button id="c2-back"></button>
      <span style="display:flex;gap:8px">
        <button id="c2-reroll"></button>
        <button id="c2-confirm" class="primary"></button>
      </span>
    </div>
  </div>

  <!-- 屏 2 · 择界（步序 2） -->
  <div id="sc-c3" class="panel hide">
    <div class="stepper" id="c3-steps"></div>
    <h1 id="c3-title"></h1>
    <p class="sub" id="c3-pick"></p>
    <p class="hint" id="c3-hint"></p>
    <div id="c3-list"></div>
    <p class="err hide" id="c3-err"></p>
    <div class="row between">
      <button id="c3-back"></button>
      <button id="c3-go" class="primary"></button>
    </div>
  </div>

  </div>

<!-- MAIN：顶栏 + 六 Tab + 底栏（窄屏单栏；≥720px 左栏导航 + 右栏内容。
     放在 .wrap 之外，才不会被创角三屏的 480px 窄栏限宽） -->
<div id="sc-main" class="hide">
    <div class="panel topbar">
      <div class="wm" id="m-wm" aria-hidden="true"></div>
      <div class="topline name" id="m-who" data-act="role"></div>
      <div class="topline">
        <span class="rankchip" id="m-rank" data-act="karma"></span>
        <span class="stones" id="m-stones"></span>
      </div>
      <div class="topline" id="m-sub"></div>
    </div>
    <div class="tabbody">
      <div id="tab-idle" class="panel"></div>
      <div id="tab-combat" class="panel hide"></div>
      <div id="tab-arts" class="panel hide"></div>
      <div id="tab-treasure" class="panel hide"></div>
      <div id="tab-shop" class="panel hide"></div>
      <div id="tab-faction" class="panel hide"></div>
      <div id="tab-bonds" class="panel hide"></div>
      <div id="tab-event" class="panel hide"></div>
      <div id="tab-alchemy" class="panel hide"></div>
      <div id="tab-prodigy" class="panel hide"></div>
      <div id="tab-sect" class="panel hide"></div>
      <div id="tab-achv" class="panel hide"></div>
      <div id="tab-legacy" class="panel hide"></div>
      <div id="tab-journal" class="panel hide"></div>
      <div id="tab-settings" class="panel hide"></div>
    </div>
    <div class="tabbar" id="m-tabbar"></div>
</div>

<!-- 锁定确认模态（F1：入定摘要 pills = 天赋 + 初心） -->
<div id="modal-lock" class="mask hide">
  <div class="modal">
    <h2 id="mk-title"></h2>
    <p id="mk-text"></p>
    <p class="hint" id="mk-sumlabel"></p>
    <div class="pills" id="mk-summary"></div>
    <div id="mk-legacy"></div>
    <div class="row between">
      <button id="mk-cancel"></button>
      <button id="mk-ok" class="primary"></button>
    </div>
  </div>
</div>

<!-- 选择奇遇模态（F3：三分支 + 判定演出 + 结果页；必须选择才关闭） -->
<div id="modal-choice" class="mask hide">
  <div class="modal">
    <div class="mc-badges" id="mc-badges"></div>
    <h2 id="mc-title"></h2>
    <p class="mc-story" id="mc-story"></p>
    <div id="mc-branches"></div>
    <p class="mc-foot hint" id="mc-foot"></p>
    <div id="mc-judging" class="judging hide"></div>
    <div id="mc-result" class="hide">
      <p class="res-check" id="mc-check"></p>
      <p class="res-karma" id="mc-karma"></p>
      <p id="mc-eff" class="hint" style="text-align:center"></p>
      <p id="mc-excl" class="hint hide" style="text-align:center"></p>
      <p id="mc-bondlock" class="hint hide" style="text-align:center;opacity:.75"></p>
      <button id="mc-ok" class="primary" style="width:100%"></button>
    </div>
  </div>
</div>

<!-- 角色浮层 -->
<div id="modal-role" class="mask hide">
  <div class="modal">
    <h2 id="mr-title"></h2>
    <div id="mr-attrs"></div>
    <div class="cards" id="mr-talents" style="margin-top:10px"></div>
    <div class="row between">
      <button id="mr-karma"></button>
      <button id="mr-wash" class="hide" data-act="washOpen"></button>
      <button id="mr-close" class="primary"></button>
    </div>
  </div>
</div>

<!-- 洗髓浮层（天赋池设计 v1.8 §十 · 洗髓批）：三格择一替换 + 三候选择一 → 换骨 -->
<div id="modal-talentwash" class="mask hide">
  <div class="modal">
    <h2 id="tw-title"></h2>
    <p id="tw-sub" class="hint"></p>
    <p class="hint" id="tw-pick-label"></p>
    <div class="cards" id="tw-slots"></div>
    <p class="hint" id="tw-cand-label"></p>
    <div class="cards" id="tw-cands"></div>
    <div class="row between">
      <button id="tw-close"></button>
      <button id="tw-ok" class="primary" data-act="washOk"></button>
    </div>
  </div>
</div>

<!-- karma 浮层（F5：四行构成 + 色带游标 + 档位效果摘要） -->
<div id="modal-karma" class="mask hide">
  <div class="modal">
    <h2 id="mkd-title"></h2>
    <p id="mkd-value" style="font-size:20px;font-weight:700"></p>
    <div class="bar slim"><i id="mkd-bar"></i></div>
    <p id="mkd-next" class="hint"></p>
    <p class="hint" id="mkd-ranktitle" style="margin-top:10px;font-weight:650"></p>
    <div id="mkd-ranks" class="rankladder"></div>
    <div id="mkd-parts"></div>
    <p id="mkd-rate" class="hint" style="margin-top:8px"></p>
    <p class="hint" id="mkd-efftitle" style="margin-top:10px;font-weight:650"></p>
    <div id="mkd-effects"></div>
    <button id="mkd-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 通用确认（购买等） -->
<div id="modal-confirm" class="mask hide">
  <div class="modal">
    <h2 id="cf-title"></h2>
    <p id="cf-text"></p>
    <div class="row between">
      <button id="cf-cancel"></button>
      <button id="cf-ok" class="primary"></button>
    </div>
  </div>
</div>

<!-- 真灵承继选择浮层（轮回卷 §3.4「可选一件」玩家入口 · 器灵卷 §九 数据契约）：
     转世触发前择**一件**已觉醒器灵的法宝带入下世；零候选时整层不弹（由 askHeirChoice 直过）。 -->
<div id="modal-heirchoice" class="mask hide">
  <div class="modal">
    <h2 id="hc-title"></h2>
    <p class="hint" id="hc-sub"></p>
    <p class="hint" id="hc-carry" style="font-weight:650"></p>
    <div id="hc-list" style="max-height:52vh;overflow-y:auto"></div>
    <p class="hint" id="hc-verdict"></p>
    <div class="row between">
      <button id="hc-cancel"></button>
      <button id="hc-none"></button>
    </div>
  </div>
</div>

<!-- 出关呈报（F4：lastOffline.at 键控 · 会话一次 · EVENT_CHOICE 优先顺延） -->
<div id="modal-offline" class="mask hide">
  <div class="modal">
    <h2 id="mo-title"></h2>
    <div class="osub" id="mo-sub"></div>
    <div class="ostat" id="mo-stats"></div>
    <p class="hint" id="mo-hint"></p>
    <button id="mo-ok" class="primary" style="width:100%"></button>
  </div>
</div>

<!-- 财 · 此生总账浮层（B2：恒等式置顶 + 收支八行条形 + 占比 + 印章分档） -->
<div id="modal-ledger" class="mask hide">
  <div class="modal">
    <h2 id="mlg-title"></h2>
    <div class="lg-ident" id="mlg-ident"></div>
    <p class="hint" id="mlg-identnote"></p>
    <div class="lg-sec" id="mlg-intitle"></div>
    <div id="mlg-in"></div>
    <div class="lg-sec" id="mlg-outtitle"></div>
    <div id="mlg-out"></div>
    <p class="hint" id="mlg-seal"></p>
    <p class="hint" id="mlg-empty"></p>
    <button id="mlg-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 法 · 修习功法浮层（修行页四柱「法」：只读展示修习槽内功法，与财/地/侣同级，不跳页） -->
<div id="modal-arts" class="mask hide">
  <div class="modal">
    <h2 id="mam-title"></h2>
    <p class="hint" id="mam-sub"></p>
    <div id="mam-list" style="max-height:58vh;overflow-y:auto"></div>
    <button id="mam-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 境界说明浮层（修行页）：十阶一览 + 当前高亮 + 已过/未至三态 -->
<div id="modal-realm" class="mask hide">
  <div class="modal">
    <h2 id="mrm-title"></h2>
    <p class="hint" id="mrm-intro"></p>
    <div id="mrm-list" style="max-height:56vh;overflow-y:auto"></div>
    <button id="mrm-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 百器录浮层（批 2 · B5：12 格双节 = 特殊词条 10 + 独占法宝 2 · 炼化不除名 · 纯荣誉零数值） -->
<div id="modal-gearcodex" class="mask hide">
  <div class="modal">
    <h2 id="mgc-title"></h2>
    <div id="mgc-body" style="max-height:60vh;overflow-y:auto"></div>
    <button id="mgc-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 奇遇回看浮层（批 2 · 交互说明 ★：story 全文 + 首遇时间 + 上次选择与结果；法宝来源行/百器录独占格跳入） -->
<div id="modal-recall" class="mask hide">
  <div class="modal">
    <h2 id="mrc-title"></h2>
    <p class="mc-story" id="mrc-story"></p>
    <p class="hint" id="mrc-first"></p>
    <p class="hint" id="mrc-last"></p>
    <p class="hint" id="mrc-eff"></p>
    <button id="mrc-close" class="primary" style="width:100%;margin-top:6px"></button>
  </div>
</div>

<!-- 悟道石说明浮层（融合坛「悟道石」点按入口：物品介绍 + 获取来源） -->
<div id="modal-matwudao" class="mask hide">
  <div class="modal">
    <h2 id="mwd-title"></h2>
    <p id="mwd-desc"></p>
    <p class="hint" id="mwd-srct" style="margin-bottom:2px;font-weight:650"></p>
    <p class="hint" id="mwd-src" style="margin-top:0"></p>
    <button id="mwd-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 洞府入驻轻演出（批 2 · B3：仅第一次拥有；洞府名 + caveMult + 灵气叙事全文，点按跳过） -->
<div id="cave-stage" class="cave-stage hide">
  <div class="cavebox">
    <div class="cv1" id="cvs-t1"></div>
    <div class="cv2" id="cvs-t2"></div>
    <div class="cv3" id="cvs-t3"></div>
    <div class="cvstory" id="cvs-story"></div>
    <div class="cvskip" id="cvs-skip"></div>
  </div>
</div>

<!-- 道友名录浮层（批 3 · B2/B3：20 格双节四态 + 护法摘要 + 双修状态行；详情五段式为浮层内二级页） -->
<div id="modal-bonds" class="mask hide">
  <div class="modal">
    <h2 id="mbd-title"></h2>
    <div id="mbd-body" style="max-height:62vh;overflow-y:auto"></div>
    <button id="mbd-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 护法位/道侣位择选浮层（择选批）：道友页顶部两位置点开——仅列当前满足条件者，不满足不显示 -->
<div id="modal-slotpick" class="mask hide">
  <div class="modal">
    <h2 id="msp-title"></h2>
    <p class="hint" id="msp-hint"></p>
    <div id="msp-body" style="max-height:56vh;overflow-y:auto"></div>
    <button id="msp-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 提亲 CONFIRM（批 3 · B4：三形态全列，当前档位描金，其余置灰但效果代价全文可见） -->
<div id="modal-propose" class="mask hide">
  <div class="modal">
    <h2 id="mpr-title" style="text-align:center;letter-spacing:.35em"></h2>
    <p class="hint" id="mpr-sub" style="text-align:center"></p>
    <div id="mpr-forms"></div>
    <div class="row between" style="margin-top:12px">
      <button id="mpr-no"></button>
      <button id="mpr-ok" class="primary"></button>
    </div>
    <p class="pfoot" id="mpr-foot"></p>
  </div>
</div>

<!-- 结契轻演出（批 3 · B4：结缘词全屏 2s，点按跳过；文案写意留白红线） -->
<div id="spouse-stage" class="spouse-stage hide">
  <div class="spousebox">
    <div class="sv1" id="sps-t1"></div>
    <div class="sv2" id="sps-t2"></div>
    <div class="sv3" id="sps-t3"></div>
  </div>
</div>

<!-- 天道 · 焚表问天浮层（天道系统批 B1）：卦位六选 + 香火四档 + 奏疏生成/复制 + 本地自问自卜 + 接旨粘贴框 -->
<div id="modal-tiandao" class="mask hide">
  <div class="modal">
    <h2 id="mtd-title" style="text-align:center;letter-spacing:.35em"></h2>
    <p class="hint" id="mtd-cd" style="text-align:center"></p>
    <p class="hint" id="mtd-hexlabel"></p>
    <div class="tdhex" id="mtd-hex"></div>
    <p class="hint" id="mtd-inclabel"></p>
    <div class="chips" id="mtd-incense"></div>
    <textarea id="mtd-free" class="tdta hide" rows="2" style="min-height:52px;margin-top:6px"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="mtd-memo" class="primary" style="flex:1"></button>
      <button id="mtd-local" style="flex:1"></button>
    </div>
    <p class="hint" id="mtd-localhint" style="margin-top:6px"></p>
    <textarea id="mtd-memoout" class="tdta hide" readonly style="margin-top:8px"></textarea>
    <button id="mtd-copy" class="hide" style="width:100%;margin-top:6px"></button>
    <p class="hint" id="mtd-reclabel" style="margin-top:10px"></p>
    <textarea id="mtd-receive" class="tdta" rows="3" style="min-height:64px"></textarea>
    <button id="mtd-parse" class="primary" style="width:100%;margin-top:6px"></button>
    <div class="kv" id="mtd-defy" style="margin-top:8px"></div>
    <button id="mtd-close" style="width:100%;margin-top:8px"></button>
  </div>
</div>

<!-- 天道 · 接旨揭晓（B2）：卷轴展开 + 判词逐字显现 + 领旨/抗旨二选一（抗旨走 CONFIRM 二次确认） -->
<div id="modal-decree" class="mask hide">
  <div class="modal">
    <div class="decree-scroll" id="mdc-scroll">
      <div class="decree-type" id="mdc-type"></div>
      <div class="decree-meta" id="mdc-meta"></div>
      <div class="decree-verdict" id="mdc-verdict"></div>
      <div class="decree-omen" id="mdc-omen"></div>
      <p class="hint" id="mdc-eff" style="text-align:center;margin-top:8px"></p>
    </div>
    <div class="row between" id="mdc-btns" style="margin-top:12px">
      <button id="mdc-defy"></button>
      <button id="mdc-accept" class="primary"></button>
    </div>
    <p class="hint" id="mdc-seen" style="text-align:center;margin-top:10px"></p>
    <button id="mdc-close" style="width:100%;margin-top:8px"></button>
  </div>
</div>

<!-- 天道 · 天象查看浮层（B4）：未览红点即开即消 -->
<div id="modal-omens" class="mask hide">
  <div class="modal">
    <h2 id="mom-title"></h2>
    <div id="mom-body" style="max-height:62vh;overflow-y:auto"></div>
    <button id="mom-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 兵解 · 盖棺之传（第册批 · 用户令「点击兵解做一个效果演出，逐字出现，给当前角色一个类似传记总结」）：
     卷轴观感与逐字节奏复用接旨那一族（.decree-scroll / .decree-type / .decree-verdict ⇒ 零新 CSS），
     正文取引擎 doBingjie 刚写入的 `meta.biographies` 末条——视图不另生成文本，与前世书同源。
     ⚠️ 挂点前缀取 `mrp-` 而非顺手的 `mrc-`：`mrc-title` 已被上面「奇遇回看」浮层占用（同 id 两个 ⇒
     getElementById 只认文档里第一个，标题会写进一个 display:none 的 h2 里，屏上看不见——本批截图取证抓到）。 -->
<!-- 更新公告（第册四批 · UI 卷 §3.4e · 视图代码外置试点）：结构与文案分别活在 view/updatenote.js 与词表里，
     本块只留挂点。刻意**不进 MASKS** ⇒ 点遮罩不关（要玩家亲手点「知道了」，与「奇遇抉择」同一套纪律）。
     挂点前缀 `mun-`（全库唯一由审计 D6 守）。 -->
<div id="modal-updatenote" class="mask hide">
  <div class="modal">
    <div class="decree-scroll">
      <div class="decree-type" id="mun-title"></div>
      <div id="mun-text" style="max-height:58vh;overflow-y:auto"></div>
    </div>
    <button id="mun-go" class="primary" data-act="noteClose" style="width:100%;margin-top:12px"></button>
  </div>
</div>

<div id="modal-recap" class="mask hide">
  <div class="modal">
    <div class="decree-scroll">
      <div class="decree-type" id="mrp-title"></div>
      <div class="decree-verdict" id="mrp-text" style="max-height:58vh;overflow-y:auto"></div>
    </div>
    <button id="mrp-go" class="primary" style="width:100%;margin-top:12px"></button>
  </div>
</div>

<!-- 渡劫呈报（渡劫演出重做批：主题感知卡片 + 成算环 + 数据行） -->
<div id="trib-stage" class="trib-mask hide">
  <div class="trib-card" id="trib-box">
    <div class="trib-ring" id="trib-ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="trk" cx="50" cy="50" r="42"></circle>
        <circle class="tfl" id="trib-arc" cx="50" cy="50" r="42"></circle>
      </svg>
      <div class="tri-in"><span class="tri-p" id="trib-ring-p">--</span><span class="tri-u">%</span></div>
    </div>
    <div class="t1" id="trib-t1"></div>
    <div class="t2" id="trib-t2"></div>
    <div class="trib-rows" id="trib-rows"></div>
    <div class="t2 hide" id="trib-guard"></div>
    <div class="trib-skip hide" id="trib-skip"></div>
  </div>
</div>

<!-- 独占奖励全屏演出（F3） -->
<div id="excl-stage" class="excl-mask hide">
  <div class="excl-box">
    <div class="e1" id="excl-t1"></div>
    <div class="e2" id="excl-t2"></div>
    <div class="e3" id="excl-t3"></div>
  </div>
</div>

<!-- 名号更迭全屏演出（善恶名号批）：跨段瞬间弹，点按或 3.2s 自动收 -->
<div id="rank-stage" class="rank-mask hide">
  <div class="rank-box">
    <div class="r1" id="rank-t1"></div>
    <div class="r2" id="rank-t2"></div>
    <div class="r3" id="rank-t3"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
(function () {
  var SQ = window.SQ;
  var state = {};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };

  var draft = { name: '', roll: null, worldId: null, worldNames: {}, bias: 'neutral', legacy: null };
  var ui = {
    tab: 'idle',
    detailRate: false, detailTrib: false,
    logFilter: 'all', shopBlack: false,
    lastAttempts: 0, lastLogKey: '', toasts: [],
    announcedLogKey: '',                    /* 动作处已就同一日志提示过的标识：tick 侧据此避免同文重复呈报 */
    newLogDot: false,                       /* 日志页未读红点（afterClaim 置位，进页清除） */
    newFeedDot: false,                      /* 奇遇页未读红点（同上；基线见 lastFeedKey） */
    rumorSeenAt: null,                      /* G17 传闻红点基线（走查修复）：已读时点，其后出生的传闻才亮 */
    feedExpand: false, lastFeedKey: '',     /* 奇遇页叙事流折叠态（F2）+ 未读判定基线（最新条标识） */
    seenOfflineAt: 0,                       /* 出关呈报 at 键控 · 会话一次（F4） */
    seenDeathAt: 0, deathPending: false,    /* 坐化呈报（寿元批）：同 at 键控 · 确定后进创角 */
    ioErrSeen: null, tickErrSeen: null,                        /* 存档 I/O 失败提示去重（平台关卡 #89） */
    caveStory: {},                          /* 洞府叙事展开态（B3；未达资格者本就不给展开） */
    tribSnap: null,                         /* 渡劫前 {p, loss} 快照（F7 复盘行） */
    artsGroup: 'tier', artsGroupVal: null,  /* 功法页双维筛选（B4 + 体验批）：品阶|阵营 × 选中值（null=不筛，已学会与图鉴同受） */
    lawChip: 'fa',                          /* 法与器页顶部标签（标签化批 2026-10-09）：'fa' 功法段 | 'qi' 法器段，两段互斥；纯 UI 态不入存档 */
    slotPickFor: null,                      /* 满槽替换选择模式（B4）：待入槽的功法 id */
    bondDetail: null,                       /* 名录浮层二级页（B3）：当前查看的 npcId */
    unwalked: {},                           /* 未择之路展开态（B8）：feed ts 键控；卸下照世镜即复位 */
    bondSnap: null,                         /* 侣 chip 红点快照（B1）：升档/可提亲变化检测 */
    caveSnap: null,                         /* 地 chip 红点快照（B1）：新福地解锁变化检测 */
    achvSnap: null,                         /* 成就页红点快照：新成就达成变化检测（meta.achv 只增） */
    spouseLogSeen: 0,                       /* 双修解除叙事已消费标记（B4）：spouseLog.at 键控，会话一次 */
    giftI: -1, giftUntil: 0,                /* 页游礼包彩蛋（第卅九批）：会话内轮换槽位与下次重掷时刻——纯呈现，不入存档 */
    lastMerchUntil: 0,                      /* 神秘商人开席时刻（第卅九批）：席期只 MERCHANT_DURATION_MS，靠它把「到货」这件事提示出来 */
    karmaRank: ''                           /* 善恶名号段位基线（善恶名号批）：跨段即触发名号更迭演出 */
  };

  function wid() { return state.profile ? state.profile.worldId : 'xiuxian'; }
  function t(k, v) { return SQ.t(k, v, wid()); }
  /* 创角期取词：世界尚未写入 profile，按 draft.worldId 取（未择界时回落 common 词表） */
  function tc(k, v) { return SQ.t(k, v, draft.worldId); }
  function ws() { return state.worlds[wid()]; }
  function pack() { return SQ.Worlds[wid()].pack; }
  function D() { return pack().data; }
  /* mods 聚合的「一轮渲染一次」记忆（第册二批 · 热路径项）：一次 renderAll 里 ctx() 被取 27 次，
   * 每次都重跑一遍 Mods.collect 全量聚合（同一表达式里还有连取两次的）。渲染器是纯拼串、不改状态，
   * 所以缓存只需活过本轮渲染：renderAll / renderTab 各自在入口清一次，跨轮必重算 ⇒ 不存在读到旧值的路径。
   * shortcut: 若哪天出现「渲染中途写状态再读 mods」的写法，把失效点从渲染入口挪到写口（同 mutate 收口那条纪律）。 */
  var _mods = null;
  function mods() { if (!_mods) _mods = SQ.Mods.collect(state.profile, ws(), pack(), D()); return _mods; }

  /* 视图外置件的桥（第册五批 · N34 第二刀）：内联闭包里的私有量不许被外置件自取，一律走这一枚 ctx。
   * ⚠️ 键集由审计 **D7** 逐键对账：`view/*.js` 里用到的 c.xxx 必须在这里给过 ⇒ 少给一枚键当场判红，不留到运行时。
   * shortcut: 只放**已被外置件需要**的键；下一片要用新服务（toast / renderAll / mutate 之类）时在这里加一行、D7 自动跟。 */
  function ctx() {
    return { s: state, w: ws(), p: pack(), d: D(), ui: ui, $: $, t: t, esc: esc, date: gameDateStr,
      mods: mods(), tierCls: tierCls, kindCls: treasureKindCls, statLine: statLine, timeLeft: timeLeftText, toast: toast, ask: askConfirm, renderAll: renderAll, artTier: artTierCls, carrier: carrierOf, pct: pct, renderTab: renderTab, timeAgo: timeAgo, fmtDate: fmtDate };
  }

  function show(name) {
    ['loading', 'c1', 'c2', 'c3', 'main'].forEach(function (s) {
      $('sc-' + s).classList.toggle('hide', s !== name);
    });
  }

  /* ── toast（F6 收敛：同屏 ≤2 条；事件类废止——奇遇走模态/叙事流/红点） ── */
  function toast(text) {
    /* 动作处提示若与日志末条同文，则记为「已呈报」——tick 侧 afterClaim 不再重复弹一次。
       仅比对末条文本，冷却/错误类提示（文本对不上）不受影响。 */
    var w = state.worlds[wid()];
    var tail = w && w.log && w.log[w.log.length - 1];
    if (tail && tail.text === text) ui.announcedLogKey = logKeyOf(w.log);
    var box = $('toasts');
    while (box.children.length >= 2 && box.firstChild) box.removeChild(box.firstChild);
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    box.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 3000);
  }
  /* 动作处自弹提示（第十九批 · 用户报「点登门拜访弹两条」）：拜访 / 赠丹 / 赎回三处的 toast
   * 文案本来就比引擎那条日志更具体（结识 / 升档 / 同道相投…），旧的「文本全等」去重永远对不上
   * ⇒ 下一个 tick 又把日志末条弹一遍 = 同一次动作两条提示。此函数在弹之前把当前末条记为已呈报。 */
  function toastAction(text) {
    var wA = state.worlds[wid()];
    ui.announcedLogKey = (wA && wA.log) ? logKeyOf(wA.log) : '';
    toast(text);
  }

  /* 轻震反馈（未结缘格 / 缘尽格 / 未录格共用）：可感知但无信息（交互说明 ★） */
  function nudgeEl(elx) {
    if (!elx || reducedMotion()) return;
    elx.classList.remove('nudge');
    void elx.offsetWidth;
    elx.classList.add('nudge');
    setTimeout(function () { elx.classList.remove('nudge'); }, 420);
  }

  /* 存档 I/O 失败 → 人话提示（平台关卡 #89 桥容错：storage 被拒也不白屏、不静默丢档） */
  function checkIo() {
    if (!SQ.storageError) return;
    var e = SQ.storageError();
    if (!e) { ui.ioErrSeen = null; return; }
    var sig = e.op + ':' + e.msg;
    if (ui.ioErrSeen === sig) return;
    ui.ioErrSeen = sig;
    /* 侧档跳写 = 「展示流没存上、主档已存」那一族，套 ui.error.save 会同时说错两件事（裸英文 + 谎称进度没记下） */
    toast(t(e.msg === 'sideflow' ? 'ui.error.sideflow'
      : (e.op === 'write' ? 'ui.error.save' : 'ui.error.storage'), { msg: e.msg }));
  }

  /* ── 创角三屏（与 P2 相同逻辑） ── */
  /* 步骤条：一立名 / 二择界 / 三观天赋（当前步实心金、已过步描金，走查稿① 第 6 项）
   * 屏 id 与步骤号解耦：c1 = 起名 / c3 = 择界 / c2 = 观天赋（DOM 顺序按语义成对，不按步序）。 */
  function stepsHtml(cur) {
    var h = '';
    [1, 2, 3].forEach(function (i) {
      if (i > 1) h += '<span class="stepline"></span>';
      h += '<span class="step ' + (i === cur ? 'on' : (i < cur ? 'done' : '')) + '">' +
        '<span class="n">' + esc(tc('creation.step.' + i + '.n')) + '</span>' +
        esc(tc('creation.step.' + i + '.t')) + '</span>';
    });
    return h;
  }
  function bindCreationTexts() {
    document.title = SQ.t('app.name');
    $('loading-text').textContent = t('ui.loading');
    $('c1-steps').innerHTML = stepsHtml(1);   /* 起名 */
    $('c3-steps').innerHTML = stepsHtml(2);   /* 择界 */
    $('c2-steps').innerHTML = stepsHtml(3);   /* 观天赋 */
    $('c1-title').textContent = tc('creation.name.title');
    $('c1-label').textContent = tc('creation.name.label');
    $('c1-name').placeholder = tc('creation.name.ph');
    $('c1-random').textContent = tc('creation.name.random');
    $('c1-next').textContent = tc('creation.name.next');
    $('c3-title').textContent = tc('creation.world.title');
    $('c3-pick').textContent = tc('creation.world.pick');
    $('c3-hint').textContent = tc('creation.world.hint');
    $('c3-go').textContent = tc('creation.world.next');
    $('c3-back').textContent = tc('creation.back');
    $('c2-title').textContent = tc('creation.talent.title');
    $('c2-hint').textContent = tc('creation.talent.hint');
    $('c2-reroll').textContent = tc('creation.talent.reroll');
    $('c2-confirm').textContent = tc('creation.talent.confirm');
    $('c2-back').textContent = tc('creation.back');
    $('c2b-title').textContent = tc('creation.bias.title');
    $('c2b-hint').textContent = tc('creation.bias.hint');
    $('mk-title').textContent = tc('creation.talent.lockTitle');
    $('mk-text').textContent = tc('creation.talent.lockText');
    $('mk-sumlabel').textContent = tc('creation.talent.lockSummary');
    $('mk-cancel').textContent = t('ui.cancel');
    $('mk-ok').textContent = t('ui.ok');
  }

  function hasProfile(s) {
    return !!(s && s.profile && s.profile.worldId && s.profile.createdAt &&
              s.worlds && s.worlds[s.profile.worldId]);
  }

  $('c1-random').addEventListener('click', function () {
    $('c1-name').value = SQ.randomRoleName('xiuxian');
    $('c1-err').classList.add('hide');
  });
  /* 屏 1 · 起名 → 屏 3 · 择界（步序 2） */
  $('c1-next').addEventListener('click', function () {
    var name = ($('c1-name').value || '').trim();
    if (!SQ.validateName(name)) {
      $('c1-err').textContent = tc('creation.name.invalid');
      $('c1-err').classList.remove('hide');
      return;
    }
    draft.name = name;
    renderC3();
    show('c3');
  });

  /* 机制词条判定（天赋池设计 §三·补）：effects 含挂点白名单键 → 「机制」小角标；
   * desc 直出条件句式文案（词表手写），不显示挂点键名 */
  function isMechTalent(el) {
    var HK = (SQ.Mods && SQ.Mods.TALENT_HOOK_KEYS) || [];
    for (var k in (el.effects || {})) if (HK.indexOf(k) >= 0) return true;
    return false;
  }
  /* 羁绊命中（§九）：锁定态才生效加成，创角重抽阶段仅展示连线徽标 + 一行说明 */
  function matchedSynergies(talents, worldId) {
    var entry = SQ.Worlds[worldId];
    var D = entry && entry.pack && entry.pack.data;
    var syns = (D && D.TALENT_SYNERGIES) || [];
    var ids = {};
    (talents || []).forEach(function (t) { ids[t.id] = 1; });
    return syns.filter(function (s) { return s.pair && ids[s.pair[0]] && ids[s.pair[1]]; });
  }
  function talentCard(el, w, synHit) {
    var d = document.createElement('div');
    var isEpic = el.tier === 'epic';
    d.className = 'tcard ' + (el.kind === 'positive' ? 'pos' : 'neg') +
      (el.tier === 'rare' ? ' rare' : '') + (isEpic ? ' epic' : '') + (synHit ? ' syn' : '');
    var html = '';
    if (el.tier === 'rare') html += '<span class="corner">' + esc(tc('creation.talent.rare')) + '</span>';
    if (isEpic) html += '<span class="corner epic">' + esc(tc('creation.talent.epic')) + '</span>';
    if (el.amplified) html += '<span class="corner amp">' + esc(tc('creation.talent.amplify')) + '</span>';
    /* N20 接线：羁绊命中此前只加 `.syn` 描边、无文字（玩家看不出这枚天赋是被羁绊点亮的） */
    if (synHit) html += '<span class="corner">' + esc(tc('creation.talent.synergy')) + '</span>';
    if (isMechTalent(el)) html += '<span class="corner mech' + (el.amplified ? ' mechshift' : '') + '">' + esc(tc('creation.talent.mech')) + '</span>';
    html += '<div class="tname">' + esc(SQ.t('talent.' + el.id + '.name', null, w)) + '</div>' +
            '<div class="teff">' + esc(SQ.effectsToText(el.effects, w)) + '</div>' +
            '<div class="tdesc">' + esc(SQ.t('talent.' + el.id + '.desc', null, w)) + '</div>';
    d.innerHTML = html;
    return d;
  }
  /* 天赋池由「屏 3 · 择界」所选世界决定（draft.worldId） */
  function rerollTalents() {
    draft.roll = SQ.rollTalents(draft.worldId || 'xiuxian');
    renderC2();
  }
  function renderC2() {
    var r = draft.roll, w = draft.worldId || 'xiuxian';
    $('c2-combo').textContent = tc('creation.talent.combo', { p: r.combo.pos, n: r.combo.neg });
    var syns = matchedSynergies(r.talents, w);
    var synIds = {};
    syns.forEach(function (s) { s.pair.forEach(function (id) { synIds[id] = 1; }); });
    var box = $('c2-cards');
    box.innerHTML = '';
    r.talents.forEach(function (el) { box.appendChild(talentCard(el, w, !!synIds[el.id])); });
    /* 羁绊连线徽标行（卡片下方一行说明；纯展示，加成结算在 mods 通道） */
    var noteEl = $('c2-syn');
    if (syns.length && noteEl) {
      noteEl.innerHTML = syns.map(function (s) {
        return '<span class="synbadge">⚭ ' + esc(SQ.t('talent.synergy.' + s.id + '.name', null, w)) + '</span> ' +
          esc(SQ.t('talent.synergy.' + s.id + '.desc', null, w));
      }).join('<br>');
      noteEl.classList.remove('hide');
    } else if (noteEl) {
      noteEl.innerHTML = '';
      noteEl.classList.add('hide');
    }
    renderBias();
  }
  /* ── F1 问道初心三段（默认「红尘自在」预选；无性别/种族入口，profile 走缺省） ── */
  function renderBias() {
    var box = $('c2-bias');
    box.innerHTML = '';
    ['right', 'neutral', 'evil'].forEach(function (b) {
      var card = document.createElement('div');
      card.className = 'biascard ' + b + (draft.bias === b ? ' sel' : '');
      card.innerHTML = '<div class="bn">' + esc(tc('creation.bias.' + b)) + '</div>' +
        '<div class="bd">' + esc(tc('creation.bias.' + b + '.desc')) + '</div>';
      card.addEventListener('click', function () { draft.bias = b; renderBias(); });
      box.appendChild(card);
    });
  }
  function renderLockSummary() {
    var w = draft.worldId || 'xiuxian';
    var pills = (draft.roll ? draft.roll.talents : []).map(function (el) {
      return '<span class="pill">' + esc(SQ.t('talent.' + el.id + '.name', null, w)) + '</span>';
    });
    pills.push('<span class="pill">' + esc(tc('creation.bias.label')) + ' · ' + esc(tc('creation.bias.' + draft.bias)) + '</span>');
    $('mk-summary').innerHTML = pills.join('');
    renderLegacyGifts();
  }
  /* 轮回赠礼（轮回卷 §5.3 新周目创角）：跳档起步 / 转世天赋槽 ≤2 / 跨世之缘赎回——
   * 全部资格型（meta.spent 判定），创角事务内一次确认 */
  function renderLegacyGifts() {
    var meta = state.meta || {};
    var spent = meta.spent || {};
    var d = D();   /* 批C：世界表经 pack 取数，不吃世界专属全局（D3 射程） */
    draft.legacy = draft.legacy || { startRealm: 0, talents: [], bond: null };
    var has = { r1: spent['shop.startRealm1'] != null, r2: spent['shop.startRealm2'] != null, r3: spent['shop.startRealm3'] != null };
    var ownedT = SQ.Legacy ? SQ.Legacy.ownedTalents(meta, d) : [];
    var bondOk = !!(meta.unlocks && meta.unlocks.bond) && ((meta.lastBonds || []).length > 0);
    if (!has.r1 && !has.r2 && !has.r3 && !ownedT.length && !bondOk) { $('mk-legacy').innerHTML = ''; return; }
    var h = '<p class="hint" style="margin-top:10px">' + esc(t('legacy.ui.gifts')) + '</p>';
    if (has.r1 || has.r2 || has.r3) {
      h += '<div class="kv"><span class="hint">' + esc(t('legacy.ui.startRealm.pick')) + '</span></div><div class="chips">';
      h += '<button class="' + (draft.legacy.startRealm === 0 ? 'on' : '') + '" data-act="lgRealm" data-v="0">' + esc(t('legacy.ui.none')) + '</button>';
      [[1, 'r1'], [2, 'r2'], [3, 'r3']].forEach(function (r) {
        if (!has[r[1]]) return;
        h += '<button class="' + (draft.legacy.startRealm === r[0] ? 'on' : '') + '" data-act="lgRealm" data-v="' + r[0] + '">' + esc(t('realm.' + r[0])) + '</button>';
      });
      h += '</div>';
    }
    if (ownedT.length) {

  /* ══════════ MAIN：九游戏页 + 两系统页 ══════════ */

   * 阈值单一事实源 = data.js TAB_UNLOCK（tabLock() 优先读表，行内 lock 为同源兜底值；
   * 引擎侧天骄 gate 与渡劫解锁播报同表同源）。
   * 阶梯：炼气起点 5 页（修行/历练/法与器/奇遇/成就）→ 筑基 +坊市/势力/炼丹/道友
   *   → 金丹 +天骄 → 元婴 +法宝 → 化神 +宗门。
   * 页面整合批 2026-10-06（UI 卷 §3.4a）：原「功法」「法器」两页并为「法与器」一页 →
   *   游戏页 13 → **12** 项。tab id 沿用 `arts`（不新造 id），故 newArtsDot 红点键、
   *   lastArtsSig 签名、TAB_UNLOCK（二者本就无境界门槛）三处零改动；`gear` 条目删除后，
   *   旧档 settings.tabOrder 里的 'gear' 由 tabOrder() 既有「未知 id 剔除」自动清掉，无需迁移。
   *   导航标签改取 `arts.system`（法与器）；`skill.system`/`gear.system` 保留不动——
   *   二者仍是日志页分类筛选标签，改它们会连带改日志分类语义。 */
  var GAME_TABS = [
    { id: 'idle', key: 'tab.idle' },
    { id: 'combat', key: null, sys: 'combat.system' },
    { id: 'arts', key: null, sys: 'arts.system' },
    { id: 'treasure', key: null, sys: 'treasure.system', lock: 3 },
    { id: 'shop', key: null, sys: 'shop.system', lock: 1 },
    { id: 'faction', key: null, sys: 'faction.system', lock: 1 },
    { id: 'bonds', key: null, sys: 'ui.pillar.bond', lock: 1 },
    { id: 'event', key: 'tab.event' },
    /* 六向长线批：炼丹炼器（筑基开炉）/ 同代天骄（金丹方闻同代之名）/ 宗门（化神亮入口） */
    { id: 'alchemy', key: null, sys: 'alchemy.system', lock: 1 },
    { id: 'prodigy', key: null, sys: 'jianghu.system', lock: 2 },
    { id: 'sect', key: null, sys: 'sect.system', lock: 4 },

    { id: 'achv', key: null, sys: 'achv.system' }
  ];
  /* 系统页：固定在导航最底部，不参与自定义排序 */
  var SYS_TABS = [
    { id: 'legacy', key: null, sys: 'legacy.system' },
    { id: 'journal', key: 'tab.log' },
    { id: 'settings', key: 'tab.settings' }
  ];
  var TABS = GAME_TABS.concat(SYS_TABS);

  /* 渐次解锁批 §C1：门槛单一事实源 = D.TAB_UNLOCK（引擎天骄 gate / realm.js 解锁播报同源）；
   * 世界未装载或表缺项时回落 GAME_TABS 行内 lock（同值兜底）。 */
  function tabLock(tb) {
    try {
      var tu = (D() || {}).TAB_UNLOCK;
      if (tu && tu[tb.id] && tu[tb.id].r != null) return tu[tb.id].r;
    } catch (e) { /* 创角屏/世界未选：回落硬编码 */ }
    return tb.lock || 0;
  }
  /* 解锁红点（§C3）：会话级已知集——启动/切角色时快照当时已解锁项；会话内新解锁 tab 亮红点、
   * 进页即消。不入存档（纯 UI 态，与 newArtsDot 红点家族同纪律）。 */
  function tabKnownSync() {
    var pid0 = (state.profile && state.profile.id) || '';
    if (!ui.tabKnown || ui.tabKnownPid !== pid0) {
      ui.tabKnown = {}; ui.tabKnownPid = pid0;
      var w0 = ws();
      TABS.forEach(function (tb) {
        var lk = tabLock(tb);
        if (!lk || (w0 && w0.realm >= lk)) ui.tabKnown[tb.id] = 1;
      });
    }
  }

  /* 游戏页有效顺序：settings.tabOrder 优先，缺项按默认序补齐（未知 id 剔除） */
  function tabOrder() {
    var so = (state.settings && state.settings.tabOrder) || [];
    var byId = {}, used = {};
    GAME_TABS.forEach(function (t) { byId[t.id] = t; });
    var out = [];
    so.forEach(function (id) { if (byId[id] && !used[id]) { out.push(byId[id]); used[id] = 1; } });
    GAME_TABS.forEach(function (t) { if (!used[t.id]) out.push(t); });
    return out;
  }

  function tabBtn(bar, tb) {

    var w0 = ws();
    var lk = tabLock(tb);
    var locked = lk && (!w0 || w0.realm < lk);
    if (locked) {

    var dotFlag = { arts: 'newArtsDot', treasure: 'newTreasureDot', bonds: 'newBondDot', shop: 'newShopDot' }[tb.id];
    if (dotFlag && ui[dotFlag]) {

    if (tb.id === 'achv') {

      }
    }
    /* 新解锁红点（渐次解锁批 §C3）：本会话内刚解锁且未进过页 */
    if (!locked && ui.tabKnown && !ui.tabKnown[tb.id]) {

  function switchTab(id) {
    var tbDef = null;
    TABS.forEach(function (tb) { if (tb.id === id) tbDef = tb; });
    /* 未解锁页不可进入（势力批 v2.4 → 渐次解锁批表化）：防御——导航已不可点，这里兜底 */
    if (tbDef && tabLock(tbDef) && (!ws() || ws().realm < tabLock(tbDef))) return;
    ui.tab = id;
    if (ui.tabKnown) ui.tabKnown[id] = 1;   /* 新解锁红点进页即消 */
    TABS.forEach(function (tb) { $('tab-' + tb.id).classList.toggle('hide', tb.id !== id); });
    if (id === 'event') {
      ui.newFeedDot = false;                      /* 进奇遇页即视为已读 */
      ui.rumorSeenAt = maxRumorBornAt(ws());      /* 传闻红点同步消账：此后仅新出生传闻再亮 */
    }
    if (id === 'journal') ui.newLogDot = false;   /* 进日志页即视为已读 */
    if (id === 'combat') ui.caveSnap = caveRedDotSig();   /* 进秘境洞天页（洞天节在内联）即视为已读地 chip 红点 */
    /* 走查 v2.5 §6：进页即清对应红点 */
    var dotMap = { arts: 'newArtsDot', treasure: 'newTreasureDot', bonds: 'newBondDot', shop: 'newShopDot' };
    if (dotMap[id]) ui[dotMap[id]] = false;
    renderTabbar();
    renderTab();

  function pct(n) { return (Math.round(n * 1000) / 10).toString().replace(/\.0$/, '') + '%'; }

  /* 全位数字（修行状态批 v2.1）：修为大数字专用——千分位、不缩放不带单位，
   * 让每秒 tick 的增量逐位可见（SQ.fmt 的 万/亿 会把低境界产出量化到 0.1万/步） */
  function fmtFull(n) {
    return String(Math.floor(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  /* ── 游戏时间（v2.3）：算式与显示名口径**已上移到 core**（`SQ.gameDateOf` / `SQ.gameDateStr`，

   * 1 游戏日 = 现实 1 秒，自入世（profile.createdAt）起算；12 月 × 30 日 = 360 日/年；
   * 起始年 = ws.calYear（创角随机 1~9000）；createdAt 缺失时返回空串（旧档兜底）── */
  function gameDateOf(ts) {

   * B1 chip 行：财=收支摘要、法=主修、地=洞府×倍率、侣=灰置（批 3 解锁）

  /* B2 · 财柱总账：恒等式置顶 + 收支八行条形（区内归一）+ 占比 + 字段小注 + 印章分档 */
  var LEDGER_SEAL_2 = 5520000, LEDGER_SEAL_3 = 55200000;   /* 档界 = 主线六福地总投入 552 万 / ×10（UI §3.3 v2.5；扩池批别院/设施为带外可选投入不改档界） */
  function ledgerRows(dir, cats, max) {
    var w = ws(), l = w.ledger || { in: {}, out: {} };
    return cats.map(function (c) {
      var v = (l[dir] && l[dir][c]) || 0;
      var pctv = max > 0 ? (v / max) * 100 : 0;
      return '<div class="lgrow ' + (dir === 'in' ? 'in' : 'out') + '">' +
        '<div class="lgl"><span class="nm">' + esc(t('ledger.cat.' + c)) + '</span>' +
        '<span class="vl">' + SQ.fmt(v) + (v > 0 ? ' · ' + esc(t('ledger.share', { p: Math.round(pctv) })) : '') + '</span></div>' +
        '<div class="lgb"><i style="width:' + pctv.toFixed(1) + '%"></i></div>' +
        '<div class="lgn">' + esc(t('ledger.field', { dir: t('ledger.dir.' + dir), cat: t('ledger.cat.' + c) })) + '</div></div>';
    }).join('');

  function renderLedger() {
    var w = ws(), s = ledgerSums();
    $('mlg-title').textContent = t('ledger.title');
    $('mlg-ident').textContent = t('ledger.ident', {
      start: SQ.Ledger.START_STONES, inn: SQ.fmt(s.inn), out: SQ.fmt(s.out), now: SQ.fmt(w.stones)
    });
    $('mlg-identnote').textContent = t('ledger.identnote');
    $('mlg-intitle').textContent = t('ledger.in.title');
    $('mlg-outtitle').textContent = t('ledger.out.title');
    var inMax = Math.max.apply(null, SQ.Ledger.IN_CATS.map(function (c) { return (w.ledger.in[c] || 0); }).concat([1]));
    var outMax = Math.max.apply(null, SQ.Ledger.OUT_CATS.map(function (c) { return (w.ledger.out[c] || 0); }).concat([1]));

    $('mlg-seal').textContent = tier >= 2 ? t('ledger.epitaph.' + tier) : '';

  $('mlg-close').addEventListener('click', function () { $('modal-ledger').classList.add('hide'); });

  /* B3 · 地柱洞府：福地名录四态卡（主线 6 + 别院 4 + 隐世 3，扩池批 v2.0）+ 缺项 chips 三段红绿 + 附属设施行 + 叙事折叠（未达资格不剧透）+ 迁居冷却倒计时 */
  /* 游戏时长（走查 v2.6 §1/§4）：冷却类以游戏时间表述——ms/1000 = 游戏日，360 日 = 1 游戏年 */
  function fmtGameDur(ms) {
    if (!isFinite(ms)) ms = 0;                     /* 防脏字段：NaN/undefined 一律按 0 计 */
    var days = Math.max(0, Math.floor(ms / 1000));
    var y = Math.floor(days / 360), rd = days % 360;
    if (y > 0) return t('ui.time.game.yd', { y: y, d: rd });
    return t('ui.time.game.d', { d: rd });
  }
  function fmtLeft(ms) {
    if (!isFinite(ms)) ms = 0;                     /* 防脏字段：NaN/undefined 一律按 0 计 */
    var s = Math.max(0, Math.floor(ms / 1000));
    var d = Math.floor(s / 86400), hh = Math.floor((s % 86400) / 3600),
      mm = Math.floor((s % 3600) / 60), ss = s % 60;
    function two(n) { return ('0' + n).slice(-2); }
    return d > 0 ? t('cave.time.dhms', { d: d, h: two(hh), m: two(mm), s: two(ss) })
      : t('cave.time.hms', { h: two(hh), m: two(mm), s: two(ss) });
  }
  function caveReqChips(c, chk) {
    var w = ws(), rq = c.reqs || {};
    var out = [];
    /* 隐世福地（v2.0 obtain 门控）：未持有 → 显示缘法条件红绿 chip；已持有 → 视同免费 */
    if (c.obtain && !SQ.Cave.owned(w, c.id)) {
      var met = SQ.Cave.obtainMet(w, pack(), D(), c.obtain);
      var otxt = c.obtain.type === 'factionRank'
        ? t('cave.obtain.factionRank', { name: t('faction.rank.' + c.obtain.rank) })
        : t('cave.obtain.codex', { n: c.obtain.seen });
      out.push('<span class="' + (met ? 'ok' : 'no') + '">' + esc(t('cave.tag.hidden') + ' · ' + otxt) + '</span>');
      return out.join('');
    }
    if (!rq.realmMin && rq.zoneCleared == null && !rq.stonesCost) {
      return '<span class="ok">' + esc(t('cave.req.free')) + '</span>';
    }
    if (rq.realmMin != null) {
      out.push('<span class="' + (w.realm >= rq.realmMin ? 'ok' : 'no') + '">' +
        esc(t('cave.req.realm', { realm: t('realm.' + rq.realmMin) })) + '</span>');
    }
    if (rq.zoneCleared != null) {
      var zok = (w.cleared || []).indexOf(rq.zoneCleared) >= 0;
      out.push('<span class="' + (zok ? 'ok' : 'no') + '">' +
        esc(t('cave.req.zone', { zone: t('combat.zone.' + rq.zoneCleared) })) + '</span>');
    }
    if (rq.stonesCost) {
      /* 已持有则不再校验灵石（所有权语义，引擎卷 §2.3） */
      var sok = SQ.Cave.owned(w, c.id) || w.stones >= rq.stonesCost;
      out.push('<span class="' + (sok ? 'ok' : 'no') + '">' +
        esc(t('cave.req.stones', { n: SQ.fmt(rq.stonesCost) })) + '</span>');
    }
    return out.join('');
  }
  /* 附属设施行（福地池卷 §四）：仅已持有福地渲染；等级 + 效果恒显，
   * 营建/扩建按钮只在当前驻留福地出现（非驻留福地只读，无升级选项）。 */
  function caveFacRows(w, d, c, isCur) {
    var fac = (w.cave && w.cave.fac && w.cave.fac[c.id]) || {};
    var h = '<div class="cavefac"><div class="hint" style="margin:4px 0 2px">' +
      esc(t('cave.fac.title')) + (isCur ? ' · <span style="color:var(--good)">' + esc(t('cave.fac.active')) + '</span>'
        : ' · <span class="hint">' + esc(t('cave.fac.idle')) + '</span>') + '</div>';
    (d.CAVE_FACILITIES || []).forEach(function (fd) {
      var lv = fac[fd.id] || 0;
      var maxLv = d.CAVE_FAC_MAX_LV || 3;
      var effNow = fd.field === 'tribBonus' ? '+' + (fd.per * lv).toFixed(2)
        : (fd.per * lv * 100).toFixed(1) + '%';
      var metaTxt = t('talent.field.' + fd.field) + ' +' + effNow.replace('+', '');
      /* 灵田材料轴（炼丹卷 §2.4）：产出说明由炼丹炼器页迁入，驻留 Lv≥1 时每 6 游戏月入账 1~4 枚本区材料 */
      if (fd.id === 'lingtian') metaTxt += ' · ' + t('cave.fac.lingtian.mat');
      h += '<div class="facrow"><span class="nm">' + esc(t('cave.fac.' + fd.id + '.name')) +
        ' <span class="hint">Lv' + lv + '</span></span>' +
        '<span class="meta">' + esc(metaTxt) + '</span>';
      if (!isCur) {
        h += '<span class="hint">' + esc(t('cave.fac.onlycur')) + '</span>';
      } else if (lv >= maxLv) {
        h += '<button disabled>' + esc(t('cave.fac.max')) + '</button>';
      } else {
        var cost = (d.CAVE_FAC_COST || [])[lv] || 0;
        h += '<button class="' + (w.stones >= cost ? 'primary' : '') + '" data-act="caveBuild" data-v="' + c.id + '" data-f="' + fd.id + '"' +
          (w.stones >= cost ? '' : ' disabled') + '>' +
          esc(t(lv === 0 ? 'cave.fac.build' : 'cave.fac.upgrade', { n: SQ.fmt(cost) })) + '</button>';
      }
      h += '</div>';
    });
    return h + '</div>';
  }
  /* 洞天福地图鉴卡列（合并批：内联于「秘境洞天」页）——十三福地四态卡 + 缺项 chips + 叙事折叠 + 附属设施。
   * 当前驻留福地置顶为通栏 hero（与秘境页「当前秘境 hero」同构）；别院角标按福地表原序判定，
   * 不受展示排序影响。 */
  function caveDexHTML(left, withFac) {
    var w = ws(), p = pack(), d = D();
    var h = '';
    var list = SQ.Cave.list(p);
    var seenMult = {}, branchIds = {};
    list.forEach(function (c) {
      if (!c.obtain && seenMult[c.mult.toFixed(2)]) branchIds[c.id] = 1;
      seenMult[c.mult.toFixed(2)] = 1;
    });
    var curId = w.cave.current;
    list.slice().sort(function (a, b) {
      return (a.id === curId ? 0 : 1) - (b.id === curId ? 0 : 1);
    }).forEach(function (c) {
      var chk = SQ.Cave.canEnter(w, p, d, c.id, Date.now());
      var isCur = curId === c.id;
      var owned = SQ.Cave.owned(w, c.id);
      /* 角标（v2.0）：隐世（obtain 门控）/ 别院（同档 mult 横向支线） */
      var kindTag = '';
      if (c.obtain) kindTag = '<span class="ctag own">' + esc(t('cave.tag.hidden')) + '</span>';
      else if (branchIds[c.id]) kindTag = '<span class="ctag">' + esc(t('cave.tag.branch')) + '</span>';
      /* 缺项只算「资格」项（含 obtain），冷却与「已在此处」单独处理（不入红绿 chips） */
      var qualLack = chk.lack.filter(function (x) { return x.kind !== 'cooldown' && x.kind !== 'same'; });
      var stateCls = isCur ? ' cur' : (qualLack.length ? ' lack' : '');
      var tag = isCur ? '<span class="ctag cur">' + esc(t('cave.state.cur')) + '</span>'
        : (owned ? '<span class="ctag own">' + esc(t('cave.state.own')) + '</span>' : '');
      h += '<div class="cavecard' + stateCls + (isCur ? ' hero' : '') + '" data-cave="' + c.id + '">' +
        '<div class="ch"><span class="cn">' + esc(t('cave.' + c.id + '.name')) + kindTag + tag + '</span>' +
        '<span class="cm">×' + c.mult.toFixed(2) + '</span></div>' +
        '<div class="cs">' + esc(c.signature
          ? t('cave.sig', { name: t('cave.' + c.id + '.signature'), eff: t('talent.field.' + c.signature.field) + ' ' + (c.signature.field === 'tribBonus' ? '+' + c.signature.value.toFixed(2) : (c.signature.value > 0 ? '+' : '') + Math.round(c.signature.value * 100) + '%') })
          : t('cave.sig.none')) + '</div>' +
        '<div class="reqchips">' + caveReqChips(c, chk) + '</div>';
      /* 叙事分段（UI §3.3 v2.4）：驻留中/已持有出全文，未达资格折叠成盼头 */
      var openStory = isCur || owned || ui.caveStory[c.id];
      var canRead = isCur || owned;
      if (canRead || openStory) {
        h += '<div class="cavestory">' + esc(t('cave.' + c.id + '.desc')) + '</div>';
      } else {
        h += '<div class="cavestory hint">' + esc(t('cave.story.locked')) + '</div>';
      }
      /* 附属设施（v2.0）：已持有才展开；等级/效果只读恒显，营建/扩建按钮仅当前驻留福地有 */
      if (owned && withFac) h += caveFacRows(w, d, c, isCur);
      if (!isCur) {
        var dis = qualLack.length > 0 || left > 0;
        h += '<button class="cavebtn' + (dis ? '' : ' primary') + '" data-act="caveEnter" data-v="' + c.id + '"' +
          (dis ? ' disabled' : '') + '>' +
          esc(qualLack.length ? t('cave.state.lack') : (left > 0 ? t('cave.cd', { t: fmtGameDur(left) })
            : (owned ? t('cave.state.move') : t('cave.state.enter')))) + '</button>';
      }
      h += '</div>';
    });
    return h;
  }
  /* 洞天福地已内联到「秘境洞天」页（合并批）：地柱与秘境卡「福地」角标统一改为跳页并定位到洞天节。
   * 该节点为动态渲染，故用 querySelector 取（$ 取词会被审计 A3 要求 id 静态存在）。 */

  /* ── 境界说明浮层（修行页）：十阶一览 · 当前高亮 · 已过/未至三态 ──

  function renderIdle() {
    var w = ws(), m = mods(), p = pack(), d = D();
    var cap = SQ.Idle.capOf(w, p, d, m);
    var rate = SQ.Idle.effRate(w, p, d, m, false);   /* 含模式乘区与新手加速：与 settle 同一个式子（审计 #4） */
    var need = SQ.Realm.needEffOf(w, p, d, m);
    var full = need == null && w.qi >= cap;
    var h = '';
    /* 游戏历（v2.3）：修行页顶栏——罗云历XXX年X月X日（1 游戏日 = 1 现实秒，每秒 tick 随之日进） */
    var calNow = gameDateStr(Date.now());

    /* 江湖传闻区（传闻同步批）：紧随游戏时间之下，与奇遇页顶部同源渲染（renderRumors），

    h += renderRumors(Date.now());

    h += '<div class="stathero"><div class="shmain">' +
      '<span class="shv">' + SQ.fmt(SQ.Mods.powerOf(w, p, d, m)) + '</span>' +
      '<span class="shl">' + esc(t('resource.power')) + '</span></div><div class="shattr">' +
      (d.ATTRS || []).map(function (id) {
        return '<div class="sha"><span class="an">' + esc(t('attr.' + id)) + '</span>' +
          '<span class="av">' + Math.floor((w.attrs || {})[id] || 0) + '</span></div>';
      }).join('') + '</div></div>';
    h += '<div class="kv"><span class="hint">' + esc(t('realm.info.cur', { realm: t('realm.' + w.realm) })) + '</span>' +
      '<button class="linkbtn chip" data-act="openRealm">' + esc(t('realm.info.link')) + '</button></div>';
    /* 寿元 / 道伤两行（寿元批 §6.1A · 第卌八批改显示口径）：一律取世界包 lifeInfo 的派生数，视图零自拼口径
     * （第廿五批「同源」纪律沿用）。大限将至整行转红——引擎侧刻意**不写日志**：每秒 tick
     * 重绘会刷屏（第廿八批「转世结算刷屏」同族坑），警示只在这一屏。道伤满 1 层才报，
     * 岁月疗养中的零点几层不占行。
     * 用户令「寿元：111岁，尚余约1111年」⇒ `li.age`（= floor(lifeUsed)，含创角生年）报岁、
     * 只报剩余，不再摆「X/Y」分数：上界会随累加阶梯与 lifeBonus 动，摆出来只诱导误算。 */
    var li = p.worldSystems.lifeInfo(w);
    /* N58 定案（第册十二批落地）：历练态在寿元行旁补一句**按当前模式折算**的等效可用年——
     * 寿元阶梯按「全部闭关」定标，而历练产出只有闭关的 42% ⇒ 同一境要烧 2.4 倍岁月。
     * 不改表、不改节奏（那两案第册三批已否），只把这件事摆到屏上。折算率现取 `MODES`，不写死 2.4。 */
    var ventSpan = '';
    if (!li.eternal && w.mode === 'venture') {
      var MSv = p.data.MODES || {};
      var skv = (MSv.seclude || {}).qiMult || 1, vkv = (MSv.venture || {}).qiMult || 1;

    }
    h += '<div class="kv"><span' + (li.near ? ' class="bad"' : '') + '>' + esc(
