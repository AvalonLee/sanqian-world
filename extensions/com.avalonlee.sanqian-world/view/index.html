<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>三千世界</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="wrap">
  <!-- LOADING -->
  <div id="sc-loading" class="panel"><p class="sub" id="loading-text">…</p></div>

  <!-- 屏 1 · 起名（步序 1） -->
  <div id="sc-c1" class="panel hide">
    <div class="stepper" id="c1-steps"></div>
    <h1 id="c1-title"></h1>
    <label class="kv"><span id="c1-label"></span></label>
    <input id="c1-name" maxlength="8" />
    <p class="err hide" id="c1-err"></p>
    <div class="row between">
      <button id="c1-random"></button>
      <button id="c1-next" class="primary"></button>
    </div>
  </div>

  <!-- 屏 3 · 观天赋 + 问道初心（步序 3；天赋池由屏 2 所选世界决定） -->
  <div id="sc-c2" class="panel hide">
    <div class="stepper" id="c2-steps"></div>
    <h1><span id="c2-title"></span><span class="combo-badge" id="c2-combo"></span></h1>
    <p class="hint" id="c2-hint"></p>
    <div class="cards" id="c2-cards"></div>
    <div class="synnote hide" id="c2-syn"></div>
    <h1 style="font-size:15px;margin-top:16px" id="c2b-title"></h1>
    <p class="hint" id="c2b-hint"></p>
    <div class="biascards" id="c2-bias"></div>
    <div class="row between">
      <button id="c2-back"></button>
      <span style="display:flex;gap:8px">
        <button id="c2-reroll"></button>
        <button id="c2-confirm" class="primary"></button>
      </span>
    </div>
  </div>

  <!-- 屏 2 · 择界（步序 2） -->
  <div id="sc-c3" class="panel hide">
    <div class="stepper" id="c3-steps"></div>
    <h1 id="c3-title"></h1>
    <p class="sub" id="c3-pick"></p>
    <p class="hint" id="c3-hint"></p>
    <div id="c3-list"></div>
    <p class="err hide" id="c3-err"></p>
    <div class="row between">
      <button id="c3-back"></button>
      <button id="c3-go" class="primary"></button>
    </div>
  </div>

  </div>

<!-- MAIN：顶栏 + 六 Tab + 底栏（窄屏单栏；≥720px 左栏导航 + 右栏内容。
     放在 .wrap 之外，才不会被创角三屏的 480px 窄栏限宽） -->
<div id="sc-main" class="hide">
    <!-- UI v2 B16-b：顶栏 = 设计稿 .hd（index.html §hd）——左：衬线角色名 + 境界印章（seal sm），
         副行 = 世界名 · 世界历日期（calendar.date 口径）；右：灵石（衬线数字，万/亿后缀在外）
         + 名号行（善恶入口）。战力/修为撤出顶栏（修行页 statrow/圆相已有）；世界名水印（B3）
         退役——世界名入 hd-sub（用户拍板对齐设计稿）。走查锚点：#m-who/.who-meta、#m-rank、#m-stones 同父。 -->
    <div class="panel topbar sq2-hd">
      <div class="hd-l topline name" id="m-who" data-act="role">
        <div class="hd-name"><span id="m-name"></span><span class="seal sm" id="m-realm"></span></div>
        <div class="hd-sub who-meta" id="m-meta"></div>
      </div>
      <div class="hd-r">
        <span class="stones hd-stone" id="m-stones"></span>
        <span class="rankchip" id="m-rank" data-act="karma"></span>
      </div>
    </div>
    <!-- UI v2 B1：当前区子导航（桌面与手机同一条；点击复用 data-act="tab" 分派） -->
    <div id="m-subnav" class="sq2-subnav"></div>
    <div class="tabbody">
      <div id="tab-idle" class="panel"></div>
      <div id="tab-combat" class="panel hide"></div>
      <div id="tab-arts" class="panel hide"></div>
      <div id="tab-gear" class="panel hide"></div>
      <div id="tab-treasure" class="panel hide"></div>
      <div id="tab-shop" class="panel hide"></div>
      <div id="tab-faction" class="panel hide"></div>
      <div id="tab-bonds" class="panel hide"></div>
      <div id="tab-event" class="panel hide"></div>
      <div id="tab-alchemy" class="panel hide"></div>
      <div id="tab-prodigy" class="panel hide"></div>
      <div id="tab-sect" class="panel hide"></div>
      <div id="tab-achv" class="panel hide"></div>
      <div id="tab-legacy" class="panel hide"></div>
      <div id="tab-journal" class="panel hide"></div>
      <div id="tab-settings" class="panel hide"></div>
    </div>
    <!-- UI v2 B16-b：桌面左栏 = 设计稿 .railnav——顶部品牌区（印章「三千」+ 三千世界/SANQIAN WORLD）
         + 分组分带导航（band-h/rn-i 形态）；<720 整体隐藏（手机用五区底栏 #m-zonebar）。 -->
    <nav class="sq2-nav" id="m-nav" aria-label="分区导航">
      <div class="rn-brand">
        <span class="seal">三千</span>
        <div class="rn-title">三千世界<small>SANQIAN WORLD</small></div>
      </div>
      <div class="tabbar" id="m-tabbar"></div>
    </nav>
    <!-- UI v2 B13：手机五区底部 tab（<720px 取代 16 项横滑；点区落该区首页，区内换页走顶部子导航） -->
    <div class="sq2-zonebar" id="m-zonebar"></div>
    <!-- UI v2 B1：右栏骨架（≥1200px 第三列）。B1 只立容器，不造数据；空时 CSS 收起 -->
    <aside id="m-rail" class="sq2-rail" aria-label="区情"></aside>
</div>

<!-- 锁定确认模态（F1：入定摘要 pills = 天赋 + 初心） -->
<div id="modal-lock" class="mask hide">
  <div class="modal">
    <h2 id="mk-title"></h2>
    <p id="mk-text"></p>
    <p class="hint" id="mk-sumlabel"></p>
    <div class="pills" id="mk-summary"></div>
    <div id="mk-legacy"></div>
    <div class="row between">
      <button id="mk-cancel"></button>
      <button id="mk-ok" class="primary"></button>
    </div>
  </div>
</div>

<!-- 选择奇遇（F3：三分支 + 判定演出 + 结果页；必须选择才关闭）
     UI v2 B16-v：按设计稿改全屏「问 → 应」两段（薄雾压边 + 纸面面板）；
     判定、收益与「道心不预告」（D7）口径一字未动。 -->
<div id="modal-choice" class="choice hide">
  <div class="ch-mist" aria-hidden="true"></div>
  <div class="ch-body">
    <section class="chstage" id="mc-ask">
      <div class="ch-head"><span class="mc-badges" id="mc-badges"></span><span class="ch-time" id="mc-date"></span></div>
      <h2 class="mc-name" id="mc-title"></h2>
      <p class="mc-story" id="mc-story"></p>
      <div class="ch-opts" id="mc-branches"></div>
      <p class="mc-foot hint" id="mc-foot"></p>
      <div id="mc-judging" class="judging hide"></div>
    </section>
    <section class="chstage hide" id="mc-result">
      <div class="ch-res" id="mc-res-box">
        <div class="ch-mark" id="mc-mark"></div>
        <h2 id="mc-res-title"></h2>
        <div class="ch-sub res-check" id="mc-check"></div>
      </div>
      <ul class="ch-list">
        <li><span class="gk" id="mc-gk-karma"></span><span class="res-karma" id="mc-karma"></span></li>
        <li><span class="gk" id="mc-gk-eff"></span><span id="mc-eff"></span></li>
        <li id="mc-excl-line" class="hide"><span class="gk" id="mc-gk-excl"></span><span id="mc-excl"></span></li>
        <li id="mc-bondlock-line" class="hide"><span class="gk" id="mc-gk-bond"></span><span id="mc-bondlock"></span></li>
      </ul>
      <div class="ch-acts"><button id="mc-ok"></button></div>
    </section>
  </div>
</div>

<!-- 角色浮层 -->
<div id="modal-role" class="mask hide">
  <div class="modal">
    <h2 id="mr-title"></h2>
    <div id="mr-attrs"></div>
    <div class="cards" id="mr-talents" style="margin-top:10px"></div>
    <div class="row between">
      <button id="mr-karma"></button>
      <button id="mr-wash" class="hide" data-act="washOpen"></button>
      <button id="mr-close" class="primary"></button>
    </div>
  </div>
</div>

<!-- 洗髓浮层（天赋池设计 v1.8 §十 · 洗髓批）：三格择一替换 + 三候选择一 → 换骨 -->
<div id="modal-talentwash" class="mask hide">
  <div class="modal">
    <h2 id="tw-title"></h2>
    <p id="tw-sub" class="hint"></p>
    <p class="hint" id="tw-pick-label"></p>
    <div class="cards" id="tw-slots"></div>
    <p class="hint" id="tw-cand-label"></p>
    <div class="cards" id="tw-cands"></div>
    <div class="row between">
      <button id="tw-close"></button>
      <button id="tw-ok" class="primary" data-act="washOk"></button>
    </div>
  </div>
</div>

<!-- karma 浮层（F5：四行构成 + 色带游标 + 档位效果摘要） -->
<div id="modal-karma" class="mask hide">
  <div class="modal">
    <h2 id="mkd-title"></h2>
    <p id="mkd-value" style="font-size:20px;font-weight:700"></p>
    <div class="bar slim"><i id="mkd-bar"></i></div>
    <p id="mkd-next" class="hint"></p>
    <p class="hint" id="mkd-ranktitle" style="margin-top:10px;font-weight:650"></p>
    <div id="mkd-ranks" class="rankladder"></div>
    <div id="mkd-parts"></div>
    <p id="mkd-rate" class="hint" style="margin-top:8px"></p>
    <p class="hint" id="mkd-efftitle" style="margin-top:10px;font-weight:650"></p>
    <div id="mkd-effects"></div>
    <button id="mkd-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 通用确认（购买等） -->
<div id="modal-confirm" class="mask hide">
  <div class="modal">
    <h2 id="cf-title"></h2>
    <p id="cf-text"></p>
    <div class="row between">
      <button id="cf-cancel"></button>
      <button id="cf-ok" class="primary"></button>
    </div>
  </div>
</div>

<!-- 真灵承继选择浮层（轮回卷 §3.4「可选一件」玩家入口 · 器灵卷 §九 数据契约）：
     转世触发前择**一件**已觉醒器灵的法宝带入下世；零候选时整层不弹（由 askHeirChoice 直过）。 -->
<div id="modal-heirchoice" class="mask hide">
  <div class="modal">
    <h2 id="hc-title"></h2>
    <p class="hint" id="hc-sub"></p>
    <p class="hint" id="hc-carry" style="font-weight:650"></p>
    <div id="hc-list" style="max-height:52vh;overflow-y:auto"></div>
    <p class="hint" id="hc-verdict"></p>
    <div class="row between">
      <button id="hc-cancel"></button>
      <button id="hc-none"></button>
    </div>
  </div>
</div>

<!-- 出关呈报（F4：lastOffline.at 键控 · 会话一次 · EVENT_CHOICE 优先顺延） -->
<div id="modal-offline" class="mask hide">
  <div class="modal">
    <h2 id="mo-title"></h2>
    <div class="osub" id="mo-sub"></div>
    <div class="ostat" id="mo-stats"></div>
    <p class="hint" id="mo-hint"></p>
    <button id="mo-ok" class="primary" style="width:100%"></button>
  </div>
</div>

<!-- 财 · 此生总账浮层（B2：恒等式置顶 + 收支八行条形 + 占比 + 印章分档） -->
<div id="modal-ledger" class="mask hide">
  <div class="modal">
    <h2 id="mlg-title"></h2>
    <div class="lg-ident" id="mlg-ident"></div>
    <p class="hint" id="mlg-identnote"></p>
    <div class="lg-sec" id="mlg-intitle"></div>
    <div id="mlg-in"></div>
    <div class="lg-sec" id="mlg-outtitle"></div>
    <div id="mlg-out"></div>
    <p class="hint" id="mlg-seal"></p>
    <p class="hint" id="mlg-empty"></p>
    <button id="mlg-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 法 · 修习功法浮层（修行页四柱「法」：只读展示修习槽内功法，与财/地/侣同级，不跳页） -->
<div id="modal-arts" class="mask hide">
  <div class="modal">
    <h2 id="mam-title"></h2>
    <p class="hint" id="mam-sub"></p>
    <div id="mam-list" style="max-height:58vh;overflow-y:auto"></div>
    <button id="mam-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 境界说明浮层（修行页）：十阶一览 + 当前高亮 + 已过/未至三态 -->
<div id="modal-realm" class="mask hide">
  <div class="modal">
    <h2 id="mrm-title"></h2>
    <p class="hint" id="mrm-intro"></p>
    <div id="mrm-list" style="max-height:56vh;overflow-y:auto"></div>
    <button id="mrm-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 百器录浮层（批 2 · B5：12 格双节 = 特殊词条 10 + 独占法宝 2 · 炼化不除名 · 纯荣誉零数值） -->
<div id="modal-gearcodex" class="mask hide">
  <div class="modal">
    <h2 id="mgc-title"></h2>
    <div id="mgc-body" style="max-height:60vh;overflow-y:auto"></div>
    <button id="mgc-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 奇遇回看浮层（批 2 · 交互说明 ★：story 全文 + 首遇时间 + 上次选择与结果；法宝来源行/百器录独占格跳入） -->
<div id="modal-recall" class="mask hide">
  <div class="modal">
    <h2 id="mrc-title"></h2>
    <p class="mc-story" id="mrc-story"></p>
    <p class="hint" id="mrc-first"></p>
    <p class="hint" id="mrc-last"></p>
    <p class="hint" id="mrc-eff"></p>
    <button id="mrc-close" class="primary" style="width:100%;margin-top:6px"></button>
  </div>
</div>

<!-- 悟道石说明浮层（融合坛「悟道石」点按入口：物品介绍 + 获取来源） -->
<div id="modal-matwudao" class="mask hide">
  <div class="modal">
    <h2 id="mwd-title"></h2>
    <p id="mwd-desc"></p>
    <p class="hint" id="mwd-srct" style="margin-bottom:2px;font-weight:650"></p>
    <p class="hint" id="mwd-src" style="margin-top:0"></p>
    <button id="mwd-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 洞府入驻轻演出（批 2 · B3：仅第一次拥有；洞府名 + caveMult + 灵气叙事全文，点按跳过） -->
<div id="cave-stage" class="cave-stage hide">
  <div class="cavebox">
    <div class="cv1" id="cvs-t1"></div>
    <div class="cv2" id="cvs-t2"></div>
    <div class="cv3" id="cvs-t3"></div>
    <div class="cvstory" id="cvs-story"></div>
    <div class="cvskip" id="cvs-skip"></div>
  </div>
</div>

<!-- 道友名录浮层（批 3 · B2/B3：20 格双节四态 + 护法摘要 + 双修状态行；详情五段式为浮层内二级页） -->
<div id="modal-bonds" class="mask hide">
  <div class="modal">
    <h2 id="mbd-title"></h2>
    <div id="mbd-body" style="max-height:62vh;overflow-y:auto"></div>
    <button id="mbd-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 护法位/道侣位择选浮层（择选批）：道友页顶部两位置点开——仅列当前满足条件者，不满足不显示 -->
<div id="modal-slotpick" class="mask hide">
  <div class="modal">
    <h2 id="msp-title"></h2>
    <p class="hint" id="msp-hint"></p>
    <div id="msp-body" style="max-height:56vh;overflow-y:auto"></div>
    <button id="msp-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 提亲 CONFIRM（批 3 · B4：三形态全列，当前档位描金，其余置灰但效果代价全文可见） -->
<div id="modal-propose" class="mask hide">
  <div class="modal">
    <h2 id="mpr-title" style="text-align:center;letter-spacing:.35em"></h2>
    <p class="hint" id="mpr-sub" style="text-align:center"></p>
    <div id="mpr-forms"></div>
    <div class="row between" style="margin-top:12px">
      <button id="mpr-no"></button>
      <button id="mpr-ok" class="primary"></button>
    </div>
    <p class="pfoot" id="mpr-foot"></p>
  </div>
</div>

<!-- 结契轻演出（批 3 · B4：结缘词全屏 2s，点按跳过；文案写意留白红线） -->
<div id="spouse-stage" class="spouse-stage hide">
  <div class="spousebox">
    <div class="sv1" id="sps-t1"></div>
    <div class="sv2" id="sps-t2"></div>
    <div class="sv3" id="sps-t3"></div>
  </div>
</div>

<!-- 天道 · 焚表问天浮层（天道系统批 B1）：卦位六选 + 香火四档 + 奏疏生成/复制 + 本地自问自卜 + 接旨粘贴框 -->
<div id="modal-tiandao" class="mask hide">
  <div class="modal">
    <h2 id="mtd-title" style="text-align:center;letter-spacing:.35em"></h2>
    <p class="hint" id="mtd-cd" style="text-align:center"></p>
    <p class="hint" id="mtd-hexlabel"></p>
    <div class="tdhex" id="mtd-hex"></div>
    <p class="hint" id="mtd-inclabel"></p>
    <div class="chips" id="mtd-incense"></div>
    <textarea id="mtd-free" class="tdta hide" rows="2" style="min-height:52px;margin-top:6px"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="mtd-memo" class="primary" style="flex:1"></button>
      <button id="mtd-local" style="flex:1"></button>
    </div>
    <p class="hint" id="mtd-localhint" style="margin-top:6px"></p>
    <textarea id="mtd-memoout" class="tdta hide" readonly style="margin-top:8px"></textarea>
    <button id="mtd-copy" class="hide" style="width:100%;margin-top:6px"></button>
    <p class="hint" id="mtd-reclabel" style="margin-top:10px"></p>
    <textarea id="mtd-receive" class="tdta" rows="3" style="min-height:64px"></textarea>
    <button id="mtd-parse" class="primary" style="width:100%;margin-top:6px"></button>
    <div class="kv" id="mtd-defy" style="margin-top:8px"></div>
    <button id="mtd-close" style="width:100%;margin-top:8px"></button>
  </div>
</div>

<!-- 天道 · 接旨揭晓（B2）：卷轴展开 + 判词逐字显现 + 领旨/抗旨二选一（抗旨走 CONFIRM 二次确认） -->
<div id="modal-decree" class="mask hide">
  <div class="modal">
    <div class="decree-scroll" id="mdc-scroll">
      <div class="decree-type" id="mdc-type"></div>
      <div class="decree-meta" id="mdc-meta"></div>
      <div class="decree-verdict" id="mdc-verdict"></div>
      <div class="decree-omen" id="mdc-omen"></div>
      <p class="hint" id="mdc-eff" style="text-align:center;margin-top:8px"></p>
    </div>
    <div class="row between" id="mdc-btns" style="margin-top:12px">
      <button id="mdc-defy"></button>
      <button id="mdc-accept" class="primary"></button>
    </div>
    <p class="hint" id="mdc-seen" style="text-align:center;margin-top:10px"></p>
    <button id="mdc-close" style="width:100%;margin-top:8px"></button>
  </div>
</div>

<!-- 天道 · 天象查看浮层（B4）：未览红点即开即消 -->
<div id="modal-omens" class="mask hide">
  <div class="modal">
    <h2 id="mom-title"></h2>
    <div id="mom-body" style="max-height:62vh;overflow-y:auto"></div>
    <button id="mom-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 兵解 · 盖棺之传（第册批 · 用户令「点击兵解做一个效果演出，逐字出现，给当前角色一个类似传记总结」）：
     卷轴观感与逐字节奏复用接旨那一族（.decree-scroll / .decree-type / .decree-verdict ⇒ 零新 CSS），
     正文取引擎 doBingjie 刚写入的 `meta.biographies` 末条——视图不另生成文本，与前世书同源。
     ⚠️ 挂点前缀取 `mrp-` 而非顺手的 `mrc-`：`mrc-title` 已被上面「奇遇回看」浮层占用（同 id 两个 ⇒
     getElementById 只认文档里第一个，标题会写进一个 display:none 的 h2 里，屏上看不见——本批截图取证抓到）。 -->

    ui.announcedLogKey = (wA && wA.log) ? logKeyOf(wA.log) : '';
    toast(text);
  }

  /* 轻震反馈（未结缘格 / 缘尽格 / 未录格共用）：可感知但无信息（交互说明 ★） */
  function nudgeEl(elx) {
    if (!elx || reducedMotion()) return;
    elx.classList.remove('nudge');
    void elx.offsetWidth;
    elx.classList.add('nudge');
    setTimeout(function () { elx.classList.remove('nudge'); }, 420);
  }

  /* 存档 I/O 失败 → 人话提示（平台关卡 #89 桥容错：storage 被拒也不白屏、不静默丢档） */
  function checkIo() {
    if (!SQ.storageError) return;
    var e = SQ.storageError();
    if (!e) { ui.ioErrSeen = null; return; }
    var sig = e.op + ':' + e.msg;
    if (ui.ioErrSeen === sig) return;
    ui.ioErrSeen = sig;
    /* 侧档跳写 = 「展示流没存上、主档已存」那一族，套 ui.error.save 会同时说错两件事（裸英文 + 谎称进度没记下） */
    toast(t(e.msg === 'sideflow' ? 'ui.error.sideflow'
      : (e.op === 'write' ? 'ui.error.save' : 'ui.error.storage'), { msg: e.msg }));
  }

  /* ── 创角三屏（与 P2 相同逻辑） ── */
  /* 步骤条：一立名 / 二择界 / 三观天赋（当前步实心金、已过步描金，走查稿① 第 6 项）
   * 屏 id 与步骤号解耦：c1 = 起名 / c3 = 择界 / c2 = 观天赋（DOM 顺序按语义成对，不按步序）。 */
  function stepsHtml(cur) {
    var h = '';
    [1, 2, 3].forEach(function (i) {
      if (i > 1) h += '<span class="stepline"></span>';
      h += '<span class="step ' + (i === cur ? 'on' : (i < cur ? 'done' : '')) + '">' +
        '<span class="n">' + esc(tc('creation.step.' + i + '.n')) + '</span>' +
        esc(tc('creation.step.' + i + '.t')) + '</span>';
    });

  }

  function hasProfile(s) {
    return !!(s && s.profile && s.profile.worldId && s.profile.createdAt &&
              s.worlds && s.worlds[s.profile.worldId]);
  }

  $('c1-random').addEventListener('click', function () {
    $('c1-name').value = SQ.randomRoleName(SQ.WORLD_DEFAULT);
    $('c1-err').classList.add('hide');
  });
  /* 屏 1 · 起名 → 屏 3 · 择界（步序 2） */
  $('c1-next').addEventListener('click', function () {
    var name = ($('c1-name').value || '').trim();
    if (!SQ.validateName(name)) {
      $('c1-err').textContent = tc('creation.name.invalid');
      $('c1-err').classList.remove('hide');
      return;
    }
    draft.name = name;

  /* 机制词条判定（天赋池设计 §三·补）：effects 含挂点白名单键 → 「机制」小角标；
   * desc 直出条件句式文案（词表手写），不显示挂点键名 */
  function isMechTalent(el) {
    var HK = (SQ.Mods && SQ.Mods.TALENT_HOOK_KEYS) || [];
    for (var k in (el.effects || {})) if (HK.indexOf(k) >= 0) return true;
    return false;
  }
  /* 羁绊命中（§九）：锁定态才生效加成，创角重抽阶段仅展示连线徽标 + 一行说明 */
  function matchedSynergies(talents, worldId) {
    var entry = SQ.Worlds[worldId];
    var D = entry && entry.pack && entry.pack.data;
    var syns = (D && D.TALENT_SYNERGIES) || [];
    var ids = {};
    (talents || []).forEach(function (t) { ids[t.id] = 1; });
    return syns.filter(function (s) { return s.pair && ids[s.pair[0]] && ids[s.pair[1]]; });
  }
  function talentCard(el, w, synHit) {
    var d = document.createElement('div');
    var isEpic = el.tier === 'epic';
    d.className = 'tcard ' + (el.kind === 'positive' ? 'pos' : 'neg') +
      (el.tier === 'rare' ? ' rare' : '') + (isEpic ? ' epic' : '') + (synHit ? ' syn' : '');
    var html = '';
    if (el.tier === 'rare') html += '<span class="corner">' + esc(tc('creation.talent.rare')) + '</span>';
    if (isEpic) html += '<span class="corner epic">' + esc(tc('creation.talent.epic')) + '</span>';
    if (el.amplified) html += '<span class="corner amp">' + esc(tc('creation.talent.amplify')) + '</span>';
    /* N20 接线：羁绊命中此前只加 `.syn` 描边、无文字（玩家看不出这枚天赋是被羁绊点亮的） */
    if (synHit) html += '<span class="corner">' + esc(tc('creation.talent.synergy')) + '</span>';
    if (isMechTalent(el)) html += '<span class="corner mech' + (el.amplified ? ' mechshift' : '') + '">' + esc(tc('creation.talent.mech')) + '</span>';
    html += '<div class="tname">' + esc(SQ.t('talent.' + el.id + '.name', null, w)) + '</div>' +
            '<div class="teff">' + esc(SQ.effectsToText(el.effects, w)) + '</div>' +
            '<div class="tdesc">' + esc(SQ.t('talent.' + el.id + '.desc', null, w)) + '</div>';
    d.innerHTML = html;
    return d;
  }
  /* 天赋池由「屏 3 · 择界」所选世界决定（draft.worldId） */
  function rerollTalents() {
    draft.roll = SQ.rollTalents(draft.worldId || SQ.WORLD_DEFAULT);
    renderC2();
  }
  function renderC2() {
    var r = draft.roll, w = draft.worldId || SQ.WORLD_DEFAULT;
    $('c2-combo').textContent = tc('creation.talent.combo', { p: r.combo.pos, n: r.combo.neg });
    var syns = matchedSynergies(r.talents, w);
    var synIds = {};
    syns.forEach(function (s) { s.pair.forEach(function (id) { synIds[id] = 1; }); });
    var box = $('c2-cards');
    box.innerHTML = '';
    r.talents.forEach(function (el) { box.appendChild(talentCard(el, w, !!synIds[el.id])); });
    /* 羁绊连线徽标行（卡片下方一行说明；纯展示，加成结算在 mods 通道） */
    var noteEl = $('c2-syn');
    if (syns.length && noteEl) {
      noteEl.innerHTML = syns.map(function (s) {
        return '<span class="synbadge">⚭ ' + esc(SQ.t('talent.synergy.' + s.id + '.name', null, w)) + '</span> ' +
          esc(SQ.t('talent.synergy.' + s.id + '.desc', null, w));
      }).join('<br>');
      noteEl.classList.remove('hide');
    } else if (noteEl) {
      noteEl.innerHTML = '';
      noteEl.classList.add('hide');
    }
    renderBias();
  }
  /* ── F1 问道初心三段（默认「红尘自在」预选；无性别/种族入口，profile 走缺省） ── */
  function renderBias() {
    var box = $('c2-bias');
    box.innerHTML = '';
    ['right', 'neutral', 'evil'].forEach(function (b) {
      var card = document.createElement('div');
      card.className = 'biascard ' + b + (draft.bias === b ? ' sel' : '');
      card.innerHTML = '<div class="bn">' + esc(tc('creation.bias.' + b)) + '</div>' +
        '<div class="bd">' + esc(tc('creation.bias.' + b + '.desc')) + '</div>';
      card.addEventListener('click', function () { draft.bias = b; renderBias(); });
      box.appendChild(card);
    });
  }
  function renderLockSummary() {
    var w = draft.worldId || SQ.WORLD_DEFAULT;
    var pills = (draft.roll ? draft.roll.talents : []).map(function (el) {
      return '<span class="pill">' + esc(SQ.t('talent.' + el.id + '.name', null, w)) + '</span>';
    });
    pills.push('<span class="pill">' + esc(tc('creation.bias.label')) + ' · ' + esc(tc('creation.bias.' + draft.bias)) + '</span>');
    $('mk-summary').innerHTML = pills.join('');
    renderLegacyGifts();
  }
  /* 轮回赠礼（轮回卷 §5.3 新周目创角）：跳档起步 / 转世天赋槽 ≤2 / 跨世之缘赎回——
   * 全部资格型（meta.spent 判定），创角事务内一次确认 */
  function renderLegacyGifts() {
    var meta = state.meta || {};
    var spent = meta.spent || {};
    var d = D();   /* 批C：世界表经 pack 取数，不吃世界专属全局（D3 射程） */
    draft.legacy = draft.legacy || { startRealm: 0, talents: [], bond: null };
    var has = { r1: spent['shop.startRealm1'] != null, r2: spent['shop.startRealm2'] != null, r3: spent['shop.startRealm3'] != null };
    var ownedT = SQ.Legacy ? SQ.Legacy.ownedTalents(meta, d) : [];
    var bondOk = !!(meta.unlocks && meta.unlocks.bond) && ((meta.lastBonds || []).length > 0);
    if (!has.r1 && !has.r2 && !has.r3 && !ownedT.length && !bondOk) { $('mk-legacy').innerHTML = ''; return; }
    var h = '<p class="hint" style="margin-top:10px">' + esc(t('legacy.ui.gifts')) + '</p>';
    if (has.r1 || has.r2 || has.r3) {
      h += '<div class="kv"><span class="hint">' + esc(t('legacy.ui.startRealm.pick')) + '</span></div><div class="chips">';
      h += '<button class="' + (draft.legacy.startRealm === 0 ? 'on' : '') + '" data-act="lgRealm" data-v="0">' + esc(t('legacy.ui.none')) + '</button>';
      [[1, 'r1'], [2, 'r2'], [3, 'r3']].forEach(function (r) {
        if (!has[r[1]]) return;
        h += '<button class="' + (draft.legacy.startRealm === r[0] ? 'on' : '') + '" data-act="lgRealm" data-v="' + r[0] + '">' + esc(t('realm.' + r[0])) + '</button>';
      });
      h += '</div>';
    }
    if (ownedT.length) {
      h += '<div class="kv"><span class="hint">' + esc(t('legacy.ui.legacyTalent.pick')) + '</span></div><div class="chips">';
      ownedT.forEach(function (tt) {
        var on = draft.legacy.talents.some(function (x) { return x.id === tt.id; });
        h += '<button class="' + (on ? 'on' : '') + '" data-act="lgTalent" data-v="' + tt.id + '" title="' + esc(t('legacy.talent.' + tt.id + '.desc')) + '">' + esc(t('legacy.talent.' + tt.id + '.name')) + '</button>';
      });
      h += '</div>';
    }
    if (bondOk) {
      h += '<div class="kv"><span class="hint">' + esc(t('legacy.ui.bondHeir.pick')) + '</span></div><div class="chips">';
      h += '<button class="' + (draft.legacy.bond === null ? 'on' : '') + '" data-act="lgBond" data-v="">—</button>';
      (meta.lastBonds || []).slice(0, 12).forEach(function (nid) {
        h += '<button class="' + (draft.legacy.bond === nid ? 'on' : '') + '" data-act="lgBond" data-v="' + nid + '">' + esc(t('bond.' + nid + '.name')) + '</button>';
      });
      h += '</div>';
    }
    $('mk-legacy').innerHTML = h;
  }
  $('c2-reroll').addEventListener('click', rerollTalents);
  $('c2-back').addEventListener('click', function () { show('c3'); });
  $('c2-confirm').addEventListener('click', function () { renderLockSummary(); $('modal-lock').classList.remove('hide'); });
  $('mk-cancel').addEventListener('click', function () { $('modal-lock').classList.add('hide'); });
  /* 屏 2 · 观天赋 → 入定（锁定天命后写入存档并进入主界面） */
  $('mk-ok').addEventListener('click', async function () {
    $('modal-lock').classList.add('hide');
    var w = draft.worldId;
    await SQ.mutate(state, function (s) {
      s.profile = {
        name: draft.name,
        talents: draft.roll.talents,
        worldId: w,
        worldName: draft.worldNames[w],
        createdAt: Date.now(),
        alignBias: draft.bias,   /* 问道初心（锁定态；gender/race 走 normalize 缺省，本期无入口） */
        gender: 'male',
        race: 'human',
        /* 转世与换界都走这里重建 profile ⇒ 「已读公告号」必须显式带走，否则每死一次就重弹一次
           同一版公告（不能改成整对象展开：legacyTalents 那枚要的是「新一世没有赠礼就清干净」，见下 `if (lg)`） */
        seenNote: s.profile.seenNote
      };
      s.worlds[w] = SQ.Worlds[w].pack.initialState();
      /* N20 接线：首世开场行（转世世由 legacy.js 的 `legacy.log.rebirth` 起头，首世此前一片空白） */
      SQ.Log.push(s.worlds[w], 'sys', SQ.t('log.boot', null, w));
      if (s.meta.unlockedWorlds.indexOf(w) < 0) s.meta.unlockedWorlds.push(w);
      /* 轮回赠礼落地（轮回卷 §3.2/§3.3/§3.5）：跳档不跳渡劫 / 转世天赋独立槽 / 跨世之缘 bond 40 */
      var nws = s.worlds[w];
      var lg = draft.legacy;
      if (lg) {
        if (lg.startRealm > 0 && s.meta.spent['shop.startRealm' + lg.startRealm] != null) {
          nws.realm = lg.startRealm;
        }
        if (lg.talents && lg.talents.length) {
          s.profile.legacyTalents = lg.talents.slice(0, 2).map(function (tt) {
            return { id: tt.id, effects: tt.effects };
          });
        }
        if (lg.bond && s.meta.unlocks.bond) {
          /* 好感播种与 heirBond 判定源都由引擎唯一写口 grantHeir 落在成功分支里
             （耦合缺陷收口批 2026-10-10 引擎卷 §3.2 收 bonds 直写 + N23① 收口批收 heirBond 无条件赋值） */
          SQ.Bonds.grantHeir(nws, SQ.Worlds[w].pack, SQ.Worlds[w].pack.data, lg.bond, SQ.Worlds[w].pack.data.LEGACY.BOND_HEIR_BASE);
        }
      }
      /* 同代天骄创角生成（天骄卷 §二：默认 2 / 解锁 4 + 跨世宿敌带记忆转世） */
      if (SQ.Prodigy) SQ.Prodigy.rollForNewLife(nws, SQ.Worlds[w].pack, SQ.Worlds[w].pack.data, s.meta, Date.now());
    });
    draft.legacy = null;
    enterMain();
  });

  function renderC3() {
    var list = $('c3-list');
    list.innerHTML = '';
    draft.worldId = null;
    SQ.visibleWorlds().forEach(function (w) {
      if (!draft.worldNames[w.id] && w.status === 'live') {
        draft.worldNames[w.id] = SQ.generateWorldName(w.id);
      }
      var card = document.createElement('div');
      var coming = w.status !== 'live';
      card.className = 'wcard' + (coming ? ' coming' : '');
      var tags = (w.tagsKeys || []).map(function (k) { return SQ.t(k, null, w.id); }).join(' · ');
      card.innerHTML =
        '<span class="wstatus">' + esc(SQ.t(coming ? 'world.status.coming' : 'world.status.live', null, w.id)) + '</span>' +
        '<div class="wname">' + esc(coming ? SQ.t('world.' + w.id + '.name', null, w.id) : (draft.worldNames[w.id] || '')) + '</div>' +
        /* 副行只放「还多出来的信息」：live 卡的 .wname 是随机界名，故副行要带上界系名（玄幻修仙 · 标签…）；
         * coming 卡的 .wname 已经是界系名，副行再抄一遍就是重复排字（第二十批克苏鲁入列后 4/6 张卡都这样）*/
        (coming ? (tags ? '<div class="wtags">' + esc(tags) + '</div>' : '')
                : '<div class="wtags">' + esc(SQ.t('world.' + w.id + '.name', null, w.id)) + (tags ? ' · ' + esc(tags) : '') + '</div>');
      if (!coming) {
        card.addEventListener('click', function () {
          draft.worldId = w.id;
          Array.prototype.forEach.call(list.children, function (c) { c.classList.remove('sel'); });
          card.classList.add('sel');
          $('c3-err').classList.add('hide');
        });
      }
      list.appendChild(card);
    });
  }
  $('c3-back').addEventListener('click', function () { show('c1'); });
  /* 屏 3 · 择界 → 屏 2 · 观天赋（天赋池随所选世界抽取） */
  $('c3-go').addEventListener('click', function () {
    if (!draft.worldId) {
      $('c3-err').textContent = tc('creation.world.noPick');
      $('c3-err').classList.remove('hide');
      return;
    }
    rerollTalents();
    show('c2');
  });

  /* ══════════ MAIN：九游戏页 + 两系统页 ══════════ */
  /* 游戏页：**固定五区序**（UI v2 B1/B2 起；旧 `settings.tabOrder` 不再读、字段保留，旧档照常加载）；
   * lock（势力批 v2.4 需求 §4/§5 → 渐次解锁批 §C 表化）：境界未达时导航标题显示「？」置灰不可点。
   * 阈值单一事实源 = data.js TAB_UNLOCK（tabLock() 优先读表，行内 lock 为同源兜底值；
   * 引擎侧天骄 gate 与渡劫解锁播报同表同源）。
   * 阶梯：炼气起点 5 页（修行/历练/法与器/奇遇/成就）→ 筑基 +坊市/势力/炼丹/道友
   *   → 金丹 +天骄 → 元婴 +法宝 → 化神 +宗门。
   * 页面整合批 2026-10-06（UI 卷 §3.4a）：原「功法」「法器」两页并为「法与器」一页 → 游戏页 12 项。
   * **UI v2 B3（2026-10-20）拆回两页**：`arts` = 功法（skill.system）、新增 `gear` = 百器（gear.system）；
   *   导航 12 → **13** 项（五区共 16 项），`arts.system` / `arts.seg.*` / `arts.ov.*` 词表键退役。
   *   `newArtsDot` / `lastArtsSig` 仍只跟功法；百器侧无红点。 */
  var GAME_TABS = [
    { id: 'idle', key: 'tab.idle' },
    { id: 'combat', key: null, sys: 'combat.system' },
    { id: 'arts', key: null, sys: 'skill.system' },
    { id: 'gear', key: null, sys: 'gear.system' },
    { id: 'treasure', key: null, sys: 'treasure.system', lock: 3 },
    { id: 'shop', key: null, sys: 'shop.system', lock: 1 },
    { id: 'faction', key: null, sys: 'faction.system', lock: 1 },
    { id: 'bonds', key: null, sys: 'ui.pillar.bond', lock: 1 },
    { id: 'event', key: 'tab.event' },
    /* 六向长线批：炼丹炼器（筑基开炉）/ 同代天骄（金丹方闻同代之名）/ 宗门（化神亮入口） */
    { id: 'alchemy', key: null, sys: 'alchemy.system', lock: 1 },
    { id: 'prodigy', key: null, sys: 'jianghu.system', lock: 2 },
    { id: 'sect', key: null, sys: 'sect.system', lock: 4 },
    /* 成就图鉴批：成就自轮回页迁出为独立页（常驻可见，无境界门槛） */
    { id: 'achv', key: null, sys: 'achv.system' }
  ];
  /* 系统页：固定在导航最底部，不参与自定义排序 */
  var SYS_TABS = [
    { id: 'legacy', key: null, sys: 'legacy.system' },
    { id: 'journal', key: 'tab.log' },
    { id: 'settings', key: 'tab.settings' }
  ];
  var TABS = GAME_TABS.concat(SYS_TABS);
  /* UI v2 B1：五区分组（固定顺序）。B1 仍 15 页；B3 拆页后「道器」组加 gear。
   * 区标题是 #m-tabbar 的直接子节点（span），页按钮仍是直接子节点 —— 旧判据按 button[data-v]
   * 取数不受影响；A0/A10 的「12 游戏 + navsep」口径已在同批改为「15 项 + 五区齐全」。 */
  var SECTIONS = [
    { id: 'idle', key: 'nav.sec.idle', items: ['idle'] },
    { id: 'zone', key: 'nav.sec.zone', items: ['combat', 'event'] },
    { id: 'arts', key: 'nav.sec.arts', items: ['arts', 'gear', 'treasure', 'alchemy', 'shop'] },
    { id: 'bonds', key: 'nav.sec.bonds', items: ['bonds', 'faction', 'prodigy', 'sect'] },
    { id: 'life', key: 'nav.sec.life', items: ['achv', 'legacy', 'journal', 'settings'] }
  ];
  function tabById(id) {
    for (var i = 0; i < TABS.length; i++) if (TABS[i].id === id) return TABS[i];
    return null;
  }
  function sectionOf(id) {
    for (var i = 0; i < SECTIONS.length; i++) {
      if (SECTIONS[i].items.indexOf(id) >= 0) return SECTIONS[i];
    }
    return SECTIONS[0];
  }

  /* 渐次解锁批 §C1：门槛单一事实源 = D.TAB_UNLOCK（引擎天骄 gate / realm.js 解锁播报同源）；
   * 世界未装载或表缺项时回落 GAME_TABS 行内 lock（同值兜底）。 */
  function tabLock(tb) {
    try {
      var tu = (D() || {}).TAB_UNLOCK;
      if (tu && tu[tb.id] && tu[tb.id].r != null) return tu[tb.id].r;
    } catch (e) { /* 创角屏/世界未选：回落硬编码 */ }
    return tb.lock || 0;
  }
  /* 解锁红点（§C3）：会话级已知集——启动/切角色时快照当时已解锁项；会话内新解锁 tab 亮红点、
   * 进页即消。不入存档（纯 UI 态，与 newArtsDot 红点家族同纪律）。 */
  function tabKnownSync() {
    var pid0 = (state.profile && state.profile.id) || '';
    if (!ui.tabKnown || ui.tabKnownPid !== pid0) {
      ui.tabKnown = {}; ui.tabKnownPid = pid0;
      var w0 = ws();
      TABS.forEach(function (tb) {
        var lk = tabLock(tb);
        if (!lk || (w0 && w0.realm >= lk)) ui.tabKnown[tb.id] = 1;
      });
    }
  }

    var locked = lk && (!w0 || w0.realm < lk);
    if (locked) {
      /* 未解锁（势力批 v2.4）：标题「？」、置灰、不绑动作——点按无响应 */
      b.textContent = t('event.codex.unknown');   /* ？（词条本身即三个问号）*/
      b.className = 'locked';
      bar.appendChild(b);
      return;
    }
    b.textContent = tb.key ? t(tb.key) : t(tb.sys);
    b.className = ui.tab === tb.id ? 'on' : '';

    /* 走查 v2.5 §6：新功法/新法宝/新道友/坊市补货 红点 */
    var dotFlag = { arts: 'newArtsDot', treasure: 'newTreasureDot', bonds: 'newBondDot', shop: 'newShopDot' }[tb.id];
    if (dotFlag && ui[dotFlag]) {
      var dN = document.createElement('span'); dN.className = 'dot'; b.appendChild(dN);

    if (tb.id === 'achv') {

    if (!locked && ui.tabKnown && !ui.tabKnown[tb.id]) {

  function switchTab(id) {
    var tbDef = null;
    TABS.forEach(function (tb) { if (tb.id === id) tbDef = tb; });
    /* 未解锁页不可进入（势力批 v2.4 → 渐次解锁批表化）：防御——导航已不可点，这里兜底 */
    if (tbDef && tabLock(tbDef) && (!ws() || ws().realm < tabLock(tbDef))) return;
    ui.tab = id;
    if (ui.tabKnown) ui.tabKnown[id] = 1;   /* 新解锁红点进页即消 */
    TABS.forEach(function (tb) { $('tab-' + tb.id).classList.toggle('hide', tb.id !== id); });
    if (id === 'event') {
      ui.newFeedDot = false;                      /* 进奇遇页即视为已读 */
      ui.rumorSeenAt = SQ.UI.rumor.maxBorn(ctx(), ws());      /* 传闻红点同步消账：此后仅新出生的亮 */
    }
    if (id === 'journal') ui.newLogDot = false;   /* 进日志页即视为已读 */
    if (id === 'combat') ui.caveSnap = caveRedDotSig();   /* 进秘境洞天页（洞天节在内联）即视为已读地 chip 红点 */
    /* 走查 v2.5 §6：进页即清对应红点 */
    var dotMap = { arts: 'newArtsDot', treasure: 'newTreasureDot', bonds: 'newBondDot', shop: 'newShopDot' };
    if (dotMap[id]) ui[dotMap[id]] = false;
    renderTabbar();
    renderTab();
  }

  function pct(n) { return (Math.round(n * 1000) / 10).toString().replace(/\.0$/, '') + '%'; }

  /* 全位数字（修行状态批 v2.1）：修为大数字专用——千分位、不缩放不带单位，
   * 让每秒 tick 的增量逐位可见（SQ.fmt 的 万/亿 会把低境界产出量化到 0.1万/步） */
  function fmtFull(n) {
    return String(Math.floor(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  /* ── 游戏时间（v2.3）：算式与显示名口径**已上移到 core**（`SQ.gameDateOf` / `SQ.gameDateStr`，
   * 第廿八批）——引擎侧的人生传记也用它，视图这里只留一层取当前档的薄壳，别留第二套历法。
   * 1 游戏日 = 现实 1 秒，自入世（profile.createdAt）起算；12 月 × 30 日 = 360 日/年；
   * 起始年 = ws.calYear（创角随机 1~9000）；createdAt 缺失时返回空串（旧档兜底）── */
  function gameDateOf(ts) {
    return SQ.gameDateOf(state.profile, ws(), ts);
  }
  function gameDateStr(ts) {
    return SQ.gameDateStr(state.profile, ws(), ts, state.profile && state.profile.worldId);
  }

  /* ── Tab 1 修行 ── */
  /* ── 批 2 · 四柱（财/法/地/侣）────────────────────────────────
   * B1 chip 行：财=收支摘要、法=主修、地=洞府×倍率、侣=灰置（批 3 解锁）
   * B2 财 → 此生总账浮层；B3 地 → 洞府浮层；法 → 修习功法浮层（与财/地/侣同级） */
  function caveSigOf(field) {
    var c = SQ.Cave.current(ws(), pack());
    return (c.signature && c.signature.field === field) ? c.signature.value : 0;
  }
  function ledgerSums() { return SQ.Ledger.sums(ws()); }

  function renderPillars() {
    var w = ws(), p = pack(), d = D(), m = mods();
    var s = ledgerSums();
    var main = SQ.Arts.mainArt(w);

  /* B2 · 财柱总账：恒等式置顶 + 收支八行条形（区内归一）+ 占比 + 字段小注 + 印章分档 */
  var LEDGER_SEAL_2 = 5520000, LEDGER_SEAL_3 = 55200000;   /* 档界 = 主线六福地总投入 552 万 / ×10（UI §3.3 v2.5；扩池批别院/设施为带外可选投入不改档界） */
  function ledgerRows(dir, cats, max) {

        '<div class="lgl"><span class="nm">' + esc(t('ledger.cat.' + c)) + '</span>' +
        '<span class="vl">' + SQ.fmt(v) + (v > 0 ? ' · ' + esc(t('ledger.share', { p: Math.round(pctv) })) : '') + '</span></div>' +
        '<div class="lgb"><i style="width:' + pctv.toFixed(1) + '%"></i></div>' +
        '<div class="lgn">' + esc(t('ledger.field', { dir: t('ledger.dir.' + dir), cat: t('ledger.cat.' + c) })) + '</div></div>';

  function renderLedger() {

  /* B3 · 地柱洞府：福地名录四态卡（主线 6 + 别院 4 + 隐世 3，扩池批 v2.0）+ 缺项 chips 三段红绿 + 附属设施行 + 叙事折叠（未达资格不剧透）+ 迁居冷却倒计时 */
  /* 游戏时长（走查 v2.6 §1/§4）：冷却类以游戏时间表述——ms/1000 = 游戏日，360 日 = 1 游戏年 */
  function fmtGameDur(ms) {
    if (!isFinite(ms)) ms = 0;                     /* 防脏字段：NaN/undefined 一律按 0 计 */
    var days = Math.max(0, Math.floor(ms / 1000));
    var y = Math.floor(days / 360), rd = days % 360;
    if (y > 0) return t('ui.time.game.yd', { y: y, d: rd });
    return t('ui.time.game.d', { d: rd });
  }
  function fmtLeft(ms) {
    if (!isFinite(ms)) ms = 0;                     /* 防脏字段：NaN/undefined 一律按 0 计 */
    var s = Math.max(0, Math.floor(ms / 1000));
    var d = Math.floor(s / 86400), hh = Math.floor((s % 86400) / 3600),
      mm = Math.floor((s % 3600) / 60), ss = s % 60;
    function two(n) { return ('0' + n).slice(-2); }
    return d > 0 ? t('cave.time.dhms', { d: d, h: two(hh), m: two(mm), s: two(ss) })
      : t('cave.time.hms', { h: two(hh), m: two(mm), s: two(ss) });
  }
  /* 洞天福地三件（reqchips / 附属设施行 / 图鉴卡列）已随第册四十二批整片搬进 view/zone.js（`SQ.UI.zone.caveDex`）；

  /* 洞天福地已内联到「秘境洞天」页（合并批）：地柱与秘境卡「福地」角标统一改为跳页并定位到洞天节。

  function openCave() {

  /* ── 修行页（引擎主面板）已整片外置 `view/idle.js`（N34 第十六刀 · 第册五十二批）：
   * 调用点由 `renderIdle()` 改为 `SQ.UI.idle.render(ctx())`；渲染器纯拼串，桥新增七枚（见件头注）。 ── */

  /* ── Tab 2 秘境（第册四十二批 · N34 第十刀）：整片搬进 view/zone.js（`SQ.UI.zone.render`，洞天节在内联）── */
  /* ── Tab 3 功法（批 2 · B4：主修角标 + 品阶×阵营双维分组 + 架上三态 + 独占剪影；
   * 「待重修」金标与渡劫 24h 横幅随第廿五批撤除——渡劫不再清功法等级）── */
  /* 相对时间（百器录首获 / 回看首遇共用） */
  function timeAgo(ts) {
    if (!isFinite(ts)) ts = Date.now();            /* 防脏字段：NaN/undefined 一律按「此刻」计 */
    var s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return t('ui.time.ago.now');
    if (s < 3600) return t('ui.time.ago.m', { n: Math.floor(s / 60) });
    if (s < 86400) return t('ui.time.ago.h', { n: Math.floor(s / 3600) });
    return t('ui.time.ago.d', { n: Math.floor(s / 86400) });
  }
  function fmtDate(ts) {
    /* 防脏字段：null / NaN / Infinity 一律按「此刻」计，杜绝「NaN-NaN-NaN NaN:NaN」 */
    if (ts == null || (typeof ts === 'number' && !isFinite(ts))) ts = Date.now();
    var dt = new Date(ts);
    function p2(n) { return ('0' + n).slice(-2); }
    return dt.getFullYear() + '-' + p2(dt.getMonth() + 1) + '-' + p2(dt.getDate()) + ' ' + p2(dt.getHours()) + ':' + p2(dt.getMinutes());
  }
  /* 独占载体溯源（B4/B5 共用）：扫全事件表三分支 gain → {ev, branch} */
  function carrierOf(kind, id) {
    var out = null;
    allEventList().forEach(function (ev) {
      ['right', 'evil', 'neutral'].forEach(function (bk) {
        var br = ev.choices && ev.choices[bk];
        if (!br) return;
        (br.gain || []).forEach(function (g) {
          if (out) return;
          if (kind === 'art' && g.type === 'exclusiveArt' && g.id === id) out = { ev: ev, branch: bk };
          if (kind === 'gear' && g.type === 'exclusiveGear' && g.id === id) out = { ev: ev, branch: bk };
        });
      });
    });
    return out;
  }
  /* 品阶 → 色阶（功法 / 丹药 / 丹方同一谱系，**映射只这一处**）；未知档落 t0 而非 'tundefined'。 */
  var TIER_CLS = { huang: 0, xuan: 2, di: 3, tian: 4 };
  function artTierCls(a) { return 't' + (TIER_CLS[a && a.tier] != null ? TIER_CLS[a.tier] : 0); }
  function tierCls(tier) { return TIER_CLS[tier] != null ? 't' + TIER_CLS[tier] : ''; }
  /* 法宝「先天 / 后天」→ 色阶：同一套 t 类，映射只这一处（原四处逐字抄 `xian ? 4 : 2`）*/
  function treasureKindCls(kind) { return 't' + (kind === 'xian' ? 4 : 2); }
  /* 未获得行（B4：获取途径教学行 + 缺项红字；系统深化批 B4：情报角标 + 豁免提示行） */

  /* 奇遇回看浮层（批 2 · 交互说明 ★）：story 全文 + 首遇时间 + 上次选择与结果。
   * 入口三处：图鉴已解锁格 / 法宝来源行（event）/ 百器录独占格载体事件。 */
  function openRecall(eventId) {

    });
    if (last) {

      var chk = last.hadCheck ? t('event.recall.check', { r: last.pass ? t('check.ok') : t('check.fail') }) : '';
      $('mrc-last').textContent = t('event.recall.last', { branch: t('event.' + eventId + '.branch.' + last.branch), karma: k }) + chk;

  /* ══ 批 3 · 侣柱 G14（B1~B4/B7~B9）══ */
  function bondTierNum(n) { return t('bond.tiernum.' + n); }
  function bondRedDotSig() {
    /* 侣 chip 红点（B1 · §2.2）：有人升档 或 候选可提亲——签名变化即亮，进浮层重置 */
    var w = ws(), p = pack(), d = D();
    var sig = [];
    SQ.Bonds.list(p).forEach(function (c) { sig.push(c.id + ':' + SQ.Bonds.tierOf(w, c.id, d)); });
    SQ.Bonds.list(p).forEach(function (c) {
      if (c.category === 'spouse' && SQ.Bonds.canPropose(w, p, d, c.id, Date.now()).ok) sig.push('p:' + c.id);
    });
    return sig.join(',');

  function caveRedDotSig() {
    /* 地 chip 红点（B1 · §2.2 同侣 chip 口径）：新福地解锁——境界 / 首通 / 缘法门控达成。
     * 只取「与灵石 / 冷却 / 当前驻留无关」的资格项：灵石涨落不参与签名，避免红点反复闪烁
     * （与侣 chip 的「满档 / 升档」同为稳定阈值型信号）；进洞天节即消。 */
    var w = ws(), p = pack(), d = D();
    if (!w || !p) return '';   /* 未入世 / 世界包未载：无红点可言（switchTab 可能先于 profile 就绪） */
    var sig = [];
    SQ.Cave.list(p).forEach(function (c) {
      var lack = SQ.Cave.canEnter(w, p, d, c.id, Date.now()).lack.filter(function (x) {
        return x.kind !== 'stones' && x.kind !== 'cooldown' && x.kind !== 'same';
      });
      if (!lack.length) sig.push(c.id);
    });
    return sig.join(',');
  }
  function achvRedDotSig() {
    /* 成就页红点：meta.achv 跨世只增（Codex.scan 追加、不重排不清），故取「已录条数 + 最新一条 id」
     * 为签名——达成新成就即签名变化 → 红点亮；进成就页消账。
     * 与日志/奇遇的「最新条标识」同纪律（不靠数组长度单判，避免将来若发生裁剪时静默失效）。 */
    var meta = state.meta;
    var a = (meta && meta.achv) || [];

      /* N20 接线：难度名此前不上屏（ATTR_DIFF 四档只在引擎侧乘算，玩家看到的是「属性 + 成算」，看不出这一门难在哪）       * ⇒ 动态取词 `t('dc.' + chk.dc)`，A6 的拼接前缀覆盖口径与 `odds.*` 同族 */
      var lblDc = t('event.check.type.attr', { attr: t('attr.' + chk.attr) }) + ' · ' + t('dc.' + chk.dc);
      return { kind: 'odds', label: lblDc,
        text: lblDc + ' · ' + t('event.check.odds', { odds: t(SQ.Attrs.oddsKey(pp)) }), ok: true };
    }
    if (type === 'karma') {
      var k = sys.karmaOf(w);
      return { kind: 'det', ok: (chk.min == null || k >= chk.min) && (chk.max == null || k <= chk.max), label: t('event.check.type.karma') };
    }
    if (type === 'align') {
      return { kind: 'det', ok: sys.tierOf(w) === chk.need, label: t('event.check.type.align') };
    }
    if (type === 'stones') {
      var lo = Array.isArray(chk.cost) ? chk.cost[0] : (chk.cost || 0);
      var hi = Array.isArray(chk.cost) ? chk.cost[1] : lo;
      return { kind: 'det', ok: w.stones >= lo, label: t('event.check.type.stones'),
        text: t('event.check.cost.stones', { n: lo === hi ? SQ.fmt(lo) : SQ.fmt(lo) + '~' + SQ.fmt(hi), cur: t('resource.currency') }) };
    }
    if (type === 'qi') {
      var pq = Math.round((Array.isArray(chk.pct) ? chk.pct[0] : (chk.pct || 0)) * 100);
      return { kind: 'det', ok: w.qi > 0, label: t('event.check.type.qi'),
        text: t('event.check.cost.qi', { res: t('resource.primary'), p: pq }) };
    }
    if (type === 'art') {
      var artsMap = p.artsMap();
      var ids = chk.id ? [chk.id] : (w.artsKnown || []).filter(function (aid) {
        var a = artsMap[aid];
        if (!a) return false;
        if (chk.tier != null && a.tier !== chk.tier) return false;
        if (chk.alignment && a.alignment !== chk.alignment) return false;
        return true;
      });
      var oka = ids.length > 0 && ids.every(function (aid) { return (w.artsKnown || []).indexOf(aid) >= 0; });
      if (oka && chk.slotted) oka = ids.some(function (aid) { return (w.artsSlots || []).indexOf(aid) >= 0; });
      return { kind: 'det', ok: oka, label: t('event.check.type.art') };
    }
    if (type === 'gear') {
      var okg = false;
      for (var slot in w.gear) {
        var it = w.gear[slot];
        if (!it) continue;
        if (chk.slot && it.slot !== chk.slot) continue;
        if (chk.tierMin != null && it.tier < chk.tierMin) continue;
        if (chk.special && it.special !== chk.special) continue;
        okg = true; break;
      }
      return { kind: 'det', ok: okg, label: t('event.check.type.gear') };
    }
    if (type === 'companion') {
      /* 第九类（B7 · 引擎卷 §3.5）：护法位档 ≥ minTier；魔道档必然失败 →「无人可援」置灰提示不隐藏 */
      var gC = SQ.Bonds ? SQ.Bonds.guardianOf(w, p, d) : null;
      var okC = !!(SQ.Bonds && SQ.Bonds.companionOk(w, p, d, chk.minTier));
      var lackC = okC ? '' : ((gC && gC.evil) ? t('event.check.companion.none') : t('event.check.companion.need', { n: chk.minTier || 1 }));
      return { kind: 'det', ok: okC, label: t('event.check.type.companion'), lack: lackC,
        text: okC
          ? t('event.check.type.companion') + ' · ' + t('bond.' + gC.npcId + '.name') + bondTierNum(gC.tier)
          : lackC };
    }
    if (type === 'power') {
      var pw = SQ.Mods.powerOf(w, p, d, m);
      var nd = d.ZONES[w.zone].need * (chk.ratio != null ? chk.ratio : 1);
      return { kind: 'det', ok: pw >= nd, label: t('event.check.type.power') };
    }
    if (type === 'ambushFoe') {
      /* 敌手快照（第卌四批 · §6.1B）：只报「你多少 / 对方多少」，**不置灰**——
       * 打得过打不过都是玩家的一念，这一族的「难」不该由 disabled 替他决定。
       * 成算不显示：引擎是双方各 ±10% 浮动的对局，写一个百分比就是假精确（切磋那边同理只给让差档）。 */
      var fo = (w.pendingChoice && w.pendingChoice.foe) || null;
      var fpw = fo && fo.power > 0 ? fo.power : 0;
      return { kind: 'odds', ok: true, label: t('event.check.type.ambushFoe'),
        text: fpw ? t('event.ambush.ui.vs', { a: SQ.fmt(SQ.Mods.powerOf(w, p, d, m)), b: SQ.fmt(fpw) })
          : t('event.check.type.ambushFoe') };
    }
    return { kind: 'det', ok: true, label: '' };
  }

  /* ── 自动奇遇（自动批）：开启后奇遇触发不再弹抉择模态，自动择一「可用」分支并结算 ──
   * 可用 = 确定性判定全过（与抉择模态按钮置灰同一套 checkPreview 口径）；
   * 倾向（体验批）：settings.eventPref 指定分支且可用 → 直接选它；否则可用分支中随机择一
   * （机缘本就无常）；全部不可用（理论不发生，防御）退化为全分支随机。
   * 结算走与手动抉择完全相同的 SQ.Actions.resolveChoice 单一通道，toast 告知抉择结果。 */
  function autoEventOn() {
    /* 战术限时抉择（第卌四批 · §6.1B）不受自动奇遇代择：用户原话「必须手动选，限时，超时默认迎战」——
     * 自动模式的语义是「机缘当前替玩家拿主意」，而这一族要保留的正是那一念之间。
     * 判据 = 走查 verify-ui-ambush A1（开着 autoEvent 也不代择，浮层与挂起都还在）。 */
    var wp = ws();
    if (wp && wp.pendingChoice) {
      var evp = findEvent(wp.pendingChoice.id);
      if (evp && evp.tactical) return false;
    }
    return !!(state.settings && state.settings.autoEvent);
  }
  function autoEventPref() {
    var p = state.settings && state.settings.eventPref;
    return (p === 'right' || p === 'evil' || p === 'neutral') ? p : 'none';
  }
  var autoEventBusy = false;                     /* 秒级 tick 防重入：resolveChoice 异步落盘期间不再重复触发 */
  function autoAvailableBranches(ev) {
    var out = [];
    ['right', 'evil', 'neutral'].forEach(function (bk) {
      var br = ev.choices && ev.choices[bk];
      if (!br) return;
      var ok = branchChecks(br).every(function (c) { return checkPreview(c).ok; });
      if (ok) out.push(bk);
    });
    return out;
  }
  async function autoResolveChoice() {
    if (autoEventBusy || !autoEventOn()) return;
    var pend = ws() && ws().pendingChoice;
    if (!pend) return;
    var ev = findEvent(pend.id);
    if (!ev) return;
    var bks = autoAvailableBranches(ev);
    if (!bks.length) bks = Object.keys(ev.choices || {});
    if (!bks.length) return;
    var pref = autoEventPref();
    var bk = (pref !== 'none' && bks.indexOf(pref) >= 0)
      ? pref
      : bks[Math.floor(Math.random() * bks.length)];
    autoEventBusy = true;
    try {
      var res = await SQ.Actions.resolveChoice(state, bk);
      if (res) {
        toast(t('event.auto.resolved', { name: t('event.' + ev.id + '.name'), branch: t('branch.' + bk) }));
        if (res.eff && (res.eff.exclusiveGear || res.eff.exclusiveArt)) SQ.UI.show.exclusive(ctx(), res.eff);
        /* bond 升档 toast：与手动抉择同一白名单（交互说明 §2.3） */
        var bd = res.eff && res.eff.bond;
        if (bd && bd.tierUp && !bd.blocked) {
          toast(t('bond.toast.tier', { name: t('bond.' + bd.npc + '.name'), title: t('bond.' + bd.npc + '.title.' + bd.tier) }));
          if (bd.tier === 3) toast(t('bond.toast.guardian', { name: t('bond.' + bd.npc + '.name') }));
        }
      }
      renderAll();
    } finally { autoEventBusy = false; }
  }

  /* ── 抉择浮层 showChoice 已外置 `view/event.js`（N34 第十九刀 · 第册五十五批）：导出 choice，调用点改成 `SQ.UI.event.choice(ctx(), …)`。 ── */

  /* ── 限时抉择（第卌四批 · 数值详设 §6.1B）：袭击 / 族中寻仇必须手动择，超时默认迎战。
   * 计时器归浮层自己养：秒级 tick 在「抉择浮层开着」时整段让路（见 startTick 首行那句 return），
   * 挂在 tick 上等于永远不倒数。**离线不倒数**——关掉页面就是把这抉择留到下次进线，
   * 不会「睡一觉被仇家打死」（用户定的这条与「限时」并不冲突：限时限的是你盯着屏幕的那一刻）。
   * 超时结算走与玩家手点**完全同一条** `SQ.Actions.resolveChoice`，不另开结算口——
   * 否则「超时迎战胜」与「手点迎战胜」的账会分叉（本仓「单一通道」纪律）。
   * shortcut: 重新载入页面会把这一轮的时限重新给满（刷新即可拖延）；要收紧就得把剩余量落盘、
   * 按在线时长扣减，代价是每秒一次写档——不值。 */
  var ambushTimer = null;
  function ambushHalt() {
    if (ambushTimer) { clearInterval(ambushTimer); ambushTimer = null; }
  }
  function ambushFoot(left) {
    $('mc-foot').textContent = t('event.modal.foot') +
      (left > 0 ? ' · ' + t('event.ambush.ui.remain', { t: timeLeftText(left) }) : '');
    $('mc-foot').classList.remove('hide');
  }
  function ambushCountdown() {
    ambushHalt();
    var A = D().AMBUSH || {};
    var left = A.DECIDE_MS || 0;
    ambushFoot(left);
    if (!(left > 0)) return;
    ambushTimer = setInterval(async function () {
      var w = ws();
      if (!w || !w.pendingChoice || $('modal-choice').classList.contains('hide')) { ambushHalt(); return; }
      left -= 1000;
      if (left > 0) { ambushFoot(left); return; }
      ambushHalt();
      ambushFoot(0);
      toast(t('event.ambush.ui.timeout'));
      var res = await SQ.Actions.resolveChoice(state, 'right');
      if (res && res.eff && (res.eff.exclusiveGear || res.eff.exclusiveArt)) SQ.UI.show.exclusive(ctx(), res.eff);
      /* 超时也必须把这一屏**结清在屏上**：旧代码只 renderAll()，浮层还开着、分支排还在、挂起已清空
       * ⇒ 三枚按钮点了都撞 `if (!pendC) return`，而抉择模态既不在遮罩可关族也不吃 ESC ⇒ 玩家被钉死在这一屏，
       *   只能刷新页面逃出去（2026-10-18 用户报「魔道来犯无法点击选项、又关不掉」）。
       *   出口 = 与手点同一条 renderChoiceResult（分支排收起、结果页与「确定」到位）。res 为空 = 引擎没结这一笔，
       *   挂起原样留着，按钮照旧可用，不是死路。 */
      if (res) { SQ.UI.event.choiceResult(ctx(), res); renderTop(); }
    }, 1000);
  }

  /* ── 演出族三枚（独占 / 名号 / 洞府）已整片外置 `view/show.js`（N34 第十四刀 · 第册五十批）：

  /* 闭关明细行（面板与出关呈报同源同数，走查稿② 第 4/6 项）：
   * 离线效率拆解 + 12h 上限是否触顶 + 奇遇时钟冻结读数（在线爬钟的悬念钩子） */
  function offlineDetail(lo) {
    var w = ws(), m = mods(), d = D();
    var base = Math.round(d.OFFLINE_EFF * 100);
    var bonus = Math.round(((m.sum && m.sum.offlineEff) || 0) * 100);
    var capH = d.OFFLINE_CAP_H + ((m.hooks && m.hooks.changye) || 0);

      clock: t('ui.time.ms', { m: Math.floor(cs / 60), s: cs % 60 })
    });

  /* 出关呈报（F4：lastOffline.at 键控 · 会话一次 · EVENT_CHOICE 优先顺延）
   * 正文改为数据网格：只陈列本次离线所得的数字（修为/灵石/时长/渡劫），不再走散文句式 */
  function showOfflineReport() {
    var lo = ws().lastOffline;

    var lsecs = isFinite(lo.secs) ? lo.secs : 0;   /* 防脏字段：NaN/undefined 一律按 0 计 */
    var lh = Math.floor(lsecs / 3600), lm = Math.floor((lsecs % 3600) / 60);
    var lt = lh > 0 ? t('ui.time.hm', { h: lh, m: lm }) : t('ui.time.m', { m: Math.max(1, lm) });
    var ventureLo = lo.mode === 'venture';

    $('mo-title').textContent = t('offline.report.title');
    $('mo-sub').textContent = t(ventureLo ? 'offline.panel.title.v' : 'offline.panel.title');
    $('mo-stats').innerHTML =
      '<div class="o"><div class="on">' + esc(t('resource.primary')) + '</div>' +

        '<div class="ov">' + trib.n + '<span class="u">' + esc(t('offline.stat.times')) + '</span></div>' +
        (trib.n > 0 ? '<div class="os">' + esc(t('offline.stat.trib.split', { s: trib.s, f: trib.f })) + '</div>' : '') +
      '</div>';
    $('mo-hint').textContent = offlineDetail(lo) + ' · ' +
      t(ventureLo ? 'offline.report.hint.v' : 'offline.report.hint');
    $('mo-ok').textContent = t('offline.report.ok');
    $('modal-offline').classList.remove('hide');
  }
  /* 坐化呈报（`deathReport`）与确认收口（`okDeath`）已整片外置 `view/show.js`（N34 第十四刀 · 第册五十批）：
   * 这里只留确认键的一行转发——`deathPending` 那条分支（进创角 + 盖棺之传）在件内走桥位。 */
  $('mo-ok').addEventListener('click', function () { SQ.UI.show.okDeath(ctx()); });

  /* ── 角色浮层已外置 `view/self.js`（N34 第十八刀 · 第册五十四批）：调用点 = 派发器 `data-act="role"`，

  $('mr-close').addEventListener('click', function () { $('modal-role').classList.add('hide'); });
  $('mr-karma').addEventListener('click', function () { $('modal-role').classList.add('hide'); SQ.UI.self.karma(ctx()); });

  /* ── 洗髓浮层（天赋池设计 v1.8 §十 · 洗髓批）：三格择一替换 + 三候选择一 ──
   * 候选只掷一次并存在 washDraft 里（选格不重掷，否则「看着换」变成「赌着换」）；
   * 真正改档只走 SQ.Talents.applySwap 单口，视图不自带判定。 */
  var washDraft = { slot: -1, cand: -1, cands: [] };
  function washCard(el, i, act, picked) {
    var d = talentCard(el, wid());
    d.setAttribute('data-act', act);
    d.setAttribute('data-v', i);

  }
  function renderWash() {

    var cb = $('tw-cands');

    washDraft.cands.forEach(function (el, i) { cb.appendChild(washCard(el, i, 'washPick', i === washDraft.cand)); });
    $('tw-ok').disabled = !(washDraft.slot >= 0 && washDraft.cand >= 0);
  }
  function showWash() {
    var w = ws(), cap = (D().TALENT_SWAP || {}).PER_LIFE || 0;

    washDraft.cands = SQ.Talents.candidates(wid(), state.profile, 3);

    });
    $('tw-pick-label').textContent = t('talent.swap.pick');
    $('tw-cand-label').textContent = t('talent.swap.cand');

    $('tw-ok').textContent = t('talent.swap.ok');
    renderWash();
    $('modal-role').classList.add('hide');
    $('modal-talentwash').classList.remove('hide');
  }
  async function doWash() {
    var cand = washDraft.cands[washDraft.cand];
    if (washDraft.slot < 0 || !cand) { toast(t('talent.swap.need')); return; }
    var res = null;
    await SQ.mutate(state, function (s) {
      var id = s.profile.worldId;
      res = SQ.Talents.applySwap(id, s.profile, s.worlds[id], SQ.Worlds[id].pack.data, washDraft.slot, cand.id);
      if (res.ok) SQ.Log.push(s.worlds[id], 'sys', SQ.t('talent.swap.done', {
        from: SQ.t('talent.' + res.from + '.name', null, id),

      toast(t(res && res.reason === 'none' ? 'talent.swap.none' : 'talent.swap.cap'));

  $('tw-close').addEventListener('click', function () { $('modal-talentwash').classList.add('hide'); });

  /* ── karma 浮层（F5）已外置 `view/self.js`（N34 第十八刀 · 第册五十四批）：调用点 = 派发器 `data-act="karma"`。 ── */
  $('mkd-close').addEventListener('click', function () { $('modal-karma').classList.add('hide'); });

  /* ── 通用确认 ── */
  var confirmCb = null;
  var confirmCancelCb = null;   /* 取消回调（系统深化批 B4 · 献秘二选一） */
  function askConfirm(title, text, cb, cancelCb) {

        if (!res) return;
        if (res.eff && (res.eff.exclusiveGear || res.eff.exclusiveArt)) SQ.UI.show.exclusive(ctx(), res.eff);
        /* bond 升档 toast（B7 · 交互说明 §2.3 白名单）：达档 3 另弹「愿为你护法」 */
        var bd = res.eff && res.eff.bond;
        if (bd && bd.tierUp && !bd.blocked) {
          toast(t('bond.toast.tier', { name: t('bond.' + bd.npc + '.name'), title: t('bond.' + bd.npc + '.title.' + bd.tier) }));
          if (bd.tier === 3) toast(t('bond.toast.guardian', { name: t('bond.' + bd.npc + '.name') }));
        }
        SQ.UI.event.choiceResult(ctx(), res);
        renderTop();
      };
      if (chks.length && !reducedMotion()) {
        /* 判定演出 ≈1s：链逐级点亮（引擎已出结果，演出纯表现；交互说明 §4.3） */
        $('mc-branches').classList.add('hide');
        $('mc-foot').classList.add('hide');
        var jd = $('mc-judging');
        jd.innerHTML = '<div style="font-weight:650">' + esc(t('event.modal.judging')) + '</div>' +
          chks.map(function (c, i) {
            return '<div class="jline" id="jline-' + i + '">' + esc(checkPreview(c).label) + '</div>';
          }).join('');
        jd.classList.remove('hide');
        var step = Math.max(150, Math.floor(1000 / (chks.length + 1)));
        chks.forEach(function (c, i) {
          judgingTimers.push(setTimeout(function () {
            var el = $('jline-' + i);
            if (el) el.classList.add('lit');
          }, step * (i + 1)));
        });
        judgingTimers.push(setTimeout(function () { jd.classList.add('hide'); finishChoose(); }, step * (chks.length + 1) + 200));
      } else {
        await finishChoose();
      }
      return;
    }
    if (document.querySelector('.tabbody')) document.querySelector('.tabbody').scrollTop = keepScroll;
  });

  /* ── tick 后呈报（弹层栈：奇遇抉择 > 出关呈报 > 渡劫结果；同帧只弹一个，其余下次收功顺延）── */
  function afterClaim(prevAttempts) {
    var w = ws();
    checkIo();
    /* 坐化呈报排在弹层栈首（寿元批）：人死在这一刻，抉择 / 出关 / 渡劫结果都属于上一世了 */
    if (w.lastDeath && w.lastDeath.at !== ui.seenDeathAt) SQ.UI.show.deathReport(ctx());
    else if (w.pendingChoice) {
      /* 自动批：自动奇遇开启 → 不弹抉择模态，自动择分支结算；关闭 → 维持弹窗 */
      if (autoEventOn()) autoResolveChoice();
      else SQ.UI.event.choice(ctx());
    }
    else if (w.lastOffline && w.lastOffline.at !== ui.seenOfflineAt) showOfflineReport();
    else if (w.tribulation.attempts > prevAttempts) SQ.UI.trib.show(ctx());
    /* 未读红点：基线（lastLogKey / lastFeedKey）每 tick 都要推进——toast 去重靠它。
     所以「有没有新内容」必须在推进基线之前判定，再记到独立的 dot 标志上；
     直接让 renderTabbar 去比基线，差值恒为 0，红点永远不亮。
     基线取「最新一条」的标识而非长度：log/feed 均封顶 50，长度到顶后不再增长，
     比长度会让红点永久失效。 */
    var logKey = logKeyOf(w.log);
    if (logKey && logKey !== ui.lastLogKey && ui.tab !== 'journal') {
      /* 去重：动作处已就同一日志弹过（announcedLogKey）则不再重复呈报；
         无自提示的动作（如坊市购入）仍由 tick 呈报，反馈不丢。 */
      if (logKey !== ui.announcedLogKey) {
        var latest = w.log[w.log.length - 1];
        /* event 类走奇遇模态/叙事流；karma 类（名号更迭）改由全屏演出呈报，不再重复 toast */
        if (latest && latest.cat !== 'event' && latest.cat !== 'karma') toast(latest.text);
      }
      ui.newLogDot = true;
    }
    ui.lastLogKey = logKey;
    /* 神秘商人开席提示（第卅九批 · 用户报「黑市/特席从没见过」）：席期只有 MERCHANT_DURATION_MS，
     * 而 settle 侧先写 shop 类日志、resolveBranch 随后写 event 类尾行 ⇒ 上面那条「只 toast 末行且跳过 event」
     * 的规则天然把开席吞掉。这里按开席时刻去重，一次开席只提示一次（含载入时仍在席期的补提示）。 */
    var mu = ((w.shop || {}).merchant || {}).until || 0;
    if (mu !== ui.lastMerchUntil) {
      ui.lastMerchUntil = mu;
      if (mu > Date.now()) toast(t('shop.merchant.open'));
    }
    var feedKey = feedKeyOf(w.eventHistory.feed);
    if (feedKey && feedKey !== ui.lastFeedKey && ui.tab !== 'event') ui.newFeedDot = true;
    ui.lastFeedKey = feedKey;
    /* 走查 v2.5 §6：新功法/新法宝/新道友/坊市补货 红点——同「先判定后推基线」纪律 */
    var sigs = resDotSigs(w);
    if (sigs.arts !== ui.lastArtsSig && ui.tab !== 'arts') ui.newArtsDot = true;
    ui.lastArtsSig = sigs.arts;
    if (sigs.treasure !== ui.lastTreasureSig && ui.tab !== 'treasure') ui.newTreasureDot = true;
    ui.lastTreasureSig = sigs.treasure;
    if (sigs.bonds !== ui.lastBondSig && ui.tab !== 'bonds') ui.newBondDot = true;
    ui.lastBondSig = sigs.bonds;
    if (sigs.shop !== ui.lastShopSig && ui.tab !== 'shop') ui.newShopDot = true;
    ui.lastShopSig = sigs.shop;
    /* 名号更迭演出（善恶名号批）：段位基线跨段即演（日志同源由 recalcDerived 入档 'karma'）。
       仅在无其它浮层/演出时触发，避免叠层；有浮层则保持旧基线，顺延下次收功再演。 */
    var rankSys = pack().worldSystems;
    var rankNow = (rankSys && rankSys.rankOf) ? rankSys.rankOf(w) : '';
    if (ui.karmaRank && rankNow && rankNow !== ui.karmaRank && !overlayOpen()) {
      SQ.UI.show.karmaRank(ctx(), rankNow, rankSys.tierOf(w));
      ui.karmaRank = rankNow;
    }
  }

  /* 是否有浮层/演出遮挡（名号更迭演出避让判定）：任一可见即顺延，不叠层 */
  function overlayOpen() {
    return !!document.querySelector('.mask:not(.hide), .trib-mask:not(.hide), .cave-stage:not(.hide),' +
      ' .spouse-stage:not(.hide), .excl-mask:not(.hide)');
  }

  /* 红点信号（走查 v2.5 §6）：功法=已学会部数、法宝=在库件数、道友=已结缘人数、坊市=补货时间戳 */
  function resDotSigs(w) {
    var bonded = 0;
    (D().COMPANIONS || []).forEach(function (c) {
      var a = (w.bonds || {})[c.id] || 0;
      if (a >= 1) bonded++;
    });
    return {
      arts: (w.artsKnown || []).length,
      treasure: (w.treasures && w.treasures.owned ? w.treasures.owned.length : 0),
      bonds: bonded,
      /* 坊市 = 补货时间戳 + **商人席的开席时刻**（第卅九批：特席只活 MERCHANT_DURATION_MS，
       * 原签名不含它 ⇒ 12h 冷却换来的一次到货从不点亮 tab，玩家实测「从没见过」）。
       * 只取 until 原值不做时间比较：席过期的那一 tick 若参与签名，会把红点在**收尾时**再点一次。 */
      shop: (w.shop && w.shop.nextRestock || 0) + '#' + ((w.shop && w.shop.merchant || {}).until || 0)
    };
  }

  /* 未读判定基线标识：log 尾插、feed 头插（unshift），二者均封顶 50 条，
     长度到顶后不再增长——只能比「最新一条」的标识。 */
  function logKeyOf(log) {
    var e = log && log[log.length - 1];
    return e ? (e.ts + ':' + e.cat + ':' + e.text) : '';
  }
  function feedKeyOf(feed) {
    var f = feed && feed[0];
    return f ? (f.ts + ':' + f.id + ':' + f.branch) : '';
  }

  var tickTimer = null;
  function stopTick() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }
  function startTick() {
    if (tickTimer) return;
    tickTimer = setInterval(async function () {
      if (!$('modal-choice').classList.contains('hide')) return; /* 选择模态期间暂停自动结算展示 */
      var prev = ws() ? ws().tribulation.attempts : 0;
      var keep = document.querySelector('.tabbody') ? document.querySelector('.tabbody').scrollTop : 0;
      /* 输入闸（GitHub issue #5 · 用户报「融合坛自定义名输入框无法输入文字，点击后很快丢失焦点」）：
       * renderAll() 把当前页整块 innerHTML 重建 ⇒ 正在打字的 <input> 换成新节点，焦点被抢、字一起丢。
       * 结算照跑（玩家进程不能停），只跳过这一次 DOM 重建；focusout 时补渲染。 */
      var ae = document.activeElement;
      var typing = !!(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA'));
      try {
        SQ.UI.trib.snap(ctx());           /* 劫前成算/损失快照（F7 复盘行） */
        await SQ.claim(state);
        afterClaim(prev);
        if (typing || document.hidden) return;
        /* document.hidden：面板收在后台时结算与落盘照跑（进度不能停），只跳过每秒一次的整页 DOM 重建；
         * 回到可见由下面的 visibilitychange 立刻补一帧 ⇒ 玩家看到的不会是旧数。 */
        renderAll();
        var tb = document.querySelector('.tabbody');
        if (tb) tb.scrollTop = keep;
      } catch (e) {
        /* C2（排期 C2 · 第册卅一批）：整段静默 catch ⇒ 渲染器**每秒抛一次也是零信号**（既不是 pageerror，
         * `assets/**` 又零 `console.*`，任何门禁都照不到）。现按 checkIo 同形记一次人话提示：签名去重
         * （同一枚错只播一次，不每秒刷屏），换一枚错才再播；打印面复用既有 `toast()`，不新开横幅。 */
        var sigTick = 'render:' + ((e && (e.name + ':' + e.message)) || 'unknown');
        if (ui.tickErrSeen !== sigTick) { ui.tickErrSeen = sigTick; toast(t('ui.error.render')); }
      }
    }, 1000);
  }
  /* 回到前台立刻补一帧（tick 里 document.hidden 那支跳过的渲染在这里接回来）*/
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && ws()) { _mods = null; renderAll(); }
  });

  /* ── MAIN 入口 ── */
  function enterMain() {
    ui.lastAttempts = ws().tribulation.attempts;
    /* 基线对齐当前存档：进场前（含离线结算）已产生的叙事/日志视为已读，
       只对本次会话内新增的亮红点——离线那批由「出关呈报」浮层交代 */
    ui.lastLogKey = logKeyOf(ws().log);
    ui.announcedLogKey = ui.lastLogKey;      /* 进场前（含离线）已产生的日志视为已呈报，首 tick 不重复弹 */
    ui.karmaRank = pack().worldSystems.rankOf(ws());   /* 名号段位基线：进场前（含离线）跨段不补演，只演本次会话内新跨段 */
    ui.lastFeedKey = feedKeyOf(ws().eventHistory.feed);
    ui.newLogDot = false; ui.newFeedDot = false;
    ui.rumorSeenAt = null;                /* G17 传闻红点基线：进场惰性对齐（存档既有传闻不打扰） */
    var baseSigs = resDotSigs(ws());          /* 走查 v2.5 §6：四类红点基线对齐当前档 */
    ui.lastArtsSig = baseSigs.arts; ui.lastTreasureSig = baseSigs.treasure;
    ui.lastBondSig = baseSigs.bonds; ui.lastShopSig = baseSigs.shop;
    ui.newArtsDot = false; ui.newTreasureDot = false; ui.newBondDot = false; ui.newShopDot = false;
    ui.achvSnap = achvRedDotSig();          /* 成就页红点基线：进场前（含离线）已达成者视为已读 */
    /* 回线首帧呈报闸（离线≤5min 不打扰批）：仅当 boot 的 claim 真的结算了离线才弹。
       判定依据：settle 与 core.claim 共用同一枚 now ⇒ 真结算时 lastOffline.at 恰等于 lastSave；
       离线 ≤5min 未触发结算（settle 不写 lastOffline），存档里残留的是上一段旧记录，
       其 at 早于本次 lastSave —— 直接标为已读，不再打扰。 */
    var lo0 = ws().lastOffline;
    ui.seenOfflineAt = (lo0 && lo0.at === ws().lastSave) ? 0 : (lo0 ? lo0.at : 0);
    switchTab('idle');
    show('main');
    checkIo();                              /* boot 的 load/save 若失败，进场即提示（#89） */
    var w0 = ws();
    if (w0.pendingChoice) {
      if (autoEventOn()) autoResolveChoice();   /* 自动批：进线即自动结算，不弹窗 */
      else SQ.UI.event.choice(ctx());
    }
    else if (w0.lastOffline && w0.lastOffline.at !== ui.seenOfflineAt) showOfflineReport();
    /* 更新公告（第册四批 · 判定与渲染全在 view/updatenote.js）：排在遇袭抉择与出关呈报**之后**，
       公告是最低优先级的打断，不能盖掉那些要玩家做决定的层。 */
    if (SQ.UI && SQ.UI.updateNote && SQ.UI.updateNote.needed((state.profile || {}).seenNote)) SQ.UI.updateNote.show(wid());
    startTick();
  }

  /* ── boot 模式：先 await 读档再首绘 ── */
  async function boot() {
    bindCreationTexts();
    show('loading');
    try {
      var s = await SQ.claim(state);
      /* 死在门口（寿元批）：boot 那一次离线结算里就已完成强制转世 ⇒ 档案名已空、进不了主界面。
       * 不能把人无声扔在创角屏——先演坐化呈报，确定后仍是创角流程。 */
      var ld0 = ((s.worlds || {})[s.profile.worldId] || {}).lastDeath;
      if (!hasProfile(s) && ld0 && ld0.at !== ui.seenDeathAt) { show('c1'); SQ.UI.show.deathReport(ctx()); return; }
      if (hasProfile(s)) enterMain();
      /* 读档失败回落空档 ⇒ 屏上是一张干净的创角屏。不提示就是「无声以为档没了」，
       * 而玩家此时顺手新建 = `SQ.mutate` 起手又读失败 → 拿空档落盘 → **盖掉盘上那份完好但读不动的载荷**。
       * tick 只在 enterMain 后起（startTick 在那条路上），所以这两支是 checkIo 唯一的补位点。 */
      else { show('c1'); checkIo(); }
    } catch (e) {
      show('c1'); checkIo();
    }
  }
  boot();
})();
</script>
</body>
</html>
