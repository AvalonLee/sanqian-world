<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>三千世界</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="wrap">
  <!-- LOADING -->
  <div id="sc-loading" class="panel"><p class="sub" id="loading-text">…</p></div>

  <!-- 屏 1 · 起名（步序 1） -->
  <div id="sc-c1" class="panel hide">
    <div class="stepper" id="c1-steps"></div>
    <h1 id="c1-title"></h1>
    <label class="kv"><span id="c1-label"></span></label>
    <input id="c1-name" maxlength="8" />
    <p class="err hide" id="c1-err"></p>
    <div class="row between">
      <button id="c1-random"></button>
      <button id="c1-next" class="primary"></button>
    </div>
  </div>

  <!-- 屏 3 · 观天赋 + 问道初心（步序 3；天赋池由屏 2 所选世界决定） -->
  <div id="sc-c2" class="panel hide">
    <div class="stepper" id="c2-steps"></div>
    <h1><span id="c2-title"></span><span class="combo-badge" id="c2-combo"></span></h1>
    <p class="hint" id="c2-hint"></p>
    <div class="cards" id="c2-cards"></div>
    <div class="synnote hide" id="c2-syn"></div>
    <h1 style="font-size:15px;margin-top:16px" id="c2b-title"></h1>
    <p class="hint" id="c2b-hint"></p>
    <div class="biascards" id="c2-bias"></div>
    <div class="row between">
      <button id="c2-back"></button>
      <span style="display:flex;gap:8px">
        <button id="c2-reroll"></button>
        <button id="c2-confirm" class="primary"></button>
      </span>
    </div>
  </div>

  <!-- 屏 2 · 择界（步序 2） -->
  <div id="sc-c3" class="panel hide">
    <div class="stepper" id="c3-steps"></div>
    <h1 id="c3-title"></h1>
    <p class="sub" id="c3-pick"></p>
    <p class="hint" id="c3-hint"></p>
    <div id="c3-list"></div>
    <p class="err hide" id="c3-err"></p>
    <div class="row between">
      <button id="c3-back"></button>
      <button id="c3-go" class="primary"></button>
    </div>
  </div>

  </div>

<!-- MAIN：顶栏 + 六 Tab + 底栏（窄屏单栏；≥720px 左栏导航 + 右栏内容。
     放在 .wrap 之外，才不会被创角三屏的 480px 窄栏限宽） -->
<div id="sc-main" class="hide">
    <div class="panel topbar">
      <div class="wm" id="m-wm" aria-hidden="true"></div>
      <div class="topline name" id="m-who" data-act="role"></div>
      <div class="topline">
        <span class="rankchip" id="m-rank" data-act="karma"></span>
        <span class="stones" id="m-stones"></span>
      </div>
      <div class="topline" id="m-sub"></div>
    </div>
    <div class="tabbody">
      <div id="tab-idle" class="panel"></div>
      <div id="tab-combat" class="panel hide"></div>
      <div id="tab-arts" class="panel hide"></div>
      <div id="tab-treasure" class="panel hide"></div>
      <div id="tab-shop" class="panel hide"></div>
      <div id="tab-faction" class="panel hide"></div>
      <div id="tab-bonds" class="panel hide"></div>
      <div id="tab-event" class="panel hide"></div>
      <div id="tab-alchemy" class="panel hide"></div>
      <div id="tab-prodigy" class="panel hide"></div>
      <div id="tab-sect" class="panel hide"></div>
      <div id="tab-achv" class="panel hide"></div>
      <div id="tab-legacy" class="panel hide"></div>
      <div id="tab-journal" class="panel hide"></div>
      <div id="tab-settings" class="panel hide"></div>
    </div>
    <div class="tabbar" id="m-tabbar"></div>
</div>

<!-- 锁定确认模态（F1：入定摘要 pills = 天赋 + 初心） -->
<div id="modal-lock" class="mask hide">
  <div class="modal">
    <h2 id="mk-title"></h2>
    <p id="mk-text"></p>
    <p class="hint" id="mk-sumlabel"></p>
    <div class="pills" id="mk-summary"></div>
    <div id="mk-legacy"></div>
    <div class="row between">
      <button id="mk-cancel"></button>
      <button id="mk-ok" class="primary"></button>
    </div>
  </div>
</div>

<!-- 选择奇遇模态（F3：三分支 + 判定演出 + 结果页；必须选择才关闭） -->
<div id="modal-choice" class="mask hide">
  <div class="modal">
    <div class="mc-badges" id="mc-badges"></div>
    <h2 id="mc-title"></h2>
    <p class="mc-story" id="mc-story"></p>
    <div id="mc-branches"></div>
    <p class="mc-foot hint" id="mc-foot"></p>
    <div id="mc-judging" class="judging hide"></div>
    <div id="mc-result" class="hide">
      <p class="res-check" id="mc-check"></p>
      <p class="res-karma" id="mc-karma"></p>
      <p id="mc-eff" class="hint" style="text-align:center"></p>
      <p id="mc-excl" class="hint hide" style="text-align:center"></p>
      <p id="mc-bondlock" class="hint hide" style="text-align:center;opacity:.75"></p>
      <button id="mc-ok" class="primary" style="width:100%"></button>
    </div>
  </div>
</div>

<!-- 角色浮层 -->
<div id="modal-role" class="mask hide">
  <div class="modal">
    <h2 id="mr-title"></h2>
    <div id="mr-attrs"></div>
    <div class="cards" id="mr-talents" style="margin-top:10px"></div>
    <div class="row between">
      <button id="mr-karma"></button>
      <button id="mr-wash" class="hide" data-act="washOpen"></button>
      <button id="mr-close" class="primary"></button>
    </div>
  </div>
</div>

<!-- 洗髓浮层（天赋池设计 v1.8 §十 · 洗髓批）：三格择一替换 + 三候选择一 → 换骨 -->
<div id="modal-talentwash" class="mask hide">
  <div class="modal">
    <h2 id="tw-title"></h2>
    <p id="tw-sub" class="hint"></p>
    <p class="hint" id="tw-pick-label"></p>
    <div class="cards" id="tw-slots"></div>
    <p class="hint" id="tw-cand-label"></p>
    <div class="cards" id="tw-cands"></div>
    <div class="row between">
      <button id="tw-close"></button>
      <button id="tw-ok" class="primary" data-act="washOk"></button>
    </div>
  </div>
</div>

<!-- karma 浮层（F5：四行构成 + 色带游标 + 档位效果摘要） -->
<div id="modal-karma" class="mask hide">
  <div class="modal">
    <h2 id="mkd-title"></h2>
    <p id="mkd-value" style="font-size:20px;font-weight:700"></p>
    <div class="bar slim"><i id="mkd-bar"></i></div>
    <p id="mkd-next" class="hint"></p>
    <p class="hint" id="mkd-ranktitle" style="margin-top:10px;font-weight:650"></p>
    <div id="mkd-ranks" class="rankladder"></div>
    <div id="mkd-parts"></div>
    <p id="mkd-rate" class="hint" style="margin-top:8px"></p>
    <p class="hint" id="mkd-efftitle" style="margin-top:10px;font-weight:650"></p>
    <div id="mkd-effects"></div>
    <button id="mkd-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 通用确认（购买等） -->
<div id="modal-confirm" class="mask hide">
  <div class="modal">
    <h2 id="cf-title"></h2>
    <p id="cf-text"></p>
    <div class="row between">
      <button id="cf-cancel"></button>
      <button id="cf-ok" class="primary"></button>
    </div>
  </div>
</div>

<!-- 真灵承继选择浮层（轮回卷 §3.4「可选一件」玩家入口 · 器灵卷 §九 数据契约）：
     转世触发前择**一件**已觉醒器灵的法宝带入下世；零候选时整层不弹（由 askHeirChoice 直过）。 -->
<div id="modal-heirchoice" class="mask hide">
  <div class="modal">
    <h2 id="hc-title"></h2>
    <p class="hint" id="hc-sub"></p>
    <p class="hint" id="hc-carry" style="font-weight:650"></p>
    <div id="hc-list" style="max-height:52vh;overflow-y:auto"></div>
    <p class="hint" id="hc-verdict"></p>
    <div class="row between">
      <button id="hc-cancel"></button>
      <button id="hc-none"></button>
    </div>
  </div>
</div>

<!-- 出关呈报（F4：lastOffline.at 键控 · 会话一次 · EVENT_CHOICE 优先顺延） -->
<div id="modal-offline" class="mask hide">
  <div class="modal">
    <h2 id="mo-title"></h2>
    <div class="osub" id="mo-sub"></div>
    <div class="ostat" id="mo-stats"></div>
    <p class="hint" id="mo-hint"></p>
    <button id="mo-ok" class="primary" style="width:100%"></button>
  </div>
</div>

<!-- 财 · 此生总账浮层（B2：恒等式置顶 + 收支八行条形 + 占比 + 印章分档） -->
<div id="modal-ledger" class="mask hide">
  <div class="modal">
    <h2 id="mlg-title"></h2>
    <div class="lg-ident" id="mlg-ident"></div>
    <p class="hint" id="mlg-identnote"></p>
    <div class="lg-sec" id="mlg-intitle"></div>
    <div id="mlg-in"></div>
    <div class="lg-sec" id="mlg-outtitle"></div>
    <div id="mlg-out"></div>
    <p class="hint" id="mlg-seal"></p>
    <p class="hint" id="mlg-empty"></p>
    <button id="mlg-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 法 · 修习功法浮层（修行页四柱「法」：只读展示修习槽内功法，与财/地/侣同级，不跳页） -->
<div id="modal-arts" class="mask hide">
  <div class="modal">
    <h2 id="mam-title"></h2>
    <p class="hint" id="mam-sub"></p>
    <div id="mam-list" style="max-height:58vh;overflow-y:auto"></div>
    <button id="mam-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 境界说明浮层（修行页）：十阶一览 + 当前高亮 + 已过/未至三态 -->
<div id="modal-realm" class="mask hide">
  <div class="modal">
    <h2 id="mrm-title"></h2>
    <p class="hint" id="mrm-intro"></p>
    <div id="mrm-list" style="max-height:56vh;overflow-y:auto"></div>
    <button id="mrm-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 百器录浮层（批 2 · B5：12 格双节 = 特殊词条 10 + 独占法宝 2 · 炼化不除名 · 纯荣誉零数值） -->
<div id="modal-gearcodex" class="mask hide">
  <div class="modal">
    <h2 id="mgc-title"></h2>
    <div id="mgc-body" style="max-height:60vh;overflow-y:auto"></div>
    <button id="mgc-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 奇遇回看浮层（批 2 · 交互说明 ★：story 全文 + 首遇时间 + 上次选择与结果；法宝来源行/百器录独占格跳入） -->
<div id="modal-recall" class="mask hide">
  <div class="modal">
    <h2 id="mrc-title"></h2>
    <p class="mc-story" id="mrc-story"></p>
    <p class="hint" id="mrc-first"></p>
    <p class="hint" id="mrc-last"></p>
    <p class="hint" id="mrc-eff"></p>
    <button id="mrc-close" class="primary" style="width:100%;margin-top:6px"></button>
  </div>
</div>

<!-- 悟道石说明浮层（融合坛「悟道石」点按入口：物品介绍 + 获取来源） -->
<div id="modal-matwudao" class="mask hide">
  <div class="modal">
    <h2 id="mwd-title"></h2>
    <p id="mwd-desc"></p>
    <p class="hint" id="mwd-srct" style="margin-bottom:2px;font-weight:650"></p>
    <p class="hint" id="mwd-src" style="margin-top:0"></p>
    <button id="mwd-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 洞府入驻轻演出（批 2 · B3：仅第一次拥有；洞府名 + caveMult + 灵气叙事全文，点按跳过） -->
<div id="cave-stage" class="cave-stage hide">
  <div class="cavebox">
    <div class="cv1" id="cvs-t1"></div>
    <div class="cv2" id="cvs-t2"></div>
    <div class="cv3" id="cvs-t3"></div>
    <div class="cvstory" id="cvs-story"></div>
    <div class="cvskip" id="cvs-skip"></div>
  </div>
</div>

<!-- 道友名录浮层（批 3 · B2/B3：20 格双节四态 + 护法摘要 + 双修状态行；详情五段式为浮层内二级页） -->
<div id="modal-bonds" class="mask hide">
  <div class="modal">
    <h2 id="mbd-title"></h2>
    <div id="mbd-body" style="max-height:62vh;overflow-y:auto"></div>
    <button id="mbd-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 护法位/道侣位择选浮层（择选批）：道友页顶部两位置点开——仅列当前满足条件者，不满足不显示 -->
<div id="modal-slotpick" class="mask hide">
  <div class="modal">
    <h2 id="msp-title"></h2>
    <p class="hint" id="msp-hint"></p>
    <div id="msp-body" style="max-height:56vh;overflow-y:auto"></div>
    <button id="msp-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 提亲 CONFIRM（批 3 · B4：三形态全列，当前档位描金，其余置灰但效果代价全文可见） -->
<div id="modal-propose" class="mask hide">
  <div class="modal">
    <h2 id="mpr-title" style="text-align:center;letter-spacing:.35em"></h2>
    <p class="hint" id="mpr-sub" style="text-align:center"></p>
    <div id="mpr-forms"></div>
    <div class="row between" style="margin-top:12px">
      <button id="mpr-no"></button>
      <button id="mpr-ok" class="primary"></button>
    </div>
    <p class="pfoot" id="mpr-foot"></p>
  </div>
</div>

<!-- 结契轻演出（批 3 · B4：结缘词全屏 2s，点按跳过；文案写意留白红线） -->
<div id="spouse-stage" class="spouse-stage hide">
  <div class="spousebox">
    <div class="sv1" id="sps-t1"></div>
    <div class="sv2" id="sps-t2"></div>
    <div class="sv3" id="sps-t3"></div>
  </div>
</div>

<!-- 天道 · 焚表问天浮层（天道系统批 B1）：卦位六选 + 香火四档 + 奏疏生成/复制 + 本地自问自卜 + 接旨粘贴框 -->
<div id="modal-tiandao" class="mask hide">
  <div class="modal">
    <h2 id="mtd-title" style="text-align:center;letter-spacing:.35em"></h2>
    <p class="hint" id="mtd-cd" style="text-align:center"></p>
    <p class="hint" id="mtd-hexlabel"></p>
    <div class="tdhex" id="mtd-hex"></div>
    <p class="hint" id="mtd-inclabel"></p>
    <div class="chips" id="mtd-incense"></div>
    <textarea id="mtd-free" class="tdta hide" rows="2" style="min-height:52px;margin-top:6px"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="mtd-memo" class="primary" style="flex:1"></button>
      <button id="mtd-local" style="flex:1"></button>
    </div>
    <p class="hint" id="mtd-localhint" style="margin-top:6px"></p>
    <textarea id="mtd-memoout" class="tdta hide" readonly style="margin-top:8px"></textarea>
    <button id="mtd-copy" class="hide" style="width:100%;margin-top:6px"></button>
    <p class="hint" id="mtd-reclabel" style="margin-top:10px"></p>
    <textarea id="mtd-receive" class="tdta" rows="3" style="min-height:64px"></textarea>
    <button id="mtd-parse" class="primary" style="width:100%;margin-top:6px"></button>
    <div class="kv" id="mtd-defy" style="margin-top:8px"></div>
    <button id="mtd-close" style="width:100%;margin-top:8px"></button>
  </div>
</div>

<!-- 天道 · 接旨揭晓（B2）：卷轴展开 + 判词逐字显现 + 领旨/抗旨二选一（抗旨走 CONFIRM 二次确认） -->
<div id="modal-decree" class="mask hide">
  <div class="modal">
    <div class="decree-scroll" id="mdc-scroll">
      <div class="decree-type" id="mdc-type"></div>
      <div class="decree-meta" id="mdc-meta"></div>
      <div class="decree-verdict" id="mdc-verdict"></div>
      <div class="decree-omen" id="mdc-omen"></div>
      <p class="hint" id="mdc-eff" style="text-align:center;margin-top:8px"></p>
    </div>
    <div class="row between" id="mdc-btns" style="margin-top:12px">
      <button id="mdc-defy"></button>
      <button id="mdc-accept" class="primary"></button>
    </div>
    <p class="hint" id="mdc-seen" style="text-align:center;margin-top:10px"></p>
    <button id="mdc-close" style="width:100%;margin-top:8px"></button>
  </div>
</div>

<!-- 天道 · 天象查看浮层（B4）：未览红点即开即消 -->
<div id="modal-omens" class="mask hide">
  <div class="modal">
    <h2 id="mom-title"></h2>
    <div id="mom-body" style="max-height:62vh;overflow-y:auto"></div>
    <button id="mom-close" class="primary" style="width:100%;margin-top:10px"></button>
  </div>
</div>

<!-- 兵解 · 盖棺之传（第册批 · 用户令「点击兵解做一个效果演出，逐字出现，给当前角色一个类似传记总结」）：
     卷轴观感与逐字节奏复用接旨那一族（.decree-scroll / .decree-type / .decree-verdict ⇒ 零新 CSS），
     正文取引擎 doBingjie 刚写入的 `meta.biographies` 末条——视图不另生成文本，与前世书同源。
     ⚠️ 挂点前缀取 `mrp-` 而非顺手的 `mrc-`：`mrc-title` 已被上面「奇遇回看」浮层占用（同 id 两个 ⇒
     getElementById 只认文档里第一个，标题会写进一个 display:none 的 h2 里，屏上看不见——本批截图取证抓到）。 -->
<!-- 更新公告（第册四批 · UI 卷 §3.4e · 视图代码外置试点）：结构与文案分别活在 view/updatenote.js 与词表里，
     本块只留挂点。刻意**不进 MASKS** ⇒ 点遮罩不关（要玩家亲手点「知道了」，与「奇遇抉择」同一套纪律）。
     挂点前缀 `mun-`（全库唯一由审计 D6 守）。 -->
<div id="modal-updatenote" class="mask hide">
  <div class="modal">
    <div class="decree-scroll">
      <div class="decree-type" id="mun-title"></div>
      <div id="mun-text" style="max-height:58vh;overflow-y:auto"></div>
    </div>
    <button id="mun-go" class="primary" data-act="noteClose" style="width:100%;margin-top:12px"></button>
  </div>
</div>

<div id="modal-recap" class="mask hide">
  <div class="modal">
    <div class="decree-scroll">
      <div class="decree-type" id="mrp-title"></div>
      <div class="decree-verdict" id="mrp-text" style="max-height:58vh;overflow-y:auto"></div>
    </div>
    <button id="mrp-go" class="primary" style="width:100%;margin-top:12px"></button>
  </div>
</div>

<!-- 渡劫呈报（渡劫演出重做批：主题感知卡片 + 成算环 + 数据行） -->
<div id="trib-stage" class="trib-mask hide">
  <div class="trib-card" id="trib-box">
    <div class="trib-ring" id="trib-ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="trk" cx="50" cy="50" r="42"></circle>
        <circle class="tfl" id="trib-arc" cx="50" cy="50" r="42"></circle>
      </svg>
      <div class="tri-in"><span class="tri-p" id="trib-ring-p">--</span><span class="tri-u">%</span></div>
    </div>
    <div class="t1" id="trib-t1"></div>
    <div class="t2" id="trib-t2"></div>
    <div class="trib-rows" id="trib-rows"></div>
    <div class="t2 hide" id="trib-guard"></div>
    <div class="trib-skip hide" id="trib-skip"></div>
  </div>
</div>

<!-- 独占奖励全屏演出（F3） -->
<div id="excl-stage" class="excl-mask hide">
  <div class="excl-box">
    <div class="e1" id="excl-t1"></div>
    <div class="e2" id="excl-t2"></div>
    <div class="e3" id="excl-t3"></div>
  </div>
</div>

<!-- 名号更迭全屏演出（善恶名号批）：跨段瞬间弹，点按或 3.2s 自动收 -->
<div id="rank-stage" class="rank-mask hide">
  <div class="rank-box">
    <div class="r1" id="rank-t1"></div>
    <div class="r2" id="rank-t2"></div>
    <div class="r3" id="rank-t3"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
(function () {

  var ui = {

    newFeedDot: false,                      /* 奇遇页未读红点（同上；基线见 lastFeedKey） */
    rumorSeenAt: null,                      /* G17 传闻红点基线（走查修复）：已读时点，其后出生的传闻才亮 */
    feedExpand: false, lastFeedKey: '',     /* 奇遇页叙事流折叠态（F2）+ 未读判定基线（最新条标识） */
    seenOfflineAt: 0,                       /* 出关呈报 at 键控 · 会话一次（F4） */
    seenDeathAt: 0, deathPending: false,    /* 坐化呈报（寿元批）：同 at 键控 · 确定后进创角 */

    caveStory: {},                          /* 洞府叙事展开态（B3；未达资格者本就不给展开） */
    tribSnap: null,                         /* 渡劫前 {p, loss} 快照（F7 复盘行） */

    slotPickFor: null,                      /* 满槽替换选择模式（B4）：待入槽的功法 id */

  function wid() { return state.profile ? state.profile.worldId : SQ.WORLD_DEFAULT; }
  function t(k, v) { return SQ.t(k, v, wid()); }
  /* 创角期取词：世界尚未写入 profile，按 draft.worldId 取（未择界时回落 common 词表） */
  function tc(k, v) { return SQ.t(k, v, draft.worldId); }
  function ws() { return state.worlds[wid()]; }
  function pack() { return SQ.Worlds[wid()].pack; }
  function D() { return pack().data; }
  /* mods 聚合的「一轮渲染一次」记忆（第册二批 · 热路径项）：一次 renderAll 里 ctx() 被取 27 次，
   * 每次都重跑一遍 Mods.collect 全量聚合（同一表达式里还有连取两次的）。渲染器是纯拼串、不改状态，
   * 所以缓存只需活过本轮渲染：renderAll / renderTab 各自在入口清一次，跨轮必重算 ⇒ 不存在读到旧值的路径。
   * shortcut: 若哪天出现「渲染中途写状态再读 mods」的写法，把失效点从渲染入口挪到写口（同 mutate 收口那条纪律）。 */
  var _mods = null;
  function mods() { if (!_mods) _mods = SQ.Mods.collect(state.profile, ws(), pack(), D()); return _mods; }

  /* 视图外置件的桥（第册五批 · N34 第二刀）：内联闭包里的私有量不许被外置件自取，一律走这一枚 ctx。
   * ⚠️ 键集由审计 **D7** 逐键对账：`view/*.js` 里用到的 c.xxx 必须在这里给过 ⇒ 少给一枚键当场判红，不留到运行时。
   * shortcut: 只放**已被外置件需要**的键；下一片要用新服务（toast / renderAll / mutate 之类）时在这里加一行、D7 自动跟。 */
  function ctx() {
    return { s: state, w: ws(), p: pack(), d: D(), ui: ui, $: $, t: t, esc: esc, date: gameDateStr,
      mods: mods(), tierCls: tierCls, kindCls: treasureKindCls, statLine: statLine, timeLeft: timeLeftText, toast: toast, ask: askConfirm, renderAll: renderAll, artTier: artTierCls, carrier: carrierOf, pct: pct, renderTab: renderTab, timeAgo: timeAgo, fmtDate: fmtDate,
      /* 第册卅六批第七刀补两枚：`spiritPanel` = 器灵面板仍在内核、法宝页回头调用（件外调用 ⇒ 该进桥），`nudge` = 输入不合法时抖一下控件的内核助手（造化两路动作要用点击那一行的 el） */
      spiritPanel: renderSpiritPanel, nudge: nudgeEl,
      /* 第八刀补三枚（都是「件外调用」才进桥）：fmtLeft = 沙漏剩余时长 ‖ fmtDur = 游戏历时长 ‖ bondTier = 好感档汉字数字 */
      fmtLeft: fmtLeft, fmtDur: fmtGameDur, bondTier: bondTierNum,
      /* 第十一刀补一枚：showWash = 洗髓浮层的内核入口（服丹成功即开 = 件外调用才进桥） */
      showWash: showWash,
      /* 第十二刀补三枚：`toastAction` = 带动作的提示（拜访 / 赠丹 / 缘尽赎回三处成功态）‖ `reducedMotion` =
       * 结契轻演出的时长分支 ‖ `bondDotSig` = 侣 chip 红点签名（页签机器留内核，浮层 opener 要拿它记基线）。
       * 再补 `fresh`：取一份**新的**桥快照——`SQ.mutate` 会深拷贝 world（core.js `cpWorld`），
       * 动作处若拿动作开始时的快照重渲浮层，读到的是改前的 `w`（本批 D2/C1 两红即此形）。
       * ⚠️ 值必须走 `freshCtx` 这个别名、不许直接写 `ctx`：D7 的私名表按「桥字面量里的值名」现推，
       * 写成 `fresh: ctx` 会让 `ctx` 进私名表 ⇒ 六件外置件注释里那句 `ctx()` 全部连带判红（实测 6 件）。 */
      toastAction: toastAction, reducedMotion: reducedMotion, bondDotSig: bondRedDotSig, fresh: freshCtx,
      /* 第十三刀补两枚：`enterRebirth` = 创角屏重入（飞升 / 兵解成功后由件内回调，MASKS / draft 那套机器在核内）
       * ‖ `playRecap` = 盖棺之传演出入口（演出族，第十四刀才搬） */
      enterRebirth: enterRebirthCreation, playRecap: playRecapLastBio,
      /* 第十六刀补七枚（修行页外置 `view/idle.js`，全是「件外调用才进桥」）：
       * `renderPillars` = 四柱 chip 行 ‖ `renderTiandaoRow` = 天道行（问天入口 + 天象红点）‖
       * `fmtFull` = 大数全写（灵气的「/ 上限」那一格）‖ `caveSigOf` = 洞府印记加成 ‖
       * `talentCard` = 天赋卡（件内 `talentCard(el, wid())` 两参）‖ `autoEventPref` = 奇遇倾向现值 ‖
       * `wid` = 当前世界 id。修行页同时复用两枚已有桥名：`bondTierNum` → `bondTier`、`ctx()` → `fresh`。 */
      renderPillars: renderPillars, renderTiandaoRow: renderTiandaoRow, fmtFull: fmtFull,
      caveSigOf: caveSigOf, talentCard: talentCard, autoEventPref: autoEventPref, wid: wid,
      /* 同刀补第八枚（本刀实测漏网一枚，走查前由 boot catch 抓到）：`offlineDetail` = 离线呈报的
       * 「效率 / 时长」那一格文案。⚠️ 教训：机械改写后必须跑「内核函数名 × 件内裸调用」全表对扫，
       * 不能只信改写规则自己那份白名单（`pct` / `timeAgo` / `offlineDetail` 三枚就是这样漏的）。 */
      offlineDetail: offlineDetail };
  }
  /* `fresh` 桥位的取值别名（见上注：不许让 `ctx` 这个私名进 D7 的私名表） */
  function freshCtx() { return ctx(); }

  function show(name) {
    ['loading', 'c1', 'c2', 'c3', 'main'].forEach(function (s) {
      $('sc-' + s).classList.toggle('hide', s !== name);
    });
  }

  /* ── toast（F6 收敛：同屏 ≤2 条；事件类废止——奇遇走模态/叙事流/红点） ── */
  function toast(text) {
    /* 动作处提示若与日志末条同文，则记为「已呈报」——tick 侧 afterClaim 不再重复弹一次。
       仅比对末条文本，冷却/错误类提示（文本对不上）不受影响。 */
    var w = state.worlds[wid()];
    var tail = w && w.log && w.log[w.log.length - 1];
    if (tail && tail.text === text) ui.announcedLogKey = logKeyOf(w.log);
    var box = $('toasts');
    while (box.children.length >= 2 && box.firstChild) box.removeChild(box.firstChild);
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    box.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 3000);
  }
  /* 动作处自弹提示（第十九批 · 用户报「点登门拜访弹两条」）：拜访 / 赠丹 / 赎回三处的 toast
   * 文案本来就比引擎那条日志更具体（结识 / 升档 / 同道相投…），旧的「文本全等」去重永远对不上
   * ⇒ 下一个 tick 又把日志末条弹一遍 = 同一次动作两条提示。此函数在弹之前把当前末条记为已呈报。 */
  function toastAction(text) {
    var wA = state.worlds[wid()];
    ui.announcedLogKey = (wA && wA.log) ? logKeyOf(wA.log) : '';
    toast(text);
  }

  /* 轻震反馈（未结缘格 / 缘尽格 / 未录格共用）：可感知但无信息（交互说明 ★） */
  function nudgeEl(elx) {
    if (!elx || reducedMotion()) return;
    elx.classList.remove('nudge');
    void elx.offsetWidth;
    elx.classList.add('nudge');
    setTimeout(function () { elx.classList.remove('nudge'); }, 420);
  }

  /* 存档 I/O 失败 → 人话提示（平台关卡 #89 桥容错：storage 被拒也不白屏、不静默丢档） */
  function checkIo() {
    if (!SQ.storageError) return;
    var e = SQ.storageError();
    if (!e) { ui.ioErrSeen = null; return; }
    var sig = e.op + ':' + e.msg;
    if (ui.ioErrSeen === sig) return;
    ui.ioErrSeen = sig;
    /* 侧档跳写 = 「展示流没存上、主档已存」那一族，套 ui.error.save 会同时说错两件事（裸英文 + 谎称进度没记下） */
    toast(t(e.msg === 'sideflow' ? 'ui.error.sideflow'
      : (e.op === 'write' ? 'ui.error.save' : 'ui.error.storage'), { msg: e.msg }));
  }

  /* ── 创角三屏（与 P2 相同逻辑） ── */
  /* 步骤条：一立名 / 二择界 / 三观天赋（当前步实心金、已过步描金，走查稿① 第 6 项）
   * 屏 id 与步骤号解耦：c1 = 起名 / c3 = 择界 / c2 = 观天赋（DOM 顺序按语义成对，不按步序）。 */
  function stepsHtml(cur) {
    var h = '';
    [1, 2, 3].forEach(function (i) {
      if (i > 1) h += '<span class="stepline"></span>';
      h += '<span class="step ' + (i === cur ? 'on' : (i < cur ? 'done' : '')) + '">' +
        '<span class="n">' + esc(tc('creation.step.' + i + '.n')) + '</span>' +
        esc(tc('creation.step.' + i + '.t')) + '</span>';
    });
    return h;
  }
  function bindCreationTexts() {
    document.title = SQ.t('app.name');
    $('loading-text').textContent = t('ui.loading');
    $('c1-steps').innerHTML = stepsHtml(1);   /* 起名 */
    $('c3-steps').innerHTML = stepsHtml(2);   /* 择界 */
    $('c2-steps').innerHTML = stepsHtml(3);   /* 观天赋 */
    $('c1-title').textContent = tc('creation.name.title');
    $('c1-label').textContent = tc('creation.name.label');
    $('c1-name').placeholder = tc('creation.name.ph');
    $('c1-random').textContent = tc('creation.name.random');
    $('c1-next').textContent = tc('creation.name.next');
    $('c3-title').textContent = tc('creation.world.title');
    $('c3-pick').textContent = tc('creation.world.pick');
    $('c3-hint').textContent = tc('creation.world.hint');
    $('c3-go').textContent = tc('creation.world.next');
    $('c3-back').textContent = tc('creation.back');
    $('c2-title').textContent = tc('creation.talent.title');
    $('c2-hint').textContent = tc('creation.talent.hint');
    $('c2-reroll').textContent = tc('creation.talent.reroll');
    $('c2-confirm').textContent = tc('creation.talent.confirm');
    $('c2-back').textContent = tc('creation.back');
    $('c2b-title').textContent = tc('creation.bias.title');
    $('c2b-hint').textContent = tc('creation.bias.hint');
    $('mk-title').textContent = tc('creation.talent.lockTitle');
    $('mk-text').textContent = tc('creation.talent.lockText');
    $('mk-sumlabel').textContent = tc('creation.talent.lockSummary');
    $('mk-cancel').textContent = t('ui.cancel');
    $('mk-ok').textContent = t('ui.ok');
  }

  function hasProfile(s) {
    return !!(s && s.profile && s.profile.worldId && s.profile.createdAt &&
              s.worlds && s.worlds[s.profile.worldId]);
  }

  $('c1-random').addEventListener('click', function () {
    $('c1-name').value = SQ.randomRoleName(SQ.WORLD_DEFAULT);
    $('c1-err').classList.add('hide');
  });
  /* 屏 1 · 起名 → 屏 3 · 择界（步序 2） */
  $('c1-next').addEventListener('click', function () {
    var name = ($('c1-name').value || '').trim();
    if (!SQ.validateName(name)) {
      $('c1-err').textContent = tc('creation.name.invalid');
      $('c1-err').classList.remove('hide');
      return;
    }
    draft.name = name;
    renderC3();
    show('c3');
  });

  /* 机制词条判定（天赋池设计 §三·补）：effects 含挂点白名单键 → 「机制」小角标；
   * desc 直出条件句式文案（词表手写），不显示挂点键名 */
  function isMechTalent(el) {
    var HK = (SQ.Mods && SQ.Mods.TALENT_HOOK_KEYS) || [];
    for (var k in (el.effects || {})) if (HK.indexOf(k) >= 0) return true;
    return false;
  }
  /* 羁绊命中（§九）：锁定态才生效加成，创角重抽阶段仅展示连线徽标 + 一行说明 */
  function matchedSynergies(talents, worldId) {
    var entry = SQ.Worlds[worldId];
    var D = entry && entry.pack && entry.pack.data;
    var syns = (D && D.TALENT_SYNERGIES) || [];
    var ids = {};
    (talents || []).forEach(function (t) { ids[t.id] = 1; });
    return syns.filter(function (s) { return s.pair && ids[s.pair[0]] && ids[s.pair[1]]; });
  }
  function talentCard(el, w, synHit) {
    var d = document.createElement('div');
    var isEpic = el.tier === 'epic';
    d.className = 'tcard ' + (el.kind === 'positive' ? 'pos' : 'neg') +
      (el.tier === 'rare' ? ' rare' : '') + (isEpic ? ' epic' : '') + (synHit ? ' syn' : '');
    var html = '';
    if (el.tier === 'rare') html += '<span class="corner">' + esc(tc('creation.talent.rare')) + '</span>';
    if (isEpic) html += '<span class="corner epic">' + esc(tc('creation.talent.epic')) + '</span>';
    if (el.amplified) html += '<span class="corner amp">' + esc(tc('creation.talent.amplify')) + '</span>';
    /* N20 接线：羁绊命中此前只加 `.syn` 描边、无文字（玩家看不出这枚天赋是被羁绊点亮的） */
    if (synHit) html += '<span class="corner">' + esc(tc('creation.talent.synergy')) + '</span>';
    if (isMechTalent(el)) html += '<span class="corner mech' + (el.amplified ? ' mechshift' : '') + '">' + esc(tc('creation.talent.mech')) + '</span>';
    html += '<div class="tname">' + esc(SQ.t('talent.' + el.id + '.name', null, w)) + '</div>' +
            '<div class="teff">' + esc(SQ.effectsToText(el.effects, w)) + '</div>' +
            '<div class="tdesc">' + esc(SQ.t('talent.' + el.id + '.desc', null, w)) + '</div>';
    d.innerHTML = html;
    return d;

  /* ══════════ MAIN：九游戏页 + 两系统页 ══════════ */
  /* 游戏页：顺序可在设置页上下调整（settings.tabOrder）；
   * lock（势力批 v2.4 需求 §4/§5 → 渐次解锁批 §C 表化）：境界未达时导航标题显示「？」置灰不可点。
   * 阈值单一事实源 = data.js TAB_UNLOCK（tabLock() 优先读表，行内 lock 为同源兜底值；
   * 引擎侧天骄 gate 与渡劫解锁播报同表同源）。
   * 阶梯：炼气起点 5 页（修行/历练/法与器/奇遇/成就）→ 筑基 +坊市/势力/炼丹/道友
   *   → 金丹 +天骄 → 元婴 +法宝 → 化神 +宗门。
   * 页面整合批 2026-10-06（UI 卷 §3.4a）：原「功法」「法器」两页并为「法与器」一页 →
   *   游戏页 13 → **12** 项。tab id 沿用 `arts`（不新造 id），故 newArtsDot 红点键、
   *   lastArtsSig 签名、TAB_UNLOCK（二者本就无境界门槛）三处零改动；`gear` 条目删除后，
   *   旧档 settings.tabOrder 里的 'gear' 由 tabOrder() 既有「未知 id 剔除」自动清掉，无需迁移。
   *   导航标签改取 `arts.system`（法与器）；`skill.system`/`gear.system` 保留不动——
   *   二者仍是日志页分类筛选标签，改它们会连带改日志分类语义。 */
  var GAME_TABS = [
    { id: 'idle', key: 'tab.idle' },
    { id: 'combat', key: null, sys: 'combat.system' },
    { id: 'arts', key: null, sys: 'arts.system' },
    { id: 'treasure', key: null, sys: 'treasure.system', lock: 3 },
    { id: 'shop', key: null, sys: 'shop.system', lock: 1 },
    { id: 'faction', key: null, sys: 'faction.system', lock: 1 },
    { id: 'bonds', key: null, sys: 'ui.pillar.bond', lock: 1 },
    { id: 'event', key: 'tab.event' },
    /* 六向长线批：炼丹炼器（筑基开炉）/ 同代天骄（金丹方闻同代之名）/ 宗门（化神亮入口） */
    { id: 'alchemy', key: null, sys: 'alchemy.system', lock: 1 },
    { id: 'prodigy', key: null, sys: 'jianghu.system', lock: 2 },
    { id: 'sect', key: null, sys: 'sect.system', lock: 4 },
    /* 成就图鉴批：成就自轮回页迁出为独立页（常驻可见，无境界门槛） */
    { id: 'achv', key: null, sys: 'achv.system' }
  ];
  /* 系统页：固定在导航最底部，不参与自定义排序 */
  var SYS_TABS = [
    { id: 'legacy', key: null, sys: 'legacy.system' },
    { id: 'journal', key: 'tab.log' },
    { id: 'settings', key: 'tab.settings' }
  ];
  var TABS = GAME_TABS.concat(SYS_TABS);

  /* 渐次解锁批 §C1：门槛单一事实源 = D.TAB_UNLOCK（引擎天骄 gate / realm.js 解锁播报同源）；
   * 世界未装载或表缺项时回落 GAME_TABS 行内 lock（同值兜底）。 */
  function tabLock(tb) {
    try {
      var tu = (D() || {}).TAB_UNLOCK;
      if (tu && tu[tb.id] && tu[tb.id].r != null) return tu[tb.id].r;
    } catch (e) { /* 创角屏/世界未选：回落硬编码 */ }
    return tb.lock || 0;
  }
  /* 解锁红点（§C3）：会话级已知集——启动/切角色时快照当时已解锁项；会话内新解锁 tab 亮红点、
   * 进页即消。不入存档（纯 UI 态，与 newArtsDot 红点家族同纪律）。 */
  function tabKnownSync() {
    var pid0 = (state.profile && state.profile.id) || '';
    if (!ui.tabKnown || ui.tabKnownPid !== pid0) {
      ui.tabKnown = {}; ui.tabKnownPid = pid0;
      var w0 = ws();
      TABS.forEach(function (tb) {
        var lk = tabLock(tb);
        if (!lk || (w0 && w0.realm >= lk)) ui.tabKnown[tb.id] = 1;
      });
    }
  }

  /* 游戏页有效顺序：settings.tabOrder 优先，缺项按默认序补齐（未知 id 剔除） */
  function tabOrder() {
    var so = (state.settings && state.settings.tabOrder) || [];
    var byId = {}, used = {};
    GAME_TABS.forEach(function (t) { byId[t.id] = t; });
    var out = [];
    so.forEach(function (id) { if (byId[id] && !used[id]) { out.push(byId[id]); used[id] = 1; } });
    GAME_TABS.forEach(function (t) { if (!used[t.id]) out.push(t); });
    return out;
  }

  function tabBtn(bar, tb) {
    var b = document.createElement('button');
    var w0 = ws();
    var lk = tabLock(tb);
    var locked = lk && (!w0 || w0.realm < lk);
    if (locked) {
      /* 未解锁（势力批 v2.4）：标题「？」、置灰、不绑动作——点按无响应 */
      b.textContent = t('event.codex.unknown');   /* ？（词条本身即三个问号）*/
      b.className = 'locked';
      bar.appendChild(b);
      return;

    b.textContent = tb.key ? t(tb.key) : t(tb.sys);

    /* 走查 v2.5 §6：新功法/新法宝/新道友/坊市补货 红点 */
    var dotFlag = { arts: 'newArtsDot', treasure: 'newTreasureDot', bonds: 'newBondDot', shop: 'newShopDot' }[tb.id];
    if (dotFlag && ui[dotFlag]) {
      var dN = document.createElement('span'); dN.className = 'dot'; b.appendChild(dN);

    /* 成就页红点：新成就达成（meta.achv 只增）——签名对比；正在该页即视为已读（不亮、并同步快照） */
    if (tb.id === 'achv') {

      if (ui.achvSnap !== sigA) {

      }
    }
    /* 新解锁红点（渐次解锁批 §C3）：本会话内刚解锁且未进过页 */
    if (!locked && ui.tabKnown && !ui.tabKnown[tb.id]) {
      var dU = document.createElement('span'); dU.className = 'dot'; b.appendChild(dU);
    }

  function renderTabbar() {

  function switchTab(id) {
    var tbDef = null;
    TABS.forEach(function (tb) { if (tb.id === id) tbDef = tb; });
    /* 未解锁页不可进入（势力批 v2.4 → 渐次解锁批表化）：防御——导航已不可点，这里兜底 */
    if (tbDef && tabLock(tbDef) && (!ws() || ws().realm < tabLock(tbDef))) return;
    ui.tab = id;
    if (ui.tabKnown) ui.tabKnown[id] = 1;   /* 新解锁红点进页即消 */
    TABS.forEach(function (tb) { $('tab-' + tb.id).classList.toggle('hide', tb.id !== id); });
    if (id === 'event') {
      ui.newFeedDot = false;                      /* 进奇遇页即视为已读 */
      ui.rumorSeenAt = SQ.UI.rumor.maxBorn(ctx(), ws());      /* 传闻红点同步消账：此后仅新出生的亮 */
    }
    if (id === 'journal') ui.newLogDot = false;   /* 进日志页即视为已读 */
    if (id === 'combat') ui.caveSnap = caveRedDotSig();   /* 进秘境洞天页（洞天节在内联）即视为已读地 chip 红点 */
    /* 走查 v2.5 §6：进页即清对应红点 */
    var dotMap = { arts: 'newArtsDot', treasure: 'newTreasureDot', bonds: 'newBondDot', shop: 'newShopDot' };
    if (dotMap[id]) ui[dotMap[id]] = false;
    renderTabbar();
    renderTab();
  }

  function pct(n) { return (Math.round(n * 1000) / 10).toString().replace(/\.0$/, '') + '%'; }

  /* 全位数字（修行状态批 v2.1）：修为大数字专用——千分位、不缩放不带单位，
   * 让每秒 tick 的增量逐位可见（SQ.fmt 的 万/亿 会把低境界产出量化到 0.1万/步） */
  function fmtFull(n) {
    return String(Math.floor(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  /* ── 游戏时间（v2.3）：算式与显示名口径**已上移到 core**（`SQ.gameDateOf` / `SQ.gameDateStr`，
   * 第廿八批）——引擎侧的人生传记也用它，视图这里只留一层取当前档的薄壳，别留第二套历法。
   * 1 游戏日 = 现实 1 秒，自入世（profile.createdAt）起算；12 月 × 30 日 = 360 日/年；
   * 起始年 = ws.calYear（创角随机 1~9000）；createdAt 缺失时返回空串（旧档兜底）── */
  function gameDateOf(ts) {
    return SQ.gameDateOf(state.profile, ws(), ts);
  }
  function gameDateStr(ts) {
    return SQ.gameDateStr(state.profile, ws(), ts, state.profile && state.profile.worldId);
  }

  /* ── Tab 1 修行 ── */
  /* ── 批 2 · 四柱（财/法/地/侣）────────────────────────────────
   * B1 chip 行：财=收支摘要、法=主修、地=洞府×倍率、侣=灰置（批 3 解锁）
   * B2 财 → 此生总账浮层；B3 地 → 洞府浮层；法 → 修习功法浮层（与财/地/侣同级） */
  function caveSigOf(field) {
    var c = SQ.Cave.current(ws(), pack());
    return (c.signature && c.signature.field === field) ? c.signature.value : 0;
  }
  function ledgerSums() { return SQ.Ledger.sums(ws()); }

  function renderPillars() {

    var s = ledgerSums();
    var main = SQ.Arts.mainArt(w);

  /* ── Tab 3 功法（批 2 · B4：主修角标 + 品阶×阵营双维分组 + 架上三态 + 独占剪影；

  /* 相对时间（百器录首获 / 回看首遇共用） */
  function timeAgo(ts) {

    if (s < 60) return t('ui.time.ago.now');
    if (s < 3600) return t('ui.time.ago.m', { n: Math.floor(s / 60) });
    if (s < 86400) return t('ui.time.ago.h', { n: Math.floor(s / 3600) });

  function fmtDate(ts) {

    var dt = new Date(ts);
    function p2(n) { return ('0' + n).slice(-2); }
    return dt.getFullYear() + '-' + p2(dt.getMonth() + 1) + '-' + p2(dt.getDate()) + ' ' + p2(dt.getHours()) + ':' + p2(dt.getMinutes());

  /* 独占载体溯源（B4/B5 共用）：扫全事件表三分支 gain → {ev, branch} */

  /* ── 渡劫演出（F7：悬念 1s 不可跳 → 成败帧：损失明细 + 成算复盘 + 计数；reduced-motion 直出）── */
  var tribTimer = null, tribUnlocked = false;
  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }
  function snapTrib() {
    try {
      var w = ws(), p = pack(), d = D(), m = mods();
      var ti = p.worldSystems.tribInfo(w, p, d, m);
      var loss = p.worldSystems.tribLoss(w, p, d, m);
      ui.tribSnap = ti ? {
        p: Math.round(ti.p * 100), loss: Math.round(loss * 100),
        /* 护法叙事三态素材（B6）：道号 / 道侣形态名（护法恰为道侣时）/ 魔道独行 */
        guardNpc: ti.parts.guardianNpc || null, guardBonus: ti.parts.guardian || 0,
        evil: p.worldSystems.tierOf(w) === 'evil',
        spouseForm: (w.spouse && ti.parts.guardianNpc === w.spouse.npcId) ? w.spouse.form : null
      } : null;
    } catch (e) { ui.tribSnap = null; }
  }
  /* 渡劫呈报（渡劫演出重做批）：主题感知卡片 + 成算环蓄势 → 结果帧数据行。
   * 环 = 成算（0~100%），胜主色 / 败警戒色；数据行陈列成算 / 损失 / 次数 / 护法。 */
  var TRIB_ARC_C = 264;   /* 环周长 = 2πr（r = 42） */
  function tribArc(p, color) {
    var arc = $('trib-arc');
    if (!arc) return;
    arc.style.stroke = color;
    arc.style.strokeDashoffset = String(TRIB_ARC_C * (1 - Math.max(0, Math.min(100, p)) / 100));
  }
  function tribRow(label, value, tone) {
    return '<div class="tr' + (tone ? ' ' + tone : '') + '"><span>' + esc(label) + '</span><b>' + esc(value) + '</b></div>';
  }
  function showTrib() {
    var w = ws();
    var win = w.tribulation.lastResult === 'success';
    var snap = ui.tribSnap;
    var box = $('trib-box');
    var p = snap ? snap.p : 0;
    box.className = 'trib-card charging';
    /* 悬念帧：环自 0 蓄势到成算（reduced-motion 直落） */
    var arc = $('trib-arc');
    arc.style.transition = 'none';
    arc.style.stroke = 'var(--primary)';
    arc.style.strokeDashoffset = String(TRIB_ARC_C);
    $('trib-ring-p').textContent = snap ? String(p) : '--';
    $('trib-t1').textContent = t('trib.suspense');
    $('trib-t2').textContent = t('trib.attempts', { n: w.tribulation.attempts });
    $('trib-rows').innerHTML = '';
    $('trib-guard').classList.add('hide');
    $('trib-skip').classList.add('hide');
    tribUnlocked = false;
    $('trib-stage').classList.remove('hide');
    var charge = function () { arc.style.transition = ''; tribArc(p, 'var(--primary)'); };
    if (reducedMotion()) charge(); else requestAnimationFrame(charge);
    function reveal() {
      box.className = 'trib-card ' + (win ? 'win' : 'lose');
      tribArc(p, win ? 'var(--primary)' : 'var(--bad)');
      $('trib-t1').textContent = win ? t('trib.result.win') : t('trib.result.lose');
      $('trib-t2').textContent = win
        ? t('tribulation.success', { realm: t('realm.' + w.realm) }) + ' · ' + t('tribulation.reset')
        : t('tribulation.reset');
      /* 数据行：成算 / [败] 修为损失 / 渡劫次数 / 护法加项 */
      var rows = '';
      if (snap) rows += tribRow(t('trib.row.p'), p + '%', 'hot');
      if (!win && snap) rows += tribRow(t('trib.row.loss'), snap.loss + '%', 'bad');
      rows += tribRow(t('trib.row.n'), t('trib.attempts', { n: w.tribulation.attempts }));
      if (snap) rows += snap.guardBonus > 0
        ? tribRow(t('tribulation.guardian'), '+' + snap.guardBonus.toFixed(2), 'hot')
        : tribRow(t('tribulation.guardian'), t('tribulation.guardian.none'));
      $('trib-rows').innerHTML = rows;
      /* 护法叙事行（B6 · 帧四）：成功三态（道号+加项 / 道侣形态名 / 魔道独行） */
      var tg = $('trib-guard');
      if (win && snap && snap.guardNpc && snap.guardBonus > 0) {
        tg.textContent = snap.spouseForm
          ? t('tribulation.guardianSpouse', { name: t('bond.' + snap.guardNpc + '.name'), form: t('bond.spouse.form.' + snap.spouseForm) })
          : t('tribulation.guardianLine', { name: t('bond.' + snap.guardNpc + '.name') });
        tg.classList.remove('hide');
      } else if (win && snap && snap.evil) {
        tg.textContent = t('tribulation.guardianNone');
        tg.classList.remove('hide');
      }
      $('trib-skip').textContent = t('trib.skip');
      $('trib-skip').classList.remove('hide');
      tribUnlocked = true;
    }
    if (reducedMotion()) reveal();
    else setTimeout(reveal, 1000);
    if (tribTimer) clearTimeout(tribTimer);
    /* 悬念 1s（不可跳）+ 结果帧 2s 自动关（交互说明 §4.9）；reduced-motion 直出后同样 2s */
    tribTimer = setTimeout(function () { if (tribUnlocked) hideTrib(); }, reducedMotion() ? 2000 : 3000);
  }
  function hideTrib() {
    $('trib-stage').classList.add('hide');
    if (tribTimer) { clearTimeout(tribTimer); tribTimer = null; }
  }
  $('trib-stage').addEventListener('click', function () { if (tribUnlocked) hideTrib(); });

  /* ── 抉择模态（F3）：三分支 + 信息层（成算/花费/缺项置灰）+ 判定演出 + 结果页 + 独占全屏演出。
   * karma 不预告（按钮无道心数值）；确定性判定不满足 → 置灰；attr/power 类给出成算或可预判结果。── */
  var choiceResult = null;
  var judgingTimers = [];
  function findEvent(id) { return SQ.Events.findById(pack(), id); }
  function branchChecks(br) { return br.check ? (Array.isArray(br.check) ? br.check : [br.check]) : []; }

  function checkPreview(chk) {
    var w = ws(), d = D(), m = mods(), p = pack();
    var sys = p.worldSystems;
    var type = chk.type || 'attr';
    if (type === 'attr') {
      var eff = sys.effectsOf ? sys.effectsOf(w) : null;
      var dc = SQ.Attrs.dcStdOf(w, d) * d.ATTR_DIFF[chk.dc] * (eff ? eff.checkDcMult : 1);
      var v = w.attrs[chk.attr] || 0;
      /* 判定加点三源合计封顶（引擎同口径 #131）：摄魂 + 斩三尸 + 秦老丈 ≤ +15pp */
      var ppAdd = Math.min(d.CHECK_BONUS_CAP != null ? d.CHECK_BONUS_CAP : 0.15,
        ((m.hooks.shehun) || 0) + ((m.sum && m.sum.checkBonus) || 0) + ((m.bonds && m.bonds.checkPp) || 0));
      var pp = 0.5 + (v - dc) / (2 * dc) + ppAdd;
      pp = Math.max(d.ATTR_P_CLAMP[0], Math.min(d.ATTR_P_CLAMP[1], pp));
      /* N20 接线：难度名此前不上屏（ATTR_DIFF 四档只在引擎侧乘算，玩家看到的是「属性 + 成算」，看不出这一门难在哪）       * ⇒ 动态取词 `t('dc.' + chk.dc)`，A6 的拼接前缀覆盖口径与 `odds.*` 同族 */
      var lblDc = t('event.check.type.attr', { attr: t('attr.' + chk.attr) }) + ' · ' + t('dc.' + chk.dc);
      return { kind: 'odds', label: lblDc,
        text: lblDc + ' · ' + t('event.check.odds', { odds: t(SQ.Attrs.oddsKey(pp)) }), ok: true };
    }
    if (type === 'karma') {
      var k = sys.karmaOf(w);
      return { kind: 'det', ok: (chk.min == null || k >= chk.min) && (chk.max == null || k <= chk.max), label: t('event.check.type.karma') };
    }
    if (type === 'align') {
      return { kind: 'det', ok: sys.tierOf(w) === chk.need, label: t('event.check.type.align') };
    }
    if (type === 'stones') {
      var lo = Array.isArray(chk.cost) ? chk.cost[0] : (chk.cost || 0);
      var hi = Array.isArray(chk.cost) ? chk.cost[1] : lo;
      return { kind: 'det', ok: w.stones >= lo, label: t('event.check.type.stones'),
        text: t('event.check.cost.stones', { n: lo === hi ? SQ.fmt(lo) : SQ.fmt(lo) + '~' + SQ.fmt(hi), cur: t('resource.currency') }) };
    }
    if (type === 'qi') {
      var pq = Math.round((Array.isArray(chk.pct) ? chk.pct[0] : (chk.pct || 0)) * 100);
      return { kind: 'det', ok: w.qi > 0, label: t('event.check.type.qi'),
        text: t('event.check.cost.qi', { res: t('resource.primary'), p: pq }) };
    }
    if (type === 'art') {
      var artsMap = p.artsMap();
      var ids = chk.id ? [chk.id] : (w.artsKnown || []).filter(function (aid) {
        var a = artsMap[aid];
        if (!a) return false;
        if (chk.tier != null && a.tier !== chk.tier) return false;
        if (chk.alignment && a.alignment !== chk.alignment) return false;
        return true;
      });
      var oka = ids.length > 0 && ids.every(function (aid) { return (w.artsKnown || []).indexOf(aid) >= 0; });
      if (oka && chk.slotted) oka = ids.some(function (aid) { return (w.artsSlots || []).indexOf(aid) >= 0; });
      return { kind: 'det', ok: oka, label: t('event.check.type.art') };
    }
    if (type === 'gear') {
      var okg = false;
      for (var slot in w.gear) {
        var it = w.gear[slot];
        if (!it) continue;
        if (chk.slot && it.slot !== chk.slot) continue;
        if (chk.tierMin != null && it.tier < chk.tierMin) continue;
        if (chk.special && it.special !== chk.special) continue;
        okg = true; break;
      }
      return { kind: 'det', ok: okg, label: t('event.check.type.gear') };
    }
    if (type === 'companion') {
      /* 第九类（B7 · 引擎卷 §3.5）：护法位档 ≥ minTier；魔道档必然失败 →「无人可援」置灰提示不隐藏 */
      var gC = SQ.Bonds ? SQ.Bonds.guardianOf(w, p, d) : null;
      var okC = !!(SQ.Bonds && SQ.Bonds.companionOk(w, p, d, chk.minTier));
      var lackC = okC ? '' : ((gC && gC.evil) ? t('event.check.companion.none') : t('event.check.companion.need', { n: chk.minTier || 1 }));
      return { kind: 'det', ok: okC, label: t('event.check.type.companion'), lack: lackC,
        text: okC
          ? t('event.check.type.companion') + ' · ' + t('bond.' + gC.npcId + '.name') + bondTierNum(gC.tier)
          : lackC };
    }
    if (type === 'power') {
      var pw = SQ.Mods.powerOf(w, p, d, m);
      var nd = d.ZONES[w.zone].need * (chk.ratio != null ? chk.ratio : 1);
      return { kind: 'det', ok: pw >= nd, label: t('event.check.type.power') };
    }
    if (type === 'ambushFoe') {
      /* 敌手快照（第卌四批 · §6.1B）：只报「你多少 / 对方多少」，**不置灰**——
       * 打得过打不过都是玩家的一念，这一族的「难」不该由 disabled 替他决定。
       * 成算不显示：引擎是双方各 ±10% 浮动的对局，写一个百分比就是假精确（切磋那边同理只给让差档）。 */
      var fo = (w.pendingChoice && w.pendingChoice.foe) || null;
      var fpw = fo && fo.power > 0 ? fo.power : 0;
      return { kind: 'odds', ok: true, label: t('event.check.type.ambushFoe'),
        text: fpw ? t('event.ambush.ui.vs', { a: SQ.fmt(SQ.Mods.powerOf(w, p, d, m)), b: SQ.fmt(fpw) })
          : t('event.check.type.ambushFoe') };
    }
    return { kind: 'det', ok: true, label: '' };
  }

  /* ── 自动奇遇（自动批）：开启后奇遇触发不再弹抉择模态，自动择一「可用」分支并结算 ──
   * 可用 = 确定性判定全过（与抉择模态按钮置灰同一套 checkPreview 口径）；
   * 倾向（体验批）：settings.eventPref 指定分支且可用 → 直接选它；否则可用分支中随机择一
   * （机缘本就无常）；全部不可用（理论不发生，防御）退化为全分支随机。
   * 结算走与手动抉择完全相同的 SQ.Actions.resolveChoice 单一通道，toast 告知抉择结果。 */
  function autoEventOn() {
    /* 战术限时抉择（第卌四批 · §6.1B）不受自动奇遇代择：用户原话「必须手动选，限时，超时默认迎战」——
     * 自动模式的语义是「机缘当前替玩家拿主意」，而这一族要保留的正是那一念之间。
     * 判据 = 走查 verify-ui-ambush A1（开着 autoEvent 也不代择，浮层与挂起都还在）。 */
    var wp = ws();
    if (wp && wp.pendingChoice) {
      var evp = findEvent(wp.pendingChoice.id);
      if (evp && evp.tactical) return false;
    }
    return !!(state.settings && state.settings.autoEvent);
  }
  function autoEventPref() {
    var p = state.settings && state.settings.eventPref;
    return (p === 'right' || p === 'evil' || p === 'neutral') ? p : 'none';
  }
  var autoEventBusy = false;                     /* 秒级 tick 防重入：resolveChoice 异步落盘期间不再重复触发 */
  function autoAvailableBranches(ev) {
    var out = [];
    ['right', 'evil', 'neutral'].forEach(function (bk) {
      var br = ev.choices && ev.choices[bk];
      if (!br) return;
      var ok = branchChecks(br).every(function (c) { return checkPreview(c).ok; });
      if (ok) out.push(bk);
    });
    return out;
  }
  async function autoResolveChoice() {
    if (autoEventBusy || !autoEventOn()) return;
    var pend = ws() && ws().pendingChoice;
    if (!pend) return;
    var ev = findEvent(pend.id);
    if (!ev) return;
    var bks = autoAvailableBranches(ev);
    if (!bks.length) bks = Object.keys(ev.choices || {});
    if (!bks.length) return;
    var pref = autoEventPref();
    var bk = (pref !== 'none' && bks.indexOf(pref) >= 0)
      ? pref
      : bks[Math.floor(Math.random() * bks.length)];
    autoEventBusy = true;
    try {
      var res = await SQ.Actions.resolveChoice(state, bk);
      if (res) {
        toast(t('event.auto.resolved', { name: t('event.' + ev.id + '.name'), branch: t('branch.' + bk) }));
        if (res.eff && (res.eff.exclusiveGear || res.eff.exclusiveArt)) SQ.UI.show.exclusive(ctx(), res.eff);
        /* bond 升档 toast：与手动抉择同一白名单（交互说明 §2.3） */
        var bd = res.eff && res.eff.bond;
        if (bd && bd.tierUp && !bd.blocked) {
          toast(t('bond.toast.tier', { name: t('bond.' + bd.npc + '.name'), title: t('bond.' + bd.npc + '.title.' + bd.tier) }));
          if (bd.tier === 3) toast(t('bond.toast.guardian', { name: t('bond.' + bd.npc + '.name') }));
        }
      }
      renderAll();
    } finally { autoEventBusy = false; }
  }

  function showChoice() {
    var pend = ws().pendingChoice;
    if (!pend) return;
    var ev = findEvent(pend.id);
    if (!ev) return;
    choiceResult = null;
    judgingTimers.forEach(function (tm) { clearTimeout(tm); });
    judgingTimers = [];
    $('mc-badges').innerHTML =
      '<span class="mbadge">' + esc(t('event.tier.' + ev.tier)) + '</span>' +
      '<span class="mbadge ' + (ev.nature === 'good' ? 'good' : 'bad') + '">' + esc(t('event.nature.' + ev.nature)) + '</span>' +
      (ev.special ? '<span class="mbadge sp">' + esc(t('event.badge.special')) + '</span>' : '') +
      (ev.once ? '<span class="mbadge sp">' + esc(t('event.badge.once')) + '</span>' : '');
    $('mc-title').textContent = t('event.' + ev.id + '.name');
    $('mc-story').textContent = t('event.' + ev.id + '.story') +
      /* 敌手快照（第卌四批 · 袭击/寻仇）：名号与战力在触发时刻已定，屏上如实报——
       * 名录里那人此刻可能已绝交/已出榜，但**那一刀是真的冲你来过**，不回填成别人 */
      (pend.foe ? '\n' + t('event.ambush.ui.foe', { name: pend.foe.nm, p: SQ.fmt(pend.foe.power) }) : '');
    var bh = '';
    var tac = ev.tactical === true;   /* 战术抉择（迎战 / 避战 / 认输）与善恶无关：不打「正道/魔道」前缀 */
    ['right', 'evil', 'neutral'].forEach(function (bk) {
      var br = ev.choices[bk];
      if (!br) return;
      var infos = [], disabled = false, lackParts = [];
      branchChecks(br).forEach(function (chk) {
        var pv = checkPreview(chk);
        infos.push(pv.text || pv.label);
        if (pv.kind === 'det' && !pv.ok) { disabled = true; lackParts.push(pv.lack || pv.label); }
      });
      if (disabled) infos.push(t('event.branch.lack', { req: lackParts.join(' · ') }));
      var hasLock = (br.gain || []).some(function (g) { return g.type === 'bondLock'; });
      /* 情谊生裂角标（缘尽收敛批）：轻中度背叛分支的预告——措辞比「绝缘」轻，明示不致缘尽 */
      var hasDrain = (br.gain || []).some(function (g) { return g.type === 'bondDrain'; });
      bh += '<button class="branch ' + bk + '-b" data-act="choose" data-v="' + bk + '"' + (disabled ? ' disabled' : '') + '>' +
        '<span class="bk">' + (tac ? '' : esc(t('branch.' + bk)) + ' · ') + esc(t('event.' + ev.id + '.branch.' + bk)) +
        (hasLock ? ' <span class="ebadge gray">' + esc(t('event.badge.bondlock')) + '</span>' : '') +
        (!hasLock && hasDrain ? ' <span class="ebadge gray">' + esc(t('event.badge.bonddrain')) + '</span>' : '') + '</span>' +
        (infos.length ? '<span class="bi">' + esc(infos.join(' · ')) + '</span>' : '') +
        '</button>';
    });
    $('mc-branches').innerHTML = bh;
    $('mc-branches').classList.remove('hide');
    if (tac) ambushCountdown();
    else {
      ambushHalt();
      $('mc-foot').textContent = t('event.modal.foot');
      $('mc-foot').classList.remove('hide');
    }
    $('mc-judging').classList.add('hide');
    $('mc-result').classList.add('hide');
    $('modal-choice').classList.remove('hide');
  }

  /* ── 限时抉择（第卌四批 · 数值详设 §6.1B）：袭击 / 族中寻仇必须手动择，超时默认迎战。
   * 计时器归浮层自己养：秒级 tick 在「抉择浮层开着」时整段让路（见 startTick 首行那句 return），
   * 挂在 tick 上等于永远不倒数。**离线不倒数**——关掉页面就是把这抉择留到下次进线，
   * 不会「睡一觉被仇家打死」（用户定的这条与「限时」并不冲突：限时限的是你盯着屏幕的那一刻）。
   * 超时结算走与玩家手点**完全同一条** `SQ.Actions.resolveChoice`，不另开结算口——
   * 否则「超时迎战胜」与「手点迎战胜」的账会分叉（本仓「单一通道」纪律）。
   * shortcut: 重新载入页面会把这一轮的时限重新给满（刷新即可拖延）；要收紧就得把剩余量落盘、
   * 按在线时长扣减，代价是每秒一次写档——不值。 */
  var ambushTimer = null;
  function ambushHalt() {
    if (ambushTimer) { clearInterval(ambushTimer); ambushTimer = null; }
  }
  function ambushFoot(left) {
    $('mc-foot').textContent = t('event.modal.foot') +
      (left > 0 ? ' · ' + t('event.ambush.ui.remain', { t: timeLeftText(left) }) : '');
    $('mc-foot').classList.remove('hide');
  }
  function ambushCountdown() {
    ambushHalt();
    var A = D().AMBUSH || {};
    var left = A.DECIDE_MS || 0;
    ambushFoot(left);
    if (!(left > 0)) return;
    ambushTimer = setInterval(async function () {
      var w = ws();
      if (!w || !w.pendingChoice || $('modal-choice').classList.contains('hide')) { ambushHalt(); return; }
      left -= 1000;
      if (left > 0) { ambushFoot(left); return; }
      ambushHalt();
      ambushFoot(0);
      toast(t('event.ambush.ui.timeout'));
      var res = await SQ.Actions.resolveChoice(state, 'right');
      if (res && res.eff && (res.eff.exclusiveGear || res.eff.exclusiveArt)) SQ.UI.show.exclusive(ctx(), res.eff);
      /* 超时也必须把这一屏**结清在屏上**：旧代码只 renderAll()，浮层还开着、分支排还在、挂起已清空
       * ⇒ 三枚按钮点了都撞 `if (!pendC) return`，而抉择模态既不在遮罩可关族也不吃 ESC ⇒ 玩家被钉死在这一屏，
       *   只能刷新页面逃出去（2026-10-18 用户报「魔道来犯无法点击选项、又关不掉」）。
       *   出口 = 与手点同一条 renderChoiceResult（分支排收起、结果页与「确定」到位）。res 为空 = 引擎没结这一笔，
       *   挂起原样留着，按钮照旧可用，不是死路。 */
      if (res) { renderChoiceResult(res); renderTop(); }
    }, 1000);
  }

  /* ── 演出族三枚（独占 / 名号 / 洞府）已整片外置 `view/show.js`（N34 第十四刀 · 第册五十批）：
   * 演出本体与三枚定时器都在件内，这里只留三个监听，监听体一律一行转发。 ── */
  $('excl-stage').addEventListener('click', function () { SQ.UI.show.closeExcl(ctx()); });
  $('rank-stage').addEventListener('click', function () { SQ.UI.show.closeRank(ctx()); });
  $('cave-stage').addEventListener('click', function () { SQ.UI.show.closeCave(ctx()); });

  function renderChoiceResult(res) {
    choiceResult = res;
    $('mc-branches').classList.add('hide');
    $('mc-foot').classList.add('hide');
    $('mc-judging').classList.add('hide');
    $('mc-result').classList.remove('hide');
    var br = res.ev && res.ev.choices ? res.ev.choices[res.branch] : null;
    var checks = br ? branchChecks(br) : [];
    var ck = $('mc-check');
    if (checks.length) {
      ck.textContent = res.pass ? t('event.result.pass') : t('event.result.fail');
      ck.className = 'res-check ' + (res.pass ? 'pass' : 'fail');
    } else {
      ck.textContent = '';
      ck.className = 'res-check';
    }
    $('mc-karma').textContent = res.karmaTxt;
    $('mc-karma').className = 'res-karma ' + (res.karma >= 0 ? 'pos' : 'neg');
    $('mc-eff').textContent = SQ.Events.effText(ws(), pack(), D(), res.eff || {});
    var exEl = $('mc-excl');
    if (res.eff && (res.eff.exclusiveGear || res.eff.exclusiveArt)) {
      /* 独占已入手：全屏演出之外，结果页留一行豁免规则提示（UI §3.5） */
      exEl.textContent = t('event.exclusive.hint');
      exEl.classList.remove('hide');
    } else {
      exEl.classList.add('hide');
    }
    /* 绝交锁结果页末行灰字（B7）：「有些事做了，就再没有回头路」
     * 缘尽收敛批（引擎卷 v1.10 §3.6）：门槛不合已降级为情谊生裂 → 换软措辞末行，
     * 明确告知「未至恩断义绝、尚可挽回」，与 res.eff.bondLock 互斥（events.js 已同步撤销）。 */
    var blEl = $('mc-bondlock');
    if (res.eff && res.eff.bondLock) {
      blEl.textContent = t('log.eff.bondLock', { name: t('bond.' + res.eff.bondLock + '.name') });
      blEl.classList.remove('hide');
    } else if (res.eff && res.eff.bondDrain) {
      blEl.textContent = t('log.eff.bondDrain.hint', { name: t('bond.' + res.eff.bondDrain + '.name') });
      blEl.classList.remove('hide');
    } else {
      blEl.classList.add('hide');
    }
    $('mc-ok').textContent = t('ui.confirm');
  }
  $('mc-ok').addEventListener('click', function () { $('modal-choice').classList.add('hide'); renderAll(); });

  /* 闭关明细行（面板与出关呈报同源同数，走查稿② 第 4/6 项）：
   * 离线效率拆解 + 12h 上限是否触顶 + 奇遇时钟冻结读数（在线爬钟的悬念钩子） */
  function offlineDetail(lo) {
    var w = ws(), m = mods(), d = D();
    var base = Math.round(d.OFFLINE_EFF * 100);
    var bonus = Math.round(((m.sum && m.sum.offlineEff) || 0) * 100);
    var capH = d.OFFLINE_CAP_H + ((m.hooks && m.hooks.changye) || 0);
    var cs = Math.max(0, Math.floor(w.eventClock || 0));
    return t('offline.panel.detail', {
      base: base, bonus: bonus, eff: base + bonus, cap: capH,
      capNote: (lo && lo.secs > capH * 3600) ? t('offline.cap.hit') : t('offline.cap.miss'),
      clock: t('ui.time.ms', { m: Math.floor(cs / 60), s: cs % 60 })
    });
  }

  /* 出关呈报（F4：lastOffline.at 键控 · 会话一次 · EVENT_CHOICE 优先顺延）
   * 正文改为数据网格：只陈列本次离线所得的数字（修为/灵石/时长/渡劫），不再走散文句式 */
  function showOfflineReport() {
    var lo = ws().lastOffline;
    if (!lo) return;
    ui.seenOfflineAt = lo.at;
    var lsecs = isFinite(lo.secs) ? lo.secs : 0;   /* 防脏字段：NaN/undefined 一律按 0 计 */
    var lh = Math.floor(lsecs / 3600), lm = Math.floor((lsecs % 3600) / 60);
    var lt = lh > 0 ? t('ui.time.hm', { h: lh, m: lm }) : t('ui.time.m', { m: Math.max(1, lm) });
    var ventureLo = lo.mode === 'venture';
    var trib = lo.trib || { n: 0, s: 0, f: 0 };
    $('mo-title').textContent = t('offline.report.title');
    $('mo-sub').textContent = t(ventureLo ? 'offline.panel.title.v' : 'offline.panel.title');
    $('mo-stats').innerHTML =
      '<div class="o"><div class="on">' + esc(t('resource.primary')) + '</div>' +
        '<div class="ov">+' + SQ.fmt(lo.qi) + '</div></div>' +
      '<div class="o"><div class="on">' + esc(t('resource.currency')) + '</div>' +
        '<div class="ov">+' + SQ.fmt(lo.stones || 0) + '</div></div>' +
      '<div class="o"><div class="on">' + esc(t('offline.stat.dur')) + '</div>' +
        '<div class="ov">' + esc(lt) + '</div></div>' +
      '<div class="o"><div class="on">' + esc(t('tribulation.tag')) + '</div>' +
        '<div class="ov">' + trib.n + '<span class="u">' + esc(t('offline.stat.times')) + '</span></div>' +
        (trib.n > 0 ? '<div class="os">' + esc(t('offline.stat.trib.split', { s: trib.s, f: trib.f })) + '</div>' : '') +
      '</div>';
    $('mo-hint').textContent = offlineDetail(lo) + ' · ' +
      t(ventureLo ? 'offline.report.hint.v' : 'offline.report.hint');
    $('mo-ok').textContent = t('offline.report.ok');
    $('modal-offline').classList.remove('hide');
  }
  /* 坐化呈报（`deathReport`）与确认收口（`okDeath`）已整片外置 `view/show.js`（N34 第十四刀 · 第册五十批）：
   * 这里只留确认键的一行转发——`deathPending` 那条分支（进创角 + 盖棺之传）在件内走桥位。 */
  $('mo-ok').addEventListener('click', function () { SQ.UI.show.okDeath(ctx()); });

  /* ── 角色浮层 ── */
  function showRole() {
    var w = ws(), d = D(), m = mods(), p = pack();
    var idp = identityParts();
    $('mr-title').textContent = idp.name + ' · ' + idp.world + ' · ' + idp.realm;
    var h = '';
    /* 天道段（天道系统批 B3）：称号「我命由我不由天」/ 逆天盾 / 逆天值展示 */
    var tdRole = w.tiandao;
    if (tdRole && (tdRole.title || tdRole.shield || tdRole.defy > 0)) {
      h += '<div class="tdrow">' +
        (tdRole.title ? '<span class="tdtitle">' + esc(t('tiandao.title')) + '</span>' : '') +
        (tdRole.shield ? '<span class="tdtitle">' + esc(t('tiandao.shield')) + '</span>' : '') +
        (tdRole.defy > 0 ? '<span class="tddefy">' + esc(t('tiandao.defy.val', { n: tdRole.defy })) + '</span>' : '') +
        '</div>';
    }
    var metaT = (state.meta && state.meta.titles) || [];
    if (metaT.length) {
      /* 称号墙：改与成就页同款 chips（一枚称号整块不换行）——旧 `.kv` 写法把「称号墙」标签与称号串
       * 一起塞进 flex 两端对齐的一行里，窄浮层下标签会被从中间截断（"墙" 独自掉到次行） */
      h += '<p class="hint" style="margin:0 0 4px">' + esc(t('codex.ui.titles')) + '</p>' +
        '<div class="chips">' + metaT.slice(-6).map(function (id) {
          return '<span class="tdtitle">' + esc(t('codex.title.' + id)) + '</span>';
        }).join('') + '</div>';
    }
    h += '<p class="hint">' + esc(t('role.attrs.title')) + '</p>';
    d.ATTRS.forEach(function (id) {
      var v = w.attrs[id] || 0;
      var dc2 = SQ.Attrs.dcStdOf(w, d) * 2;
      h += '<div class="kv"><span>' + esc(t('attr.' + id)) + ' <span class="hint">' + esc(t('attr.desc.' + id)) + '</span></span><span>' + Math.floor(v) + '</span></div>';
      h += '<div class="bar slim"><i style="width:' + Math.min(100, (v / dc2) * 100).toFixed(1) + '%"></i></div>';
      /* 构成明细 */
      var base = SQ.Attrs.baseOf(w, d);
      var nurture = SQ.Attrs.artsNurtureOf(w, p, d, id);   /* 与引擎同一处算式（含品阶阶梯），视图不再自己抄一遍 */
      var gearV = 0;
      for (var slot in w.gear) {
        var it = w.gear[slot];
        if (it && it.attrValue && it.attrValue.attr === id) gearV += it.attrValue.value;
      }
      var evB = (w.attrEventBonus || {})[id] || 0;
      var buffV = Math.max(0, Math.round((v - base - nurture - gearV - evB) * 10) / 10);
      h += '<div class="detailbox"><div class="kv"><span>' + esc(t('attr.part.base')) + '</span><span>' + base + '</span></div>' +
           '<div class="kv"><span>' + esc(t('attr.part.arts')) + '</span><span>+' + nurture + '</span></div>' +
           '<div class="kv"><span>' + esc(t('attr.part.gear')) + '</span><span>+' + gearV + '</span></div>' +
           '<div class="kv"><span>' + esc(t('attr.part.event')) + '</span><span>' + (evB >= 0 ? '+' : '−') + Math.abs(evB) + '</span></div>' +
           (buffV ? '<div class="kv"><span>' + esc(t('attr.part.buff')) + '</span><span>+' + buffV + '</span></div>' : '') +
           '<div class="kv hint"><span>' + esc(t('attr.dc', { n: SQ.Attrs.dcOf(w, d, 'medium') })) + '</span></div></div>';
    });
    $('mr-attrs').innerHTML = h;
    var tb = $('mr-talents');
    tb.innerHTML = '';
    (state.profile.talents || []).forEach(function (el) { tb.appendChild(talentCard(el, wid())); });
    $('mr-karma').textContent = t('karma.system') + ' →';
    $('mr-close').textContent = t('ui.close');
    /* 洗髓入口（v1.8 §十）：本世有预算才露出，手中无缘时置灰（灰置而非隐藏——玩家要看得见「还有这条路」） */
    var swapCap = (D().TALENT_SWAP || {}).PER_LIFE || 0;
    var wb = $('mr-wash');
    if (swapCap > 0) {
      wb.classList.remove('hide');
      wb.textContent = t('talent.swap.entry', { owed: w.talentOwed || 0, cap: swapCap });
      wb.disabled = !((w.talentOwed || 0) > 0);
    } else wb.classList.add('hide');
    $('modal-role').classList.remove('hide');
  }
  $('mr-close').addEventListener('click', function () { $('modal-role').classList.add('hide'); });
  $('mr-karma').addEventListener('click', function () { $('modal-role').classList.add('hide'); showKarma(); });

  /* ── 洗髓浮层（天赋池设计 v1.8 §十 · 洗髓批）：三格择一替换 + 三候选择一 ──
   * 候选只掷一次并存在 washDraft 里（选格不重掷，否则「看着换」变成「赌着换」）；
   * 真正改档只走 SQ.Talents.applySwap 单口，视图不自带判定。 */
  var washDraft = { slot: -1, cand: -1, cands: [] };
  function washCard(el, i, act, picked) {
    var d = talentCard(el, wid());
    d.setAttribute('data-act', act);
    d.setAttribute('data-v', i);
    d.className += ' pickable' + (picked ? ' pick' : '');
    return d;
  }
  function renderWash() {
    var sl = $('tw-slots');
    sl.innerHTML = '';
    (state.profile.talents || []).forEach(function (el, i) { sl.appendChild(washCard(el, i, 'washSlot', i === washDraft.slot)); });
    var cb = $('tw-cands');
    cb.innerHTML = '';
    washDraft.cands.forEach(function (el, i) { cb.appendChild(washCard(el, i, 'washPick', i === washDraft.cand)); });
    $('tw-ok').disabled = !(washDraft.slot >= 0 && washDraft.cand >= 0);
  }
  function showWash() {
    var w = ws(), cap = (D().TALENT_SWAP || {}).PER_LIFE || 0;
    if (!(cap > 0)) return;
    if (!((w.talentOwed || 0) > 0)) { toast(t('talent.swap.none')); return; }
    washDraft.cands = SQ.Talents.candidates(wid(), state.profile, 3);
    washDraft.slot = -1; washDraft.cand = -1;
    $('tw-title').textContent = t('talent.swap.title');
    $('tw-sub').textContent = t('talent.swap.sub', {
      n: Math.max(0, cap - (w.talentUsed || 0)), cap: cap, owed: w.talentOwed || 0
    });
    $('tw-pick-label').textContent = t('talent.swap.pick');
    $('tw-cand-label').textContent = t('talent.swap.cand');
    $('tw-close').textContent = t('ui.cancel');
    $('tw-ok').textContent = t('talent.swap.ok');
    renderWash();
    $('modal-role').classList.add('hide');
    $('modal-talentwash').classList.remove('hide');
  }
  async function doWash() {
    var cand = washDraft.cands[washDraft.cand];
    if (washDraft.slot < 0 || !cand) { toast(t('talent.swap.need')); return; }
    var res = null;
    await SQ.mutate(state, function (s) {
      var id = s.profile.worldId;
      res = SQ.Talents.applySwap(id, s.profile, s.worlds[id], SQ.Worlds[id].pack.data, washDraft.slot, cand.id);
      if (res.ok) SQ.Log.push(s.worlds[id], 'sys', SQ.t('talent.swap.done', {
        from: SQ.t('talent.' + res.from + '.name', null, id),
        to: SQ.t('talent.' + res.to + '.name', null, id)
      }, id));
    });
    if (!res || !res.ok) {
      /* 引擎拒因只有 none（无缘）与形状类（格号/候选非法、撞已持有）两类 ⇒ 前者说「手中没有洗髓缘」，
       * 后者属档面异常，一律回「本世之数已尽」并重的渲染，绝不打裸英文 */
      toast(t(res && res.reason === 'none' ? 'talent.swap.none' : 'talent.swap.cap'));
      renderAll();
      return;
    }
    $('modal-talentwash').classList.add('hide');
    toast(t('talent.swap.done', {
      from: t('talent.' + res.from + '.name', null, wid()),
      to: t('talent.' + res.to + '.name', null, wid())
    }));
    renderAll();
  }

  /* ── karma 浮层（F5：四行构成 + 色带游标 + 差值双提示 + ALIGN_EFFECTS 摘要六行 + 护法行灰置） ── */
  function showKarma() {
    var w = ws(), p = pack(), d = D();
    var sys = p.worldSystems;
    var tier = sys.tierOf(w);
    var parts = sys.karmaParts(w);
    $('mkd-title').textContent = t('karma.system');
    $('mkd-value').textContent = t('karma.tier.' + tier) + ' · ' + (w.karma > 0 ? '+' : '') + w.karma;
    $('mkd-value').style.color = 'var(--sq-karma-' + tier + ')';
    var pos = (w.karma + d.KARMA_CLAMP) / (2 * d.KARMA_CLAMP);
    $('mkd-bar').style.width = (pos * 100).toFixed(1) + '%';
    /* 差值双提示：左道显示两侧距离；正/魔显示距极处 */
    var nextTxt;
    var eK = SQ.XKarma.edgeOf(d);   /* 边界取自 KARMA_TIERS，视图不再抄 200（#293(e) 钉这条取数口） */
    if (tier === 'neutral') {
      nextTxt = t('karma.next', { tier: t('karma.tier.right'), n: Math.max(0, eK.up - w.karma) }) +
        ' · ' + t('karma.next', { tier: t('karma.tier.evil'), n: Math.max(0, w.karma - eK.down) });
    } else if (tier === 'right') {
      nextTxt = w.karma >= d.KARMA_CLAMP ? t('karma.maxed') : t('karma.next', { tier: t('karma.extreme'), n: d.KARMA_CLAMP - w.karma });
    } else {
      nextTxt = w.karma <= -d.KARMA_CLAMP ? t('karma.maxed') : t('karma.next', { tier: t('karma.extreme'), n: w.karma + d.KARMA_CLAMP });
    }
    $('mkd-next').textContent = nextTxt;
    function sgn(n) { return (n >= 0 ? '+' : '') + n; }
    $('mkd-parts').innerHTML =
      '<div class="kv"><span>' + esc(t('karma.part.arts')) + '</span><span>' + sgn(parts.arts) + '</span></div>' +
      '<div class="kv"><span>' + esc(t('karma.part.gear')) + '</span><span>' + sgn(parts.gear) + '</span></div>' +
      '<div class="kv"><span>' + esc(t('karma.part.events')) + '</span><span>' + sgn(parts.events) + '</span></div>' +
      '<div class="kv"><span>' + esc(t('karma.part.drift')) + '</span><span>' + sgn(Math.round(parts.drift)) + '</span></div>';
    /* 名号九段天梯（善恶名号批）：九段全列，当前段高亮并按其档位着色；区间由 KARMA_RANKS 下界推导 */
    var rows = d.KARMA_RANKS || [];
    var rankNow = sys.rankOf ? sys.rankOf(w) : 'zuodao';
    var lh = '';
    rows.forEach(function (row, i) {
      var lo = (row[0] === -Infinity) ? -d.KARMA_CLAMP : Math.ceil(row[0]);
      var hi = (i === 0) ? d.KARMA_CLAMP : Math.ceil(rows[i - 1][0]) - 1;
      if (rows[i - 1] && rows[i - 1][0] === -Infinity) hi = d.KARMA_CLAMP;
      var on = row[1] === rankNow;
      var rTier = SQ.XKarma.tierOf((lo + hi) / 2);
      lh += '<div class="rrow' + (on ? ' on ' + rTier : '') + '">' +
        '<span>' + esc(t('karma.rank.' + row[1])) + '</span>' +
        '<span class="rr-range">' + sgn(lo) + ' ~ ' + sgn(hi) + '</span></div>';
    });
    $('mkd-ranktitle').textContent = t('karma.rank.ladder');
    $('mkd-ranks').innerHTML = lh;
    $('mkd-rate').textContent = t('karma.rateHint.' + tier);
    /* ALIGN_EFFECTS 摘要六行（当前档位实时值）+ 品阶上浮（魔道档）+ 护法行灰置（批 3） */
    var eff = sys.effectsOf(w);
    var eh = '';
    function effRow(label, val) {
      return '<div class="kv"><span>' + esc(label) + '</span><span>' + esc(val) + '</span></div>';
    }
    eh += effRow(t('karma.eff.qiRate'), '×' + eff.qiRateMult.toFixed(2));
    eh += effRow(t('karma.eff.combatPower'), '×' + eff.combatPowerMult.toFixed(2));
    eh += effRow(t('karma.eff.eventRate'), '×' + eff.eventRateMult.toFixed(2));
    eh += effRow(t('karma.eff.dropRate'), '×' + eff.dropRateMult.toFixed(2));
    eh += effRow(t('karma.eff.checkDc'), '×' + eff.checkDcMult.toFixed(2));
    eh += effRow(t('karma.eff.trib'), (eff.tribBonusFlat >= 0 ? '+' : '') + Math.round(eff.tribBonusFlat * 100) + '%');
    if (eff.dropTierUpChance > 0) eh += effRow(t('karma.eff.tierUp'), Math.round(eff.dropTierUpChance * 100) + '%');
    (function () {
      /* 护法行激活（B6 · 批 3）：魔道档红字独行 / 生效金加项 / 无人灰置 */
      var gK = SQ.Bonds.guardianOf(ws(), pack(), D());
      var evilK = pack().worldSystems.tierOf(ws()) === 'evil';
      var txtK, clsK = ' hint';
      if (evilK) { txtK = t('bond.guard.evil'); }
      else if (gK && gK.bonus > 0) { clsK = ''; txtK = '+' + gK.bonus.toFixed(2) + ' · ' + t('bond.' + gK.npcId + '.name') + bondTierNum(gK.tier); }
      else { txtK = '—'; }
      eh += '<div class="kv' + clsK + '"><span>' + esc(t('karma.eff.guardian')) + '</span><span>' + esc(txtK) + '</span></div>';
    })();
    $('mkd-efftitle').textContent = t('karma.effects.title');
    $('mkd-effects').innerHTML = eh;
    $('mkd-close').textContent = t('ui.cancel');
    $('modal-karma').classList.remove('hide');
  }
  $('mkd-close').addEventListener('click', function () { $('modal-karma').classList.add('hide'); });

  /* ── 通用确认 ── */
  var confirmCb = null;
  var confirmCancelCb = null;   /* 取消回调（系统深化批 B4 · 献秘二选一） */
  function askConfirm(title, text, cb, cancelCb) {
    $('cf-title').textContent = title;
    $('cf-text').textContent = text;
    $('cf-cancel').textContent = t('ui.cancel');
    $('cf-ok').textContent = t('ui.confirm');

    confirmCancelCb = cancelCb || null;   /* 系统深化批 B4：献秘二选一（确认=带秘 / 取消=好聚好散）需要取消回调 */
    $('modal-confirm').classList.remove('hide');
  }
  $('cf-cancel').addEventListener('click', function () {

  /* ══════════ 天道系统（天道系统批 B1~B4 · 天道设计 v1.1）══════════
   * 问天浮层：卦位六选 + 香火四档 + 奏疏生成/一键复制（V1 人工中继）+ 自问自卜（V1.5 本地模拟）
   * + 接旨粘贴解析；圣旨揭晓：卷轴展开 + 判词逐字 + 领旨/抗旨（抗旨 CONFIRM 明示逆天值收益与档位后果）；
   * 天象浮层：即开即消红点；逆天大劫入口在渡劫预估浮层（detailTrib 段）。 */
  var tdTypeTimer = null;
  var GIFT_N = 6, GIFT_ROLL_MS = 600000;   /* 六款页游贴片 · 10 现实分钟换一张（会话态，不入存档） */

  /* 恶搞彩蛋：修行页右侧那张贴在墙上的「充值大礼包」。
   * 零机制是本条的底线——点击只出一句提示，不发资源、不写档、不入 Ledger、不碰 cooldown。 */
  function renderGiftPack() {
    var now = Date.now();
    if (ui.giftI < 0 || now >= ui.giftUntil) {
      ui.giftI = Math.floor(Math.random() * GIFT_N);
      ui.giftUntil = now + GIFT_ROLL_MS;
    }
    var gk = 'eggs.gift.p' + ui.giftI + '.';   /* 前缀先落变量：内联在 t(' 里会被 A2 当成整键静态引用（本仓同款先例 = legacy.shop.qirate） */
    return '<span class="giftcard" data-act="giftBuy">' +
      '<span class="gtag">' + esc(t('eggs.gift.tag')) + '</span>' +
      '<span class="gname">' + esc(t(gk + 'name')) + '</span>' +
      '<span class="goffer">' + esc(t(gk + 'offer')) + '</span>' +
      '<span class="gbtn">' + esc(t('eggs.gift.btn')) + '</span></span>';
  }

  function renderTiandaoRow() {
    var w = ws(), d = D();
    if (!SQ.Tiandao || !w.tiandao) return '';
    var td = w.tiandao;
    var unseen = SQ.Tiandao.unseenOmens(w);
    var stage = SQ.Tiandao.stageOf(w, d);
    var h = '<div class="tdrow">';
    /* 问天入口（第卅九批 · 用户令「隐藏游戏问天功能」）：**用既有 .hide 工具类收掉，不删代码**——
     * 引擎（Tiandao.ask / 奏疏 / 圣旨浮层）与词表键原样留着，恢复只需去掉这一个类名；
     * 判据 = 走查 `verify-ui-tiandao` B1（在 DOM 但 `offsetParent === null` ⇒ 玩家看不见也点不着），
     * 后续链路仍由该篇以 dispatchEvent 驱动（委托挂在 document 上，隐藏元素被合成点击照跑）。 */
    h += '<button class="tdbtn hide" data-act="openTiandao">' + esc(t('tiandao.entry')) +
      (unseen ? '<i class="pdot"></i>' : '') + '</button>';
    h += '<button class="tdbtn plain" data-act="openOmens">' + esc(t('tiandao.omen.chip')) +
      (unseen ? '<i class="pdot"></i>' : '') + '</button>';
    if (td.defy > 0 || stage) h += '<span class="tddefy">' + esc(t('tiandao.defy.val', { n: td.defy })) + '</span>';
    if (stage) h += '<span class="tdstage' + (stage === 'nijie' ? ' nijie' : '') + '">' + esc(t('tiandao.stage.' + stage)) + '</span>';
    if (td.title) h += '<span class="tdtitle">' + esc(t('tiandao.title')) + '</span>';
    /* N20 接线：盾此前只有名、语义（用后即失 / 只保修为）全靠玩家自己猜；正典在天道卷 line253/325 */
    if (td.shield) h += '<span class="tdtitle">' + esc(t('tiandao.shield')) + '</span>' +
      '<span class="hint">' + esc(t('tiandao.shield.desc')) + '</span>';
    if (w.realm >= ((d.LEGACY || {}).BINGJIE_MIN_REALM || 4) && SQ.Legacy) {
      h += '<button class="tdbtn plain" data-act="dissolve">' + esc(t('legacy.ui.bingjie.btn')) + '</button>';
    }
    h += renderGiftPack();   /* 页游充值贴片彩蛋（恶搞，零机制） */
    h += '</div>';
    return h;
  }

  function renderTdModal() {
    var w = ws(), d = D();

    (d.TIANDAO.HEXAGRAMS || []).forEach(function (id) {

  /* 奏疏文本框自适应高度：按内容撑开（上限六成屏高，超出由浮层滚动承接），
   * 避免用户只框选到可见首段就复制——「复制不全」的直接诱因 */
  function fitMemoOut(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight + 2, Math.round(window.innerHeight * 0.6)) + 'px';
  }

  /* 领旨 / 抗旨后清空本轮问天残留（奏疏文本框 + 复制按钮 + 接旨粘贴框 + 圣旨缓存）：
   * 一轮问天已了结，下次打开问天不应再显示上一轮奏疏（用户反馈：领完旨后重开问天仍留着旧奏疏） */
  function resetTdMemo() {
    var ta = $('mtd-memoout');
    ta.value = '';
    ta.classList.add('hide');
    $('mtd-copy').classList.add('hide');
    $('mtd-receive').value = '';
    ui.tdDec = null;
  }

  async function tdRunAsk(local) {
    var free = ui.tdHex === 'blank' ? $('mtd-free').value : '';
    var r = await SQ.Actions.tdAsk(state, ui.tdHex, ui.tdIncense, free);
    if (r && r.ok) {
      if (local) {
        var dec = SQ.Tiandao.localDecree(ws(), pack(), D(), Date.now());
        showDecree(dec);
      } else {
        var taM = $('mtd-memoout');
        taM.value = r.text;
        taM.classList.remove('hide');
        fitMemoOut(taM);
        $('mtd-copy').classList.remove('hide');
        toast(t('tiandao.memo.ready', { n: r.text.length }));
      }
    } else if (r && r.reason === 'cooldown') {
      toast(t('tiandao.cd', { t: timeLeftText(Math.max(0, r.until - Date.now())) }));
    } else if (r && r.reason === 'stones') {
      toast(t('tiandao.stones.lack'));
    }
    renderTdModal();
    renderAll();
  }

  function decreeEffText(dec) {
    var p = dec.payload || {};
    switch (dec.type) {
      case 'bless': return t('tiandao.eff.bless', { n: '+' + (p.tribBonus || 0).toFixed(2) });
      case 'curse': return t('tiandao.eff.curse', { n: (p.tribBonus || 0).toFixed(2) });
      case 'gift': return t('tiandao.eff.gift', { n: SQ.fmt(p.stones || 0) });
      case 'punish': return t('tiandao.eff.punish', { n: Math.round((p.mult || 0) * 100), h: p.hours || 24 });
      case 'karma': return t('tiandao.eff.karma', { n: (p.karma >= 0 ? '+' : '') + (p.karma || 0) });
      case 'bond': return t('tiandao.eff.bond', { name: p.target ? t('bond.' + p.target + '.name') : t('tiandao.eff.bond.any'), n: p.bond || 0 });
      case 'affix': return t('tiandao.eff.affix', { name: p.affixId ? t('affix.' + p.affixId + '.name') : t('tiandao.eff.affix.any') });
      default: return t('tiandao.eff.' + dec.type);
    }
  }

  function showDecree(dec) {
    ui.tdDec = dec;
    var w = ws();
    $('mdc-type').textContent = t('tiandao.decree.type', { type: t('tiandao.type.' + dec.type) });
    $('mdc-meta').innerHTML =
      '<span>' + esc(t('tiandao.decree.hex', { hex: t('tiandao.hex.' + dec.hexagram) })) + '</span>' +
      '<span>' + esc(t('tiandao.decree.tier', { tier: t('tiandao.tier.' + dec.tier) })) + '</span>';
    $('mdc-eff').textContent = decreeEffText(dec);
    $('mdc-omen').textContent = t('tiandao.omen.wrap', { s: dec.omen || '' });
    var vd = $('mdc-verdict');
    vd.textContent = '';
    if (tdTypeTimer) { clearInterval(tdTypeTimer); tdTypeTimer = null; }
    if (reducedMotion() || !dec.verdict) {
      vd.textContent = dec.verdict || '';
    } else {
      var vi = 0;
      tdTypeTimer = setInterval(function () {
        vi += 2;
        vd.textContent = dec.verdict.slice(0, vi);
        if (vi >= dec.verdict.length) { clearInterval(tdTypeTimer); tdTypeTimer = null; }
      }, 40);

    var isSeen = SQ.Tiandao.seen(w, dec);

  /* ── 兵解 · 盖棺之传（第册批）已整片外置 `view/show.js`（N34 第十四刀 · 第册五十批）：
   * 打字机节奏（+3 字 / 24ms）与「自查隐藏态自收」的 interval 随件搬走（`recap` / `closeRecap` / `playRecap`）。
   * 这里只留两样：入世钮的一行转发 ‖ 桥位 `playRecap` 用的内核别名（`view/legacy.js` 与确认键都要它）。 ── */
  $('mrp-go').addEventListener('click', function () { SQ.UI.show.closeRecap(ctx()); });
  /* 桥位 `playRecap` 的取值：第十三刀起给 `view/legacy.js` 用，本刀起由它转发到件内实现 */
  function playRecapLastBio() { return SQ.UI.show.playRecap(ctx()); }

  /* 复制奏疏：先走同步 execCommand（内嵌 webview 无剪贴板权限时唯一可用路径，
   * 且在全选态下必然复制全文），失败再试异步 clipboard；两条都失败则明示手动全选，
   * 不再无脑弹「已复制」——旧实现在 clipboard 存在但被拒时静默失败且谎报成功 */
  function copyMemoOut() {
    var ta = $('mtd-memoout');
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); } catch (e) { /* 选区失败仍尝试剪贴板 */ }
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (ok) { toast(t('tiandao.memo.copied')); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(function () {
        toast(t('tiandao.memo.copied'));
      }, function () {
        toast(t('tiandao.memo.manual'));
      });
      return;
    }
    toast(t('tiandao.memo.manual'));
  }
