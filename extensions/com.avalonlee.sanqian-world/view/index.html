<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>三千世界</title>
<style>
  /* ── 主题：双声明 fallback（x-hub §5.5）；页面底永远透明（§5.4 铁律）── */
  :root {
    color-scheme: light;
    --surface: var(--xhub-surface, rgba(255, 255, 255, 0.66));
    --well: var(--xhub-bg-card, rgba(255, 255, 255, 0.9));
    --ink: var(--xhub-text-1, #1f2230);
    --ink-2: var(--xhub-text-2, #5b6070);
    --ink-3: var(--xhub-text-3, #8a8fa0);
    --line: var(--xhub-border, rgba(0, 0, 0, 0.1));
    --primary: var(--xhub-accent, #a8842c);
    --brand-soft: var(--xhub-brand-soft, rgba(168, 132, 44, 0.12));
    --good: var(--xhub-green, #1a7f37);
    --bad: var(--xhub-red, #c0392b);
    --danger: var(--xhub-red, #c0392b);
    --radius: var(--xhub-radius-lg, 12px);
    /* 阵营文字统一规范（走查 v2.7 §4）：正/魔/左三色 token 全项目唯一定义点——
     * 浅色主题取「可读加深」值（正道暗金 #7a5c08，不再用装饰金 #b8860b），暗色主题取亮值 */
    --sq-karma-right: #7a5c08;
    --sq-karma-evil: #b03a2e;
    --sq-karma-neutral: #5f7d8c;
    --sq-tier-0: #8a8fa0; --sq-tier-1: #3a8f5f; --sq-tier-2: #3f5fbf;
    --sq-tier-3: #8a3fbf; --sq-tier-4: #b8860b;
    /* 日志吸顶栏底色：近实遮罩（面板表面偏透明，滚动内容会透出残影） */
    --sq-sticky-veil: rgba(255, 255, 255, 0.92);
  }
  :root[data-xhub-theme="dark"] {
    color-scheme: dark;
    --surface: var(--xhub-surface, rgba(255, 255, 255, 0.06));
    --well: var(--xhub-bg-card, rgba(255, 255, 255, 0.04));
    --ink: var(--xhub-text-1, #e8e9f0);
    --ink-2: var(--xhub-text-2, #a2a7b8);
    --ink-3: var(--xhub-text-3, #71768a);
    --line: var(--xhub-border, rgba(255, 255, 255, 0.12));
    --primary: var(--xhub-accent, #d9b45e);
    --brand-soft: var(--xhub-brand-soft, rgba(217, 180, 94, 0.14));
    --good: var(--xhub-green, #4ec96a);
    --bad: var(--xhub-red, #e57373);
    --danger: var(--xhub-red, #e57373);
    --sq-karma-right: #e3c34a;
    --sq-karma-evil: #e57373;
    --sq-karma-neutral: #8fa8b5;
    --sq-tier-0: #a2a7b8; --sq-tier-1: #4ec96a; --sq-tier-2: #6f8fdf;
    --sq-tier-3: #b47fdf; --sq-tier-4: #d9b45e;
    /* 日志吸顶栏底色：暗色下 --surface 近乎全透（0.06），须换近实深遮罩挡残影 */
    --sq-sticky-veil: rgba(30, 32, 41, 0.92);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", "Songti SC", SimSun, sans-serif;
    font-size: 13px;
    background: var(--xhub-page-bg, transparent);
    color: var(--ink);
  }
  :root[data-xhub-wallpaper-clear="1"] .panel {
    border-color: transparent;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  h1 { margin: 0 0 4px; font-size: 17px; font-weight: 650; letter-spacing: 0.12em; }
  .sub { margin: 0 0 12px; color: var(--ink-2); }
  .hint { color: var(--ink-3); font-size: 12px; }
  button {
    font: inherit; color: var(--ink); background: var(--well);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; min-height: 44px;
  }
  button:hover { border-color: var(--primary); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  :root[data-xhub-theme="dark"] button.primary { color: #1c1a12; }
  input {
    font: inherit; color: var(--ink); background: var(--well);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; width: 100%; min-height: 44px;
  }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .row.between { justify-content: space-between; }
  .big { font-size: 26px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .bar { height: 10px; border-radius: 5px; background: var(--well); overflow: hidden; margin: 10px 0; }
  .bar > i { display: block; height: 100%; width: 0%; background: var(--primary); transition: width .3s; }
  .bar.slim { height: 6px; margin: 6px 0; }
  .kv { display: flex; justify-content: space-between; margin: 6px 0; }
  .hide { display: none !important; }
  .err { color: var(--danger); margin: 8px 0 0; }

  /* ── 创角：天赋卡 ── */
  .combo-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--primary); font-weight: 650; margin-left: 8px; vertical-align: middle; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 12px 0; }
  .tcard.dim { opacity: 0.72; }
  /* 功法卡网格（走查 v2.6 §2）：同行卡片数随窗口宽度自适应 */
  .artgrid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)) !important; }
  .artgrid .acts { display: flex; flex-wrap: wrap; gap: 4px; }
  .artgrid .acts button { flex: 1 1 auto; }
  /* 法器 / 法宝卡网格（卡片化批）：同行卡片数随窗口宽度自适应，宽屏多列、窄屏单列 */
  .geargrid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)) !important; }
  .trgrid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)) !important; }
  .geargrid .acts, .trgrid .acts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .geargrid .acts button, .trgrid .acts button { flex: 1 1 auto; min-height: 34px; padding: 4px 10px; font-size: 12px; }
  .tcard .tslot { font-size: 11px; color: var(--ink-2); margin-bottom: 3px; }
  .tcard .tacts-src { margin-top: 6px; }
  .tcard { position: relative; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--well); }
  .tcard.pos { border-color: var(--good); }
  .tcard.neg { border-color: var(--bad); }
  .tcard.rare { box-shadow: 0 0 0 1px var(--primary) inset; }
  .tcard .tname { font-weight: 650; font-size: 14px; }
  .tcard.pos .tname { color: var(--good); }
  .tcard.neg .tname { color: var(--bad); }
  .tcard .teff { margin: 4px 0; color: var(--ink); }
  .tcard .tdesc { color: var(--ink-3); font-size: 12px; }
  .corner { position: absolute; top: -7px; right: 8px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--primary); color: #fff; white-space: nowrap; }
  :root[data-xhub-theme="dark"] .corner { color: #1c1a12; }
  .corner.amp { right: auto; left: 8px; background: var(--good); color: #fff; }
  /* ── 系统深化批 B1：epic 档专属配色（色值本批拍板：紫金双色，与 rare 金描边明显区分）
     + 机制词条角标 + 羁绊连线徽标（天赋池设计 §七）── */
  :root { --epic: #7a4fb8; --epic-soft: rgba(122, 79, 184, 0.08); --epic-glow: rgba(122, 79, 184, 0.25); }
  :root[data-xhub-theme="dark"] { --epic: #b58ae8; --epic-soft: rgba(181, 138, 232, 0.10); --epic-glow: rgba(181, 138, 232, 0.30); }
  .tcard.epic { border-color: var(--epic); box-shadow: 0 0 0 1px var(--epic) inset, 0 0 12px var(--epic-glow); }
  .tcard.epic.pos { background: linear-gradient(160deg, var(--epic-soft), transparent 55%); }
  .tcard.epic.neg { background: linear-gradient(200deg, var(--epic-soft), transparent 55%); }
  .corner.epic { background: var(--epic); color: #fff; }
  .corner.mech { right: auto; left: 8px; background: var(--ink-2); color: var(--well); font-size: 10px; }
  .corner.amp.mechshift { left: 52px; }
  .synline { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  .synline .dash { flex: 1; border-top: 1px dashed var(--epic); }
  .synbadge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--epic); color: var(--epic); background: var(--epic-soft); white-space: nowrap; }
  /* 临时增益图标行（B2）：来源溯源 chip，减益红描边 */
  .buffrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .buffchip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--good); color: var(--good); background: var(--well); white-space: nowrap; }
  .buffchip.deb { border-color: var(--bad); color: var(--bad); }
  /* 历练页（B3）：词缀 chip / 域主行 / 残片兑换行 */
  .affixrow { display: flex; align-items: baseline; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
  .affixchip { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--sq-tier-2); color: var(--sq-tier-2); background: var(--well); white-space: nowrap; }
  .bossrow { display: flex; align-items: baseline; gap: 4px; margin: 4px 0; }
  .tierbadge.tboss { color: var(--bad); background: var(--well); }
  .shardrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
  .shardrow .acts { margin: 0; display: flex; gap: 4px; }
  /* 批 2 · 主修角标（B4）与秘境↔洞府联动角标（B6） */
  .corner.maincorner { background: var(--primary); letter-spacing: .1em; }
  .lrow .cavelink { font-size: 10px; padding: 0 6px; border-radius: 999px; cursor: pointer;
    border: 1px dashed var(--primary); color: var(--primary); margin-left: 6px; white-space: nowrap; }
  .zone-pw { font-size: 11px; }
  .zone-pw.ok { color: var(--good); } .zone-pw.tight { color: var(--sq-karma-right); }
  .zone-pw.bad { color: var(--bad); }

  /* ── 创角：世界卡 ── */
  .wcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; background: var(--well); cursor: pointer; position: relative; }
  .wcard.sel { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
  .wcard.coming { opacity: .5; cursor: not-allowed; }
  .wcard .wname { font-weight: 650; font-size: 15px; }
  .wcard .wtags { margin-top: 4px; color: var(--ink-2); font-size: 12px; }
  .wstatus { position: absolute; top: 10px; right: 12px; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--primary); }
  .wcard.coming .wstatus { background: var(--well); color: var(--ink-3); border: 1px solid var(--line); }

  /* ── 主界面骨架：窄屏单栏（顶栏 / 内容 / 底栏 Tab），≥720px 自动升为「左栏导航 + 右栏内容」
     用 grid-template-areas 承载两种排布，DOM 顺序不变（创角三屏仍走 .wrap 窄栏）── */
  #sc-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "top" "body" "tabs";
    /* 定高（而非 min-height）：只有容器高度确定，右栏 .tabbody 才会内部滚动、
       左栏（顶栏 + 导航）才钉住不动；用 min-height 时内容撑高容器 → 整页跟着滚。 */
    height: calc(100vh - 32px);
    height: calc(100dvh - 32px);
  }
  #sc-main > .topbar { grid-area: top; }
  #sc-main > .tabbody { grid-area: body; min-height: 0; }
  #sc-main > .tabbar { grid-area: tabs; }
  /* 走查 v2.7 §1：三行——①名字 ②善恶徽章 + 灵石 ③战力 + 修为；二三行字号样式一致 */
  .topbar { display: block; padding: 10px 14px; position: relative; overflow: hidden; }
  /* 世界名水印（方案 B3 · 右上竖排落款）：夹在面板底色与文字层之间——absolute 贴右上，文字行抬到 z-index 1。
   * 竖排字号取 20px（3 字约 60px 高），避免竖排大字被 .topbar 裁切。
   * opacity 由 .06 → .10 → .30（用户逐次要求更明显，现为较高墨色）。 */
  .topbar .wm {
    position: absolute; right: 12px; top: 6px; z-index: 0;
    writing-mode: vertical-rl;
    font-size: 20px; font-weight: 800; letter-spacing: .06em; line-height: 1;
    color: var(--ink); opacity: .30; white-space: nowrap;
    pointer-events: none; user-select: none;
  }
  .topbar .topline { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); position: relative; z-index: 1; }
  .topbar .topline + .topline { margin-top: 4px; }
  .topbar .topline.name { font-weight: 650; font-size: 13px; color: var(--ink); cursor: pointer; min-width: 0; }
  /* 名号徽章（第二行最左 · 善恶入口）固定不缩；元信息 / 灵石可缩省略号（防势力名过长溢出） */
  .topbar .topline .rankchip { flex: 0 0 auto; white-space: nowrap; }
  .topbar .topline .who-meta { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .who { font-weight: 650; cursor: pointer; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stones { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .tabbody { overflow-y: auto; }
  /* 导航条（页面整合批 2026-10-06 顺手修）：窄屏 <720px 为横向滚动条而非 flex:1 等分——
   * 等分时 12 项每项仅 ≈25px，而两字标签需 ≈24px + 左右 padding 4px，配合下方 button 的
   * nowrap+ellipsis 会把**全部**标签截成「修…」「秘…」实际不可读（既有缺陷，13 项时更甚）。
   * 改为不收缩 + min-width 52px + 容器横向滚动：标签完整可读、滑动取用。
   * ≥720px 侧栏媒体查询（flex-direction:column + align-items:stretch）覆盖本规则，不受影响。
   * 合并页取三字标签「法与器」正是以本修复为前提（否则窄屏截成「法…」比原两字更糟）。 */
  .tabbar { display: flex; gap: 4px; padding: 8px 0 0; overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .tabbar button { flex: 0 0 auto; min-width: 52px; min-height: 44px; padding: 8px 8px; font-size: 12px; border-radius: 8px; position: relative;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabbar button.on { border-color: var(--primary); color: var(--primary); background: var(--brand-soft); }
  .tabbar button.locked { opacity: 0.55; cursor: not-allowed; letter-spacing: 2px; }
  .tabbar .dot { position: absolute; top: 4px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  /* 导航分组线：游戏页（修行…奇遇）与系统页（日志 · 设置）之间 */
  .tabbar .navsep { flex: 0 0 auto; align-self: center; width: 1px; height: 60%; background: var(--line); }

  /* ── 日志页（原「奇遇页 → 系统日志弹层」升级为左侧导航的独立页）── */
  /* 顶部分类切换栏吸顶：.tabbody 内部滚动时钉在顶部，长列表下也能随手切分类；
     负外边距抵消 .panel 的 16px 内边距、铺满卡宽；近实遮罩 + 背景模糊挡住滚过的日志行
     ⚠️ 法与器页**不能写 `#tab-arts > .chips`**（真机走查 N4 抓到，不是假想防御）：`artsBody()`
     返回的是一串**平铺**块，融合坛「父母选择」那排 `.chips` 同为 `#tab-arts` 的直接子代，
     写成 `> .chips` 会把它一起吸到页顶（页中页压在标签下）。故顶部标签行带专名 `.lawchips` 与之区分。 */
  #tab-journal > .chips, #tab-arts > .lawchips {
    position: sticky; top: 0; z-index: 6;
    background: var(--sq-sticky-veil);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    margin: -16px -16px 8px; padding: 16px 16px 8px;
    border-bottom: 1px solid var(--line);
    border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
  }
  #tab-journal .loglist { margin-top: 8px; }
  #tab-journal .logline:last-child { border-bottom: none; }

  /* ── 设置页 ── */
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .setrow .sl { font-size: 13px; font-weight: 650; }
  .setrow .sl .sd { display: block; font-size: 12px; font-weight: 400; color: var(--ink-3); margin-top: 3px; }
  /* 纵向设置块（奇遇倾向等：说明在上、控件整行在下，窄屏也不挤压） */
  .setrow.col { flex-direction: column; align-items: stretch; gap: 0; }
  .setrow.col .chips { margin: 8px 0 0; }
  button.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
  button.danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
  /* 开关（设置页 · 自动渡劫）：胶囊 + 滑块 + 状态词 */
  .switch { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 4px 12px; border-radius: 999px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .switch i { display: block; width: 30px; height: 18px; border-radius: 999px; background: var(--line); position: relative; transition: background .18s; }
  .switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .18s; }
  .switch.on { color: var(--primary); border-color: var(--primary); background: var(--brand-soft); }
  .switch.on i { background: var(--primary); }
  .switch.on i::after { transform: translateX(12px); }
  /* 设置页 · 菜单顺序：每行两个小按钮 */
  .tabordacts { display: inline-flex; gap: 6px; }
  button.mini { min-height: 30px; padding: 3px 10px; font-size: 12px; }
  button.mini:disabled { opacity: .35; cursor: default; }

  /* ── 宽屏（≥720px）：左栏 264px 常驻（顶栏摘要 + 纵向 Tab），右栏内容铺满剩余宽度 ──
     创角三屏不受影响——它们在 .wrap 里，始终保持 480px 居中窄栏。 */
  @media (min-width: 720px) {
    #sc-main {
      grid-template-columns: 264px minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "top body" "tabs body";
      column-gap: 14px;
    }
    #sc-main > .topbar { flex-wrap: wrap; row-gap: 6px; margin-bottom: 12px; }

    .tabbar { flex-direction: column; align-items: stretch; padding: 0; overflow-y: auto; }
    .tabbar button { flex: 0 0 auto; text-align: left; padding: 9px 12px; font-size: 13px; min-height: 40px; }
    .tabbar .dot { top: 50%; right: 12px; margin-top: -3.5px; }
    .tabbar .navsep { align-self: stretch; width: auto; height: 1px; margin: 6px 0; }
    /* 内容卡限宽居中：宽屏下叙事段落一行别拉太长（中文字距舒适区 ~40 字/行） */
    #sc-main > .tabbody > .panel { max-width: 980px; margin-left: auto; margin-right: auto; }
  }

  /* ── 列表行通用 ── */
  .lrow { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; background: var(--well); position: relative; }
  .lrow.cur { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
  .lrow.locked { opacity: .5; }
  .lrow .nm { font-weight: 650; font-size: 14px; }
  .lrow .meta { color: var(--ink-2); font-size: 12px; margin-top: 3px; }
  .lrow .red { color: var(--danger); }
  .lrow .acts { display: flex; gap: 6px; margin-top: 8px; }
  .lrow .acts button { min-height: 36px; padding: 4px 12px; font-size: 12px; }

  /* ── 秘境洞天合并批：页内分节标题（秘境 / 洞天福地）+ 洞天福地卡片网格。

  .secbar { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;

  /* ── 成就图鉴批：独立「成就」页卡片网格——已解锁（.got）显名/条件/遗泽，
     未解锁（.lock）遮为问号；特殊成就（data 标 hint）在未解锁时出条件提示（.ahint）── */
  .achvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 10px; align-items: stretch; }

  /* ── 图鉴九面卡（自轮回页迁入成就页顶）：收集率进度条 + 里程碑点 ── */
  .facegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 10px; align-items: stretch; margin-bottom: 4px; }
  .facecard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--well);
    display: flex; flex-direction: column; gap: 6px; }

  .facecard .cn { font-weight: 650; font-size: 13px; }
  .facecard .cc { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .facecard .bar { margin: 0; }
  .facecard .cfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; }
  .facecard .cms { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .tierbadge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; margin-left: 6px; vertical-align: 1px; }
  .t0 { color: var(--sq-tier-0); } .t1 { color: var(--sq-tier-1); } .t2 { color: var(--sq-tier-2); }
  .t3 { color: var(--sq-tier-3); } .t4 { color: var(--sq-tier-4); }
  .special-mark { color: var(--primary); font-weight: 650; }
  /* 卡片「分类」chip（坊市标签批 2026-10-09 · UI 卷 §3.4）：刻意与 `.special-mark` 分家——
     后者在法器卡上已承担「特殊词条」（破军 / 摄灵），同色同形会让「分类」和「词条」两种语义混起来。 */
  .catbadge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; margin-left: 6px;
    vertical-align: 1px; color: var(--ink-3); border: 1px solid var(--line); font-weight: 400; }
  .align-sym { margin-right: 3px; }
  .align-right { color: var(--sq-karma-right); } .align-evil { color: var(--sq-karma-evil); } .align-neutral { color: var(--sq-karma-neutral); }

  /* ── 修行页 ── */
  .detailbox { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; font-size: 12px; color: var(--ink-2); }
  .detailbox .kv { margin: 3px 0; }
  .linkbtn { background: none; border: none; color: var(--primary); cursor: pointer; padding: 2px 6px; min-height: 0; font-size: 12px; text-decoration: underline; }
  /* 胶囊式链接按钮（体验批）：取代纯色下划线文本——柔色底 + 描边 + 尾箭头，悬停描边提亮 */
  .linkbtn.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 11px; border-radius: 999px; background: var(--brand-soft); border: 1px solid transparent; color: var(--primary); font-weight: 600; text-decoration: none; transition: border-color .15s ease, transform .15s ease; }
  .linkbtn.chip::after { content: '\203A'; font-size: 14px; line-height: 1; opacity: .7; margin-top: -1px; }
  .linkbtn.chip:hover { border-color: var(--primary); }
  .linkbtn.chip:active { transform: scale(.97); }
  .fullcap { color: var(--primary); font-weight: 650; }
  /* 手动渡劫入口（自动渡劫关闭时）：修为圆满才亮 */
  .tribready { border: 1px solid var(--primary); border-radius: 10px; padding: 10px 12px; margin-top: 10px; background: var(--brand-soft); text-align: center; }

  .stathero .sha .an { font-size: 11px; color: var(--ink-3); }

  /* 游戏历顶栏（v2.3）：修行页最顶——罗云历X年X月X日，1 游戏日 = 1 现实秒 */
  .calrow { text-align: center; font-size: 12px; color: var(--ink-3); letter-spacing: 1px; margin: 0 0 8px; font-variant-numeric: tabular-nums; }
  /* ── 势力页（G16 · 势力批 v2.4）── */
  .facbanner { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin: 8px 0; background: var(--well); display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  .faccard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; background: var(--well); }

  .cavecard .cn { font-weight: 650; font-size: 13px; }
  .cavecard .cm { font-variant-numeric: tabular-nums; color: var(--primary); font-size: 12px; white-space: nowrap; }
  .cavecard .cs { font-size: 11px; color: var(--ink-2); margin-top: 2px; }

  /* 格位详情（五段式） */
  .bd-head { display: flex; gap: 14px; align-items: center; }

    justify-content: center; font-size: 26px; font-weight: 700; color: var(--surface); background: var(--primary); flex-shrink: 0; }

  /* 往来段（好感三渠道批 2026-10-06 · UI 卷 §3.4c）：拜访主按钮 + 赠丹 chips。

  .actbtn { display: flex; align-items: center; gap: 7px; width: 100%; min-height: 40px;

  .formcard .cost { font-size: 11px; color: var(--bad); margin-top: 6px; line-height: 1.8; }
  .pfoot { margin-top: 10px; font-size: 10px; color: var(--ink-3); text-align: center; line-height: 1.8; }

  .spouse-stage { position: fixed; inset: 0; z-index: 64; display: flex; align-items: center; justify-content: center;

  /* ── 模态与演出 ── */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
  /* 通用确认层恒在其它浮层之上（2026-10-05 层级修复）：.mask 同为 z-index 50 时按 DOM 序叠放，
   * 而 #modal-confirm 在 #modal-decree 之前 → 抗旨二次确认被圣旨浮层盖住，需先关掉前面浮层才见。
   * 抬到 68（> 演出层 64/65、< toasts 70），任何浮层内触发的确认都浮在触发者之上。 */
  #modal-confirm { z-index: 68; }
  .modal { width: min(360px, calc(100vw - 48px)); max-height: 80vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; backdrop-filter: blur(8px); }

  .ostat .os { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

  .tdbtn.plain { border-color: var(--line); color: var(--ink-2); background: var(--well); font-weight: 400; }

  .tdtitle { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--primary); color: var(--primary); background: var(--brand-soft); white-space: nowrap; }
  .tdhex { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .tdhex button { min-height: 34px; padding: 4px 10px; border-radius: 10px; font-size: 12px; text-align: center; }
  .tdhex button.on { border-color: var(--primary); color: var(--primary); background: var(--brand-soft); }
  .tdhex .hx { display: block; font-size: 10px; color: var(--ink-3); margin-top: 1px; }
  textarea.tdta { width: 100%; min-height: 88px; background: var(--well); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.6; resize: vertical; box-sizing: border-box; font-family: inherit; }
  .decree-scroll { animation: unroll .55s ease-out; transform-origin: top center; border: 1px solid var(--primary); border-radius: 10px; padding: 14px; background: var(--brand-soft); }
  @keyframes unroll { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
  .decree-type { text-align: center; font-size: 16px; font-weight: 700; color: var(--primary); letter-spacing: .2em; }
  .decree-verdict { margin-top: 10px; font-size: 13px; line-height: 1.7; min-height: 44px; white-space: pre-wrap; }
  .decree-omen { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  .decree-meta { display: flex; justify-content: center; gap: 10px; font-size: 11px; color: var(--ink-3); margin-top: 6px; }
  .omenitem { border: 1px solid var(--line); border-left: 3px solid var(--primary); border-radius: 10px; padding: 8px 12px; margin: 6px 0; background: var(--well); font-size: 12px; line-height: 1.6; }
  .omenitem .ot { color: var(--ink-3); font-size: 11px; margin-bottom: 2px; }
  .rumorcard.sky { border-left-color: var(--primary); }
  @media (prefers-reduced-motion: reduce) { .decree-scroll { animation: none; } }
  /* ── 渡劫呈报（渡劫演出重做批）：主题感知卡片 + 成算环，弃近黑幕布（信息落在浅色卡上）── */
  .trib-mask { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(18, 16, 28, .34); backdrop-filter: blur(4px); }
  .trib-card { position: relative; overflow: hidden; width: min(300px, calc(100vw - 56px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px 16px; text-align: center; box-shadow: 0 14px 44px rgba(0, 0, 0, .22); animation: tribIn .3s cubic-bezier(.3, .8, .3, 1); }
  .trib-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--primary); opacity: .85; }
  .trib-card.lose::before { background: var(--bad); }
  .trib-card.charging .trib-ring { animation: tribPulse 1.1s ease-in-out infinite; }
  @keyframes tribIn { from { transform: translateY(12px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes tribPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: .85; } }
  .trib-ring { position: relative; width: 92px; height: 92px; margin: 2px auto 12px; }
  .trib-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .trib-ring circle { fill: none; stroke-width: 8; }
  .trib-ring .trk { stroke: var(--well); }
  .trib-ring .tfl { stroke: var(--primary); stroke-linecap: round; stroke-dasharray: 264; stroke-dashoffset: 264; transition: stroke-dashoffset .8s cubic-bezier(.3, .7, .3, 1), stroke .3s ease; }
  .trib-ring .tri-in { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .trib-ring .tri-p { font-size: 23px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .trib-ring .tri-u { font-size: 11px; color: var(--ink-3); margin-left: 1px; }
  .trib-card.lose .tri-p { color: var(--bad); }
  .trib-card .t1 { font-size: 16px; letter-spacing: .16em; font-weight: 700; color: var(--ink); }
  .trib-card.win .t1 { color: var(--primary); }
  .trib-card.lose .t1 { color: var(--bad); }
  .trib-card .t2 { margin-top: 7px; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
  .trib-rows { margin-top: 12px; display: grid; gap: 6px; }
  .trib-rows .tr { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); background: var(--well); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; }
  .trib-rows .tr b { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .trib-rows .tr.hot b { color: var(--primary); }
  .trib-rows .tr.bad b { color: var(--bad); }
  .trib-card .trib-skip { margin-top: 12px; font-size: 11px; color: var(--ink-3); opacity: .85; }
  @media (prefers-reduced-motion: reduce) { .trib-card { animation: none; } .trib-card.charging .trib-ring { animation: none; } .trib-ring .tfl { transition: none; } }
  #toasts { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 6px; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
  .toast { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 12px; color: var(--ink); backdrop-filter: blur(8px); box-shadow: 0 4px 14px rgba(0,0,0,.15); }

  /* ── F1 问道初心三段卡 ── */
  .biascards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .biascard { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--well); cursor: pointer; text-align: center; }
  .biascard.sel { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; background: var(--brand-soft); }
  .biascard .bn { font-weight: 650; font-size: 13px; }
  .biascard.right .bn { color: var(--sq-karma-right); }
  .biascard.evil .bn { color: var(--sq-karma-evil); }
  .biascard .bd { margin-top: 4px; color: var(--ink-3); font-size: 11px; line-height: 1.5; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--primary); font-size: 12px; font-weight: 650; }

  /* ── F2 奇遇页：叙事流 + 图鉴 ── */
  .fcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; background: var(--well); }
  /* G17 江湖传闻卡：性质色调左边线 + 倒计时行（临期转红）；war 卡固定赭线 */
  .rumorcard { border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 6px 0; background: var(--well); }
  .rumorcard.good { border-left-color: var(--good); }
  .rumorcard.bad, .rumorcard.war { border-left-color: var(--bad); }
  .rumorcard .rt { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .rumorcard .fg { font-size: 12px; margin-top: 4px; }
  .rumorcard.soon .rt span:last-child { color: var(--bad); font-weight: 650; }
  /* G13 v2.0 附属设施行（洞府浮层） */
  .cavefac { margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 4px; }
  .facrow { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
  .facrow .nm { font-weight: 600; white-space: nowrap; }
  .facrow .meta { flex: 1; color: var(--ink-2); font-size: 11px; }
  .facrow button { white-space: nowrap; }
  .fcard .fh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .fcard .fn { font-weight: 650; font-size: 13px; }
  .fcard .ft { color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fcard .fg { font-size: 12px; margin-top: 3px; }
  .fcard .fe { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
  .ebadge { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 4px; border: 1px solid currentColor; margin-left: 4px; vertical-align: 1px; }
  .codexgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .cslot { border: 1px dashed var(--line); border-radius: 8px; padding: 7px 6px; font-size: 11px; text-align: center; color: var(--ink-2); background: var(--well); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .cslot.seen { border-style: solid; color: var(--ink); }
  .cslot.unseen { color: var(--ink-3); opacity: .65; }
  .codex-sec { margin-top: 10px; font-weight: 650; color: var(--ink-2); font-size: 12px; }

  /* ── F3 抉择模态：徽标行 / 分支信息层 / 判定演出 / 结果页 ── */
  .mc-badges { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  /* 创角步骤条（走查稿① 第 6 项）：当前步实心金、已过步描金 */
  .stepper { display: flex; justify-content: center; align-items: center; margin: -4px 0 12px; }
  .step { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); }
  .step .n { width: 19px; height: 19px; border-radius: 50%; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 10px; }
  .step.on { color: var(--primary); font-weight: 700; }
  .step.on .n { border-color: var(--primary); background: var(--primary); color: var(--surface); }
  .step.done .n { border-color: var(--primary); color: var(--primary); }
  .stepline { width: 30px; height: 1px; background: var(--line); margin: 0 8px; }
  .mbadge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .mbadge.good { color: var(--good); } .mbadge.bad { color: var(--bad); }
  .mbadge.sp { color: var(--primary); background: var(--brand-soft); }
  .mc-story { color: var(--ink-2); font-size: 12px; line-height: 1.8; margin: 0 0 12px; }
  .branch { position: relative; }
  .branch .bk { font-weight: 650; }
  .branch .bi { display: block; color: var(--ink-3); font-size: 11px; margin-top: 3px; line-height: 1.5; }
  .branch.right-b { border-left: 3px solid var(--sq-karma-right); }
  .branch.evil-b { border-left: 3px solid var(--sq-karma-evil); }
  .branch.neutral-b { border-left: 3px solid var(--sq-karma-neutral); }
  .branch:disabled { opacity: .45; }
  /* 抉择模态 footer 三纪律（交互说明 §4.3：必选 / 无倒计时 / 点遮罩不关）+ 点遮罩轻震反馈 */
  .mc-foot { text-align: center; font-size: 11px; margin: 10px 0 0; letter-spacing: .04em; }
  .modal.nudge { animation: nudge .32s ease-in-out; }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    22% { transform: translateX(-5px); }
    48% { transform: translateX(4px); }
    74% { transform: translateX(-2px); }
  }
  .judging { text-align: center; padding: 18px 0; color: var(--ink-2); font-size: 13px; }
  .judging .jline { margin: 6px 0; opacity: .35; transition: opacity .3s; }
  .judging .jline.lit { opacity: 1; }
  .res-karma { font-size: 16px; font-weight: 700; text-align: center; margin: 6px auto; padding: 3px 14px; width: fit-content; border-radius: 999px; }
  /* 走查 v2.5 §5：金色字压浅底不易识别 → 加深文字色 + 软底徽章（明暗双主题各自校色） */
  .res-karma.pos { color: var(--sq-karma-right); background: var(--brand-soft); }
  .res-karma.neg { color: var(--sq-karma-evil); background: rgba(192, 57, 43, 0.10); }
  .res-check { text-align: center; font-size: 12px; margin-bottom: 6px; }
  .res-check.pass { color: var(--good); } .res-check.fail { color: var(--bad); }

  /* ── F4 闭关所得常驻面板 ── */
  .offbox { border: 1px dashed var(--line); border-radius: 10px; padding: 9px 12px; margin: 10px 0; background: var(--well); font-size: 12px; color: var(--ink-2); }
  .offbox .ot { font-weight: 650; color: var(--ink); margin-bottom: 3px; }

  /* ── F7 渡劫演出（样式见上「渡劫呈报」）+ 独占全屏演出 ── */
  .excl-mask { position: fixed; inset: 0; z-index: 65; display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(ellipse at center, rgba(60,45,10,.92), rgba(10,8,4,.97)); }
  .excl-box { text-align: center; color: #f0d473; padding: 24px; animation: exclIn 1.2s ease-out; }
  .excl-box .e1 { font-size: 13px; letter-spacing: .3em; color: rgba(240,212,115,.75); }
  .excl-box .e2 { font-size: 26px; font-weight: 700; letter-spacing: .12em; margin: 12px 0; text-shadow: 0 0 18px rgba(240,212,115,.5); }
  .excl-box .e3 { font-size: 12px; color: rgba(255,255,255,.65); }
  @keyframes exclIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }

  /* ── 善恶名号（善恶名号批）：顶栏头衔徽章 + 浮层九段天梯 + 名号更迭全屏演出 ── */
  /* 名号徽章：顶栏第一行唯一的善恶入口（点按开善恶浮层）——第二行档位徽章已撤 */
  .rankchip { display: inline-block; padding: 1px 9px; border-radius: 999px; cursor: pointer;
    font-size: 12px; font-weight: 700; letter-spacing: .04em; border: 1px solid currentColor; vertical-align: 1px; }
  .rankchip.right { color: var(--sq-karma-right); background: var(--brand-soft); }
  .rankchip.evil { color: var(--sq-karma-evil); background: rgba(192, 57, 43, 0.10); }
  .rankchip.neutral { color: var(--sq-karma-neutral); background: var(--well); }
  .rankladder { display: flex; flex-direction: column; gap: 3px; margin: 8px 0; }
  .rankladder .rrow { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 3px 10px; border-radius: 8px; border: 1px solid transparent; font-size: 12px; color: var(--ink-2); }
  .rankladder .rrow .rr-range { font-variant-numeric: tabular-nums; font-size: 11px; opacity: .7; }
  .rankladder .rrow.on { font-weight: 700; border-color: currentColor; background: var(--well); }
  .rankladder .rrow.on.right { color: var(--sq-karma-right); }
  .rankladder .rrow.on.evil { color: var(--sq-karma-evil); }
  .rankladder .rrow.on.neutral { color: var(--sq-karma-neutral); }
  /* 名号更迭全屏演出：轻幕（alpha ≤ 0.6）保底，大名号高对比；z 66 在独占演出之上、确认层之下 */
  .rank-mask { position: fixed; inset: 0; z-index: 66; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .rank-mask.right { background: radial-gradient(ellipse at center, rgba(48,40,10,.58), rgba(10,9,5,.84)); }
  .rank-mask.evil { background: radial-gradient(ellipse at center, rgba(48,14,16,.58), rgba(10,5,5,.84)); }
  .rank-mask.neutral { background: radial-gradient(ellipse at center, rgba(18,26,32,.58), rgba(5,7,9,.84)); }
  .rank-box { text-align: center; padding: 26px; animation: rankIn 1s ease-out; }
  .rank-box .r1 { font-size: 13px; letter-spacing: .34em; color: rgba(255,255,255,.62); }
  .rank-box .r2 { font-size: 30px; font-weight: 800; letter-spacing: .14em; margin: 14px 0; }
  .rank-box .r2.right { color: var(--sq-karma-right); text-shadow: 0 0 24px rgba(227,195,74,.55); }
  .rank-box .r2.evil { color: var(--sq-karma-evil); text-shadow: 0 0 24px rgba(229,115,115,.55); }
  .rank-box .r2.neutral { color: #cfe0e8; text-shadow: 0 0 20px rgba(143,168,181,.45); }
  .rank-box .r3 { font-size: 12px; color: rgba(255,255,255,.6); }
  @keyframes rankIn { from { opacity: 0; transform: translateY(12px) scale(.92); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .bar > i { transition: none; }
    * { animation: none !important; }
    .judging .jline { transition: none; }
  }
</style>

<body>
<div class="wrap">
  <!-- LOADING -->
  <div id="sc-loading" class="panel"><p class="sub" id="loading-text">…</p></div>

  <!-- 屏 1 · 起名（步序 1） -->
  <div id="sc-c1" class="panel hide">
    <div class="stepper" id="c1-steps"></div>
    <h1 id="c1-title"></h1>
    <label class="kv"><span id="c1-label"></span></label>
    <input id="c1-name" maxlength="8" />
    <p class="err hide" id="c1-err"></p>
    <div class="row between">
      <button id="c1-random"></button>
      <button id="c1-next" class="primary"></button>
    </div>
  </div>

  <!-- 屏 3 · 观天赋 + 问道初心（步序 3；天赋池由屏 2 所选世界决定） -->
  <div id="sc-c2" class="panel hide">
    <div class="stepper" id="c2-steps"></div>
    <h1><span id="c2-title"></span><span class="combo-badge" id="c2-combo"></span></h1>
    <p class="hint" id="c2-hint"></p>
    <div class="cards" id="c2-cards"></div>
    <div class="synnote hide" id="c2-syn"></div>
    <h1 style="font-size:15px;margin-top:16px" id="c2b-title"></h1>
    <p class="hint" id="c2b-hint"></p>
    <div class="biascards" id="c2-bias"></div>
    <div class="row between">
      <button id="c2-back"></button>
      <span style="display:flex;gap:8px">
        <button id="c2-reroll"></button>
        <button id="c2-confirm" class="primary"></button>
      </span>
    </div>
  </div>

  <!-- 屏 2 · 择界（步序 2） -->
  <div id="sc-c3" class="panel hide">
    <div class="stepper" id="c3-steps"></div>
    <h1 id="c3-title"></h1>
    <p class="sub" id="c3-pick"></p>
    <p class="hint" id="c3-hint"></p>
    <div id="c3-list"></div>
    <p class="err hide" id="c3-err"></p>
    <div class="row between">
      <button id="c3-back"></button>
      <button id="c3-go" class="primary"></button>
    </div>
  </div>

  </div>

<!-- MAIN：顶栏 + 六 Tab + 底栏（窄屏单栏；≥720px 左栏导航 + 右栏内容。
     放在 .wrap 之外，才不会被创角三屏的 480px 窄栏限宽） -->
<div id="sc-main" class="hide">
    <div class="panel topbar">
      <div class="wm" id="m-wm" aria-hidden="true"></div>
      <div class="topline name" id="m-who" data-act="role"></div>
      <div class="topline">
        <span class="rankchip" id="m-rank" data-act="karma"></span>
        <span class="stones" id="m-stones"></span>
      </div>
      <div class="topline" id="m-sub"></div>
    </div>
    <div class="tabbody">
      <div id="tab-idle" class="panel"></div>
      <div id="tab-combat" class="panel hide"></div>
      <div id="tab-arts" class="panel hide"></div>
      <div id="tab-treasure" class="panel hide"></div>
      <div id="tab-shop" class="panel hide"></div>
      <div id="tab-faction" class="panel hide"></div>
      <div id="tab-bonds" class="panel hide"></div>
      <div id="tab-event" class="panel hide"></div>
      <div id="tab-alchemy" class="panel hide"></div>
      <div id="tab-prodigy" class="panel hide"></div>
      <div id="tab-sect" class="panel hide"></div>
      <div id="tab-achv" class="panel hide"></div>
      <div id="tab-legacy" class="panel hide"></div>
      <div id="tab-journal" class="panel hide"></div>
      <div id="tab-settings" class="panel hide"></div>
    </div>
    <div class="tabbar" id="m-tabbar"></div>
</div>

<!-- 锁定确认模态（F1：入定摘要 pills = 天赋 + 初心） -->
<div id="modal-lock" class="mask hide">
  <div class="modal">
    <h2 id="mk-title"></h2>
    <p id="mk-text"></p>
    <p class="hint" id="mk-sumlabel"></p>
    <div class="pills" id="mk-summary"></div>
    <div id="mk-legacy"></div>
    <div class="row between">
      <button id="mk-cancel"></button>
      <button id="mk-ok" class="primary"></button>
    </div>
  </div>
</div>

<!-- 选择奇遇模态（F3：三分支 + 判定演出 + 结果页；必须选择才关闭） -->
<div id="modal-choice" class="mask hide">
  <div class="modal">
    <div class="mc-badges" id="mc-badges"></div>
    <h2 id="mc-title"></h2>
    <p class="mc-story" id="mc-story"></p>
    <div id="mc-branches"></div>
    <p class="mc-foot hint" id="mc-foot"></p>
    <div id="mc-judging" class="judging hide"></div>
    <div id="mc-result" class="hide">
      <p class="res-check" id="mc-check"></p>
      <p class="res-karma" id="mc-karma"></p>
      <p id="mc-eff" class="hint" style="text-align:center"></p>
      <p id="mc-excl" class="hint hide" style="text-align:center"></p>
      <p id="mc-bondlock" class="hint hide" style="text-align:center;opacity:.75"></p>
      <button id="mc-ok" class="primary" style="width:100%"></button>
    </div>
  </div>
</div>

<!-- 角色浮层 -->
<div id="modal-role" class="mask hide">
  <div class="modal">
    <h2 id="mr-title"></h2>
    <div id="mr-attrs"></div>
    <div class="cards" id="mr-talents" style="margin-top:10px"></div>
    <div class="row between">
      <button id="mr-karma"></button>
      <button id="mr-close" class="primary"></button>
    </div>
  </div>
</div>

<!-- karma 浮层（F5：四行构成 + 色带游标 + 档位效果摘要） -->
<div id="modal-karma" class="mask hide">
  <div class="modal">
    <h2 id="mkd-title"></h2>
    <p id="mkd-value" style="font-size:20px;font-weight:700"></p>
    <div class="bar slim"><i id="mkd-bar"></i></div>
    <p id="mkd-next" class="hint"></p>
    <p class="hint" id="mkd-ranktitle" style="margin-top:10px;font-weight:650"></p>
    <div id="mkd-ranks" class="rankladder"></div>
    <div id="mkd-parts"></div>
    <p id="mkd-rate" class="hint" style="margin-top:8px"></p>
    <p class="hint" id="mkd-efftitle" style="margin-top:10px;font-weight:650"></p>

<script>
(function () {
  var SQ = window.SQ;
  var state = {};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };

  var draft = { name: '', roll: null, worldId: null, worldNames: {}, bias: 'neutral', legacy: null };
  var ui = {
    tab: 'idle',
    detailRate: false, detailTrib: false,
    logFilter: 'all', shopBlack: false,
    lastAttempts: 0, lastLogKey: '', toasts: [],
    announcedLogKey: '',                    /* 动作处已就同一日志提示过的标识：tick 侧据此避免同文重复呈报 */
    newLogDot: false,                       /* 日志页未读红点（afterClaim 置位，进页清除） */
    newFeedDot: false,                      /* 奇遇页未读红点（同上；基线见 lastFeedKey） */
    rumorSeenAt: null,                      /* G17 传闻红点基线（走查修复）：已读时点，其后出生的传闻才亮 */
    feedExpand: false, lastFeedKey: '',     /* 奇遇页叙事流折叠态（F2）+ 未读判定基线（最新条标识） */
    seenOfflineAt: 0,                       /* 出关呈报 at 键控 · 会话一次（F4） */
    ioErrSeen: null,                        /* 存档 I/O 失败提示去重（平台关卡 #89） */
    caveStory: {},                          /* 洞府叙事展开态（B3；未达资格者本就不给展开） */
    tribSnap: null,                         /* 渡劫前 {p, loss} 快照（F7 复盘行） */
    artsGroup: 'tier', artsGroupVal: null,  /* 功法页双维分组（B4）：品阶|阵营 × 选中值（null=全节） */
    lawChip: 'fa',                          /* 法与器页顶部标签（标签化批 2026-10-09）：'fa' 功法段 | 'qi' 法器段，两段互斥；纯 UI 态不入存档 */
    slotPickFor: null,                      /* 满槽替换选择模式（B4）：待入槽的功法 id */
    bondDetail: null,                       /* 名录浮层二级页（B3）：当前查看的 npcId */
    unwalked: {},                           /* 未择之路展开态（B8）：feed ts 键控；卸下照世镜即复位 */
    bondSnap: null,                         /* 侣 chip 红点快照（B1）：升档/可提亲变化检测 */
    caveSnap: null,                         /* 地 chip 红点快照（B1）：新福地解锁变化检测 */
    achvSnap: null,                         /* 成就页红点快照：新成就达成变化检测（meta.achv 只增） */
    spouseLogSeen: 0,                       /* 双修解除叙事已消费标记（B4）：spouseLog.at 键控，会话一次 */
    karmaRank: ''                           /* 善恶名号段位基线（善恶名号批）：跨段即触发名号更迭演出 */
  };

  function wid() { return state.profile ? state.profile.worldId : 'xiuxian'; }
  function t(k, v) { return SQ.t(k, v, wid()); }
  /* 创角期取词：世界尚未写入 profile，按 draft.worldId 取（未择界时回落 common 词表） */
  function tc(k, v) { return SQ.t(k, v, draft.worldId); }
  function ws() { return state.worlds[wid()]; }
  function pack() { return SQ.Worlds[wid()].pack; }
  function D() { return pack().data; }
  function mods() { return SQ.Mods.collect(state.profile, ws(), pack(), D()); }

  function show(name) {
    ['loading', 'c1', 'c2', 'c3', 'main'].forEach(function (s) {
      $('sc-' + s).classList.toggle('hide', s !== name);
    });
  }

  /* ── toast（F6 收敛：同屏 ≤2 条；事件类废止——奇遇走模态/叙事流/红点） ── */
  function toast(text) {
    /* 动作处提示若与日志末条同文，则记为「已呈报」——tick 侧 afterClaim 不再重复弹一次。
       仅比对末条文本，冷却/错误类提示（文本对不上）不受影响。 */
    var w = state.worlds[wid()];
    var tail = w && w.log && w.log[w.log.length - 1];
    if (tail && tail.text === text) ui.announcedLogKey = logKeyOf(w.log);
    var box = $('toasts');
    while (box.children.length >= 2 && box.firstChild) box.removeChild(box.firstChild);
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    box.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 3000);
  }

  /* 轻震反馈（未结缘格 / 缘尽格 / 未录格共用）：可感知但无信息（交互说明 ★） */
  function nudgeEl(elx) {
    if (!elx || reducedMotion()) return;
    elx.classList.remove('nudge');
    void elx.offsetWidth;
    elx.classList.add('nudge');
    setTimeout(function () { elx.classList.remove('nudge'); }, 420);
  }

  /* 存档 I/O 失败 → 人话提示（平台关卡 #89 桥容错：storage 被拒也不白屏、不静默丢档） */
  function checkIo() {
    if (!SQ.storageError) return;
    var e = SQ.storageError();
    if (!e) { ui.ioErrSeen = null; return; }
    var sig = e.op + ':' + e.msg;
    if (ui.ioErrSeen === sig) return;
    ui.ioErrSeen = sig;
    toast(t(e.op === 'write' ? 'ui.error.save' : 'ui.error.storage', { msg: e.msg }));
  }

  /* ── 创角三屏（与 P2 相同逻辑） ── */
  /* 步骤条：一立名 / 二择界 / 三观天赋（当前步实心金、已过步描金，走查稿① 第 6 项）
   * 屏 id 与步骤号解耦：c1 = 起名 / c3 = 择界 / c2 = 观天赋（DOM 顺序按语义成对，不按步序）。 */
  function stepsHtml(cur) {
    var h = '';
    [1, 2, 3].forEach(function (i) {
      if (i > 1) h += '<span class="stepline"></span>';
      h += '<span class="step ' + (i === cur ? 'on' : (i < cur ? 'done' : '')) + '">' +
        '<span class="n">' + esc(tc('creation.step.' + i + '.n')) + '</span>' +
        esc(tc('creation.step.' + i + '.t')) + '</span>';
    });
    return h;
  }
  function bindCreationTexts() {
    document.title = SQ.t('app.name');

  /* 机制词条判定（天赋池设计 §三·补）：effects 含挂点白名单键 → 「机制」小角标；
   * desc 直出条件句式文案（词表手写），不显示挂点键名 */
  function isMechTalent(el) {
    var HK = (SQ.Mods && SQ.Mods.TALENT_HOOK_KEYS) || [];

  /* 羁绊命中（§九）：锁定态才生效加成，创角重抽阶段仅展示连线徽标 + 一行说明 */
  function matchedSynergies(talents, worldId) {
    var entry = SQ.Worlds[worldId];
    var D = entry && entry.pack && entry.pack.data;
    var syns = (D && D.TALENT_SYNERGIES) || [];
    var ids = {};
    (talents || []).forEach(function (t) { ids[t.id] = 1; });
    return syns.filter(function (s) { return s.pair && ids[s.pair[0]] && ids[s.pair[1]]; });
  }
  function talentCard(el, w, synHit) {
    var d = document.createElement('div');
    var isEpic = el.tier === 'epic';
    d.className = 'tcard ' + (el.kind === 'positive' ? 'pos' : 'neg') +
      (el.tier === 'rare' ? ' rare' : '') + (isEpic ? ' epic' : '') + (synHit ? ' syn' : '');
    var html = '';
    if (el.tier === 'rare') html += '<span class="corner">' + esc(tc('creation.talent.rare')) + '</span>';
    if (isEpic) html += '<span class="corner epic">' + esc(tc('creation.talent.epic')) + '</span>';
    if (el.amplified) html += '<span class="corner amp">' + esc(tc('creation.talent.amplify')) + '</span>';
    /* N20 接线：羁绊命中此前只加 `.syn` 描边、无文字（玩家看不出这枚天赋是被羁绊点亮的） */
    if (synHit) html += '<span class="corner">' + esc(tc('creation.talent.synergy')) + '</span>';
    if (isMechTalent(el)) html += '<span class="corner mech' + (el.amplified ? ' mechshift' : '') + '">' + esc(tc('creation.talent.mech')) + '</span>';
    html += '<div class="tname">' + esc(SQ.t('talent.' + el.id + '.name', null, w)) + '</div>' +
            '<div class="teff">' + esc(SQ.effectsToText(el.effects, w)) + '</div>' +
            '<div class="tdesc">' + esc(SQ.t('talent.' + el.id + '.desc', null, w)) + '</div>';
    d.innerHTML = html;
    return d;
  }

  /* 轮回赠礼（轮回卷 §5.3 新周目创角）：跳档起步 / 转世天赋槽 ≤2 / 跨世之缘赎回——
   * 全部资格型（meta.spent 判定），创角事务内一次确认 */
  function renderLegacyGifts() {
    var meta = state.meta || {};
    var spent = meta.spent || {};
    var d = SQ.XDATA;
    draft.legacy = draft.legacy || { startRealm: 0, talents: [], bond: null };
    var has = { r1: spent['shop.startRealm1'] != null, r2: spent['shop.startRealm2'] != null, r3: spent['shop.startRealm3'] != null };
    var ownedT = SQ.Legacy ? SQ.Legacy.ownedTalents(meta, d) : [];
    var bondOk = !!(meta.unlocks && meta.unlocks.bond) && ((meta.lastBonds || []).length > 0);
    if (!has.r1 && !has.r2 && !has.r3 && !ownedT.length && !bondOk) { $('mk-legacy').innerHTML = ''; return; }
    var h = '<p class="hint" style="margin-top:10px">' + esc(t('legacy.ui.gifts')) + '</p>';
    if (has.r1 || has.r2 || has.r3) {
      h += '<div class="kv"><span class="hint">' + esc(t('legacy.ui.startRealm.pick')) + '</span></div><div class="chips">';
      h += '<button class="' + (draft.legacy.startRealm === 0 ? 'on' : '') + '" data-act="lgRealm" data-v="0">' + esc(t('legacy.ui.none')) + '</button>';
      [[1, 'r1'], [2, 'r2'], [3, 'r3']].forEach(function (r) {
        if (!has[r[1]]) return;
        h += '<button class="' + (draft.legacy.startRealm === r[0] ? 'on' : '') + '" data-act="lgRealm" data-v="' + r[0] + '">' + esc(t('realm.' + r[0])) + '</button>';

      ownedT.forEach(function (tt) {

        h += '<button class="' + (on ? 'on' : '') + '" data-act="lgTalent" data-v="' + tt.id + '" title="' + esc(t('legacy.talent.' + tt.id + '.desc')) + '">' + esc(t('legacy.talent.' + tt.id + '.name')) + '</button>';

      h += '<div class="kv"><span class="hint">' + esc(t('legacy.ui.bondHeir.pick')) + '</span></div><div class="chips">';
      h += '<button class="' + (draft.legacy.bond === null ? 'on' : '') + '" data-act="lgBond" data-v="">—</button>';

        h += '<button class="' + (draft.legacy.bond === nid ? 'on' : '') + '" data-act="lgBond" data-v="' + nid + '">' + esc(t('bond.' + nid + '.name')) + '</button>';

  /* 屏 2 · 观天赋 → 入定（锁定天命后写入存档并进入主界面） */
  $('mk-ok').addEventListener('click', async function () {

      /* N20 接线：首世开场行（转世世由 legacy.js 的 `legacy.log.rebirth` 起头，首世此前一片空白） */
      SQ.Log.push(s.worlds[w], 'sys', SQ.t('log.boot', null, w));
      if (s.meta.unlockedWorlds.indexOf(w) < 0) s.meta.unlockedWorlds.push(w);
      /* 轮回赠礼落地（轮回卷 §3.2/§3.3/§3.5）：跳档不跳渡劫 / 转世天赋独立槽 / 跨世之缘 bond 40 */
      var nws = s.worlds[w];

          SQ.Bonds.grantHeir(nws, SQ.Worlds[w].pack, SQ.XDATA, lg.bond, SQ.XDATA.LEGACY.BOND_HEIR_BASE);

      /* 同代天骄创角生成（天骄卷 §二：默认 2 / 解锁 4 + 跨世宿敌带记忆转世） */
      if (SQ.Prodigy) SQ.Prodigy.rollForNewLife(nws, SQ.Worlds[w].pack, SQ.XDATA, s.meta, Date.now());
    });
    draft.legacy = null;
    enterMain();

  /* ══════════ MAIN：九游戏页 + 两系统页 ══════════ */
  /* 游戏页：顺序可在设置页上下调整（settings.tabOrder）；
   * lock（势力批 v2.4 需求 §4/§5 → 渐次解锁批 §C 表化）：境界未达时导航标题显示「？」置灰不可点。
   * 阈值单一事实源 = data.js TAB_UNLOCK（tabLock() 优先读表，行内 lock 为同源兜底值；
   * 引擎侧天骄 gate 与渡劫解锁播报同表同源）。
   * 阶梯：炼气起点 5 页（修行/历练/法与器/奇遇/成就）→ 筑基 +坊市/势力/炼丹/道友
   *   → 金丹 +天骄 → 元婴 +法宝 → 化神 +宗门。
   * 页面整合批 2026-10-06（UI 卷 §3.4a）：原「功法」「法器」两页并为「法与器」一页 →
   *   游戏页 13 → **12** 项。tab id 沿用 `arts`（不新造 id），故 newArtsDot 红点键、
   *   lastArtsSig 签名、TAB_UNLOCK（二者本就无境界门槛）三处零改动；`gear` 条目删除后，
   *   旧档 settings.tabOrder 里的 'gear' 由 tabOrder() 既有「未知 id 剔除」自动清掉，无需迁移。
   *   导航标签改取 `arts.system`（法与器）；`skill.system`/`gear.system` 保留不动——
   *   二者仍是日志页分类筛选标签，改它们会连带改日志分类语义。 */
  var GAME_TABS = [
    { id: 'idle', key: 'tab.idle' },
    { id: 'combat', key: null, sys: 'combat.system' },
    { id: 'arts', key: null, sys: 'arts.system' },
    { id: 'treasure', key: null, sys: 'treasure.system', lock: 3 },
    { id: 'shop', key: null, sys: 'shop.system', lock: 1 },
    { id: 'faction', key: null, sys: 'faction.system', lock: 1 },
    { id: 'bonds', key: null, sys: 'ui.pillar.bond', lock: 1 },
    { id: 'event', key: 'tab.event' },
    /* 六向长线批：炼丹炼器（筑基开炉）/ 同代天骄（金丹方闻同代之名）/ 宗门（化神亮入口） */
    { id: 'alchemy', key: null, sys: 'alchemy.system', lock: 1 },
    { id: 'prodigy', key: null, sys: 'prodigy.system', lock: 2 },
    { id: 'sect', key: null, sys: 'sect.system', lock: 4 },
    /* 成就图鉴批：成就自轮回页迁出为独立页（常驻可见，无境界门槛） */
    { id: 'achv', key: null, sys: 'achv.system' }
  ];
  /* 系统页：固定在导航最底部，不参与自定义排序 */
  var SYS_TABS = [
    { id: 'legacy', key: null, sys: 'legacy.system' },
    { id: 'journal', key: 'tab.log' },
    { id: 'settings', key: 'tab.settings' }
  ];
  var TABS = GAME_TABS.concat(SYS_TABS);

  /* 渐次解锁批 §C1：门槛单一事实源 = D.TAB_UNLOCK（引擎天骄 gate / realm.js 解锁播报同源）；
   * 世界未装载或表缺项时回落 GAME_TABS 行内 lock（同值兜底）。 */
  function tabLock(tb) {
    try {
      var tu = (D() || {}).TAB_UNLOCK;
      if (tu && tu[tb.id] && tu[tb.id].r != null) return tu[tb.id].r;
    } catch (e) { /* 创角屏/世界未选：回落硬编码 */ }
    return tb.lock || 0;
  }
  /* 解锁红点（§C3）：会话级已知集——启动/切角色时快照当时已解锁项；会话内新解锁 tab 亮红点、
   * 进页即消。不入存档（纯 UI 态，与 newArtsDot 红点家族同纪律）。 */
  function tabKnownSync() {
    var pid0 = (state.profile && state.profile.id) || '';
    if (!ui.tabKnown || ui.tabKnownPid !== pid0) {
      ui.tabKnown = {}; ui.tabKnownPid = pid0;
      var w0 = ws();
      TABS.forEach(function (tb) {
        var lk = tabLock(tb);
        if (!lk || (w0 && w0.realm >= lk)) ui.tabKnown[tb.id] = 1;
      });
    }
  }

  /* 游戏页有效顺序：settings.tabOrder 优先，缺项按默认序补齐（未知 id 剔除） */
  function tabOrder() {
    var so = (state.settings && state.settings.tabOrder) || [];
    var byId = {}, used = {};
    GAME_TABS.forEach(function (t) { byId[t.id] = t; });
    var out = [];
    so.forEach(function (id) { if (byId[id] && !used[id]) { out.push(byId[id]); used[id] = 1; } });
    GAME_TABS.forEach(function (t) { if (!used[t.id]) out.push(t); });
    return out;
  }

  function tabBtn(bar, tb) {
    var b = document.createElement('button');
    var w0 = ws();
    var lk = tabLock(tb);
    var locked = lk && (!w0 || w0.realm < lk);
    if (locked) {
      /* 未解锁（势力批 v2.4）：标题「？」、置灰、不绑动作——点按无响应 */
      b.textContent = t('event.codex.unknown');   /* ？（词条本身即三个问号）*/
      b.className = 'locked';
      bar.appendChild(b);
      return;
    }
    b.textContent = tb.key ? t(tb.key) : t(tb.sys);
    b.className = ui.tab === tb.id ? 'on' : '';
    b.dataset.act = 'tab'; b.dataset.v = tb.id;
    if (tb.id === 'event' && (ui.newFeedDot || rumorDotOn())) {
      var dF = document.createElement('span'); dF.className = 'dot'; b.appendChild(dF);
    }
    if (tb.id === 'journal' && ui.newLogDot) {
      var dL = document.createElement('span'); dL.className = 'dot'; b.appendChild(dL);
    }
    /* 走查 v2.5 §6：新功法/新法宝/新道友/坊市补货 红点 */
    var dotFlag = { arts: 'newArtsDot', treasure: 'newTreasureDot', bonds: 'newBondDot', shop: 'newShopDot' }[tb.id];
    if (dotFlag && ui[dotFlag]) {
      var dN = document.createElement('span'); dN.className = 'dot'; b.appendChild(dN);
    }
    /* 成就页红点：新成就达成（meta.achv 只增）——签名对比；正在该页即视为已读（不亮、并同步快照） */
    if (tb.id === 'achv') {
      var sigA = achvRedDotSig();
      if (ui.achvSnap == null || ui.tab === 'achv') ui.achvSnap = sigA;
      if (ui.achvSnap !== sigA) {
        var dA = document.createElement('span'); dA.className = 'dot'; b.appendChild(dA);
      }
    }
    /* 新解锁红点（渐次解锁批 §C3）：本会话内刚解锁且未进过页 */
    if (!locked && ui.tabKnown && !ui.tabKnown[tb.id]) {
      var dU = document.createElement('span'); dU.className = 'dot'; b.appendChild(dU);
    }
    bar.appendChild(b);
  }

  function renderTabbar() {
    tabKnownSync();
    var bar = $('m-tabbar');
    bar.innerHTML = '';
    tabOrder().forEach(function (tb) { tabBtn(bar, tb); });
    /* 系统页固定最底部：一条分组线 + 日志/设置 */
    var sp = document.createElement('span');
    sp.className = 'navsep';
    bar.appendChild(sp);
    SYS_TABS.forEach(function (tb) { tabBtn(bar, tb); });
  }

  function switchTab(id) {
    var tbDef = null;
    TABS.forEach(function (tb) { if (tb.id === id) tbDef = tb; });
    /* 未解锁页不可进入（势力批 v2.4 → 渐次解锁批表化）：防御——导航已不可点，这里兜底 */
    if (tbDef && tabLock(tbDef) && (!ws() || ws().realm < tabLock(tbDef))) return;
    ui.tab = id;
    if (ui.tabKnown) ui.tabKnown[id] = 1;   /* 新解锁红点进页即消 */
    TABS.forEach(function (tb) { $('tab-' + tb.id).classList.toggle('hide', tb.id !== id); });
    if (id === 'event') {
      ui.newFeedDot = false;                      /* 进奇遇页即视为已读 */
      ui.rumorSeenAt = maxRumorBornAt(ws());      /* 传闻红点同步消账：此后仅新出生传闻再亮 */
    }
    if (id === 'journal') ui.newLogDot = false;   /* 进日志页即视为已读 */
    if (id === 'combat') ui.caveSnap = caveRedDotSig();   /* 进秘境洞天页（洞天节在内联）即视为已读地 chip 红点 */
    /* 走查 v2.5 §6：进页即清对应红点 */
    var dotMap = { arts: 'newArtsDot', treasure: 'newTreasureDot', bonds: 'newBondDot', shop: 'newShopDot' };
    if (dotMap[id]) ui[dotMap[id]] = false;
    renderTabbar();
    renderTab();
  }

  function pct(n) { return (Math.round(n * 1000) / 10).toString().replace(/\.0$/, '') + '%'; }

  /* 全位数字（修行状态批 v2.1）：修为大数字专用——千分位、不缩放不带单位，
   * 让每秒 tick 的增量逐位可见（SQ.fmt 的 万/亿 会把低境界产出量化到 0.1万/步） */
  function fmtFull(n) {
    return String(Math.floor(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  /* ── 游戏时间（v2.3）：1 游戏日 = 现实 1 秒，自入世（profile.createdAt）起算；
   * 12 月 × 30 日 = 360 日/年；起始年 = ws.calYear（创角随机 1~9000）。
   * 显示名 = 世界名去尾字（罗云州 → 罗云历…）；createdAt 缺失时返回空串（旧档兜底）── */
  function gameDateOf(ts) {
    var p = state.profile, w = ws();
    if (!p || !p.createdAt || !w) return null;
    var days = Math.max(0, Math.floor((ts - p.createdAt) / 1000));
    var y = (w.calYear || 1) + Math.floor(days / 360);
    var rem = days % 360;
    return { y: y, m: Math.floor(rem / 30) + 1, d: (rem % 30) + 1 };
  }
  function gameDateStr(ts) {
    var g = gameDateOf(ts);
    if (!g) return '';
    var nm = state.profile.worldName || '';
    if (nm.length >= 2) nm = nm.slice(0, -1);   /* 罗云州 → 罗云（去世界后缀字） */
    return t('calendar.date', { name: nm, y: g.y, m: g.m, d: g.d });
  }

  /* ── Tab 1 修行 ── */
  /* ── 批 2 · 四柱（财/法/地/侣）────────────────────────────────
   * B1 chip 行：财=收支摘要、法=主修、地=洞府×倍率、侣=灰置（批 3 解锁）
   * B2 财 → 此生总账浮层；B3 地 → 洞府浮层；法 → 修习功法浮层（与财/地/侣同级） */
  function caveSigOf(field) {
    var c = SQ.Cave.current(ws(), pack());
    return (c.signature && c.signature.field === field) ? c.signature.value : 0;
  }
  function ledgerSums() { return SQ.Ledger.sums(ws()); }

  function renderPillars() {
    var w = ws(), p = pack(), d = D(), m = mods();
    var s = ledgerSums();
    var main = SQ.Arts.mainArt(w);
    var am = p.artsMap();
    var faSub = main
      ? t('pillar.fa.sub', { name: t('skill.' + main + '.name'), lv: w.artsLevels[main] || 0 })
      : t('pillar.fa.empty');
    var cv = SQ.Cave.current(w, p);
    /* 侣 chip 副标（B1 · 交互说明 §4.2 ★）：结缘后 = 道号·形态名；否则护法·道号③；再否则尚未结缘 */
    var gP = SQ.Bonds.guardianOf(w, p, d);
    var lvSub;
    if (w.spouse) {
      lvSub = t('bond.' + w.spouse.npcId + '.name') + ' · ' + t('bond.spouse.form.' + w.spouse.form);
    } else if (gP && gP.bonus > 0) {
      lvSub = t('pillar.lv.sub', { name: t('bond.' + gP.npcId + '.name'), num: bondTierNum(gP.tier) });
    } else if (gP) {
      lvSub = t('bond.' + gP.npcId + '.name') + bondTierNum(gP.tier);
    } else {
      lvSub = t('pillar.lv.subnone');
    }
    /* 红点（§2.2）：侣 = 升档/可提亲、地 = 新福地解锁——签名对比，进浮层/洞天节即消 */
    var sigP = bondRedDotSig();
    if (ui.bondSnap == null) ui.bondSnap = sigP;
    var lvDot = ui.bondSnap !== sigP;
    var sigD = caveRedDotSig();
    if (ui.caveSnap == null) ui.caveSnap = sigD;
    var diDot = ui.caveSnap !== sigD;
    var cells = [
      { k: 'cai', act: 'openLedger', sub: t('pillar.cai.sub', { inn: SQ.fmt(s.inn), out: SQ.fmt(s.out) }) },
      { k: 'fa', act: 'openArtsModal', sub: faSub },
      { k: 'di', act: 'openCave', sub: t('pillar.di.sub', { name: t('cave.' + cv.id + '.name'), mult: SQ.Cave.multOf(w, p, d, m).toFixed(2) }), dot: diDot },
      { k: 'lv', act: 'openBonds', sub: lvSub, dot: lvDot }
    ];
    return '<div class="pillars">' + cells.map(function (c) {
      return '<button class="pillar' + (c.locked ? ' locked' : '') + '"' +
        (c.act ? ' data-act="' + c.act + '"' : ' disabled') + '>' +
        '<span class="pk">' + esc(t('pillar.' + c.k)) + (c.dot ? '<i class="pdot"></i>' : '') + '</span>' +
        '<span class="pv">' + esc(c.sub) + '</span></button>';
    }).join('') + '</div>';
  }

  /* B2 · 财柱总账：恒等式置顶 + 收支八行条形（区内归一）+ 占比 + 字段小注 + 印章分档 */
  var LEDGER_SEAL_2 = 5520000, LEDGER_SEAL_3 = 55200000;   /* 档界 = 主线六福地总投入 552 万 / ×10（UI §3.3 v2.5；扩池批别院/设施为带外可选投入不改档界） */
  function ledgerRows(dir, cats, max) {
    var w = ws(), l = w.ledger || { in: {}, out: {} };
    return cats.map(function (c) {
      var v = (l[dir] && l[dir][c]) || 0;
      var pctv = max > 0 ? (v / max) * 100 : 0;
      return '<div class="lgrow ' + (dir === 'in' ? 'in' : 'out') + '">' +
        '<div class="lgl"><span class="nm">' + esc(t('ledger.cat.' + c)) + '</span>' +
        '<span class="vl">' + SQ.fmt(v) + (v > 0 ? ' · ' + esc(t('ledger.share', { p: Math.round(pctv) })) : '') + '</span></div>' +
        '<div class="lgb"><i style="width:' + pctv.toFixed(1) + '%"></i></div>' +
        '<div class="lgn">' + esc(t('ledger.field', { dir: t('ledger.dir.' + dir), cat: t('ledger.cat.' + c) })) + '</div></div>';
    }).join('');
  }
  function renderLedger() {
    var w = ws(), s = ledgerSums();
    $('mlg-title').textContent = t('ledger.title');
    $('mlg-ident').textContent = t('ledger.ident', {
      start: SQ.Ledger.START_STONES, inn: SQ.fmt(s.inn), out: SQ.fmt(s.out), now: SQ.fmt(w.stones)
    });
    $('mlg-identnote').textContent = t('ledger.identnote');
    $('mlg-intitle').textContent = t('ledger.in.title');
    $('mlg-outtitle').textContent = t('ledger.out.title');
    var inMax = Math.max.apply(null, SQ.Ledger.IN_CATS.map(function (c) { return (w.ledger.in[c] || 0); }).concat([1]));
    var outMax = Math.max.apply(null, SQ.Ledger.OUT_CATS.map(function (c) { return (w.ledger.out[c] || 0); }).concat([1]));
    $('mlg-in').innerHTML = ledgerRows('in', SQ.Ledger.IN_CATS, inMax);
    $('mlg-out').innerHTML = ledgerRows('out', SQ.Ledger.OUT_CATS, outMax);
    var tier = s.inn >= LEDGER_SEAL_3 ? 3 : (s.inn >= LEDGER_SEAL_2 ? 2 : 1);
    /* 印章分档（需求 1）：初档「白手起家」文案不再展示，仅中/高两档留存里程碑印记 */
    $('mlg-seal').textContent = tier >= 2 ? t('ledger.epitaph.' + tier) : '';
    var empty = s.inn === 0 && s.out === 0;
    $('mlg-empty').textContent = empty ? t('ledger.empty') : '';
    $('mlg-empty').classList.toggle('hide', !empty);
    $('mlg-close').textContent = t('ui.close');
  }
  function openLedger() { renderLedger(); $('modal-ledger').classList.remove('hide'); }
  $('mlg-close').addEventListener('click', function () { $('modal-ledger').classList.add('hide'); });

  /* B3 · 地柱洞府：福地名录四态卡（主线 6 + 别院 4 + 隐世 3，扩池批 v2.0）+ 缺项 chips 三段红绿 + 附属设施行 + 叙事折叠（未达资格不剧透）+ 迁居冷却倒计时 */
  /* 游戏时长（走查 v2.6 §1/§4）：冷却类以游戏时间表述——ms/1000 = 游戏日，360 日 = 1 游戏年 */
  function fmtGameDur(ms) {
    if (!isFinite(ms)) ms = 0;                     /* 防脏字段：NaN/undefined 一律按 0 计 */
    var days = Math.max(0, Math.floor(ms / 1000));
    var y = Math.floor(days / 360), rd = days % 360;
    if (y > 0) return t('ui.time.game.yd', { y: y, d: rd });
    return t('ui.time.game.d', { d: rd });
  }
  function fmtLeft(ms) {
    if (!isFinite(ms)) ms = 0;                     /* 防脏字段：NaN/undefined 一律按 0 计 */
    var s = Math.max(0, Math.floor(ms / 1000));
    var d = Math.floor(s / 86400), hh = Math.floor((s % 86400) / 3600),
      mm = Math.floor((s % 3600) / 60), ss = s % 60;
    function two(n) { return ('0' + n).slice(-2); }
    return d > 0 ? t('cave.time.dhms', { d: d, h: two(hh), m: two(mm), s: two(ss) })
      : t('cave.time.hms', { h: two(hh), m: two(mm), s: two(ss) });
  }
  function caveReqChips(c, chk) {
    var w = ws(), rq = c.reqs || {};
    var out = [];
    /* 隐世福地（v2.0 obtain 门控）：未持有 → 显示缘法条件红绿 chip；已持有 → 视同免费 */
    if (c.obtain && !SQ.Cave.owned(w, c.id)) {
      var met = SQ.Cave.obtainMet(w, pack(), D(), c.obtain);
      var otxt = c.obtain.type === 'factionRank'
        ? t('cave.obtain.factionRank', { name: t('faction.rank.' + c.obtain.rank) })
        : t('cave.obtain.codex', { n: c.obtain.seen });
      out.push('<span class="' + (met ? 'ok' : 'no') + '">' + esc(t('cave.tag.hidden') + ' · ' + otxt) + '</span>');
      return out.join('');
    }
    if (!rq.realmMin && rq.zoneCleared == null && !rq.stonesCost) {
      return '<span class="ok">' + esc(t('cave.req.free')) + '</span>';
    }
    if (rq.realmMin != null) {
      out.push('<span class="' + (w.realm >= rq.realmMin ? 'ok' : 'no') + '">' +
        esc(t('cave.req.realm', { realm: t('realm.' + rq.realmMin) })) + '</span>');
    }
    if (rq.zoneCleared != null) {
      var zok = (w.cleared || []).indexOf(rq.zoneCleared) >= 0;
      out.push('<span class="' + (zok ? 'ok' : 'no') + '">' +
        esc(t('cave.req.zone', { zone: t('combat.zone.' + rq.zoneCleared) })) + '</span>');
    }
    if (rq.stonesCost) {
      /* 已持有则不再校验灵石（所有权语义，引擎卷 §2.3） */
      var sok = SQ.Cave.owned(w, c.id) || w.stones >= rq.stonesCost;
      out.push('<span class="' + (sok ? 'ok' : 'no') + '">' +
        esc(t('cave.req.stones', { n: SQ.fmt(rq.stonesCost) })) + '</span>');
    }
    return out.join('');
  }
  /* 附属设施行（福地池卷 §四）：仅已持有福地渲染；等级 + 效果恒显，
   * 营建/扩建按钮只在当前驻留福地出现（非驻留福地只读，无升级选项）。 */
  function caveFacRows(w, d, c, isCur) {
    var fac = (w.cave && w.cave.fac && w.cave.fac[c.id]) || {};
    var h = '<div class="cavefac"><div class="hint" style="margin:4px 0 2px">' +
      esc(t('cave.fac.title')) + (isCur ? ' · <span style="color:var(--good)">' + esc(t('cave.fac.active')) + '</span>'
        : ' · <span class="hint">' + esc(t('cave.fac.idle')) + '</span>') + '</div>';
    (d.CAVE_FACILITIES || []).forEach(function (fd) {
      var lv = fac[fd.id] || 0;
      var maxLv = d.CAVE_FAC_MAX_LV || 3;
      var effNow = fd.field === 'tribBonus' ? '+' + (fd.per * lv).toFixed(2)
        : (fd.per * lv * 100).toFixed(1) + '%';
      var metaTxt = t('talent.field.' + fd.field) + ' +' + effNow.replace('+', '');
      /* 灵田材料轴（炼丹卷 §2.4）：产出说明由炼丹炼器页迁入，驻留 Lv≥1 时每 6 游戏月入账 1~4 枚本区材料 */
      if (fd.id === 'lingtian') metaTxt += ' · ' + t('cave.fac.lingtian.mat');
      h += '<div class="facrow"><span class="nm">' + esc(t('cave.fac.' + fd.id + '.name')) +
        ' <span class="hint">Lv' + lv + '</span></span>' +
        '<span class="meta">' + esc(metaTxt) + '</span>';
      if (!isCur) {
        h += '<span class="hint">' + esc(t('cave.fac.onlycur')) + '</span>';
      } else if (lv >= maxLv) {
        h += '<button disabled>' + esc(t('cave.fac.max')) + '</button>';
      } else {
        var cost = (d.CAVE_FAC_COST || [])[lv] || 0;
        h += '<button class="' + (w.stones >= cost ? 'primary' : '') + '" data-act="caveBuild" data-v="' + c.id + '" data-f="' + fd.id + '"' +
          (w.stones >= cost ? '' : ' disabled') + '>' +
          esc(t(lv === 0 ? 'cave.fac.build' : 'cave.fac.upgrade', { n: SQ.fmt(cost) })) + '</button>';
      }
      h += '</div>';
    });
    return h + '</div>';
  }
  /* 洞天福地图鉴卡列（合并批：内联于「秘境洞天」页）——十三福地四态卡 + 缺项 chips + 叙事折叠 + 附属设施。
   * 当前驻留福地置顶为通栏 hero（与秘境页「当前秘境 hero」同构）；别院角标按福地表原序判定，
   * 不受展示排序影响。 */
  function caveDexHTML(left, withFac) {
    var w = ws(), p = pack(), d = D();
    var h = '';
    var list = SQ.Cave.list(p);
    var seenMult = {}, branchIds = {};
    list.forEach(function (c) {
      if (!c.obtain && seenMult[c.mult.toFixed(2)]) branchIds[c.id] = 1;
      seenMult[c.mult.toFixed(2)] = 1;
    });
    var curId = w.cave.current;
    list.slice().sort(function (a, b) {
      return (a.id === curId ? 0 : 1) - (b.id === curId ? 0 : 1);
    }).forEach(function (c) {
      var chk = SQ.Cave.canEnter(w, p, d, c.id, Date.now());
      var isCur = curId === c.id;
      var owned = SQ.Cave.owned(w, c.id);
      /* 角标（v2.0）：隐世（obtain 门控）/ 别院（同档 mult 横向支线） */
      var kindTag = '';
      if (c.obtain) kindTag = '<span class="ctag own">' + esc(t('cave.tag.hidden')) + '</span>';
      else if (branchIds[c.id]) kindTag = '<span class="ctag">' + esc(t('cave.tag.branch')) + '</span>';
      /* 缺项只算「资格」项（含 obtain），冷却与「已在此处」单独处理（不入红绿 chips） */
      var qualLack = chk.lack.filter(function (x) { return x.kind !== 'cooldown' && x.kind !== 'same'; });
      var stateCls = isCur ? ' cur' : (qualLack.length ? ' lack' : '');
      var tag = isCur ? '<span class="ctag cur">' + esc(t('cave.state.cur')) + '</span>'
        : (owned ? '<span class="ctag own">' + esc(t('cave.state.own')) + '</span>' : '');
      h += '<div class="cavecard' + stateCls + (isCur ? ' hero' : '') + '" data-cave="' + c.id + '">' +
        '<div class="ch"><span class="cn">' + esc(t('cave.' + c.id + '.name')) + kindTag + tag + '</span>' +
        '<span class="cm">×' + c.mult.toFixed(2) + '</span></div>' +
        '<div class="cs">' + esc(c.signature
          ? t('cave.sig', { name: t('cave.' + c.id + '.signature'), eff: t('talent.field.' + c.signature.field) + ' ' + (c.signature.field === 'tribBonus' ? '+' + c.signature.value.toFixed(2) : (c.signature.value > 0 ? '+' : '') + Math.round(c.signature.value * 100) + '%') })
          : t('cave.sig.none')) + '</div>' +
        '<div class="reqchips">' + caveReqChips(c, chk) + '</div>';
      /* 叙事分段（UI §3.3 v2.4）：驻留中/已持有出全文，未达资格折叠成盼头 */
      var openStory = isCur || owned || ui.caveStory[c.id];
      var canRead = isCur || owned;
      if (canRead || openStory) {
        h += '<div class="cavestory">' + esc(t('cave.' + c.id + '.desc')) + '</div>';
      } else {
        h += '<div class="cavestory hint">' + esc(t('cave.story.locked')) + '</div>';
      }
      /* 附属设施（v2.0）：已持有才展开；等级/效果只读恒显，营建/扩建按钮仅当前驻留福地有 */
      if (owned && withFac) h += caveFacRows(w, d, c, isCur);
      if (!isCur) {
        var dis = qualLack.length > 0 || left > 0;
        h += '<button class="cavebtn' + (dis ? '' : ' primary') + '" data-act="caveEnter" data-v="' + c.id + '"' +
          (dis ? ' disabled' : '') + '>' +
          esc(qualLack.length ? t('cave.state.lack') : (left > 0 ? t('cave.cd', { t: fmtGameDur(left) })
            : (owned ? t('cave.state.move') : t('cave.state.enter')))) + '</button>';
      }
      h += '</div>';
    });
    return h;
  }
  /* 洞天福地已内联到「秘境洞天」页（合并批）：地柱与秘境卡「福地」角标统一改为跳页并定位到洞天节。
   * 该节点为动态渲染，故用 querySelector 取（$ 取词会被审计 A3 要求 id 静态存在）。 */
  function openCave() {
    if (ui.tab !== 'combat') switchTab('combat');   /* switchTab 内已消地 chip 红点 */
    else ui.caveSnap = caveRedDotSig();             /* 已在秘境洞天页：直接消账 */
    var el = document.querySelector('#cave-sec');
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
  }

  /* B1 · 法柱修习功法浮层：只读一览修习槽内功法（与财/地/侣同级弹窗，不跳功法页） */
  function renderArtsModal() {
    var w = ws(), p = pack(), d = D();
    var am = p.artsMap();
    var eqN = (w.artsSlots || []).filter(function (x) { return !!x; }).length;
    $('mam-title').textContent = t('arts.modal.title');
    $('mam-sub').textContent = t('arts.modal.sub', { n: eqN, cap: d.ARTS_SLOTS });
    var h = '';
    for (var i = 0; i < d.ARTS_SLOTS; i++) {
      var id = w.artsSlots[i];
      if (!id) {
        h += '<div class="lrow locked"><div class="nm">—</div><div class="meta">' +
          esc(t(i === 0 ? 'arts.main.empty' : 'arts.empty')) + '</div></div>';
        continue;
      }
      var a = am[id];
      var lv = w.artsLevels[id] || 0;
      var isMain = i === 0 && SQ.Arts.mainArt(w) === id;
      h += '<div class="lrow cur">';
      h += '<div class="nm"><span class="align-sym align-' + a.alignment + '">' + esc(t('align.sym.' + a.alignment)) + '</span>' +
        esc(t('skill.' + id + '.name')) +
        ' <span class="tierbadge ' + artTierCls(a) + '">' + esc(t('skill.tier.' + a.tier)) + '</span>' +
        (isMain ? ' <span class="special-mark">' + esc(t('arts.main')) + '</span>' : '') +
        ' <span class="hint">Lv' + lv + (lv === 0 ? ' <span class="goldmark">' + esc(t('arts.reset')) + '</span>' : '') + '</span></div>';
      h += '<div class="meta">' + esc(t('skill.' + id + '.desc')) + (lv > 0 ? ' ×' + lv : '') + '</div>';
      h += '<div class="meta"><span class="special-mark">' + esc(t('arts.special')) + ' · ' + t('special.' + a.special.pool + '.name') + '</span> · ' +
        esc(t('skill.nurture.' + a.attr)) + '</div>';
      h += '<div class="meta">' + esc(t('arts.practice', { p: Math.floor(SQ.Arts.practiceOf(w, id, d)) })) + '</div>';
      h += '</div>';
    }
    $('mam-list').innerHTML = h;
    $('mam-close').textContent = t('ui.close');
  }

  /* ── Tab 2 秘境 ── */
  function renderCombat() {

          var aff = SQ.Combat.affixDef(w, d);

          var zb = w.zoneBoss;

    var cleared = w.cleared || [];

       互为引流（秘境卡「福地」角标 ↔ 洞天卡首通资格 chips）；当前驻留福地为通栏 hero ── */
    var caveCur = SQ.Cave.current(w, p);

  /* ── Tab 3 功法（批 2 · B4：主修角标 + 待重修金标 + 品阶×阵营双维分组 + 架上三态 + 独占剪影）── */
  /* 相对时间（百器录首获 / 回看首遇共用） */
  function timeAgo(ts) {
    if (!isFinite(ts)) ts = Date.now();            /* 防脏字段：NaN/undefined 一律按「此刻」计 */
    var s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return t('ui.time.ago.now');
    if (s < 3600) return t('ui.time.ago.m', { n: Math.floor(s / 60) });
    if (s < 86400) return t('ui.time.ago.h', { n: Math.floor(s / 3600) });
    return t('ui.time.ago.d', { n: Math.floor(s / 86400) });
  }
  function fmtDate(ts) {
    /* 防脏字段：null / NaN / Infinity 一律按「此刻」计，杜绝「NaN-NaN-NaN NaN:NaN」 */
    if (ts == null || (typeof ts === 'number' && !isFinite(ts))) ts = Date.now();
    var dt = new Date(ts);
    function p2(n) { return ('0' + n).slice(-2); }
    return dt.getFullYear() + '-' + p2(dt.getMonth() + 1) + '-' + p2(dt.getDate()) + ' ' + p2(dt.getHours()) + ':' + p2(dt.getMinutes());
  }
  /* 修习缺项含差值（B4：「相差 314」两段式 karma 门槛可视化；draft 帧一） */
  function artLackTexts(id) {
    var w = ws(), p = pack();
    var a = p.artsMap()[id];
    if (!a) return [];
    var r = a.reqs || {};
    var karma = p.worldSystems && p.worldSystems.karmaOf ? p.worldSystems.karmaOf(w) : 0;
    var kTxt = (karma >= 0 ? '+' : '') + karma;
    var out = [];
    if (r.realm != null && w.realm < r.realm) {
      out.push(t('arts.lack.realmgap', { realm: t('realm.' + r.realm), n: r.realm - w.realm }));
    }
    if (r.attr) {
      var cur = Math.floor((w.attrs || {})[r.attr.id] || 0);
      if (cur < r.attr.min) {
        out.push(t('arts.lack.attr', { attr: t('attr.' + r.attr.id), min: r.attr.min, cur: cur, gap: r.attr.min - cur }));
      }
    }
    if (r.karmaMin != null && karma < r.karmaMin) {
      out.push(t('arts.lack.karmaMin', { min: r.karmaMin, cur: kTxt, gap: r.karmaMin - karma }));
    }
    if (r.karmaMax != null && karma > r.karmaMax) {
      out.push(t('arts.lack.karmaMax', { max: r.karmaMax, cur: kTxt, gap: karma - r.karmaMax }));
    }
    return out;
  }
  /* 获取途径行（B4：未获得显示教学行——收集牵引 = 知道去哪拿） */
  function obtainVia(a) {
    var o = a.obtain || {};
    if (o.type === 'zone') return t('arts.obtain.zone', { zone: t('combat.zone.' + o.zone) });
    if (['initial', 'shop', 'black', 'event', 'event_evil', 'event_rare'].indexOf(o.type) >= 0) {
      return t('arts.obtain.' + o.type);
    }
    return t('arts.obtain.event');
  }
  /* 独占载体溯源（B4/B5 共用）：扫全事件表三分支 gain → {ev, branch} */
  function carrierOf(kind, id) {
    var out = null;
    allEventList().forEach(function (ev) {
      ['right', 'evil', 'neutral'].forEach(function (bk) {
        var br = ev.choices && ev.choices[bk];
        if (!br) return;
        (br.gain || []).forEach(function (g) {
          if (out) return;
          if (kind === 'art' && g.type === 'exclusiveArt' && g.id === id) out = { ev: ev, branch: bk };
          if (kind === 'gear' && g.type === 'exclusiveGear' && g.id === id) out = { ev: ev, branch: bk };
        });
      });
    });
    return out;
  }
  /* 品阶 → 色阶（功法 / 丹药 / 丹方同一谱系，**映射只这一处**）；未知档落 t0 而非 'tundefined'。 */
  var TIER_CLS = { huang: 0, xuan: 2, di: 3, tian: 4 };
  function artTierCls(a) { return 't' + (TIER_CLS[a && a.tier] != null ? TIER_CLS[a.tier] : 0); }
  function tierCls(tier) { return TIER_CLS[tier] != null ? 't' + TIER_CLS[tier] : ''; }
  /* 独占剪影（B4：？？？ + 天阶 + 大道方向一句 skill.{id}.dao + 载体奇遇明示 + 法·灰角标） */
  function artSilhouette(id, a) {
    var car = carrierOf('art', id);
    var r = a.reqs || {}, reqTxt = [];
    if (r.realm != null) reqTxt.push(t('realm.' + r.realm));
    if (r.attr) reqTxt.push(t('attr.' + r.attr.id) + ' ≥ ' + r.attr.min);
    if (r.karmaMin != null) reqTxt.push(t('arts.req.karmaMin', { min: r.karmaMin }));
    if (r.karmaMax != null) reqTxt.push(t('arts.req.karmaMax', { max: r.karmaMax }));
    var h = '<div class="lrow sil">';
    h += '<div class="nm">' + esc(t('event.codex.unknown')) +
      ' <span class="tierbadge ' + artTierCls(a) + '">' + esc(t('skill.tier.' + a.tier)) + '</span>' +
      ' <span class="ebadge gray">' + esc(t('event.badge.exArt')) + '</span></div>';
    h += '<div class="meta daoline">' + esc(t('arts.dao.line', { txt: t('skill.' + id + '.dao') })) + '</div>';
    h += '<div class="meta hint">' + esc(t('arts.exclusive.via', {
      ev: car ? t('event.' + car.ev.id + '.name') : t('event.codex.unknown'),
      branch: car ? t('align.' + car.branch) : ''
    })) + '</div>';
    if (reqTxt.length) h += '<div class="meta hint">' + esc(t('arts.req.line', { req: reqTxt.join(' · ') })) + '</div>';
    return h + '</div>';

  /* 未获得行（B4：获取途径教学行 + 缺项红字；系统深化批 B4：情报角标 + 豁免提示行） */
  function artUnownedRow(id, a) {
    var lacks = artLackTexts(id);
    var wU = ws();
    var intelU = !!(wU.intelArts && wU.intelArts[id]);

      esc(t('skill.' + id + '.name')) +
      ' <span class="tierbadge ' + artTierCls(a) + '">' + esc(t('skill.tier.' + a.tier)) + '</span>' +
      (intelU ? ' <span class="tierbadge t2">' + esc(t('faction.intel.tag')) + '</span>' : '') + '</div>';
    h += '<div class="meta">' + esc(t('skill.' + id + '.desc')) + '</div>';
    h += '<div class="meta hint">' + esc(t('arts.state.unowned', { via: obtainVia(a) })) + '</div>';
    if (intelU) h += '<div class="meta" style="color:var(--sq-tier-2)">' + esc(t('faction.intel.ignore')) + '</div>';
    if (lacks.length) h += '<div class="meta red">' + esc(t('arts.state.lackline', { req: lacks.join(' · ') })) + '</div>';
