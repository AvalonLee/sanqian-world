<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山河棋盘 · 三维水墨演示 — 三千世界</title>
<style>
  /* ===== 纸面令牌（对齐 game.html --xuan-* 体系）===== */
  :root {
    --xuan-light: #f6efe0;
    --xuan-mid: #ece0c8;
    --xuan-dark: #dccab0;
    --ink-deep: #1d1915;
    --ink-mid: #433a31;
    --ink-soft: #75685a;
    --cinnabar: #b9362c;
    --cinnabar-bright: #dc473a;
    --jade: #2b6b5e;
    --gold: #b37e24;
    --serif: "KaiTi", "STKaiti", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #efe5cf; }
  body { font-family: var(--serif); color: var(--ink-deep); }

  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; cursor: grab; }
  #stage canvas.dragging { cursor: grabbing; }
  #stage canvas.hovering { cursor: pointer; }

  /* ===== 宣纸纱纹 + 暗角（叠在最上层，不挡交互）===== */
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 30;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.5'/></svg>");
    mix-blend-mode: multiply; opacity: 0.30;
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 29;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(80, 62, 40, 0.16) 100%);
  }

  /* ===== 题名（左上，竖排）===== */
  .title-block {
    position: fixed; top: 22px; left: 24px; z-index: 40; user-select: none;
    display: flex; align-items: flex-start; gap: 12px; pointer-events: none;
  }
  .title-main {
    writing-mode: vertical-rl; font-size: 34px; font-weight: 700; letter-spacing: 10px;
    color: var(--ink-deep); text-shadow: 0 0 10px rgba(246, 239, 224, 0.9), 0 0 3px rgba(246,239,224,.9);
  }
  .title-side { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
  .title-sub {
    writing-mode: vertical-rl; font-size: 12px; letter-spacing: 5px; color: var(--ink-soft);
    text-shadow: 0 0 8px rgba(246, 239, 224, 0.9);
  }
  .title-seal {
    width: 26px; height: 26px; background: var(--cinnabar); color: var(--xuan-light);
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; box-shadow: 0 1px 4px rgba(29, 25, 21, 0.35);
  }

  /* ===== 右上按钮组 ===== */
  .toolbar { position: fixed; top: 22px; right: 24px; z-index: 40; display: flex; gap: 8px; }
  .ink-btn {
    font-family: var(--serif); font-size: 13px; font-weight: 700; letter-spacing: 2px;
    color: var(--ink-mid); background: rgba(246, 239, 224, 0.88);
    border: 1px solid rgba(67, 58, 49, 0.45); border-radius: 6px;
    padding: 7px 14px; cursor: pointer; backdrop-filter: blur(2px);
    box-shadow: 0 1px 5px rgba(29, 25, 21, 0.18);
    transition: all 0.18s ease;
  }
  .ink-btn:hover { background: var(--xuan-light); border-color: var(--ink-mid); transform: translateY(-1px); }
  .ink-btn.on { color: var(--jade); border-color: var(--jade); }

  /* ===== 底部操作提示 ===== */
  .hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 40;
    font-size: 12px; letter-spacing: 3px; color: var(--ink-soft); user-select: none; pointer-events: none;
    text-shadow: 0 0 8px rgba(246, 239, 224, 0.95), 0 0 3px rgba(246,239,224,.95);
    white-space: nowrap;
  }
  .hint b { color: var(--ink-mid); font-weight: 700; }

  /* ===== 地界信息卡 ===== */
  .info-card {
    position: fixed; right: 24px; bottom: 56px; z-index: 45; width: 316px;
    background: linear-gradient(160deg, #faf4e6 0%, #f1e6cf 100%);
    border: 1px solid rgba(67, 58, 49, 0.5); border-radius: 10px;
    box-shadow: 0 6px 26px rgba(29, 25, 21, 0.28), inset 0 0 40px rgba(220, 202, 176, 0.35);
    padding: 16px 18px 14px; display: none;
  }
  .info-card.show { display: block; animation: cardIn 0.28s ease both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .ic-head { display: flex; align-items: flex-start; gap: 12px; }
  .ic-seal {
    flex: none; width: 44px; height: 44px; background: var(--cinnabar); color: var(--xuan-light);
    border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; box-shadow: inset 0 0 0 2px rgba(246,239,224,.4), 0 2px 6px rgba(29,25,21,.3);
  }
  .ic-name { font-size: 22px; font-weight: 700; line-height: 1.15; }
  .ic-sub { font-size: 12px; color: var(--ink-soft); letter-spacing: 1px; margin-top: 3px; }
  .ic-close {
    margin-left: auto; flex: none; width: 24px; height: 24px; border: none; background: none;
    color: var(--ink-soft); font-size: 15px; cursor: pointer; font-family: inherit;
  }
  .ic-close:hover { color: var(--cinnabar); }
  .ic-zone {
    display: inline-block; margin-top: 10px; font-size: 11px; letter-spacing: 2px; color: var(--jade);
    border: 1px solid rgba(43, 107, 94, 0.5); border-radius: 4px; padding: 1px 8px;
  }
  .ic-faction { margin-top: 6px; font-size: 12px; color: var(--ink-soft); }
  .ic-desc { margin-top: 9px; font-size: 13px; line-height: 1.75; color: var(--ink-mid); text-align: justify; }
  .ic-event { margin-top: 9px; font-size: 12.5px; letter-spacing: 1px; display: none; }
  .ic-event.show { display: block; }
  .ic-event.crisis { color: var(--cinnabar); }
  .ic-event.gold { color: var(--gold); }
  .ic-neigh { margin-top: 11px; padding-top: 9px; border-top: 1px dashed rgba(67, 58, 49, 0.35); }
  .ic-neigh > span { font-size: 11px; letter-spacing: 3px; color: var(--ink-soft); }
  .ic-neigh-list { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .neigh-chip {
    font-family: var(--serif); font-size: 12px; color: var(--ink-mid);
    background: rgba(236, 224, 200, 0.8); border: 1px solid rgba(67, 58, 49, 0.35);
    border-radius: 4px; padding: 2px 9px; cursor: pointer; transition: all 0.15s ease;
  }
  .neigh-chip:hover { background: var(--jade); color: var(--xuan-light); border-color: var(--jade); }

  /* ===== 入场纱幕 ===== */
  .veil {
    position: fixed; inset: 0; z-index: 60; background: #efe5cf; pointer-events: none;
    transition: opacity 1.4s ease;
  }
  .veil.off { opacity: 0; }

  /* ===== 钻入纱幕 + 本境顶栏 ===== */
  .dive-veil {
    position: fixed; inset: 0; z-index: 55; background: #efe5cf; pointer-events: none;
    opacity: 0; transition: opacity 0.42s ease;
  }
  .dive-veil.show { opacity: 1; }
  .local-bar {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 45;
    display: none; align-items: center; gap: 10px;
    background: rgba(246, 239, 224, 0.9); border: 1px solid rgba(67, 58, 49, 0.45);
    border-radius: 8px; padding: 6px 8px 6px 16px; box-shadow: 0 2px 10px rgba(29, 25, 21, 0.2);
    backdrop-filter: blur(2px);
  }
  .local-bar.show { display: flex; }
  .local-bar .lb-name { font-size: 16px; font-weight: 700; letter-spacing: 3px; color: var(--ink-deep); }
  .ic-enter { display: none; margin-top: 11px; width: 100%; text-align: center; }
  .ic-enter.show { display: block; }

  .webgl-fail {
    position: fixed; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center;
    font-size: 16px; color: var(--ink-mid); letter-spacing: 2px; text-align: center; line-height: 2;
  }
</style>
</head>
<body>
  <div id="stage"></div>

  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="title-block">
    <div class="title-main">山河棋盘</div>
    <div class="title-side">
      <div class="title-seal">叁</div>
      <div class="title-sub">三维水墨 · 演示稿</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="ink-btn" id="btn-reset">复位视角</button>
    <button class="ink-btn on" id="btn-auto">自转 · 开</button>
    <button class="ink-btn on" id="btn-labels">地名 · 显</button>
  </div>

  <div class="hint"><b>拖拽</b> 旋转　·　<b>滚轮</b> 远近　·　<b>双击</b> 复位　·　<b>点击地界</b> 看详情</div>

  <aside class="info-card" id="info-card">
    <div class="ic-head">
      <div class="ic-seal" id="ic-seal">洛</div>
      <div>
        <div class="ic-name" id="ic-name">洛阳</div>
        <div class="ic-sub" id="ic-sub"></div>
      </div>
      <button class="ic-close" id="ic-close" title="收起">✕</button>
    </div>
    <span class="ic-zone" id="ic-zone">中原</span>
    <p class="ic-faction" id="ic-faction"></p>
    <p class="ic-desc" id="ic-desc"></p>
    <div class="ic-event" id="ic-event"></div>
    <div class="ic-neigh">
      <span>邻 接</span>
      <div class="ic-neigh-list" id="ic-neigh-list"></div>
    </div>
    <button class="ink-btn ic-enter" id="ic-enter">进入本境 ▸</button>
  </aside>

  <div class="dive-veil" id="dive-veil"></div>
  <div class="local-bar" id="local-bar">
    <span class="lb-name" id="lb-name">洛阳 · 本境</span>
    <button class="ink-btn" id="btn-back">⟵ 回到山河</button>
  </div>

  <div class="veil" id="veil"></div>
  <div class="webgl-fail" id="webgl-fail">此演示需要 WebGL 支持<br>请更换浏览器后打开</div>

  <script>window.__errs = []; window.addEventListener('error', function (e) { window.__errs.push(String(e.message || e)); });</script>
  <script src="./three.min.js"></script>
  <script src="./demo-data.js"></script>
  <script src="./local-specs.js"></script>
  <script src="./board3d.js"></script>
</body>
</html>
