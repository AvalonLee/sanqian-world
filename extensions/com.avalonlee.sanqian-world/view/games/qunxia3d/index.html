<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山河棋盘 · 三维水墨演示 — 三千世界</title>
<style>
  /* ===== 纸面令牌（对齐 game.html --xuan-* 体系）===== */
  :root {
    --xuan-light: #f6efe0;
    --xuan-mid: #ece0c8;
    --xuan-dark: #dccab0;
    --ink-deep: #1d1915;
    --ink-mid: #433a31;
    --ink-soft: #75685a;
    --cinnabar: #b9362c;
    --cinnabar-bright: #dc473a;
    --jade: #2b6b5e;
    --gold: #b37e24;
    --serif: "KaiTi", "STKaiti", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #efe5cf; }
  body { font-family: var(--serif); color: var(--ink-deep); }
  .hidden { display: none !important; }

  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; cursor: grab; }
  #stage canvas.dragging { cursor: grabbing; }
  #stage canvas.hovering { cursor: pointer; }

  /* ===== 宣纸纱纹 + 暗角（叠在最上层，不挡交互）===== */
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 30;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.5'/></svg>");
    mix-blend-mode: multiply; opacity: 0.30;
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 29;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(80, 62, 40, 0.16) 100%);
  }

  /* ===== 题名（左上，竖排）===== */
  .title-block {
    position: fixed; top: 22px; left: 24px; z-index: 40; user-select: none;
    display: flex; align-items: flex-start; gap: 12px; pointer-events: none;
  }
  .title-main {
    writing-mode: vertical-rl; font-size: 34px; font-weight: 700; letter-spacing: 10px;
    color: var(--ink-deep); text-shadow: 0 0 10px rgba(246, 239, 224, 0.9), 0 0 3px rgba(246,239,224,.9);
  }
  .title-side { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
  .title-sub {
    writing-mode: vertical-rl; font-size: 12px; letter-spacing: 5px; color: var(--ink-soft);
    text-shadow: 0 0 8px rgba(246, 239, 224, 0.9);
  }
  .title-seal {
    width: 26px; height: 26px; background: var(--cinnabar); color: var(--xuan-light);
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; box-shadow: 0 1px 4px rgba(29, 25, 21, 0.35);
  }

  /* ===== 右上按钮组 ===== */
  .toolbar { position: fixed; top: 22px; right: 24px; z-index: 40; display: flex; gap: 8px; }
  .ink-btn {
    font-family: var(--serif); font-size: 13px; font-weight: 700; letter-spacing: 2px;
    color: var(--ink-mid); background: rgba(246, 239, 224, 0.88);
    border: 1px solid rgba(67, 58, 49, 0.45); border-radius: 6px;
    padding: 7px 14px; cursor: pointer; backdrop-filter: blur(2px);
    box-shadow: 0 1px 5px rgba(29, 25, 21, 0.18);
    transition: all 0.18s ease;
  }
  .ink-btn:hover { background: var(--xuan-light); border-color: var(--ink-mid); transform: translateY(-1px); }
  .ink-btn.on { color: var(--jade); border-color: var(--jade); }

  /* ===== 底部操作提示 ===== */
  .hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 40;
    font-size: 12px; letter-spacing: 3px; color: var(--ink-soft); user-select: none; pointer-events: none;
    text-shadow: 0 0 8px rgba(246, 239, 224, 0.95), 0 0 3px rgba(246,239,224,.95);
    white-space: nowrap;
  }
  .hint b { color: var(--ink-mid); font-weight: 700; }

  /* ===== 地界信息卡 ===== */
  .info-card {
    position: fixed; right: 24px; bottom: 56px; z-index: 45; width: 316px;
    background: linear-gradient(160deg, #faf4e6 0%, #f1e6cf 100%);
    border: 1px solid rgba(67, 58, 49, 0.5); border-radius: 10px;
    box-shadow: 0 6px 26px rgba(29, 25, 21, 0.28), inset 0 0 40px rgba(220, 202, 176, 0.35);
    padding: 16px 18px 14px; display: none;
  }
  .info-card.show { display: block; animation: cardIn 0.28s ease both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .ic-head { display: flex; align-items: flex-start; gap: 12px; }
  .ic-seal {
    flex: none; width: 44px; height: 44px; background: var(--cinnabar); color: var(--xuan-light);
    border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; box-shadow: inset 0 0 0 2px rgba(246,239,224,.4), 0 2px 6px rgba(29,25,21,.3);
  }
  .ic-name { font-size: 22px; font-weight: 700; line-height: 1.15; }
  .ic-sub { font-size: 12px; color: var(--ink-soft); letter-spacing: 1px; margin-top: 3px; }
  .ic-close {
    margin-left: auto; flex: none; width: 24px; height: 24px; border: none; background: none;
    color: var(--ink-soft); font-size: 15px; cursor: pointer; font-family: inherit;
  }
  .ic-close:hover { color: var(--cinnabar); }
  .ic-zone {
    display: inline-block; margin-top: 10px; font-size: 11px; letter-spacing: 2px; color: var(--jade);
    border: 1px solid rgba(43, 107, 94, 0.5); border-radius: 4px; padding: 1px 8px;
  }
  .ic-faction { margin-top: 6px; font-size: 12px; color: var(--ink-soft); }
  .ic-desc { margin-top: 9px; font-size: 13px; line-height: 1.75; color: var(--ink-mid); text-align: justify; }
  .ic-event { margin-top: 9px; font-size: 12.5px; letter-spacing: 1px; display: none; }
  .ic-event.show { display: block; }
  .ic-event.crisis { color: var(--cinnabar); }
  .ic-event.gold { color: var(--gold); }
  .ic-neigh { margin-top: 11px; padding-top: 9px; border-top: 1px dashed rgba(67, 58, 49, 0.35); }
  .ic-neigh > span { font-size: 11px; letter-spacing: 3px; color: var(--ink-soft); }
  .ic-neigh-list { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .neigh-chip {
    font-family: var(--serif); font-size: 12px; color: var(--ink-mid);
    background: rgba(236, 224, 200, 0.8); border: 1px solid rgba(67, 58, 49, 0.35);
    border-radius: 4px; padding: 2px 9px; cursor: pointer; transition: all 0.15s ease;
  }
  .neigh-chip:hover { background: var(--jade); color: var(--xuan-light); border-color: var(--jade); }

  /* ===== 入场纱幕 ===== */
  .veil {
    position: fixed; inset: 0; z-index: 60; background: #efe5cf; pointer-events: none;
    transition: opacity 1.4s ease;
  }
  .veil.off { opacity: 0; }

  /* ===== 钻入纱幕 + 本境顶栏 ===== */
  .dive-veil {
    position: fixed; inset: 0; z-index: 55; background: #efe5cf; pointer-events: none;
    opacity: 0; transition: opacity 0.42s ease;
  }
  .dive-veil.show { opacity: 1; }
  .local-bar {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 45;
    display: none; align-items: center; gap: 10px;
    background: rgba(246, 239, 224, 0.9); border: 1px solid rgba(67, 58, 49, 0.45);
    border-radius: 8px; padding: 6px 8px 6px 16px; box-shadow: 0 2px 10px rgba(29, 25, 21, 0.2);
    backdrop-filter: blur(2px);
  }
  .local-bar.show { display: flex; }
  .local-bar .lb-name { font-size: 16px; font-weight: 700; letter-spacing: 3px; color: var(--ink-deep); }
  .ic-enter { display: none; margin-top: 11px; width: 100%; text-align: center; }
  .ic-enter.show { display: block; }

  .webgl-fail {
    position: fixed; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center;
    font-size: 16px; color: var(--ink-mid); letter-spacing: 2px; text-align: center; line-height: 2;
  }

  /* ===== M0 游戏化：纸面 HUD / 行脚 / 创角（--xuan-* 令牌同源） ===== */
  .hud-bar {
    position: fixed; top: 66px; left: 50%; transform: translateX(-50%); z-index: 44;
    display: none; align-items: center; gap: 14px; flex-wrap: wrap; max-width: min(880px, 92vw);
    background: rgba(246, 239, 224, 0.92); border: 1px solid rgba(67, 58, 49, 0.5);
    border-radius: 10px; padding: 8px 14px; box-shadow: 0 3px 14px rgba(29, 25, 21, 0.22);
    backdrop-filter: blur(2px); font-size: 12px; letter-spacing: 1px;
  }
  .hud-bar.show { display: flex; }
  .hud-name { font-size: 15px; font-weight: 700; color: var(--ink-deep); }
  .hud-realm, .hud-sect { color: var(--ink-soft); font-size: 11px; }
  .hud-cell { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .hud-label { color: var(--ink-soft); font-size: 11px; }
  .hud-val { color: var(--ink-deep); font-weight: 700; }
  .bar-wrap { width: 76px; height: 9px; background: rgba(67, 58, 49, 0.18); border-radius: 5px; overflow: hidden; border: 1px solid rgba(67,58,49,.25); }
  .bar-fill { height: 100%; background: var(--cinnabar-bright); border-radius: 5px; transition: width .3s ease; }
  .bar-fill.mp { background: var(--jade); }
  .ap-dots { color: var(--cinnabar); letter-spacing: 2px; font-size: 11px; }
  .hud-ticker { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--gold); font-size: 11.5px; }
  .hud-ticker.crisis { color: var(--cinnabar); }
  #btn-turn { color: var(--jade); border-color: var(--jade); }

  .logs-panel {
    position: fixed; left: 24px; bottom: 20px; z-index: 43; width: 360px; max-height: 168px; overflow: hidden;
    background: rgba(246, 239, 224, 0.9); border: 1px solid rgba(67, 58, 49, 0.45);
    border-radius: 8px; padding: 8px 12px; display: none; font-size: 11.5px; line-height: 1.6;
    box-shadow: 0 2px 10px rgba(29, 25, 21, 0.16); backdrop-filter: blur(2px);
  }
  .logs-panel.show { display: block; }
  .log-row { display: flex; gap: 8px; align-items: baseline; padding: 1.5px 0; }
  .log-time { flex: none; color: var(--ink-soft); font-size: 10.5px; }
  .log-text { color: var(--ink-mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .ic-travel {
    display: none; margin-top: 11px; width: 100%; text-align: center;
    color: var(--jade); border-color: var(--jade);
  }
  .ic-travel.show { display: block; }

  .toast-container { position: fixed; top: 116px; left: 50%; transform: translateX(-50%); z-index: 65; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  .paper-toast {
    background: rgba(29, 25, 21, 0.92); color: var(--xuan-light); border: 1px solid rgba(179, 126, 36, 0.7);
    border-radius: 999px; padding: 6px 16px; font-size: 12.5px; letter-spacing: 1px;
    box-shadow: 0 4px 14px rgba(29, 25, 21, 0.3); transition: all .3s ease;
  }
  .paper-toast.good { border-color: rgba(43, 107, 94, 0.9); }
  .paper-toast.bad { border-color: rgba(185, 54, 44, 0.9); }

  /* 创角模态 */
  .creation-modal {
    position: fixed; inset: 0; z-index: 68; display: none; align-items: center; justify-content: center;
    background: rgba(239, 229, 207, 0.96);
  }
  .creation-modal.show { display: flex; }
  .cr-sheet {
    width: min(920px, 94vw); max-height: 92vh; overflow-y: auto;
    background: linear-gradient(160deg, #faf4e6 0%, #f1e6cf 100%);
    border: 1px solid rgba(67, 58, 49, 0.55); border-radius: 12px;
    box-shadow: 0 10px 40px rgba(29, 25, 21, 0.3), inset 0 0 60px rgba(220, 202, 176, 0.3);
    padding: 20px 22px;
  }
  .cr-title { font-size: 20px; font-weight: 700; letter-spacing: 6px; color: var(--ink-deep); }
  .cr-subtitle { font-size: 12px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 2px; }
  .cr-section { margin-top: 14px; }
  .cr-section > .cr-h { font-size: 12px; letter-spacing: 4px; color: var(--jade); border-left: 3px solid var(--jade); padding-left: 8px; margin-bottom: 8px; }
  .cr-name-row { display: flex; gap: 8px; align-items: center; }
  .cr-name-row input {
    flex: 1; max-width: 320px; font-family: var(--serif); font-size: 15px; letter-spacing: 2px;
    padding: 7px 12px; border: 1px solid rgba(67, 58, 49, 0.5); border-radius: 6px;
    background: rgba(255, 252, 244, 0.9); color: var(--ink-deep); outline: none;
  }
  .cr-origins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (max-width: 720px) { .cr-origins { grid-template-columns: repeat(2, 1fr); } }
  .cr-origin {
    font-family: var(--serif); text-align: left; cursor: pointer; border: 1.5px solid rgba(67, 58, 49, 0.4);
    background: rgba(255, 252, 244, 0.85); border-radius: 8px; padding: 9px 11px; transition: all .15s ease;
    display: flex; flex-direction: column; gap: 3px;
  }
  .cr-origin:hover { border-color: var(--ink-mid); transform: translateY(-1px); }
  .cr-origin.picked { border-color: var(--cinnabar); background: rgba(185, 54, 44, 0.08); box-shadow: 0 0 0 1px var(--cinnabar) inset; }
  .cr-origin.locked { opacity: 0.45; cursor: not-allowed; }
  .cr-tag { font-size: 10px; color: var(--gold); letter-spacing: 1px; }
  .cr-name { font-size: 13.5px; font-weight: 700; color: var(--ink-deep); }
  .cr-tip { font-size: 10.5px; color: var(--ink-soft); }
  .cr-desc { font-size: 10.5px; color: var(--ink-mid); line-height: 1.55; text-align: justify; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .cr-talents { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 8px; align-items: stretch; }
  .cr-talent { border: 1.5px solid rgba(67, 58, 49, 0.4); border-radius: 8px; padding: 8px 10px; background: rgba(255, 252, 244, 0.85); display: flex; flex-direction: column; gap: 4px; }
  .cr-talent.god { border-color: var(--gold); background: rgba(179, 126, 36, 0.08); }
  .cr-talent.bad { border-color: rgba(185, 54, 44, 0.6); background: rgba(185, 54, 44, 0.05); }
  .ct-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .ct-head b { font-size: 12.5px; color: var(--ink-deep); }
  .ct-head i { font-size: 10px; font-style: normal; color: var(--gold); border: 1px solid rgba(179, 126, 36, 0.5); border-radius: 3px; padding: 0 5px; }
  .ct-desc { font-size: 10.5px; color: var(--ink-mid); line-height: 1.5; }
  .cr-jackpot { margin-top: 8px; font-size: 12px; color: var(--gold); font-weight: 700; letter-spacing: 2px; }
  .cr-vows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cr-vow {
    font-family: var(--serif); text-align: left; cursor: pointer; border: 1.5px solid rgba(67, 58, 49, 0.4);
    background: rgba(255, 252, 244, 0.85); border-radius: 8px; padding: 9px 11px;
    display: flex; flex-direction: column; gap: 3px; transition: all .15s ease;
  }
  .cr-vow.picked { border-color: var(--cinnabar); background: rgba(185, 54, 44, 0.08); box-shadow: 0 0 0 1px var(--cinnabar) inset; }
  .cr-vow b { font-size: 12.5px; color: var(--ink-deep); }
  .cr-vow i { font-size: 10.5px; color: var(--ink-soft); }
  .cr-vow span { font-size: 10.5px; color: var(--gold); }
  .cr-actions { margin-top: 16px; display: flex; gap: 10px; justify-content: flex-end; }
  .cr-submit { font-size: 15px; letter-spacing: 4px; color: var(--xuan-light); background: var(--cinnabar); border: none; border-radius: 8px; padding: 10px 26px; cursor: pointer; font-family: var(--serif); font-weight: 700; box-shadow: 0 3px 10px rgba(185, 54, 44, 0.35); }
  .cr-submit:hover { background: var(--cinnabar-bright); }

  /* ===== M1：纸面弹窗族 + 本境动作面板 ===== */
  #qx-modal {
    position: fixed; inset: 0; z-index: 66; display: flex; align-items: center; justify-content: center;
    background: rgba(29, 25, 21, 0.35);
  }
  #qx-modal.hidden { display: none; }
  .qxm-sheet {
    width: min(680px, 92vw); max-height: 88vh; overflow-y: auto;
    background: linear-gradient(160deg, #faf4e6 0%, #f1e6cf 100%);
    border: 1px solid rgba(67, 58, 49, 0.55); border-radius: 12px;
    box-shadow: 0 10px 40px rgba(29, 25, 21, 0.35), inset 0 0 50px rgba(220, 202, 176, 0.3);
    padding: 16px 18px;
  }
  .qxm-head { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px dashed rgba(67, 58, 49, 0.4); padding-bottom: 9px; }
  .qxm-tag { font-size: 11px; letter-spacing: 3px; color: var(--jade); border: 1px solid rgba(43, 107, 94, 0.5); border-radius: 4px; padding: 1px 8px; white-space: nowrap; }
  .qxm-title { font-size: 16px; color: var(--ink-deep); letter-spacing: 1px; }
  .qxm-loc { font-size: 11.5px; color: var(--ink-soft); }
  .qxm-close { margin-left: auto; border: none; background: none; color: var(--ink-soft); font-size: 15px; cursor: pointer; font-family: inherit; }
  .qxm-close:hover { color: var(--cinnabar); }
  .qxm-body { margin-top: 10px; font-size: 13px; line-height: 1.8; color: var(--ink-mid); }
  .qxm-desc { text-align: justify; }
  .qxm-choices { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .qxm-btn {
    font-family: var(--serif); text-align: left; cursor: pointer; font-size: 12.5px; line-height: 1.55;
    border: 1.5px solid rgba(67, 58, 49, 0.45); background: rgba(255, 252, 244, 0.85);
    border-radius: 8px; padding: 9px 12px; color: var(--ink-mid); transition: all .15s ease;
  }
  .qxm-btn:hover { border-color: var(--ink-mid); transform: translateY(-1px); }
  .qxm-btn.primary { border-color: var(--cinnabar); color: var(--cinnabar); font-weight: 700; background: rgba(185, 54, 44, 0.06); }
  .qxm-poster-meta { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-deep); background: rgba(236, 224, 200, 0.8); border: 1px solid rgba(67, 58, 49, 0.35); border-radius: 7px; padding: 7px 11px; }
  .qxm-reward { color: var(--cinnabar); font-weight: 700; }
  .qxm-dim { color: var(--ink-soft); font-size: 12px; }
  .qxm-acts { display: flex; flex-direction: column; gap: 6px; }
  .qxm-more-h { margin-top: 9px; font-size: 11px; letter-spacing: 3px; color: var(--ink-soft); border-left: 3px solid var(--ink-soft); padding-left: 7px; }
  .qxm-act {
    font-family: var(--serif); display: flex; align-items: center; justify-content: space-between; gap: 10px;
    text-align: left; cursor: pointer; border: 1.5px solid rgba(67, 58, 49, 0.4);
    background: rgba(255, 252, 244, 0.85); border-radius: 8px; padding: 8px 12px; transition: all .15s ease;
  }
  .qxm-act:hover { border-color: var(--ink-mid); transform: translateY(-1px); }
  .qxm-act.recommend { border-color: var(--gold); background: rgba(179, 126, 36, 0.08); }
  .qxm-act.danger { border-color: rgba(185, 54, 44, 0.6); }
  .qxm-act.disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .qa-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .qa-main b { font-size: 13px; color: var(--ink-deep); }
  .qa-main i { font-size: 11px; font-style: normal; color: var(--ink-soft); }
  .qa-cost { flex: none; font-size: 11px; color: var(--gold); border: 1px solid rgba(179, 126, 36, 0.5); border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
  .ic-tilebtn { display: none; margin-top: 8px; width: 100%; text-align: center; }
  .ic-tilebtn.show { display: block; }

  /* ===== M2：三招对决 · 半屏出招卡 + 3D 背景糊化（拍板演出） ===== */
  #duel-overlay {
    position: fixed; inset: 0; z-index: 62; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(239, 229, 207, 0.28); backdrop-filter: blur(7px) saturate(0.85);
    -webkit-backdrop-filter: blur(7px) saturate(0.85);
  }
  #duel-overlay.hidden { display: none; }
  .dl-sheet {
    width: min(860px, 96vw); max-height: 58vh; display: flex; flex-direction: column;
    background: linear-gradient(165deg, rgba(250, 244, 230, 0.97) 0%, rgba(241, 230, 207, 0.97) 100%);
    border: 1px solid rgba(67, 58, 49, 0.55); border-bottom: none; border-radius: 14px 14px 0 0;
    box-shadow: 0 -8px 40px rgba(29, 25, 21, 0.35); padding: 12px 16px 12px;
  }
  .dl-top { border-bottom: 1px dashed rgba(67, 58, 49, 0.4); padding-bottom: 8px; }
  .dl-vs { display: flex; align-items: stretch; gap: 10px; }
  .dl-side { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .dl-side.enemy { text-align: right; }
  .dl-name { font-size: 15px; color: var(--ink-deep); letter-spacing: 1px; }

  .dl-dots { display: flex; gap: 5px; }
