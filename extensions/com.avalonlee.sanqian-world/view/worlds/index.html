<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三千世界 · 万界门环 — 世界选择</title>
<style>
  :root {
    --ink-deep: #1d1915;
    --ink-mid: #433a31;
    --ink-soft: #75685a;
    --cinnabar: #b9362c;
    --gold: #c4a44a;
    --jade: #2b6b5e;
    --serif: "KaiTi", "STKaiti", "Noto Serif SC", serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060618; }
  body { font-family: var(--serif); color: #e8dcc8; }

  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; cursor: grab; }

  /* 标题 */
  .title-blk {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 30; text-align: center; pointer-events: none; user-select: none;
  }
  .title-main {
    font-size: 28px; font-weight: 700; letter-spacing: 12px; color: var(--gold);
    text-shadow: 0 0 20px rgba(196,164,74,.4), 0 2px 6px rgba(0,0,0,.6);
  }
  .title-sub { font-size: 11px; letter-spacing: 5px; color: var(--ink-soft); margin-top: 3px; }

  /* 提示 */
  .hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 30; font-size: 11px; letter-spacing: 3px; color: var(--ink-soft);
    pointer-events: none; user-select: none;
  }
  .hint b { color: var(--gold); }

  /* 回主壳 */
  .btn-back {
    position: fixed; top: 14px; right: 16px; z-index: 30;
    font-family: var(--serif); font-size: 12px; letter-spacing: 2px;
    color: var(--ink-soft); background: rgba(26,22,18,.7); border: 1px solid rgba(117,104,90,.4);
    border-radius: 5px; padding: 5px 14px; cursor: pointer;
  }
  .btn-back:hover { color: var(--gold); border-color: var(--gold); }

  /* 门信息卡 */
  .gate-info {
    position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%);
    z-index: 35; width: 320px; display: none;
    background: rgba(26,22,18,.92); border: 1px solid rgba(196,164,74,.5);
    border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
  }
  .gate-info.show { display: block; animation: giIn .3s ease both; }
  @keyframes giIn { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%); } }
  .gi-head { display: flex; align-items: center; gap: 10px; }
  .gi-seal {
    width: 40px; height: 40px; flex: none; background: var(--cinnabar);
    color: #f6efe0; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700;
  }
  .gi-name { font-size: 18px; font-weight: 700; color: var(--gold); }
  .gi-tag { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .gi-desc { margin-top: 8px; font-size: 12px; color: #b0a490; line-height: 1.6; }

  /* 推门钮 */
  .btn-push {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 36; display: none;
    font-family: var(--serif); font-size: 16px; font-weight: 700; letter-spacing: 6px;
    color: var(--gold); background: linear-gradient(135deg, rgba(185,54,44,.9), rgba(139,26,20,.9));
    border: 2px solid var(--gold); border-radius: 8px; padding: 10px 36px;
    cursor: pointer; box-shadow: 0 0 20px rgba(196,164,74,.3), 0 4px 12px rgba(0,0,0,.5);
    transition: all .2s ease;
  }
  .btn-push:hover { transform: translateX(-50%) scale(1.05); box-shadow: 0 0 30px rgba(196,164,74,.5); }
  .btn-push.show { display: block; animation: pushIn .3s ease both; }
  @keyframes pushIn { from { opacity: 0; transform: translateX(-50%) scale(.9); } to { opacity: 1; transform: translateX(-50%) scale(1); } }

  /* 推门白光纱幕 */
  .push-veil {
    position: fixed; inset: 0; z-index: 80; background: #f6efe0;
    opacity: 0; pointer-events: none; transition: opacity .9s ease;
  }
</style>
</head>
<body>
  <div id="stage"></div>

  <div class="title-blk">
    <div class="title-main">三 千 世 界</div>
    <div class="title-sub">万界门环 · 择界入世</div>
  </div>

  <div class="hint"><b>拖拽</b> 环视回廊 · <b>点击门扇</b> 走近苏醒 · <b>推门</b> 入世</div>

  <button class="btn-back" id="btn-back-main">← 回主壳</button>

  <div class="gate-info" id="gate-info">
    <div class="gi-head">
      <div class="gi-seal" id="gi-seal">?</div>
      <div>
        <div class="gi-name" id="gi-name">???</div>
        <div class="gi-tag" id="gi-tag"></div>
      </div>
    </div>
    <div class="gi-desc" id="gi-desc"></div>
  </div>

  <button class="btn-push" id="btn-push">推 门 入 世</button>

  <div class="push-veil" id="push-veil"></div>

  <script>window.__errs = []; window.addEventListener('error', function (e) { window.__errs.push(String(e.message || e)); });</script>
  <script src="../games/qunxia3d/three.min.js"></script>
  <script src="world-registry.js"></script>
  <script src="gate3d.js"></script>
</body>
</html>
