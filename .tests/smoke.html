<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>三千世界 · P1 冒烟测试</title>
<style>
  body { font: 13px/1.7 system-ui, sans-serif; margin: 24px; color: #1f2230; }
  .ok { color: #1a7f37; } .fail { color: #c0392b; font-weight: 700; }
  li { margin: 2px 0; } .d { color: #8a8fa0; }
</style>
</head>
<body>
<h2>P1~P5 冒烟测试（93 项：存档 4.1 + P1 扩展 + 创角 4.2 + 词表 4.3 + 通用系统 4.4 + 修仙 4.5 + 事件 4.6 + 数值 4.8 + 属性 4.10 + 门槛 4.11）</h2>
<p>无桥环境（浏览器直开）自动走 localStorage 回退分支。结果同步打印到控制台；无头运行：<code>node .tests/run-smoke.cjs</code>。</p>
<ul id="out"><li>运行中…</li></ul>
<p id="sum"></p>

<script src="../assets/worlds/registry.js"></script>
<script src="../assets/lexicon.js"></script>
<script src="../assets/worlds/xiuxian/lexicon.js"></script>
<script src="../assets/worlds/xiuxian/lexicon-arts.js"></script>
<script src="../assets/lexicon/talents.js"></script>
<script src="../assets/lexicon/events.js"></script>
<script src="../assets/talents/common.js"></script>
<script src="../assets/talents/xiuxian.js"></script>
<script src="../assets/worlds/xiuxian/data.js"></script>
<script src="../assets/worlds/xiuxian/arts.js"></script>
<script src="../assets/events/common.js"></script>
<script src="../assets/worlds/xiuxian/events.js"></script>
<script src="../assets/systems/mods.js"></script>
<script src="../assets/systems/attrs.js"></script>
<script src="../assets/systems/gear.js"></script>
<script src="../assets/systems/arts.js"></script>
<script src="../assets/systems/combat.js"></script>
<script src="../assets/systems/realm.js"></script>
<script src="../assets/systems/idle.js"></script>
<script src="../assets/systems/shop.js"></script>
<script src="../assets/systems/events.js"></script>
<script src="../assets/systems/actions.js"></script>
<script src="../assets/worlds/xiuxian/karma.js"></script>
<script src="../assets/worlds/xiuxian/tribulation.js"></script>
<script src="../assets/worlds/xiuxian/index.js"></script>
<script src="../assets/talents/engine.js"></script>
<script src="../assets/core.js"></script>
<script src="./smoke.js"></script>
<script>
(async function () {
  var results = await window.SQSmoke.run();
  var out = document.getElementById('out');
  out.innerHTML = '';
  var fails = 0;
  results.forEach(function (r) {
    if (!r.ok) fails++;
    var li = document.createElement('li');
    li.innerHTML = '<span class="' + (r.ok ? 'ok' : 'fail') + '">' + (r.ok ? '✓' : '✗') +
      '</span> #' + r.id + ' ' + r.name + (r.detail ? ' <span class="d">(' + r.detail + ')</span>' : '');
    out.appendChild(li);
    console.log((r.ok ? 'PASS' : 'FAIL') + ' #' + r.id + ' ' + r.name + (r.detail ? ' (' + r.detail + ')' : ''));
  });
  document.getElementById('sum').textContent =
    fails === 0 ? '全部通过：' + results.length + '/' + results.length : '失败 ' + fails + ' 项';
  console.log(fails === 0 ? 'SMOKE_ALL_GREEN ' + results.length + '/' + results.length : 'SMOKE_FAILED ' + fails);
})();
</script>
</body>
</html>
